# Propositions mensuelles de mise à jour des dépendances (pull requests ouvertes par Dependabot).
# Aucune n'est fusionnée sans vérification : batterie de tests verte (check « Tests OK ») et relecture.
version: 2
updates:
  - package-ecosystem: npm          # appli Android (Capacitor) et SDK Firebase vendoré
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm          # application PC (Electron)
    directory: /electron
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm          # tests (Playwright)
    directory: /tests
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
