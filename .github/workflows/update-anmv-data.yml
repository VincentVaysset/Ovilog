name: Mise à jour base ANMV (délais d'attente ovins)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "explore (inspecter la structure des fichiers, rien n'est écrit) ou build (génère et commite le JSON définitif)"
        required: true
        default: "explore"
        type: choice
        options:
          - explore
          - build

jobs:
  anmv:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lancer le script ANMV
        run: python3 tools/build_anmv_data.py --mode ${{ inputs.mode }}

      - name: Committer le JSON généré (mode build uniquement)
        if: ${{ inputs.mode == 'build' }}
        run: |
          if [ -f www_anmv_ovins.json ]; then
            mkdir -p www/data
            mv www_anmv_ovins.json www/data/anmv_ovins.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add www/data/anmv_ovins.json
            if git diff --cached --quiet; then
              echo "Aucun changement dans le JSON ANMV."
            else
              git commit -m "Mettre à jour la base ANMV (délais d'attente ovins)"
              git push
            fi
          else
            echo "www_anmv_ovins.json introuvable — le script a probablement échoué."
            exit 1
          fi
