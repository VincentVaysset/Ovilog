# Contrôle rapide du test « bip agneau » (livraison pilotée par l'assistant Vibe) : lance UNIQUEMENT
# tests/test_bip_agneau_misebas.mjs et publie sa sortie complète en commentaire de l'issue #20 — les logs Actions
# n'étant pas lisibles par l'assistant, c'est la voie de diagnostic si le test échoue. Ne publie rien d'autre.
name: Contrôle test bip agneau (Vibe)
on:
  pull_request:
    branches: [claude/sheep-herd-android-app-7tlcq1]
    types: [opened, synchronize, edited, reopened]
concurrency:
  group: vibe-controle-test-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: write
jobs:
  test:
    name: Lancer test_bip_agneau_misebas seul (journal sur l'issue 20)
    if: github.event.pull_request.head.ref == 'claude/vibe-fix-bip-agneau'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (branche de la PR, avec le correctif)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer Playwright et Chromium
        run: |
          cd tests
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Servir l'appli (comme run_all.sh) puis lancer le test
        run: |
          cd www
          nohup python3 -m http.server 8998 > /tmp/serveur.log 2>&1 &
          cd ..
          sleep 2
          cd tests
          node test_bip_agneau_misebas.mjs > /tmp/test.log 2>&1
          code=$?
          cat /tmp/test.log
          echo "code de sortie du test : $code"
          exit $code
      - name: Publier la sortie du test sur l'issue 20 (toujours)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "== Contrôle test bip agneau — $(date -u) — run ${{ github.run_number }} (commit ${{ github.event.pull_request.head.sha }}) =="
            echo
            cat /tmp/test.log 2>/dev/null || echo "(pas de sortie de test)"
          } > /tmp/commentaire.md
          gh api -X POST "repos/${{ github.repository }}/issues/20/comments" -F body="$(cat /tmp/commentaire.md)" || echo "::warning::publication impossible"
