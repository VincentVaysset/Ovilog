name: Build APK Android (Ovilog)

on:
  push:
    branches:
      - main
      - 'claude/**'
      - 'vibe/**'
  workflow_dispatch: {}

jobs:
  tests:
    # Batterie de non-régression AVANT tout build : un test rouge doit
    # empêcher l'APK (et la Release) de partir, pas être découvert après
    # coup sur le téléphone. Jusqu'ici elle n'était jouée que localement.
    name: Batterie de non-régression (tests/)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer la suite de tests (Playwright + Chromium)
        # tests/ n'a pas de package-lock.json : npm install (et non npm ci).
        # --with-deps installe aussi les bibliothèques système dont
        # Chromium a besoin sur le runner.
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Installer Python (lecture des PDF par les tests)
        # tests/lib/pdf_texte.mjs appelle `python3` avec le module pymupdf
        # pour lire le contenu des PDF (comparaison avant/après refonte).
        # Le runner Ubuntu fournit un python3 mais PAS pymupdf : sans cette
        # étape, tous les tests PDF échouent en CI (ModuleNotFoundError,
        # run #253) alors qu'ils passent en local.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer pymupdf (version figée)
        run: pip install pymupdf==2.0

      - name: Jouer la batterie complète
        # run_all.sh sert www/ sur le port 8998 si rien n'y répond
        # (python3 http.server, présent sur ubuntu-latest), exécute tous
        # les tests/test_*.mjs puis la double passe de fuseaux horaires
        # (UTC + Europe/Paris, voir run_all.sh). Un seul échec fait
        # échouer ce job — donc le build et la Release.
        run: bash tests/run_all.sh

  build:
    # Aucun build (ni Release) tant que la batterie n'est pas verte.
    needs: tests
    runs-on: ubuntu-latest
    # Nécessaire pour que l'étape "Publier la Release GitHub" ci-dessous
    # puisse créer une release + y attacher l'APK avec le GITHUB_TOKEN
    # fourni automatiquement par Actions (voir chantier "Mises à jour
    # automatiques In-App") — sans ce bloc, certains dépôts ont un
    # GITHUB_TOKEN par défaut en lecture seule.
    permissions:
      contents: write
    # GitHub Actions interdit toute référence au contexte "secrets" dans un
    # "if:" (job ou step) — "Unrecognized named-value: 'secrets'"
    # (constaté à l'exécution sur Logisol). Contournement standard :
    # recopier ICI (où "secrets" reste autorisé) la présence du secret
    # keystore EXISTANT — KEYSTORE_BASE64, celui qu'utilisait déjà
    # l'ancien workflow (avec KEYSTORE_PASSWORD, KEY_ALIAS et
    # KEY_PASSWORD) ; AUCUN nouveau secret à créer — puis ne tester que
    # cette variable dans les "if:" des étapes ci-dessous.
    env:
      KEYSTORE_PRESENT: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer le SDK Android
        # `packages` explicite : le défaut de cette action ('tools
        # platform-tools') demande l'antique paquet "tools", retiré du
        # dépôt de paquets Google (Google ne le distribue plus du tout,
        # sdkmanager échoue avec "Failed to find package 'tools'" et un
        # exit code 1, faisant échouer TOUTE la suite du job) -- jamais
        # nécessaire de toute façon pour un build Gradle/Capacitor
        # classique, qui n'utilise que platform-tools ici et laisse le
        # plugin Gradle Android télécharger lui-même platforms/build-tools
        # au besoin (licences déjà acceptées via accept-android-sdk-licenses,
        # valeur par défaut de cette action).
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Installer les dépendances npm
        # npm ci (installation verrouillée sur package-lock.json : builds
        # reproductibles) au lieu de npm install. --legacy-peer-deps :
        # bluetooth-serial déclare un peerDependency @capacitor/core
        # ^4.0.0 obsolète dans son package.json publié (le projet est en
        # Capacitor 6) — l'API JS du plugin reste compatible, seule cette
        # métadonnée n'a pas été mise à jour par le mainteneur.
        run: npm ci --legacy-peer-deps

      - name: Injecter le numéro de version (date + hash court du commit)
        # Remplace la sentinelle BUILD_VERSION dans www/index.html sur la
        # copie de travail du runner UNIQUEMENT — jamais recommis dans le
        # dépôt. Doit tourner AVANT `npx cap sync android` pour que la
        # valeur injectée soit bien celle copiée vers les assets Android.
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/__OVILOG_BUILD_VERSION__/${BUILD_DATE} · ${SHORT_SHA}/" www/index.html

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Refuser un build sans keystore sur main
        # Sur main, le build publie une Release publique qui alimente la
        # mise à jour in-app. Sans keystore, Gradle ne lève PAS d'erreur :
        # il produit silencieusement un APK non signé, impossible à
        # installer par-dessus l'existante (incident Logisol v53). Sur
        # main, un keystore absent ou vide arrête donc le job AVANT le
        # build, avec un message explicite — jamais d'APK non signé
        # publié, quel que soit le chemin. Les branches de travail
        # (claude/**, vibe/**) ne publient aucune Release : l'artefact
        # non signé y reste acceptable pour test.
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_PRESENT != 'true'
        run: |
          echo "::error::Secret KEYSTORE_BASE64 absent ou vide alors que ce build main publierait une Release — refus de produire un APK non signé."
          exit 1

      - name: Décoder le keystore de signature (secret GitHub)
        # Conditionnel (leçon de Logisol) : absent sur une PR venant d'un
        # fork (les secrets n'y sont jamais exposés) ou non configuré sur
        # une branche de travail, le fichier n'est simplement pas créé —
        # build.gradle retombe alors sur un APK non signé, acceptable
        # hors main (l'étape précédente a déjà fait échouer main dans ce
        # cas).
        if: ${{ env.KEYSTORE_PRESENT == 'true' }}
        working-directory: android/app
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > ovilog-release.keystore

      - name: Builder l'APK signé (release)
        working-directory: android
        env:
          OVILOG_KEYSTORE_PATH: ovilog-release.keystore
          OVILOG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OVILOG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OVILOG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: Vérifier que l'APK est réellement signé
        # Un keystore mal résolu (chemin faux, fichier absent) ne fait PAS
        # échouer assembleRelease — build.gradle retombe silencieusement sur
        # un APK non signé, build « réussi » en apparence mais impossible à
        # installer par-dessus l'existant. C'est exactement l'incident vécu
        # sur Logisol (release v53) : mêmes if silencieux dans les deux
        # build.gradle, mêmes causes possibles ici. Dès qu'un keystore est
        # attendu, cette étape échoue explicitement si le seul .apk produit
        # porte encore le suffixe « unsigned », plutôt que de laisser
        # partir en Release un APK non installable.
        if: ${{ env.KEYSTORE_PRESENT == 'true' }}
        run: |
          if ls android/app/build/outputs/apk/release/*unsigned*.apk >/dev/null 2>&1; then
            echo "::error::APK non signé produit alors qu'un keystore était attendu — OVILOG_KEYSTORE_PATH ne résout probablement pas vers le bon fichier (voir build.gradle)."
            exit 1
          fi

      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ovilog-apk-v1.0.${{ github.run_number }}
          # Motif générique plutôt qu'un nom figé : robuste au nommage
          # exact que produit Gradle (leçon de Logisol : un chemin figé a
          # déjà fait échouer l'upload malgré un build pourtant réussi).
          # if-no-files-found: error : jamais d'artefact vide en silence.
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier la Release GitHub (source de la mise à jour in-app)
        # Contrairement à l'artefact ci-dessus (privé, expire au bout de 30
        # jours, nécessite une authentification GitHub pour être
        # téléchargé), une vraie Release est publique et permanente : c'est
        # elle qu'interroge le mécanisme de mise à jour in-app (voir
        # verifierMiseAJourDisponible dans www/index.html). Le tag "v<n>"
        # (n = numéro de run, identique au versionCode Android déjà
        # strictement croissant) permet la comparaison numérique côté appli
        # sans avoir besoin d'un fichier de métadonnées séparé.
        # CANAL STABLE : seul un push sur main publie une Release, et elle naît
        # TOUJOURS en "pre-release" (invisible pour l'appli installée, qui ne
        # propose que les versions non pre-release). Pour livrer une version :
        # GitHub > Releases > modifier la version voulue > décocher "Set as a
        # pre-release" (et cocher "Set as the latest release"). Les autres
        # builds (branches claude/**, vibe/**, lancement manuel, autres
        # branches) ne produisent que l'artefact ci-dessus, jamais de Release.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          # Sans ceci, l'action crée le tag contre la branche par défaut
          # (main) au lieu du commit réellement buildé -- repéré après coup
          # via l'API (target_commitish des releases v112/v113 pointant
          # toutes les deux vers le même vieux commit de main, avec un
          # created_at identique et donc plus ancien que leur véritable
          # date de publication). Sans conséquence sur la détection de
          # mise à jour elle-même (basée sur le tag_name, jamais la date),
          # mais un tag qui pointe sur le mauvais commit reste trompeur en
          # navigation GitHub -- épinglé ici sur le commit exact du build.
          target_commitish: ${{ github.sha }}
          name: Ovilog 1.0.${{ github.run_number }}
          prerelease: true
          body: |
            Build automatique — ${{ github.ref_name }}@${{ github.sha }}

            ${{ github.event.head_commit.message }}
          files: android/app/build/outputs/apk/release/*.apk

  build-windows:
    # Job séparé (runner + toolchain distincts) : n'installe rien à la
    # racine du dépôt (electron/ a son propre package.json, voir chantier
    # "Support Desktop Windows"), donc aucun risque d'interférer avec le
    # job "build" ci-dessus. `needs: build` : non pas pour dépendre du
    # résultat du job Android (une éventuelle panne côté Windows ne doit
    # jamais empêcher la sortie de l'APK, voir ci-dessous), mais
    # uniquement pour séquencer les deux appels à softprops/action-gh-
    # release@v2 sur LE MÊME tag_name — en parallèle, les deux jobs
    # tenteraient de créer la même Release en même temps (risque de
    # conflit/duplication) ; en séquence, ce job-ci se contente d'ajouter
    # ses fichiers à la Release déjà créée par le job Android.
    # `if: always()` : tourne même si le job Android a échoué, pour ne
    # jamais bloquer silencieusement la sortie de l'INSTALLEUR (artefact)
    # à cause d'un problème côté Android sans rapport. La PUBLICATION dans
    # la Release est une autre affaire : voir l'étape de publication
    # ci-dessous, désormais conditionnée à la réussite du job Android.
    needs: build
    if: always()
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Injecter le numéro de version (date + hash court du commit)
        # Même sentinelle que le job Android, sur la copie de travail de
        # CE runner uniquement — les deux jobs partent chacun d'un
        # checkout propre, jamais recommis dans le dépôt.
        shell: bash
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/__OVILOG_BUILD_VERSION__/${BUILD_DATE} · ${SHORT_SHA}/" www/index.html

      - name: Aligner le numéro de version de l'app Electron
        # electron-updater compare les versions via le champ "version" de
        # package.json (feed GitHub Releases) — aligné sur le même
        # run_number que l'APK pour une numérotation cohérente entre les
        # deux plateformes, même si chacune a son propre mécanisme de
        # mise à jour.
        working-directory: electron
        shell: bash
        run: npm pkg set version=1.0.${{ github.run_number }}

      - name: Installer les dépendances npm (electron/)
        working-directory: electron
        run: npm install

      - name: Builder l'installeur Windows (NSIS)
        working-directory: electron
        # --publish never : la publication vers la Release GitHub se fait
        # ci-dessous via softprops/action-gh-release@v2 (comme pour l'APK),
        # pas via le mécanisme de publication propre à electron-builder —
        # un seul chemin de publication à maintenir.
        run: npm run dist

      - name: Publier l'installeur comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: ovilog-desktop-v1.0.${{ github.run_number }}
          path: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          retention-days: 30

      - name: Publier sur la Release GitHub (source d'electron-updater)
        # latest.yml et le .blockmap sont indispensables : c'est ce que
        # lit electron-updater (provider "github") pour savoir qu'une
        # nouvelle version existe et où télécharger l'installeur — sans
        # eux, seul l'exe serait présent sur la Release mais jamais
        # détecté automatiquement par l'appli installée.
        # Condition élargie (nouveau) : plus jamais de Release si le job
        # Android (batterie de tests + build APK) n'a pas réussi. Sans
        # elle, un échec côté Android laissait ce job créer SEUL la
        # Release v<n> avec le seul installeur Windows : une version
        # « publiée » dont l'APK n'existe pas, que electron-updater et
        # l'appli installée proposeraient quand même.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build.result == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Ovilog 1.0.${{ github.run_number }}
          prerelease: true
          body: |
            Build automatique — ${{ github.ref_name }}@${{ github.sha }}

            ${{ github.event.head_commit.message }}
          files: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
