# Correctif « bip agneau » (livraison pilotée par l'assistant Vibe) : applique tools/patch_bip_agneau.py dans
# www/index.html (fichier trop gros pour l'édition directe) et pousse le commit sur la branche. Journal complet publié en
# commentaire de l'issue #20 à chaque exécution (les logs Actions ne sont pas lisibles par l'assistant).
# La construction APK, la batterie de tests et la pre-release [test] restent portées par build-apk.yml (déclenché par push,
# numérotation normale du canal de test) : rien n'est publié tant que le nouveau test échoue sur le code non corrigé.
name: Correctif bip agneau (Vibe)
on:
  pull_request:
    branches: [claude/sheep-herd-android-app-7tlcq1]
    types: [opened, synchronize, edited, reopened]
concurrency:
  group: vibe-fix-bip-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
jobs:
  patch:
    name: Appliquer le correctif dans www/index.html (journal sur l'issue 20)
    if: github.event.pull_request.head.ref == 'claude/vibe-fix-bip-agneau'
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code (branche de la PR, pas le merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Appliquer le correctif, tout journaliser
        id: patch
        run: |
          set +e
          J=tools/journal_patch.txt
          {
            echo "== $(date -u) — événement ${{ github.event_name }}, run ${{ github.run_number }} =="
            echo "== head_ref : ${{ github.head_ref }} =="
            python3 --version
            ls -la tools | head -20
            echo "== exécution du script de patch =="
            python3 tools/patch_bip_agneau.py
            echo "== code de sortie du script : $? =="
            echo "== git status =="
            git status --short
            git config user.name "ovilog-ci"
            git config user.email "actions@users.noreply.github.com"
            git add www/index.html
            [ -f tools/diag_oneidscanned.txt ] && git add tools/diag_oneidscanned.txt
            if git diff --cached --quiet; then
              echo "== rien à committer =="
            else
              git commit -m "Mise bas : le bip du lecteur saisit le n° de l'agneau dans sa case (plus de nouvelle recherche de brebis)"
              git push origin HEAD:${{ github.head_ref }}
              echo "== code de sortie du push : $? =="
            fi
            echo "== fin =="
          } > "$J" 2>&1
          cat "$J"
      - name: Publier le journal en commentaire de l'issue 20 (toujours)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/issues/20/comments" -F body="$(cat tools/journal_patch.txt)" || echo "::warning::publication du journal impossible"
