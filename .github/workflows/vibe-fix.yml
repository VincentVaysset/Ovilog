# Correctif « bip agneau » appliqué dans www/index.html par CI (fichier trop gros pour l'édition directe par l'assistant).
# Se déclenche sur la branche claude/vibe-fix-bip-agneau ; idempotent ; le commit est poussé avec GITHUB_TOKEN
# (il ne redéclenche volontairement aucun workflow : la batterie et l'APK partent du push suivant avec le token App).
name: Correctif bip agneau
on:
  push:
    branches: [claude/vibe-fix-bip-agneau]
permissions:
  contents: write
jobs:
  patch:
    name: Appliquer le correctif et le committer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Appliquer le correctif dans www/index.html
        run: python3 tools/patch_bip_agneau.py
      - name: Committer si le fichier a changé
        run: |
          git config user.name "ovilog-ci"
          git config user.email "actions@users.noreply.github.com"
          git add www/index.html
          if git diff --cached --quiet; then
            echo "Rien à committer : correctif déjà présent."
            exit 0
          fi
          git commit -m "Mise bas : le bip du lecteur saisit le n° de l'agneau dans sa case (plus de nouvelle recherche de brebis)"
          git push
