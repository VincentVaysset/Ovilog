<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ovilog</title>
<style>
  :root {
    --primary: #3c7a4e;
    --primary-light: #5a9968;
    --bg: #fbf8f1;
    --card: #ffffff;
    --border: #e6ddc9;
    --text: #2b2a22;
    --text-muted: #79765f;
    --accent: #e3812f;
    --danger: #d1584f;
    --success: #4f9c5f;
    --warning: #e0a326;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--primary);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 6px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; flex: 1; }
  .logo-icon { flex-shrink: 0; }
  .brand-name { font-size: 11px; opacity: 0.8; margin: 0; letter-spacing: 0.5px; }
  header button {
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    padding: 7px 10px;
    border-radius: var(--radius);
    font-size: 13px;
  }
  main { max-width: 700px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  input, select {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: white;
    margin-bottom: 12px;
  }
  label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; }
  button.btn {
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
  }
  button.btn-primary { background: var(--primary); color: white; width: 100%; }
  button.btn-secondary { background: white; border: 1px solid var(--border); color: var(--text); width: 100%; }
  .row { display: flex; gap: 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 12px; }
  .opt-btn {
    padding: 12px;
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: white;
    font-size: 14px;
    cursor: pointer;
  }
  .opt-btn.selected { border-color: var(--primary); background: #eaf0ea; color: var(--primary); font-weight: 600; }
  .opt-btn.selected.warn { border-color: var(--warning); background: #fbf1de; color: var(--warning); }
  .sheep-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    background: white;
    cursor: pointer;
  }
  .sheep-item .num { font-weight: 600; font-size: 15px; }
  .sheep-item .sub { font-size: 12px; color: var(--text-muted); }
  .badge {
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    background: #eaf0ea;
    color: var(--primary);
  }
  .history-item {
    display: flex;
    gap: 10px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
  }
  .history-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); margin-top: 6px; flex-shrink: 0; }
  .history-item .content { flex: 1; }
  .history-item .date { font-size: 12px; color: var(--text-muted); }
  .error-box { color: var(--danger); font-size: 13px; margin-bottom: 10px; }
  .empty { text-align: center; color: var(--text-muted); padding: 40px 20px; }
  .fab {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--primary);
    color: white;
    font-size: 28px;
    border: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    cursor: pointer;
  }
  .hidden { display: none !important; }
  .chip-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    padding: 8px 12px;
    border: 2px solid var(--border);
    border-radius: 20px;
    background: white;
    font-size: 13px;
    cursor: pointer;
  }
  .chip.selected { border-color: var(--warning); background: #fbf1de; color: var(--warning); font-weight: 600; }
  .swipe-wrap { position: relative; border-radius: 8px; overflow: hidden; margin-bottom: 2px; }
  .swipe-bg { position: absolute; inset: 0; display: flex; }
  .swipe-bg .zone-delete { flex: 1; background: var(--danger); color: white; display: flex; align-items: center; padding-left: 16px; font-weight: 600; font-size: 13px; }
  .swipe-bg .zone-edit { flex: 1; background: var(--primary); color: white; display: flex; align-items: center; justify-content: flex-end; padding-right: 16px; font-weight: 600; font-size: 13px; }
  .swipe-fg { position: relative; background: var(--card); touch-action: pan-y; }
  .swipe-hint { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
</style>
</head>
<body>

<header>
  <button id="btn-back" class="hidden">&larr;</button>
  <svg class="logo-icon" width="30" height="30" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="22" cy="26" rx="14" ry="11" fill="white"/>
    <circle cx="10" cy="20" r="4.5" fill="white"/>
    <circle cx="15" cy="14" r="4.5" fill="white"/>
    <circle cx="22" cy="12" r="4.5" fill="white"/>
    <circle cx="29" cy="14" r="4.5" fill="white"/>
    <circle cx="34" cy="20" r="4.5" fill="white"/>
    <circle cx="36" cy="27" r="4.5" fill="white"/>
    <circle cx="10" cy="28" r="4.5" fill="white"/>
    <circle cx="12" cy="35" r="4.5" fill="white"/>
    <ellipse cx="38" cy="30" rx="6" ry="5" fill="#2f5233"/>
    <circle cx="41" cy="28" r="1.4" fill="white"/>
    <rect x="14" y="34" width="3" height="8" rx="1.5" fill="white"/>
    <rect x="28" y="34" width="3" height="8" rx="1.5" fill="white"/>
  </svg>
  <div style="flex:1;">
    <p class="brand-name">OVILOG</p>
    <h1 id="page-title">Mon troupeau</h1>
    <p id="farm-banner" style="font-size:12px;opacity:0.85;margin:2px 0 0;"></p>
  </div>
</header>

<main id="app"></main>

<button class="fab hidden" id="fab-add">+</button>

<script>
/* ---------- Stockage local ---------- */
const DB_KEY = 'troupeau_data_v1';

function loadData() {
  const raw = localStorage.getItem(DB_KEY);
  if (raw) {
    const d = JSON.parse(raw);
    if (!d.produits) {
      d.produits = {
        vaccins: ['Cévac Ovipast'],
        antibiotiques: [],
        antiparasitaires: ['Dectomax'],
        antiinflammatoires: []
      };
    }
    if (!d.acheteurs) d.acheteurs = [];
    if (!d.causesMortalite) d.causesMortalite = [];
    if (!d.agnelles) d.agnelles = [];
    if (d.campagneDebut === undefined) d.campagneDebut = null;
    if (!d.beliers) d.beliers = [];
    if (!d.luttes) d.luttes = [];
    if (!d.journal) d.journal = [];
    if (!d.typesJournal) d.typesJournal = ['Lutte', 'Tonte', 'Vermifuge collectif', 'Visite vétérinaire'];
    if (!d.laitTank) d.laitTank = [];
    if (!d.lots) d.lots = [];
    if (!d.exploitation) d.exploitation = { nom: '', numeroCheptel: '', indicatifMarquage: '', adresse: '', telephone: '' };
    return d;
  }
  return {
    brebis: [],
    agnelles: [],
    beliers: [],
    luttes: [],
    journal: [],
    typesJournal: ['Lutte', 'Tonte', 'Vermifuge collectif', 'Visite vétérinaire'],
    laitTank: [],
    lots: [],
    exploitation: { nom: '', numeroCheptel: '', indicatifMarquage: '', adresse: '', telephone: '' },
    campagneDebut: null,
    casParticuliers: ['Pseudogestation', 'Avortée'],
    produits: {
      vaccins: ['Cévac Ovipast'],
      antibiotiques: [],
      antiparasitaires: ['Dectomax'],
      antiinflammatoires: []
    },
    acheteurs: [],
    causesMortalite: []
  };
}
function saveData(data) {
  localStorage.setItem(DB_KEY, JSON.stringify(data));
}
let DB = loadData();

/* ---------- Utilitaires EID ---------- */
function cleanEid(eid) {
  return eid.replace(/\s+/g, '');
}
function numeroVisuel(eid) {
  const c = cleanEid(eid);
  return c.slice(-5);
}
function anneeNaissance(eid) {
  const c = cleanEid(eid);
  if (c.length < 11) return null;
  const digit = parseInt(c.charAt(10), 10);
  const currentYear = new Date().getFullYear();
  let year = 2020 + digit;
  if (year > currentYear) year -= 10;
  return year;
}
function age(eid) {
  const y = anneeNaissance(eid);
  if (y === null) return null;
  return new Date().getFullYear() - y;
}

/* ---------- Bip sonore de confirmation de scan ---------- */
function playBeep(freq, dur, type) {
  freq = freq || 880;
  dur = dur || 0.15;
  type = type || 'sine';
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch (e) { /* audio non disponible, on ignore silencieusement */ }
}

function playBeepTrouve() {
  playBeep(1046, 0.1);
  setTimeout(() => playBeep(1568, 0.15), 110);
}
function playBeepRate() {
  playBeep(220, 0.35, 'square');
}
function playBeepDejaTrouve() {
  playBeep(440, 0.2, 'triangle');
}

function attachEidBeep(inputEl) {
  let wasValid = false;
  inputEl.addEventListener('input', () => {
    const v = cleanEid(inputEl.value);
    if (v.length >= 11 && !wasValid) {
      playBeep();
      wasValid = true;
    } else if (v.length < 11) {
      wasValid = false;
    }
  });
}

/* ---------- Navigation simple ---------- */
let currentView = 'list';
let currentSheepId = null;
let detailOrigin = 'list';
let previousDetailId = null;
let editingAgnelleId = null;
let currentBelierId = null;
let editBelierContext = null; // { kind, idx }
let currentLotId = null;

const app = document.getElementById('app');
const pageTitle = document.getElementById('page-title');
const btnBack = document.getElementById('btn-back');
const fabAdd = document.getElementById('fab-add');

btnBack.onclick = () => {
  if (currentView === 'detail') {
    if (detailOrigin === 'detail-back' && previousDetailId) {
      const back = previousDetailId;
      previousDetailId = null;
      render('detail', back);
    } else {
      render(detailOrigin);
    }
  }
  else if (currentView === 'add-sheep') render('list');
  else if (currentView === 'stats') render('list');
  else if (currentView === 'sorties') render('list');
  else if (currentView === 'agnelles') render('list');
  else if (currentView === 'add-agnelle') { editingAgnelleId = null; render('agnelles'); }
  else if (currentView === 'beliers') render('list');
  else if (currentView === 'journal') render('list');
  else if (currentView === 'lots') render('list');
  else if (currentView === 'add-lot') render('lots');
  else if (currentView === 'lot-search') render('lots');
  else if (currentView === 'mouvement-groupe') render('lots');
  else if (currentView === 'traitement-collectif') render('lots');
  else if (currentView === 'import-echo') render('stats');
  else if (currentView === 'add-belier') render('beliers');
  else if (currentView === 'belier-detail') render('beliers');
  else if (currentView === 'add-sanitaire-belier' || currentView === 'add-mouvement-belier') { editBelierContext = null; render('belier-detail', currentBelierId); }
  else if (currentView === 'add-echo' || currentView === 'add-agnelage' || currentView === 'add-sanitaire' || currentView === 'add-mouvement' || currentView === 'add-controle') render('detail', currentSheepId);
};
fabAdd.onclick = () => render('add-sheep');

let editContext = null; // { kind, idx }

function deleteItem(kind, idx) {
  if (kind.startsWith('belier-')) return deleteBelierItem(kind.slice(7), idx);
  if (!confirm('Supprimer cet élément ? Cette action est irréversible.')) return;
  const sheep = findSheep(currentSheepId);
  if (!sheep) return;
  sheep[kind] = sheep[kind] || [];
  sheep[kind].splice(idx, 1);
  if (kind === 'mouvements') {
    const last = sheep.mouvements[sheep.mouvements.length - 1];
    if (!last) sheep.statut = 'active';
    else if (last.type === 'Morte') sheep.statut = 'morte';
    else if (last.type === 'Vendue') sheep.statut = 'vendue';
    else if (last.type === 'Vendue reproduction') sheep.statut = 'vendue reproduction';
  }
  saveData(DB);
  render('detail', sheep.id);
}

function editItem(kind, idx) {
  if (kind.startsWith('belier-')) return editBelierItem(kind.slice(7), idx);
  editContext = { kind, idx };
  const viewMap = { echographies: 'add-echo', agnelages: 'add-agnelage', sanitaire: 'add-sanitaire', mouvements: 'add-mouvement', controleLaitier: 'add-controle' };
  render(viewMap[kind], currentSheepId);
}

function deleteBelierItem(kind, idx) {
  if (!confirm('Supprimer cet élément ? Cette action est irréversible.')) return;
  const belier = DB.beliers.find(b => b.id === currentBelierId);
  if (!belier) return;
  belier[kind] = belier[kind] || [];
  belier[kind].splice(idx, 1);
  if (kind === 'mouvements') {
    const last = belier.mouvements[belier.mouvements.length - 1];
    if (!last) belier.statut = 'actif';
    else if (last.type === 'Mort') belier.statut = 'mort';
    else if (last.type === 'Vendu') belier.statut = 'vendu';
    else if (last.type === 'Vendu reproduction') belier.statut = 'vendu reproduction';
  }
  saveData(DB);
  render('belier-detail');
}

function editBelierItem(kind, idx) {
  editBelierContext = { kind, idx };
  render(kind === 'sanitaire' ? 'add-sanitaire-belier' : 'add-mouvement-belier');
}

function activateSwipes(container) {
  container.querySelectorAll('.swipe-wrap').forEach(wrap => {
    const fg = wrap.querySelector('.swipe-fg');
    let startX = 0, dx = 0, dragging = false;
    fg.addEventListener('pointerdown', e => {
      dragging = true; startX = e.clientX; dx = 0;
      fg.style.transition = 'none';
      try { fg.setPointerCapture(e.pointerId); } catch(err) {}
    });
    fg.addEventListener('pointermove', e => {
      if (!dragging) return;
      dx = e.clientX - startX;
      fg.style.transform = `translateX(${dx}px)`;
    });
    function finish() {
      if (!dragging) return;
      dragging = false;
      fg.style.transition = 'transform 0.2s';
      fg.style.transform = 'translateX(0px)';
      const threshold = 70;
      const kind = wrap.dataset.kind;
      const idx = parseInt(wrap.dataset.idx, 10);
      if (dx > threshold) deleteItem(kind, idx);
      else if (dx < -threshold) editItem(kind, idx);
      dx = 0;
    }
    fg.addEventListener('pointerup', finish);
    fg.addEventListener('pointercancel', finish);
  });
}

function render(view, sheepId) {
  currentView = view;
  if (sheepId !== undefined) currentSheepId = sheepId;
  app.innerHTML = '';
  btnBack.classList.toggle('hidden', view === 'list');
  fabAdd.classList.toggle('hidden', view !== 'list');
  const farmBanner = document.getElementById('farm-banner');
  if (farmBanner) {
    if (view === 'list') {
      const parts = [];
      if (DB.exploitation && DB.exploitation.nom) parts.push(DB.exploitation.nom);
      if (DB.campagneDebut) parts.push('Campagne ' + (DB.campagneDebut + 1));
      farmBanner.textContent = parts.join(' · ');
    } else {
      farmBanner.textContent = '';
    }
  }
  const statsBtn = document.getElementById('btn-stats');
  if (statsBtn) statsBtn.classList.toggle('hidden', view !== 'list');
  const sortiesBtn = document.getElementById('btn-sorties');
  if (sortiesBtn) sortiesBtn.classList.toggle('hidden', view !== 'list');
  const agnellesBtn = document.getElementById('btn-agnelles');
  if (agnellesBtn) agnellesBtn.classList.toggle('hidden', view !== 'list');
  const beliersBtn = document.getElementById('btn-beliers');
  if (beliersBtn) beliersBtn.classList.toggle('hidden', view !== 'list');
  const journalBtn = document.getElementById('btn-journal');
  if (journalBtn) journalBtn.classList.toggle('hidden', view !== 'list');
  const lotsBtn = document.getElementById('btn-lots');
  if (lotsBtn) lotsBtn.classList.toggle('hidden', view !== 'list');

  if (view === 'list') renderList();
  else if (view === 'detail') renderDetail(currentSheepId);
  else if (view === 'add-sheep') renderAddSheep();
  else if (view === 'add-echo') renderAddEcho(currentSheepId);
  else if (view === 'add-agnelage') renderAddAgnelage(currentSheepId);
  else if (view === 'add-sanitaire') renderAddSanitaire(currentSheepId);
  else if (view === 'add-mouvement') renderAddMouvement(currentSheepId);
  else if (view === 'add-controle') renderAddControle(currentSheepId);
  else if (view === 'stats') renderStats();
  else if (view === 'sorties') renderSorties();
  else if (view === 'agnelles') renderAgnelles();
  else if (view === 'add-agnelle') renderAddAgnelle();
  else if (view === 'beliers') renderBeliers();
  else if (view === 'add-belier') renderAddBelier();
  else if (view === 'belier-detail') renderBelierDetail(currentBelierId);
  else if (view === 'add-sanitaire-belier') renderAddSanitaireBelier(currentBelierId);
  else if (view === 'add-mouvement-belier') renderAddMouvementBelier(currentBelierId);
  else if (view === 'journal') renderJournal();
  else if (view === 'lots') renderLots();
  else if (view === 'add-lot') renderAddLot();
  else if (view === 'lot-search') renderLotSearch(currentLotId);
  else if (view === 'mouvement-groupe') renderMouvementGroupe();
  else if (view === 'traitement-collectif') renderTraitementCollectif();
  else if (view === 'import-echo') renderImportEcho();
}

/* ---------- Liste des brebis ---------- */
function renderList() {
  const actives = DB.brebis.filter(s => (s.statut || 'active') === 'active');
  pageTitle.textContent = 'Mon troupeau (' + actives.length + ')';
  if (!document.getElementById('btn-stats')) {
    const statsBtn = document.createElement('button');
    statsBtn.id = 'btn-stats';
    statsBtn.textContent = 'Stats';
    statsBtn.onclick = () => render('stats');
    document.querySelector('header').appendChild(statsBtn);
  }
  if (!document.getElementById('btn-sorties')) {
    const sortiesBtn = document.createElement('button');
    sortiesBtn.id = 'btn-sorties';
    sortiesBtn.textContent = 'Sorties';
    sortiesBtn.style.marginLeft = '6px';
    sortiesBtn.onclick = () => render('sorties');
    document.querySelector('header').appendChild(sortiesBtn);
  }
  if (!document.getElementById('btn-agnelles')) {
    const agnellesBtn = document.createElement('button');
    agnellesBtn.id = 'btn-agnelles';
    agnellesBtn.textContent = 'Agnelles';
    agnellesBtn.style.marginLeft = '6px';
    agnellesBtn.onclick = () => render('agnelles');
    document.querySelector('header').appendChild(agnellesBtn);
  }
  if (!document.getElementById('btn-beliers')) {
    const beliersBtn = document.createElement('button');
    beliersBtn.id = 'btn-beliers';
    beliersBtn.textContent = 'Béliers';
    beliersBtn.style.marginLeft = '6px';
    beliersBtn.onclick = () => render('beliers');
    document.querySelector('header').appendChild(beliersBtn);
  }
  if (!document.getElementById('btn-journal')) {
    const journalBtn = document.createElement('button');
    journalBtn.id = 'btn-journal';
    journalBtn.textContent = 'Journal';
    journalBtn.style.marginLeft = '6px';
    journalBtn.onclick = () => render('journal');
    document.querySelector('header').appendChild(journalBtn);
  }
  if (!document.getElementById('btn-lots')) {
    const lotsBtn = document.createElement('button');
    lotsBtn.id = 'btn-lots';
    lotsBtn.textContent = 'Lots';
    lotsBtn.style.marginLeft = '6px';
    lotsBtn.onclick = () => render('lots');
    document.querySelector('header').appendChild(lotsBtn);
  }
  document.getElementById('btn-stats').classList.remove('hidden');
  document.getElementById('btn-sorties').classList.remove('hidden');
  document.getElementById('btn-agnelles').classList.remove('hidden');
  document.getElementById('btn-beliers').classList.remove('hidden');
  document.getElementById('btn-journal').classList.remove('hidden');
  document.getElementById('btn-lots').classList.remove('hidden');
  if (actives.length === 0) {
    app.innerHTML = '<div class="empty">Aucune brebis active pour l\'instant.<br>Appuie sur le bouton + pour en ajouter une.</div>';
  }
  app.insertAdjacentHTML('afterbegin', `
    <div style="margin-bottom:14px;">
      <input type="text" id="scan-open" placeholder="Scanner une brebis pour ouvrir sa fiche" autofocus>
      <div id="scan-open-err" class="error-box hidden"></div>
    </div>
  `);
  const scanOpen = document.getElementById('scan-open');
  scanOpen.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = cleanEid(scanOpen.value);
    const err = document.getElementById('scan-open-err');
    if (!val) return;
    const sheep = DB.brebis.find(s => cleanEid(s.eid) === val);
    if (!sheep) {
      playBeepRate();
      err.textContent = "Aucune brebis trouvée avec cet EID.";
      err.classList.remove('hidden');
      return;
    }
    playBeepTrouve();
    detailOrigin = 'list';
    previousDetailId = null;
    render('detail', sheep.id);
  });
  if (actives.length === 0) return;
  const sorted = [...actives].sort((a,b) => anneeNaissance(a.eid) - anneeNaissance(b.eid));
  sorted.forEach(sheep => {
    const lastEcho = sheep.echographies[sheep.echographies.length - 1];
    const div = document.createElement('div');
    div.className = 'sheep-item';
    div.innerHTML = `
      <div>
        <div class="num">Brebis n°${numeroVisuel(sheep.eid)}</div>
        <div class="sub">${age(sheep.eid) !== null ? age(sheep.eid) + ' an(s)' : 'âge inconnu'}</div>
      </div>
      <span class="badge">${isAttendueTraite(sheep) ? 'Attendue à la traite' : (lastEcho ? lastEcho.stade || lastEcho.special : 'Aucune écho')}</span>
    `;
    div.onclick = () => { detailOrigin = 'list'; previousDetailId = null; render('detail', sheep.id); };
    app.appendChild(div);
  });
}

/* ---------- Sorties (brebis mortes / vendues) ---------- */
function renderSorties() {
  const sorties = DB.brebis.filter(s => (s.statut || 'active') !== 'active');
  pageTitle.textContent = 'Sorties (' + sorties.length + ')';
  if (sorties.length === 0) {
    app.innerHTML = '<div class="empty">Aucune brebis sortie du troupeau pour l\'instant.</div>';
    return;
  }
  const sorted = [...sorties].sort((a,b) => anneeNaissance(a.eid) - anneeNaissance(b.eid));
  sorted.forEach(sheep => {
    const div = document.createElement('div');
    div.className = 'sheep-item';
    div.style.opacity = '0.7';
    div.innerHTML = `
      <div>
        <div class="num">Brebis n°${numeroVisuel(sheep.eid)}</div>
        <div class="sub">${age(sheep.eid) !== null ? age(sheep.eid) + ' an(s)' : 'âge inconnu'}</div>
      </div>
      <span class="badge" style="background:#f0efe9;color:var(--text-muted);">${sheep.statut}</span>
    `;

    app.appendChild(div);
  });
}

/* ---------- Ajout brebis ---------- */
function renderAddSheep() {
  pageTitle.textContent = 'Nouvelle brebis';
  app.innerHTML = `
    <div class="card">
      <label>Scanner ou saisir l'EID</label>
      <input type="text" id="input-eid" placeholder="ex: 250 016299131098" autofocus>
      <div id="preview" style="font-size:13px;color:var(--text-muted);margin-bottom:12px;"></div>
      <label>Date d'entrée (facultatif)</label>
      <input type="date" id="input-date-entree">
      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-sheep">Ajouter la brebis</button>
    </div>
  `;
  const inputEid = document.getElementById('input-eid');
  attachEidBeep(inputEid);
  const preview = document.getElementById('preview');
  inputEid.addEventListener('input', () => {
    const v = inputEid.value;
    if (cleanEid(v).length >= 11) {
      preview.textContent = `Numéro officiel : n°${numeroVisuel(v)} — Âge estimé : ${age(v)} an(s)`;
    } else {
      preview.textContent = '';
    }
  });
  inputEid.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('btn-save-sheep').click();
  });
  document.getElementById('btn-save-sheep').onclick = () => {
    const eid = inputEid.value.trim();
    const err = document.getElementById('err');
    if (cleanEid(eid).length < 11) {
      err.textContent = "Numéro EID incomplet.";
      err.classList.remove('hidden');
      return;
    }
    if (DB.brebis.some(s => cleanEid(s.eid) === cleanEid(eid))) {
      err.textContent = "Cette brebis existe déjà.";
      err.classList.remove('hidden');
      return;
    }
    const dateEntree = document.getElementById('input-date-entree').value || null;
    const sheep = { id: Date.now().toString(), eid, createdAt: Date.now(), dateEntree, echographies: [], agnelages: [], sanitaire: [], mouvements: [], controleLaitier: [], statut: 'active' };
    DB.brebis.push(sheep);
    saveData(DB);
    render('detail', sheep.id);
  };
}

/* ---------- Fiche détail brebis ---------- */
function findSheep(id) { return DB.brebis.find(s => s.id === id); }

function findLambByEid(eid) {
  for (const sheep of DB.brebis) {
    for (const ag of (sheep.agnelages || [])) {
      for (const l of ag.lambs) {
        if (l.eid && cleanEid(l.eid) === cleanEid(eid)) return l;
      }
    }
  }
  return null;
}

function isLambResolved(l) {
  if (l.sexe === 'Mort-né') return true;
  if (l.sexe === 'Femelle' && l.triStatut === 'gardée') return true;
  if (l.statutFinal === 'vendu' || l.statutFinal === 'mort') return true;
  return false;
}

function isAttendueTraite(sheep) {
  if (!sheep.agnelages || sheep.agnelages.length === 0) return false;
  const allLambs = sheep.agnelages.flatMap(a => a.lambs);
  if (allLambs.length === 0) return false;
  return allLambs.every(l => isLambResolved(l));
}

function renderDetail(id) {
  const sheep = findSheep(id);
  if (!sheep) { render('list'); return; }
  pageTitle.textContent = 'Brebis n°' + numeroVisuel(sheep.eid);

  const historyHtml = sheep.echographies.map((e, i) => ({...e, idx: i})).reverse().map(e => `

  const sanitaire = sheep.sanitaire || [];

      </div>
    </div>

  const mouvements = sheep.mouvements || [];
  const mouvementHtml = mouvements.map((m, i) => ({...m, idx: i})).reverse().map(m => `
    <div class="swipe-wrap" data-kind="mouvements" data-idx="${m.idx}">
      <div class="swipe-bg"><span class="zone-delete">Supprimer</span><span class="zone-edit">Modifier</span></div>
      <div class="swipe-fg history-item">
        <div class="dot" style="background:var(--danger);"></div>
        <div class="content">
          <div>${m.type}${m.acheteur ? ' — ' + m.acheteur : ''}${m.cause ? ' — ' + m.cause : ''}</div>
          <div class="date">${m.date}</div>
        </div>
      </div>
    </div>
  `).join('') || '<div style="color:var(--text-muted);font-size:14px;padding:10px 0;">Aucun mouvement enregistré.</div>';

  const controleLaitier = sheep.controleLaitier || [];
  const controleHtml = controleLaitier.map((c, i) => ({...c, idx: i})).reverse().map(c => `
    <div class="swipe-wrap" data-kind="controleLaitier" data-idx="${c.idx}">
      <div class="swipe-bg"><span class="zone-delete">Supprimer</span><span class="zone-edit">Modifier</span></div>
      <div class="swipe-fg history-item">
        <div class="dot" style="background:var(--primary-light);"></div>
        <div class="content">
          <div>Contrôle n°${c.controle} — ${c.quantite} L</div>
          <div class="date">${c.date}</div>
        </div>
      </div>
    </div>
  `).join('') || '<div style="color:var(--text-muted);font-size:14px;padding:10px 0;">Aucun contrôle laitier enregistré.</div>';

  const statutBadge = (sheep.statut && sheep.statut !== 'active')
    ? `<div style="background:#f0efe9;color:var(--text-muted);padding:8px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;">Statut actuel : <strong>${sheep.statut}</strong></div>`
    : '';

  const attendueTraiteBadge = ((sheep.statut || 'active') === 'active' && isAttendueTraite(sheep))
    ? `<div style="background:var(--bg-accent,#e8f0fb);color:var(--primary-light);padding:8px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;font-weight:600;">Attendue à la traite — tous ses agneaux sont partis</div>`
    : '';

  const allLiveLambs = [];
  (sheep.agnelages || []).forEach(a => {
    a.lambs.forEach(l => {
      if (l.sexe !== 'Mort-né') allLiveLambs.push(l);
    });
  });
  const devenirHtml = allLiveLambs.map((l, i) => {
    const resolved = isLambResolved(l);
    let badge = '';
    if (l.sexe === 'Femelle' && l.triStatut === 'gardée') badge = 'Renouvelée';
    else if (l.statutFinal === 'vendu') badge = 'Vendu';
    else if (l.statutFinal === 'mort') badge = 'Mort';
    const aEuSelepherol = (l.sanitaire || []).some(s => s.produit === 'Selepherol');
    return `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);">
        <div>
          <div style="font-size:14px;">n°${l.eid ? numeroVisuel(l.eid) : '?'} — ${l.sexe}</div>
          ${aEuSelepherol ? '<div style="font-size:11px;color:var(--text-muted);">Sélépérol 2cc administré</div>' : ''}

        ${resolved
          ? `<span style="font-size:12px;color:var(--text-muted);">${badge}</span>`
          : `<div style="display:flex;gap:6px;">
               <button type="button" class="btn btn-secondary btn-lamb-vendu" data-i="${i}" style="width:auto;padding:4px 10px;font-size:12px;">Vendu</button>
               <button type="button" class="btn btn-secondary btn-lamb-mort" data-i="${i}" style="width:auto;padding:4px 10px;font-size:12px;">Mort</button>

    <div class="card">
      <div style="font-size:12px;color:var(--text-muted);">EID complet</div>

      <div class="grid2">
        <div><div style="font-size:12px;color:var(--text-muted);">Âge</div><div style="font-weight:600;">${age(sheep.eid)} an(s) (${anneeNaissance(sheep.eid)})</div></div>
        <div><div style="font-size:12px;color:var(--text-muted);">Numéro officiel</div><div style="font-weight:600;">n°${numeroVisuel(sheep.eid)}</div></div>
      </div>
      ${sheep.dateEntree ? `<div style="margin-top:10px;font-size:12px;color:var(--text-muted);">Date d'entrée : <strong style="color:var(--text);">${sheep.dateEntree}</strong></div>` : ''}
    </div>
    ${statutBadge}
    ${attendueTraiteBadge}
    ${mereBlock}
    <div class="row" style="margin-bottom:10px;">
      <button class="btn btn-primary" id="btn-add-echo">+ Échographie</button>
      ${(sheep.agnelages && sheep.agnelages.length > 0)
        ? '<div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);text-align:center;padding:0 8px;">Mise bas déjà saisie — modifie-la par glissement ci-dessous</div>'
        : '<button class="btn btn-primary" id="btn-add-agnelage" style="background:var(--accent);">+ Agnelage</button>'}
    </div>
    <div class="row" style="margin-bottom:16px;">
      <button class="btn btn-primary" id="btn-add-sanitaire" style="background:var(--warning);">+ Carnet sanitaire</button>
      ${(sheep.mouvements && sheep.mouvements.length > 0)
        ? '<div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);text-align:center;padding:0 8px;">Mouvement déjà saisi — modifie-le par glissement ci-dessous</div>'
        : '<button class="btn btn-primary" id="btn-add-mouvement" style="background:var(--danger);">+ Mouvement</button>'}
    </div>
    <button class="btn btn-primary" id="btn-add-controle" style="background:var(--primary-light);margin-bottom:16px;">+ Contrôle laitier</button>
    ${allLiveLambs.length > 0 ? `
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Devenir des agneaux</div>
      ${devenirHtml}
    </div>
    ` : ''}
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Historique échographies</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${historyHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Historique agnelages</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${agnelageHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Carnet sanitaire</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${sanitaireHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Contrôle laitier</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${controleHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Mouvements</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${mouvementHtml}
    </div>
    <button class="btn btn-secondary" id="btn-delete-sheep" style="color:var(--danger);border-color:var(--danger);">Supprimer cette brebis</button>

  document.getElementById('btn-add-echo').onclick = () => { editContext = null; render('add-echo', sheep.id); };
  if (document.getElementById('btn-add-agnelage')) document.getElementById('btn-add-agnelage').onclick = () => { editContext = null; render('add-agnelage', sheep.id); };
  document.getElementById('btn-add-sanitaire').onclick = () => { editContext = null; render('add-sanitaire', sheep.id); };
  if (document.getElementById('btn-add-mouvement')) document.getElementById('btn-add-mouvement').onclick = () => { editContext = null; render('add-mouvement', sheep.id); };
  document.getElementById('btn-add-controle').onclick = () => { editContext = null; render('add-controle', sheep.id); };
  document.querySelectorAll('.btn-lamb-vendu').forEach(btn => {
    btn.onclick = () => {
      allLiveLambs[parseInt(btn.dataset.i, 10)].statutFinal = 'vendu';
      saveData(DB);
      render('detail', sheep.id);
    };
  });
  document.querySelectorAll('.btn-lamb-mort').forEach(btn => {
    btn.onclick = () => {
      allLiveLambs[parseInt(btn.dataset.i, 10)].statutFinal = 'mort';
      saveData(DB);
      render('detail', sheep.id);
    };
  });
  if (document.getElementById('btn-voir-mere-sheep')) {
    document.getElementById('btn-voir-mere-sheep').onclick = () => {
      const mother = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(sheep.mereEid));
      if (!mother) { alert('Fiche de la mère introuvable (peut-être supprimée).'); return; }
      previousDetailId = sheep.id;
      detailOrigin = 'detail-back';
      render('detail', mother.id);
    };
  }
  document.getElementById('btn-delete-sheep').onclick = () => {
    if (!confirm('Supprimer définitivement la brebis n°' + numeroVisuel(sheep.eid) + ' et tout son historique ? Cette action est irréversible.')) return;
    DB.brebis = DB.brebis.filter(s => s.id !== sheep.id);
    saveData(DB);
    render('list');
  };
  activateSwipes(app);
}

/* ---------- Ajout échographie ---------- */
function renderAddEcho(sheepId) {

  const editing = editContext && editContext.kind === 'echographies';
  const existing = editing ? sheep.echographies[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier l\'échographie' : 'Nouvelle échographie';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Brebis n°${numeroVisuel(sheep.eid)}</div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <label>Type d'échographie</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
        <button type="button" class="opt-btn type-echo-opt" data-val="constat">Constat</button>
        <button type="button" class="opt-btn type-echo-opt" data-val="stade">Stades</button>
        <button type="button" class="opt-btn type-echo-opt" data-val="stade_comptage">Stades + comptage</button>
      </div>

      <div id="stade-block" class="hidden">
        <label id="stade-label">Résultat</label>
        <div class="grid4" id="stade-group"></div>
      </div>

      <div id="agneaux-block" class="hidden">
        <label>Nombre d'agneaux</label>
        <div class="grid2" id="agneaux-group">
          <button type="button" class="opt-btn" data-val="Simple">1 agneau</button>
          <button type="button" class="opt-btn" data-val="Double">2 et plus</button>
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <input type="checkbox" id="f-parasit" style="width:18px;height:18px;margin:0;">
        <span style="font-size:14px;color:var(--text);">Parasitisme observé</span>

      <label>Cas particulier (facultatif)</label>
      <div class="chip-list" id="special-list"></div>
      <div class="row" style="margin-bottom:14px;">
        <input type="text" id="new-special" placeholder="Ajouter un nouveau cas...">
        <button type="button" class="btn btn-secondary" id="add-special" style="width:auto;padding:0 16px;">+</button>
      </div>

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-echo">${editing ? 'Enregistrer les modifications' : "Enregistrer l'échographie"}</button>
    </div>
  `;

  let typeEcho = existing ? (existing.type || 'stade_comptage') : null;
  let stade = existing ? existing.stade : null;
  let agneaux = existing ? existing.agneaux : null;
  let special = existing ? existing.special : null;

  function clearGroup(sel) {
    document.querySelectorAll(sel).forEach(b => b.classList.remove('selected'));
  }

  function renderStadeButtons() {
    const group = document.getElementById('stade-group');
    const label = document.getElementById('stade-label');
    if (typeEcho === 'constat') {
      label.textContent = 'Résultat';
      group.style.gridTemplateColumns = 'repeat(2,1fr)';
      group.innerHTML = `
        <button type="button" class="opt-btn stade-opt" data-val="Pleine">Pleine</button>
        <button type="button" class="opt-btn stade-opt" data-val="Vide">Vide</button>
      `;
    } else {
      label.textContent = 'Stade';
      group.style.gridTemplateColumns = 'repeat(2,1fr)';
      group.innerHTML = `
        <button type="button" class="opt-btn stade-opt" data-val="Début">Début</button>
        <button type="button" class="opt-btn stade-opt" data-val="Milieu">Milieu</button>
        <button type="button" class="opt-btn stade-opt" data-val="Fin">Fin</button>
        <button type="button" class="opt-btn stade-opt" data-val="Vide">Vide</button>
      `;
    }
    document.querySelectorAll('.stade-opt').forEach(btn => {
      if (btn.dataset.val === stade) btn.classList.add('selected');
      btn.onclick = () => {
        stade = btn.dataset.val;
        special = null;
        renderSpecialChips();
        clearGroup('.stade-opt');
        btn.classList.add('selected');
        const showAgneaux = (typeEcho === 'stade_comptage') && stade !== 'Vide';
        document.getElementById('agneaux-block').classList.toggle('hidden', !showAgneaux);
        if (!showAgneaux) { agneaux = null; clearGroup('#agneaux-group .opt-btn'); }
        document.getElementById('err').classList.add('hidden');
      };
    });
  }

  function renderSpecialChips() {
    const list = document.getElementById('special-list');
    list.innerHTML = '';
    DB.casParticuliers.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (special === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => {
        if (special === val) { special = null; }
        else {
          special = val; stade = null; agneaux = null;
          clearGroup('.stade-opt');
          clearGroup('#agneaux-group .opt-btn');
          document.getElementById('agneaux-block').classList.add('hidden');
        }
        renderSpecialChips();
        document.getElementById('err').classList.add('hidden');
      };
      list.appendChild(chip);
    });
  }
  renderSpecialChips();

  document.querySelectorAll('.type-echo-opt').forEach(btn => {
    if (btn.dataset.val === typeEcho) btn.classList.add('selected');
    btn.onclick = () => {
      typeEcho = btn.dataset.val;
      stade = null; agneaux = null; special = null;
      document.querySelectorAll('.type-echo-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('stade-block').classList.remove('hidden');
      document.getElementById('agneaux-block').classList.add('hidden');
      renderStadeButtons();
      renderSpecialChips();
      document.getElementById('err').classList.add('hidden');
    };
  });

  if (typeEcho) {
    document.getElementById('stade-block').classList.remove('hidden');
    renderStadeButtons();
    if (typeEcho === 'stade_comptage' && stade && stade !== 'Vide') {
      document.getElementById('agneaux-block').classList.remove('hidden');
    }
  }

  document.querySelectorAll('#agneaux-group .opt-btn').forEach(btn => {
    if (btn.dataset.val === agneaux) btn.classList.add('selected');
    btn.onclick = () => {
      agneaux = btn.dataset.val;
      clearGroup('#agneaux-group .opt-btn');
      btn.classList.add('selected');
      document.getElementById('err').classList.add('hidden');
    };
  });
  if (existing && existing.parasitisme) document.getElementById('f-parasit').checked = true;

  document.getElementById('add-special').onclick = () => {
    const input = document.getElementById('new-special');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.casParticuliers.includes(val)) DB.casParticuliers.push(val);
    saveData(DB);
    input.value = '';
    renderSpecialChips();
    document.querySelectorAll('#special-list .chip').forEach(c => {
      if (c.textContent === val) c.click();
    });
  };

  document.getElementById('btn-save-echo').onclick = () => {
    const err = document.getElementById('err');
    if (!typeEcho) {
      err.textContent = "Choisis un type d'échographie.";
      err.classList.remove('hidden');
      return;
    }
    if (!stade && !special) {
      err.textContent = "Choisis un résultat (ou un cas particulier).";
      err.classList.remove('hidden');
      return;
    }
    const needAgneaux = typeEcho === 'stade_comptage' && (stade === 'Début' || stade === 'Milieu' || stade === 'Fin');
    if (needAgneaux && !agneaux) {
      err.textContent = "Précise si c'est 1 agneau ou 2 et plus.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const echo = {
      type: typeEcho,
      date: document.getElementById('f-date').value,
      stade: stade,
      agneaux: agneaux,
      special: special,
      parasitisme: document.getElementById('f-parasit').checked
    };
    sheep.echographies = sheep.echographies || [];
    if (editing) sheep.echographies[editContext.idx] = echo;
    else sheep.echographies.push(echo);
    editContext = null;
    saveData(DB);
    render('detail', sheep.id);
  };
}

/* ---------- Ajout agnelage ---------- */
function renderAddAgnelage(sheepId) {
  const sheep = findSheep(sheepId);
  const editing = editContext && editContext.kind === 'agnelages';
  const existing = editing ? sheep.agnelages[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier l\'agnelage' : 'Nouvel agnelage';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);
  let lambCount = 0;
  const lambs = {};

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Mère — Brebis n°${numeroVisuel(sheep.eid)}</div>
      <label>Date de naissance</label>
      <input type="date" id="f-date" value="${today}" style="margin-bottom:16px;">
      <div id="lamb-list"></div>
      <button type="button" class="btn btn-secondary" id="add-lamb" style="margin-bottom:14px;">+ Ajouter un agneau</button>
      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-agnelage">${editing ? 'Enregistrer les modifications' : "Enregistrer l'agnelage"}</button>
    </div>
  `;

  function lambCard(id) {
    const div = document.createElement('div');
    div.className = 'card';
    div.style.marginBottom = '10px';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:14px;font-weight:600;">Agneau ${id}</span>
        <button type="button" class="btn btn-secondary remove-lamb" data-id="${id}" style="width:auto;padding:4px 10px;font-size:13px;">Retirer</button>
      </div>
      <label>Sexe</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);">
        <button type="button" class="opt-btn sexe-opt" data-id="${id}" data-val="Mâle">Mâle</button>
        <button type="button" class="opt-btn sexe-opt" data-id="${id}" data-val="Femelle">Femelle</button>
        <button type="button" class="opt-btn sexe-opt" data-id="${id}" data-val="Mort-né">Mort-né</button>
      </div>
      <div class="eid-block" data-id="${id}">
        <label>EID (bip agneau)</label>
        <input type="text" class="eid-input" data-id="${id}" placeholder="Scanner ou saisir l'EID">
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <input type="checkbox" class="adopt-check" data-id="${id}" style="width:16px;height:16px;margin:0;">
          <span style="font-size:14px;color:var(--text);">Adopté par une autre mère</span>
        </label>
        <div class="adopt-field hidden" data-id="${id}">
          <label>EID mère adoptive</label>
          <input type="text" class="adopt-eid" data-id="${id}" placeholder="Scanner ou saisir l'EID">
        </div>
      </div>
      <div class="mortne-note hidden" data-id="${id}" style="font-size:12px;color:var(--text-muted);">Pas de boucle sur un mort-né — aucun EID à saisir.</div>
    `;
    return div;
  }

  function bindLamb(id) {
    document.querySelectorAll(`.sexe-opt[data-id="${id}"]`).forEach(btn => {
      btn.onclick = () => {
        lambs[id].sexe = btn.dataset.val;
        document.querySelectorAll(`.sexe-opt[data-id="${id}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const isMortNe = btn.dataset.val === 'Mort-né';
        document.querySelector(`.eid-block[data-id="${id}"]`).classList.toggle('hidden', isMortNe);
        document.querySelector(`.mortne-note[data-id="${id}"]`).classList.toggle('hidden', !isMortNe);
        document.getElementById('err').classList.add('hidden');
      };
    });
    const check = document.querySelector(`.adopt-check[data-id="${id}"]`);
    check.onchange = () => {
      document.querySelector(`.adopt-field[data-id="${id}"]`).classList.toggle('hidden', !check.checked);
      lambs[id].adopte = check.checked;
    };
    document.querySelector(`.remove-lamb[data-id="${id}"]`).onclick = () => {
      delete lambs[id];
      document.querySelector(`.remove-lamb[data-id="${id}"]`).closest('.card').remove();
    };
    const eidInput = document.querySelector(`.eid-input[data-id="${id}"]`);
    if (eidInput) attachEidBeep(eidInput);
    const adoptEidInput = document.querySelector(`.adopt-eid[data-id="${id}"]`);
    if (adoptEidInput) attachEidBeep(adoptEidInput);
  }

  function addLamb() {
    lambCount++;
    const id = lambCount;
    lambs[id] = { sexe: null, adopte: false };
    document.getElementById('lamb-list').appendChild(lambCard(id));
    bindLamb(id);
  }
  document.getElementById('add-lamb').onclick = addLamb;

  if (existing) {
    existing.lambs.forEach(l => {
      addLamb();
      const id = lambCount;
      const sexeBtn = document.querySelector(`.sexe-opt[data-id="${id}"][data-val="${l.sexe}"]`);
      if (sexeBtn) sexeBtn.click();
      if (l.sexe !== 'Mort-né') {
        const eidInput = document.querySelector(`.eid-input[data-id="${id}"]`);
        if (eidInput) eidInput.value = l.eid || '';
        if (l.adopte) {
          const check = document.querySelector(`.adopt-check[data-id="${id}"]`);
          check.checked = true;
          check.dispatchEvent(new Event('change'));
          const adoptEidInput = document.querySelector(`.adopt-eid[data-id="${id}"]`);
          if (adoptEidInput) adoptEidInput.value = l.adoptiveEid || '';
        }
      }
    });
  } else {
    addLamb();
  }

  document.getElementById('btn-save-agnelage').onclick = () => {
    const err = document.getElementById('err');
    const ids = Object.keys(lambs);
    if (ids.length === 0) {
      err.textContent = "Ajoute au moins un agneau.";
      err.classList.remove('hidden');
      return;
    }
    for (const id of ids) {
      if (!lambs[id].sexe) {
        err.textContent = "Sélectionne le sexe de chaque agneau.";
        err.classList.remove('hidden');
        return;
      }
      if (lambs[id].sexe !== 'Mort-né') {
        const eidInput = document.querySelector(`.eid-input[data-id="${id}"]`);
        lambs[id].eid = eidInput.value.trim();
        if (lambs[id].adopte) {
          const adoptEidInput = document.querySelector(`.adopt-eid[data-id="${id}"]`);
          lambs[id].adoptiveEid = adoptEidInput.value.trim();
        }
        lambs[id].sanitaire = lambs[id].sanitaire || [];
        const dejaSelepherol = lambs[id].sanitaire.some(s => s.produit === 'Selepherol');
        if (!dejaSelepherol) {
          lambs[id].sanitaire.push({
            type: 'Traitement', sousType: null, produit: 'Selepherol', dose: '2 cc',
            date: document.getElementById('f-date').value,
            commentaire: 'Injection systématique à la naissance'
          });
        }
      }
    }
    err.classList.add('hidden');
    const agnelage = {
      date: document.getElementById('f-date').value,
      lambs: ids.map(id => lambs[id])
    };
    sheep.agnelages = sheep.agnelages || [];
    if (editing) sheep.agnelages[editContext.idx] = agnelage;
    else sheep.agnelages.push(agnelage);
    editContext = null;
    saveData(DB);
    render('detail', sheep.id);
  };
}

/* ---------- Ajout carnet sanitaire ---------- */
function renderAddSanitaire(sheepId) {
  const sheep = findSheep(sheepId);
  const editing = editContext && editContext.kind === 'sanitaire';
  const existing = editing ? sheep.sanitaire[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le soin' : 'Carnet sanitaire';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Brebis n°${numeroVisuel(sheep.eid)}</div>

      <label>Type d'évènement</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px;">
        <button type="button" class="opt-btn type-opt" data-val="Vaccin">Vaccin</button>
        <button type="button" class="opt-btn type-opt" data-val="Traitement">Traitement</button>
        <button type="button" class="opt-btn type-opt" data-val="Autre">Autre</button>
      </div>

      <div id="sous-type-block" class="hidden" style="margin-bottom:10px;">
        <label>Catégorie de traitement</label>
        <div class="grid2" id="sous-type-group">
          <button type="button" class="opt-btn sous-opt" data-val="Antibiotique">Antibiotique</button>
          <button type="button" class="opt-btn sous-opt" data-val="Antiparasitaire">Antiparasitaire</button>
        </div>
        <div class="grid2">
          <button type="button" class="opt-btn sous-opt" data-val="Anti-inflammatoire" style="grid-column:span 2;">Anti-inflammatoire</button>
        </div>
      </div>

      <div id="autre-note" class="hidden" style="font-size:13px;color:var(--text-muted);margin-bottom:14px;padding:10px;background:#f0efe9;border-radius:var(--radius);">Soin de plaie — pas de produit à sélectionner.</div>

      <div id="produit-block" class="hidden" style="margin-bottom:14px;">
        <label>Produit utilisé</label>
        <div class="chip-list" id="produit-list"></div>
        <div class="row">
          <input type="text" id="new-produit" placeholder="Ajouter un nouveau produit...">
          <button type="button" class="btn btn-secondary" id="add-produit" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <label>Dose (facultatif)</label>
      <input type="text" id="f-dose" placeholder="ex: 2 ml" value="${existing ? (existing.dose || '') : ''}">

      <label>Commentaire (facultatif)</label>
      <input type="text" id="f-comment" placeholder="ex: rappel dans 3 semaines" value="${existing ? (existing.commentaire || '') : ''}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-sanitaire">${editing ? 'Enregistrer les modifications' : 'Enregistrer le soin'}</button>
    </div>
  `;

  let type = null, sousType = null, produit = null;

  function categorieKey() {
    if (type === 'Vaccin') return 'vaccins';
    if (sousType === 'Antibiotique') return 'antibiotiques';
    if (sousType === 'Antiparasitaire') return 'antiparasitaires';
    if (sousType === 'Anti-inflammatoire') return 'antiinflammatoires';
    return null;
  }

  function renderProduitChips() {
    const key = categorieKey();
    const list = document.getElementById('produit-list');
    list.innerHTML = '';
    if (!key) { document.getElementById('produit-block').classList.add('hidden'); return; }
    document.getElementById('produit-block').classList.remove('hidden');
    DB.produits[key].forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (produit === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => {
        produit = (produit === val) ? null : val;
        renderProduitChips();
        document.getElementById('err').classList.add('hidden');
      };
      list.appendChild(chip);
    });
  }

  document.querySelectorAll('.type-opt').forEach(btn => {
    btn.onclick = () => {
      type = btn.dataset.val;
      sousType = null;
      produit = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      document.getElementById('sous-type-block').classList.toggle('hidden', type !== 'Traitement');
      document.getElementById('autre-note').classList.toggle('hidden', type !== 'Autre');
      if (type === 'Autre') {
        document.getElementById('produit-block').classList.add('hidden');
      } else if (type === 'Vaccin') {
        renderProduitChips();
      } else {
        document.getElementById('produit-block').classList.add('hidden');
      }
      document.getElementById('err').classList.add('hidden');
    };
  });

  document.querySelectorAll('.sous-opt').forEach(btn => {
    btn.onclick = () => {
      sousType = btn.dataset.val;
      produit = null;
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderProduitChips();
      document.getElementById('err').classList.add('hidden');
    };
  });

  document.getElementById('add-produit').onclick = () => {
    const key = categorieKey();
    if (!key) return;
    const input = document.getElementById('new-produit');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.produits[key].includes(val)) DB.produits[key].push(val);
    saveData(DB);
    input.value = '';
    produit = val;
    renderProduitChips();
  };

  document.getElementById('btn-save-sanitaire').onclick = () => {
    const err = document.getElementById('err');
    if (!type) {
      err.textContent = "Choisis un type d'évènement.";
      err.classList.remove('hidden');
      return;
    }
    if (type === 'Traitement' && !sousType) {
      err.textContent = "Choisis une catégorie de traitement.";
      err.classList.remove('hidden');
      return;
    }
    if (type !== 'Autre' && !produit) {
      err.textContent = "Sélectionne ou ajoute un produit.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const soin = {
      type: type,
      sousType: sousType,
      produit: type === 'Autre' ? 'Soin de plaie' : produit,
      date: document.getElementById('f-date').value,
      dose: document.getElementById('f-dose').value.trim(),
      commentaire: document.getElementById('f-comment').value.trim()
    };
    sheep.sanitaire = sheep.sanitaire || [];
    if (editing) sheep.sanitaire[editContext.idx] = soin;
    else sheep.sanitaire.push(soin);
    editContext = null;
    saveData(DB);
    render('detail', sheep.id);
  };

  if (existing) {
    const typeBtn = [...document.querySelectorAll('.type-opt')].find(b => b.dataset.val === existing.type);
    if (typeBtn) typeBtn.click();
    if (existing.sousType) {
      const sousBtn = [...document.querySelectorAll('.sous-opt')].find(b => b.dataset.val === existing.sousType);
      if (sousBtn) sousBtn.click();
    }
    if (existing.produit && existing.type !== 'Autre') {
      const chip = [...document.querySelectorAll('#produit-list .chip')].find(c => c.textContent === existing.produit);
      if (chip) chip.click();
    }
  }
}

/* ---------- Ajout contrôle laitier ---------- */
function renderAddControle(sheepId) {
  const sheep = findSheep(sheepId);
  const editing = editContext && editContext.kind === 'controleLaitier';
  const existing = editing ? sheep.controleLaitier[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le contrôle laitier' : 'Contrôle laitier';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Brebis n°${numeroVisuel(sheep.eid)}</div>

      <label>Contrôle de la campagne</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
        <button type="button" class="opt-btn ctrl-opt" data-val="1">1er</button>
        <button type="button" class="opt-btn ctrl-opt" data-val="2">2e</button>
        <button type="button" class="opt-btn ctrl-opt" data-val="3">3e</button>
      </div>

      <label>Quantité de lait (L)</label>
      <input type="number" step="0.1" id="f-quantite" placeholder="ex: 1.8" value="${existing ? existing.quantite : ''}">

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-controle">${editing ? 'Enregistrer les modifications' : 'Enregistrer le contrôle'}</button>
    </div>
  `;

  let controle = existing ? String(existing.controle) : null;
  document.querySelectorAll('.ctrl-opt').forEach(btn => {
    if (btn.dataset.val === controle) btn.classList.add('selected');
    btn.onclick = () => {
      controle = btn.dataset.val;
      document.querySelectorAll('.ctrl-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('err').classList.add('hidden');
    };
  });

  document.getElementById('btn-save-controle').onclick = () => {
    const err = document.getElementById('err');
    const quantite = parseFloat(document.getElementById('f-quantite').value);
    if (!controle) {
      err.textContent = "Choisis le numéro du contrôle.";
      err.classList.remove('hidden');
      return;
    }
    if (isNaN(quantite) || quantite < 0) {
      err.textContent = "Saisis une quantité de lait valide.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const record = {
      controle: parseInt(controle, 10),
      quantite: Math.round(quantite * 10) / 10,
      date: document.getElementById('f-date').value
    };
    sheep.controleLaitier = sheep.controleLaitier || [];
    if (editing) sheep.controleLaitier[editContext.idx] = record;
    else sheep.controleLaitier.push(record);
    editContext = null;
    saveData(DB);
    render('detail', sheep.id);
  };
}

      chip.textContent = val;
      chip.onclick = () => {
        acheteur = (acheteur === val) ? null : val;
        renderAcheteurChips();
        document.getElementById('err').classList.add('hidden');
      };
      list.appendChild(chip);
    });
  }
  renderCauseChips();
  renderAcheteurChips();

  document.querySelectorAll('.type-opt').forEach(btn => {
    btn.onclick = () => {
      type = btn.dataset.val;
      cause = null; acheteur = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('cause-block').classList.toggle('hidden', type !== 'Morte');
      document.getElementById('acheteur-block').classList.toggle('hidden', !(type === 'Vendue' || type === 'Vendue reproduction'));
      renderCauseChips();
      renderAcheteurChips();
      document.getElementById('err').classList.add('hidden');
    };
  });

  document.getElementById('add-cause').onclick = () => {
    const input = document.getElementById('new-cause');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.causesMortalite.includes(val)) DB.causesMortalite.push(val);
    saveData(DB);
    input.value = '';
    cause = val;
    renderCauseChips();
  };
  document.getElementById('add-acheteur').onclick = () => {
    const input = document.getElementById('new-acheteur');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.acheteurs.includes(val)) DB.acheteurs.push(val);
    saveData(DB);
    input.value = '';
    acheteur = val;
    renderAcheteurChips();
  };

  document.getElementById('btn-save-mouvement').onclick = () => {
    const err = document.getElementById('err');
    if (!type) {
      err.textContent = "Choisis un type de mouvement.";
      err.classList.remove('hidden');
      return;
    }
    if ((type === 'Vendue' || type === 'Vendue reproduction') && !acheteur) {
      err.textContent = "Sélectionne ou ajoute un acheteur.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const mouvement = {
      type: type,
      cause: type === 'Morte' ? cause : null,
      acheteur: acheteur,
      date: document.getElementById('f-date').value
    };
    sheep.mouvements = sheep.mouvements || [];
    if (editing) sheep.mouvements[editContext.idx] = mouvement;
    else sheep.mouvements.push(mouvement);
    editContext = null;
    const last = sheep.mouvements[sheep.mouvements.length - 1];
    if (!last) sheep.statut = 'active';
    else if (last.type === 'Morte') sheep.statut = 'morte';
    else if (last.type === 'Vendue') sheep.statut = 'vendue';
    else if (last.type === 'Vendue reproduction') sheep.statut = 'vendue reproduction';
    saveData(DB);
    render('detail', sheep.id);
  };

  if (existing) {
    const typeBtn = [...document.querySelectorAll('.type-opt')].find(b => b.dataset.val === existing.type);
    if (typeBtn) typeBtn.click();
    if (existing.cause) {
      const chip = [...document.querySelectorAll('#cause-list .chip')].find(c => c.textContent === existing.cause);
      if (chip) chip.click();
    }
    if (existing.acheteur) {
      const chip = [...document.querySelectorAll('#acheteur-list .chip')].find(c => c.textContent === existing.acheteur);
      if (chip) chip.click();
    }
  }
}

/* ---------- Inventaire agnelles ---------- */
function getCandidatesATrier() {
  const candidates = [];
  DB.brebis.forEach(sheep => {
    (sheep.agnelages || []).forEach(ag => {
      ag.lambs.forEach(l => {
        if (l.sexe === 'Femelle' && l.eid && !l.triStatut) {
          candidates.push({ lamb: l, motherEid: sheep.eid, date: ag.date });
        }
      });
    });
  });
  return candidates;
}

function getEcartees() {
  const list = [];
  DB.brebis.forEach(sheep => {
    (sheep.agnelages || []).forEach(ag => {
      ag.lambs.forEach(l => {
        if (l.sexe === 'Femelle' && l.eid && l.triStatut === 'écartée') {
          list.push({ lamb: l, motherEid: sheep.eid, date: ag.date });
        }
      });
    });
  });
  return list;
}

function renderAgnelles() {
  DB.agnelles = DB.agnelles || [];
  const candidates = getCandidatesATrier();
  pageTitle.textContent = 'Agnelles (' + DB.agnelles.length + ')';

  const candidatesHtml = candidates.length === 0
    ? '<div style="font-size:13px;color:var(--text-muted);padding:8px 0 16px;">Aucune femelle en attente de tri pour le moment.</div>'
    : candidates.map((c, i) => `
      <div class="card">
        <div style="margin-bottom:10px;">
          <div style="font-weight:600;">n°${numeroVisuel(c.lamb.eid)}</div>
          <div style="font-size:12px;color:var(--text-muted);">Née le ${c.date} de la brebis n°${numeroVisuel(c.motherEid)}</div>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary btn-garder" data-i="${i}">Garder (trier)</button>
          <button type="button" class="btn btn-secondary btn-ecarter" data-i="${i}" style="width:auto;padding:0 14px;">Écarter</button>
        </div>
        <button type="button" class="btn btn-secondary btn-voir-mere" data-eid="${c.motherEid}" style="margin-top:8px;">Voir la fiche de la mère</button>
      </div>
    `).join('');

  const listHtml = DB.agnelles.length === 0
    ? '<div style="font-size:13px;color:var(--text-muted);padding:8px 0;">Aucune agnelle triée ou achetée pour l\'instant.</div>'
    : [...DB.agnelles].sort((a,b) => (b.dateEntree || '').localeCompare(a.dateEntree || '')).map(ag => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <div style="font-weight:600;">n°${numeroVisuel(ag.eid)}</div>
            <div style="font-size:12px;color:var(--text-muted);">${ag.origine === 'née' ? 'Née sur l\'exploitation' : 'Achetée'} · triée/entrée le ${ag.dateEntree}</div>
            ${ag.origine === 'achetée' && (ag.pere || ag.mere) ? `<div style="font-size:11px;color:var(--text-muted);">${ag.pere ? 'Père : ' + ag.pere + ' ' : ''}${ag.mere ? '· Mère : ' + ag.mere : ''}</div>` : ''}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <button type="button" class="btn btn-secondary btn-edit-agnelle" data-id="${ag.id}" style="width:auto;padding:6px 14px;font-size:13px;">Modifier</button>
            <button type="button" class="btn btn-secondary btn-remove-agnelle" data-id="${ag.id}" style="color:var(--danger);border-color:var(--danger);width:auto;padding:6px 14px;font-size:13px;">Suppr.</button>
          </div>
        </div>
        <div class="row" style="margin-top:8px;">
          ${ag.origine === 'née' ? `<button type="button" class="btn btn-secondary btn-annuler-tri" data-id="${ag.id}">Revenir sur le tri</button>` : ''}
          ${ag.motherEid ? `<button type="button" class="btn btn-secondary btn-voir-mere" data-eid="${ag.motherEid}">Voir la fiche de la mère</button>` : ''}
        </div>
      </div>
    `).join('');

  const ecartees = getEcartees();
  const ecarteesHtml = ecartees.length === 0
    ? '<div style="font-size:13px;color:var(--text-muted);padding:8px 0;">Aucune agnelle écartée.</div>'
    : ecartees.map((c, i) => `
      <div class="card">
        <div style="margin-bottom:10px;">
          <div style="font-weight:600;">n°${numeroVisuel(c.lamb.eid)}</div>
          <div style="font-size:12px;color:var(--text-muted);">Née le ${c.date} de la brebis n°${numeroVisuel(c.motherEid)}</div>
        </div>
        <button type="button" class="btn btn-secondary btn-reconsiderer" data-i="${i}">Reconsidérer (remettre à trier)</button>
      </div>
    `).join('');

  app.innerHTML = `
    <div style="font-size:14px;font-weight:600;margin-bottom:2px;">À trier (femelles nées sur l'exploitation)</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Scanner une agnelle ci-dessous la marque directement comme gardée.</div>
    <label>Scanner l'agnelle à trier</label>
    <input type="text" id="scan-tri" placeholder="Scanner ou saisir l'EID" autofocus>
    <div id="scan-err" class="error-box hidden"></div>
    ${candidatesHtml}

    <div style="font-size:14px;font-weight:600;margin:20px 0 10px;">Agnelles triées / achetées</div>
    ${listHtml}
    <button class="btn btn-primary" id="btn-add-agnelle" style="margin-top:10px;">+ Ajouter manuellement (achetée ou autre)</button>

    <div style="font-size:14px;font-weight:600;margin:20px 0 10px;">Écartées</div>
    ${ecarteesHtml}
  `;

  const scanInput = document.getElementById('scan-tri');
  attachEidBeep(scanInput);
  scanInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = cleanEid(scanInput.value);
    const err = document.getElementById('scan-err');
    if (!val) return;
    const match = candidates.find(c => cleanEid(c.lamb.eid) === val);
    if (!match) {
      err.textContent = "Aucune agnelle correspondante en attente de tri.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    garderAgnelle(match);
  });

  function garderAgnelle(c) {
    c.lamb.triStatut = 'gardée';
    DB.agnelles.push({ id: Date.now().toString() + Math.random().toString(36).slice(2,6), eid: c.lamb.eid, origine: 'née', motherEid: c.motherEid, dateEntree: new Date().toISOString().slice(0,10), sanitaire: (c.lamb.sanitaire || []).slice() });
    saveData(DB);
    render('agnelles');
  }

  document.querySelectorAll('.btn-garder').forEach(btn => {
    btn.onclick = () => garderAgnelle(candidates[parseInt(btn.dataset.i, 10)]);
  });
  document.querySelectorAll('.btn-ecarter').forEach(btn => {
    btn.onclick = () => {
      const c = candidates[parseInt(btn.dataset.i, 10)];
      if (!confirm('Écarter cette agnelle (non gardée pour le renouvellement) ?')) return;
      c.lamb.triStatut = 'écartée';
      saveData(DB);
      render('agnelles');
    };
  });
  document.querySelectorAll('.btn-reconsiderer').forEach(btn => {
    btn.onclick = () => {
      const c = ecartees[parseInt(btn.dataset.i, 10)];
      delete c.lamb.triStatut;
      saveData(DB);
      render('agnelles');
    };
  });
  document.querySelectorAll('.btn-remove-agnelle').forEach(btn => {
    btn.onclick = () => {
      if (!confirm('Supprimer cette agnelle de l\'inventaire ? Cette action est irréversible.')) return;
      DB.agnelles = DB.agnelles.filter(a => a.id !== btn.dataset.id);
      saveData(DB);
      render('agnelles');
    };
  });
  document.querySelectorAll('.btn-annuler-tri').forEach(btn => {
    btn.onclick = () => {
      const ag = DB.agnelles.find(a => a.id === btn.dataset.id);
      if (!ag) return;
      if (!confirm('Revenir sur le tri de la n°' + numeroVisuel(ag.eid) + ' ? Elle repassera dans la liste "à trier".')) return;
      const lamb = findLambByEid(ag.eid);
      if (lamb) delete lamb.triStatut;
      DB.agnelles = DB.agnelles.filter(a => a.id !== ag.id);
      saveData(DB);
      render('agnelles');
    };
  });
  document.querySelectorAll('.btn-voir-mere').forEach(btn => {
    btn.onclick = () => {
      const mother = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(btn.dataset.eid));
      if (!mother) { alert("Fiche de la mère introuvable (peut-être supprimée)."); return; }
      detailOrigin = 'agnelles';
      previousDetailId = null;
      render('detail', mother.id);
    };
  });
  document.getElementById('btn-add-agnelle').onclick = () => { editingAgnelleId = null; render('add-agnelle'); };
  document.querySelectorAll('.btn-edit-agnelle').forEach(btn => {
    btn.onclick = () => { editingAgnelleId = btn.dataset.id; render('add-agnelle'); };
  });
}

function renderAddAgnelle() {
  const editing = !!editingAgnelleId;
  const existing = editing ? DB.agnelles.find(a => a.id === editingAgnelleId) : null;
  pageTitle.textContent = editing ? 'Modifier une agnelle' : 'Ajouter une agnelle';
  const today = existing ? existing.dateEntree : new Date().toISOString().slice(0,10);
  const origineFixe = existing ? existing.origine : null;

  const origineBlock = editing
    ? `<div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Origine : <strong>${origineFixe === 'née' ? 'Née sur l\'exploitation' : 'Achetée'}</strong> (non modifiable)</div>`
    : `<label>Origine</label>
       <div class="grid2" style="margin-bottom:10px;">
         <button type="button" class="opt-btn origine-opt" data-val="née">Née sur l'exploitation</button>
         <button type="button" class="opt-btn origine-opt" data-val="achetée">Achetée</button>
       </div>`;

  const eidBlock = (editing && origineFixe === 'née')
    ? `<label>EID</label><div style="font-size:14px;margin-bottom:12px;">${existing.eid} (non modifiable, lié à l'agnelage d'origine)</div>`
    : `<label>Scanner ou saisir l'EID</label>
       <input type="text" id="input-eid" value="${existing ? existing.eid : ''}" placeholder="ex: 250 016299131098" autofocus>
       <div id="preview" style="font-size:13px;color:var(--text-muted);margin-bottom:12px;"></div>`;

  app.innerHTML = `
    <div class="card">
      ${origineBlock}
      ${eidBlock}
      <label>Date (tri ou entrée)</label>
      <input type="date" id="f-date" value="${today}">
      <div id="parents-block" class="${(!editing || origineFixe === 'achetée') ? '' : 'hidden'}" style="${(!editing) ? 'display:none;' : ''}">
        <label>Père (facultatif, ex: issue d'IA)</label>
        <input type="text" id="f-pere" placeholder="Identifiant ou nom du père" value="${existing && existing.pere ? existing.pere : ''}">
        <label>Mère (facultatif, ex: issue d'IA)</label>
        <input type="text" id="f-mere" placeholder="Identifiant ou nom de la mère" value="${existing && existing.mere ? existing.mere : ''}">
      </div>
      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-agnelle">${editing ? 'Enregistrer les modifications' : "Ajouter à l'inventaire"}</button>
    </div>
  `;

  let origine = origineFixe;
  const parentsBlock = document.getElementById('parents-block');

  document.querySelectorAll('.origine-opt').forEach(btn => {
    btn.onclick = () => {
      origine = btn.dataset.val;
      document.querySelectorAll('.origine-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      parentsBlock.style.display = origine === 'achetée' ? 'block' : 'none';
      document.getElementById('err').classList.add('hidden');
    };
  });

  const inputEid = document.getElementById('input-eid');
  if (inputEid) {
    attachEidBeep(inputEid);
    const preview = document.getElementById('preview');
    inputEid.addEventListener('input', () => {
      const v = inputEid.value;
      preview.textContent = cleanEid(v).length >= 11 ? ('Numéro officiel : n°' + numeroVisuel(v)) : '';
    });
    inputEid.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-save-agnelle').click();
    });
  }

  document.getElementById('btn-save-agnelle').onclick = () => {
    const err = document.getElementById('err');
    const date = document.getElementById('f-date').value;

    if (editing && origineFixe === 'née') {
      existing.dateEntree = date;
      editingAgnelleId = null;
      saveData(DB);
      render('agnelles');
      return;
    }

    if (!origine) {
      err.textContent = "Choisis l'origine (née ou achetée).";
      err.classList.remove('hidden');
      return;
    }
    const eid = inputEid.value.trim();
    if (cleanEid(eid).length < 11) {
      err.textContent = "Numéro EID incomplet.";
      err.classList.remove('hidden');
      return;
    }
    const eidTakenElsewhere = DB.agnelles.some(a => cleanEid(a.eid) === cleanEid(eid) && a.id !== editingAgnelleId)
      || DB.brebis.some(s => cleanEid(s.eid) === cleanEid(eid));
    if (eidTakenElsewhere) {
      err.textContent = "Cet animal existe déjà.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const pere = document.getElementById('f-pere') ? document.getElementById('f-pere').value.trim() : '';
    const mere = document.getElementById('f-mere') ? document.getElementById('f-mere').value.trim() : '';

    if (editing) {
      existing.eid = eid;
      existing.dateEntree = date;
      existing.pere = pere;
      existing.mere = mere;
      editingAgnelleId = null;
    } else {
      DB.agnelles.push({ id: Date.now().toString(), eid, origine: origine, dateEntree: date, pere: pere, mere: mere, sanitaire: [] });
    }
    saveData(DB);
    render('agnelles');
  };
}

    <div class="swipe-wrap" data-kind="belier-mouvements" data-idx="${m.idx}">
      <div class="swipe-bg"><span class="zone-delete">Supprimer</span><span class="zone-edit">Modifier</span></div>

        <div class="dot" style="background:var(--danger);"></div>

    : '';

    <div class="card">
      <div style="font-size:12px;color:var(--text-muted);">EID complet</div>

      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${mouvementHtml}

    <button class="btn btn-secondary" id="btn-delete-belier" style="color:var(--danger);border-color:var(--danger);">Supprimer ce bélier</button>

  document.getElementById('btn-add-mouvement-belier').onclick = () => { editBelierContext = null; render('add-mouvement-belier'); };
  document.getElementById('btn-delete-belier').onclick = () => {
    if (!confirm('Supprimer définitivement le bélier n°' + numeroVisuel(belier.eid) + ' et tout son historique ? Cette action est irréversible.')) return;
    DB.beliers = DB.beliers.filter(b => b.id !== belier.id);
    saveData(DB);
    render('beliers');
