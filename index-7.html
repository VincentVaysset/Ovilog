  activateSwipes(app);
}

/* ---------- Ajout carnet sanitaire bélier ---------- */
function renderAddSanitaireBelier() {
  const belier = DB.beliers.find(b => b.id === currentBelierId);
  const editing = editBelierContext && editBelierContext.kind === 'sanitaire';
  const existing = editing ? belier.sanitaire[editBelierContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le soin' : 'Carnet sanitaire';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Bélier n°${numeroVisuel(belier.eid)}</div>

      <label>Type d'évènement</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px;">
        <button type="button" class="opt-btn type-opt" data-val="Vaccin">Vaccin</button>
        <button type="button" class="opt-btn type-opt" data-val="Traitement">Traitement</button>
        <button type="button" class="opt-btn type-opt" data-val="Autre">Autre</button>
      </div>

      <div id="sous-type-block" class="hidden" style="margin-bottom:10px;">
        <label>Catégorie de traitement</label>
        <div class="grid2" id="sous-type-group">
          <button type="button" class="opt-btn sous-opt" data-val="Antibiotique">Antibiotique</button>
          <button type="button" class="opt-btn sous-opt" data-val="Antiparasitaire">Antiparasitaire</button>
        </div>
        <div class="grid2">
          <button type="button" class="opt-btn sous-opt" data-val="Anti-inflammatoire" style="grid-column:span 2;">Anti-inflammatoire</button>
        </div>
      </div>

      <div id="autre-note" class="hidden" style="font-size:13px;color:var(--text-muted);margin-bottom:14px;padding:10px;background:#f0efe9;border-radius:var(--radius);">Soin de plaie — pas de produit à sélectionner.</div>

      <div id="produit-block" class="hidden" style="margin-bottom:14px;">
        <label>Produit utilisé</label>
        <div class="chip-list" id="produit-list"></div>
        <div class="row">
          <input type="text" id="new-produit" placeholder="Ajouter un nouveau produit...">
          <button type="button" class="btn btn-secondary" id="add-produit" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <label>Dose (facultatif)</label>
      <input type="text" id="f-dose" placeholder="ex: 2 ml" value="${existing ? (existing.dose || '') : ''}">

      <label>Commentaire (facultatif)</label>
      <input type="text" id="f-comment" placeholder="ex: rappel dans 3 semaines" value="${existing ? (existing.commentaire || '') : ''}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-sanitaire">${editing ? 'Enregistrer les modifications' : 'Enregistrer le soin'}</button>
    </div>
  `;

  let type = null, sousType = null, produit = null;

  function categorieKey() {
    if (type === 'Vaccin') return 'vaccins';
    if (sousType === 'Antibiotique') return 'antibiotiques';
    if (sousType === 'Antiparasitaire') return 'antiparasitaires';
    if (sousType === 'Anti-inflammatoire') return 'antiinflammatoires';
    return null;
  }
  function renderProduitChips() {
    const key = categorieKey();
    const list = document.getElementById('produit-list');
    list.innerHTML = '';
    if (!key) { document.getElementById('produit-block').classList.add('hidden'); return; }
    document.getElementById('produit-block').classList.remove('hidden');
    DB.produits[key].forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (produit === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => { produit = (produit === val) ? null : val; renderProduitChips(); document.getElementById('err').classList.add('hidden'); };
      list.appendChild(chip);
    });
  }

  document.querySelectorAll('.type-opt').forEach(btn => {
    btn.onclick = () => {
      type = btn.dataset.val;
      sousType = null; produit = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      document.getElementById('sous-type-block').classList.toggle('hidden', type !== 'Traitement');
      document.getElementById('autre-note').classList.toggle('hidden', type !== 'Autre');
      if (type === 'Vaccin') renderProduitChips();
      else document.getElementById('produit-block').classList.add('hidden');
      document.getElementById('err').classList.add('hidden');
    };
  });
  document.querySelectorAll('.sous-opt').forEach(btn => {
    btn.onclick = () => {
      sousType = btn.dataset.val;
      produit = null;
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderProduitChips();
      document.getElementById('err').classList.add('hidden');
    };
  });
  document.getElementById('add-produit').onclick = () => {
    const key = categorieKey();
    if (!key) return;
    const input = document.getElementById('new-produit');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.produits[key].includes(val)) DB.produits[key].push(val);
    saveData(DB);
    input.value = '';
    produit = val;
    renderProduitChips();
  };

  document.getElementById('btn-save-sanitaire').onclick = () => {
    const err = document.getElementById('err');
    if (!type) { err.textContent = "Choisis un type d'évènement."; err.classList.remove('hidden'); return; }
    if (type === 'Traitement' && !sousType) { err.textContent = "Choisis une catégorie de traitement."; err.classList.remove('hidden'); return; }
    if (type !== 'Autre' && !produit) { err.textContent = "Sélectionne ou ajoute un produit."; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    const soin = {
      type: type, sousType: sousType, produit: type === 'Autre' ? 'Soin de plaie' : produit,
      date: document.getElementById('f-date').value,
      dose: document.getElementById('f-dose').value.trim(),
      commentaire: document.getElementById('f-comment').value.trim()
    };
    belier.sanitaire = belier.sanitaire || [];
    if (editing) belier.sanitaire[editBelierContext.idx] = soin;
    else belier.sanitaire.push(soin);
    editBelierContext = null;
    saveData(DB);
    render('belier-detail');
  };

  if (existing) {
    const typeBtn = [...document.querySelectorAll('.type-opt')].find(b => b.dataset.val === existing.type);
    if (typeBtn) typeBtn.click();
    if (existing.sousType) {
      const sousBtn = [...document.querySelectorAll('.sous-opt')].find(b => b.dataset.val === existing.sousType);
      if (sousBtn) sousBtn.click();
    }
    if (existing.produit && existing.type !== 'Autre') {
      const chip = [...document.querySelectorAll('#produit-list .chip')].find(c => c.textContent === existing.produit);
      if (chip) chip.click();
    }
  }
}

/* ---------- Ajout mouvement bélier ---------- */
function renderAddMouvementBelier() {
  const belier = DB.beliers.find(b => b.id === currentBelierId);
  const editing = editBelierContext && editBelierContext.kind === 'mouvements';
  const existing = editing ? belier.mouvements[editBelierContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le mouvement' : 'Nouveau mouvement';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Bélier n°${numeroVisuel(belier.eid)}</div>

      <label>Type de mouvement</label>
      <div class="grid2" style="margin-bottom:10px;">
        <button type="button" class="opt-btn type-opt" data-val="Mort">Mort</button>
        <button type="button" class="opt-btn type-opt" data-val="Vendu">Vendu</button>

        <label>Cause</label>
        <div class="chip-list" id="cause-list"></div>
        <div class="row">
          <input type="text" id="new-cause" placeholder="Ajouter une nouvelle cause...">
          <button type="button" class="btn btn-secondary" id="add-cause" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <div id="acheteur-block" class="hidden" style="margin-bottom:14px;">
        <label>Acheteur</label>
        <div class="chip-list" id="acheteur-list"></div>
        <div class="row">
          <input type="text" id="new-acheteur" placeholder="Ajouter un nouvel acheteur...">
          <button type="button" class="btn btn-secondary" id="add-acheteur" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-mouvement">${editing ? 'Enregistrer les modifications' : 'Enregistrer le mouvement'}</button>
    </div>
  `;

  let type = existing ? existing.type : null, cause = existing ? existing.cause : null, acheteur = existing ? existing.acheteur : null;

  function renderCauseChips() {
    const list = document.getElementById('cause-list');
    list.innerHTML = '';
    if (DB.causesMortalite.length === 0) list.innerHTML = '<div style="font-size:13px;color:var(--text-muted);">Aucune cause enregistrée pour l\'instant.</div>';
    DB.causesMortalite.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (cause === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => { cause = (cause === val) ? null : val; renderCauseChips(); document.getElementById('err').classList.add('hidden'); };
      list.appendChild(chip);
    });
  }
  function renderAcheteurChips() {
    const list = document.getElementById('acheteur-list');
    list.innerHTML = '';
    if (DB.acheteurs.length === 0) list.innerHTML = '<div style="font-size:13px;color:var(--text-muted);">Aucun acheteur enregistré pour l\'instant.</div>';
    DB.acheteurs.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (acheteur === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => { acheteur = (acheteur === val) ? null : val; renderAcheteurChips(); document.getElementById('err').classList.add('hidden'); };
      list.appendChild(chip);
    });
  }
  renderCauseChips();
  renderAcheteurChips();

  document.querySelectorAll('.type-opt').forEach(btn => {
    if (btn.dataset.val === type) btn.classList.add('selected');
    btn.onclick = () => {
      type = btn.dataset.val;
      cause = null; acheteur = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('cause-block').classList.toggle('hidden', type !== 'Mort');
      document.getElementById('acheteur-block').classList.toggle('hidden', !(type === 'Vendu' || type === 'Vendu reproduction'));
      renderCauseChips(); renderAcheteurChips();
      document.getElementById('err').classList.add('hidden');
    };
  });
  if (type === 'Mort') document.getElementById('cause-block').classList.remove('hidden');
  if (type === 'Vendu' || type === 'Vendu reproduction') document.getElementById('acheteur-block').classList.remove('hidden');

  document.getElementById('add-cause').onclick = () => {
    const input = document.getElementById('new-cause');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.causesMortalite.includes(val)) DB.causesMortalite.push(val);
    saveData(DB); input.value = ''; cause = val; renderCauseChips();
  };
  document.getElementById('add-acheteur').onclick = () => {
    const input = document.getElementById('new-acheteur');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.acheteurs.includes(val)) DB.acheteurs.push(val);
    saveData(DB); input.value = ''; acheteur = val; renderAcheteurChips();
  };

  document.getElementById('btn-save-mouvement').onclick = () => {
    const err = document.getElementById('err');
    if (!type) { err.textContent = "Choisis un type de mouvement."; err.classList.remove('hidden'); return; }
    if ((type === 'Vendu' || type === 'Vendu reproduction') && !acheteur) { err.textContent = "Sélectionne ou ajoute un acheteur."; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    const mouvement = { type: type, cause: type === 'Mort' ? cause : null, acheteur: acheteur, date: document.getElementById('f-date').value };
    belier.mouvements = belier.mouvements || [];
    if (editing) belier.mouvements[editBelierContext.idx] = mouvement;
    else belier.mouvements.push(mouvement);
    editBelierContext = null;
    const last = belier.mouvements[belier.mouvements.length - 1];
    if (!last) belier.statut = 'actif';
    else if (last.type === 'Mort') belier.statut = 'mort';
    else if (last.type === 'Vendu') belier.statut = 'vendu';
    else if (last.type === 'Vendu reproduction') belier.statut = 'vendu reproduction';
    saveData(DB);
    render('belier-detail');
  };
}

  `;

  let journalType = null;
  function renderTypeChips() {
    const list = document.getElementById('journal-type-list');
    list.innerHTML = '';
    DB.typesJournal.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (journalType === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => { journalType = (journalType === val) ? null : val; renderTypeChips(); document.getElementById('journal-err').classList.add('hidden'); };
      list.appendChild(chip);

  renderTypeChips();

  document.getElementById('add-journal-type').onclick = () => {

    if (!DB.typesJournal.includes(val)) DB.typesJournal.push(val);

    renderTypeChips();

      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');

      DB.journal.splice(parseInt(btn.dataset.idx, 10), 1);

  function renderChecklist() {
    const container = document.getElementById('brebis-checklist');
    container.innerHTML = actives.map(s => `
      <label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);">
        <input type="checkbox" class="lot-check" data-id="${s.id}" ${selected.has(s.id) ? 'checked' : ''} style="width:18px;height:18px;margin:0;">
        <span style="font-size:14px;">Brebis n°${numeroVisuel(s.eid)}</span>
        <span style="font-size:12px;color:var(--text-muted);margin-left:auto;">${lastStadeOf(s)}</span>
      </label>
    `).join('');
    document.querySelectorAll('.lot-check').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selected.add(cb.dataset.id);
        else selected.delete(cb.dataset.id);
      };
    });
  }
  renderChecklist();

  document.querySelectorAll('#critere-list .chip').forEach(chip => {
    chip.onclick = () => {
      const val = chip.dataset.val;
      if (criteres.has(val)) { criteres.delete(val); chip.classList.remove('selected'); }
      else { criteres.add(val); chip.classList.add('selected'); }
      actives.forEach(s => {
        if (criteres.has(lastStadeOf(s))) selected.add(s.id);
      });
      renderChecklist();
    };
  });

  document.getElementById('btn-save-lot').onclick = () => {
    const err = document.getElementById('err');
    const nom = document.getElementById('f-lot-nom').value.trim();
    if (!nom) {
      err.textContent = "Donne un nom au lot.";
      err.classList.remove('hidden');
      return;
    }
    if (selected.size === 0) {
      err.textContent = "Sélectionne au moins une brebis.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const membres = actives.filter(s => selected.has(s.id)).map(s => s.eid);
    DB.lots = DB.lots || [];
    DB.lots.push({ id: Date.now().toString(), nom, dateCreation: new Date().toISOString().slice(0,10), membres });
    saveData(DB);
    render('lots');
  };
}

function renderLotSearch(lotId) {
  const lot = DB.lots.find(l => l.id === lotId);
  if (!lot) { render('lots'); return; }
  pageTitle.textContent = lot.nom;

  const trouveesKey = 'trouvees_' + lot.id;
  if (!window.__lotSessions) window.__lotSessions = {};
  if (!window.__lotSessions[trouveesKey]) window.__lotSessions[trouveesKey] = new Set();
  const trouvees = window.__lotSessions[trouveesKey];

  function render_() {
    const restants = lot.membres.filter(eid => !trouvees.has(cleanEid(eid)));
    app.innerHTML = `
      <div class="card">
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:6px;">Recherche en bergerie</div>
        <div style="font-size:22px;font-weight:600;margin-bottom:14px;">${trouvees.size} / ${lot.membres.length} trouvée(s)</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Scanne les brebis à la suite — en lecture continue ou brebis par brebis selon le réglage du bâton, chaque bip valide est pris en compte immédiatement.</div>
        <label>Scanner une brebis</label>
        <input type="text" id="scan-lot" placeholder="Scanner ou saisir l'EID" autofocus>
        <div id="scan-feedback" style="margin-top:10px;font-size:14px;"></div>
      </div>
      <div style="font-size:13px;color:var(--text-secondary);margin:16px 0 8px;">Restantes (${restants.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
        ${restants.map(eid => `<span style="background:var(--surface-1);border-radius:20px;padding:6px 12px;font-size:13px;">n°${numeroVisuel(eid)}</span>`).join('') || '<span style="font-size:13px;color:var(--text-muted);">Toutes trouvées !</span>'}
      </div>
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">Trouvées (${trouvees.size})</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${[...trouvees].map(eid => `<span style="background:var(--bg-success,#eaf0ea);color:var(--success);border-radius:20px;padding:6px 12px;font-size:13px;">n°${numeroVisuel(eid)}</span>`).join('')}
      </div>
    `;
    const scanInput = document.getElementById('scan-lot');
    scanInput.focus();
    scanInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const val = cleanEid(scanInput.value);
      const feedback = document.getElementById('scan-feedback');
      scanInput.value = '';
      if (!val) return;
      const isMember = lot.membres.some(m => cleanEid(m) === val);
      if (!isMember) {
        playBeepRate();
        feedback.textContent = 'n°' + numeroVisuel(val) + " n'est pas dans ce lot.";
        feedback.style.color = 'var(--danger)';
        return;
      }
      if (trouvees.has(val)) {
        playBeepDejaTrouve();
        feedback.textContent = 'n°' + numeroVisuel(val) + ' déjà trouvée.';
        feedback.style.color = 'var(--warning)';
        return;
      }
      playBeepTrouve();
      feedback.textContent = '';
      trouvees.add(val);
      render_();
    });
  }
  render_();
}

/* ---------- Mouvement groupé (vente / sortie multiple) ---------- */
function renderMouvementGroupe() {
  pageTitle.textContent = 'Mouvement groupé';
  const today = new Date().toISOString().slice(0,10);

  if (!window.__panierGroupe) window.__panierGroupe = [];
  const panier = window.__panierGroupe;

  let type = null, cause = null, acheteur = null;

  function render_() {
    app.innerHTML = `
      <div class="card">
        <label>Type de mouvement</label>
        <div class="grid2" style="margin-bottom:10px;">
          <button type="button" class="opt-btn type-opt" data-val="Morte">Morte</button>
          <button type="button" class="opt-btn type-opt" data-val="Vendue">Vendue</button>
          <button type="button" class="opt-btn type-opt" data-val="Vendue reproduction" style="grid-column:span 2;">Vendue reproduction</button>
        </div>
        <div id="cause-block" class="hidden" style="margin-bottom:14px;">
          <label>Cause</label>
          <div class="chip-list" id="cause-list"></div>
          <div class="row"><input type="text" id="new-cause" placeholder="Ajouter une nouvelle cause..."><button type="button" class="btn btn-secondary" id="add-cause" style="width:auto;padding:0 16px;">+</button></div>
        </div>
        <div id="acheteur-block" class="hidden" style="margin-bottom:14px;">
          <label>Acheteur</label>
          <div class="chip-list" id="acheteur-list"></div>
          <div class="row"><input type="text" id="new-acheteur" placeholder="Ajouter un nouvel acheteur..."><button type="button" class="btn btn-secondary" id="add-acheteur" style="width:auto;padding:0 16px;">+</button></div>
        </div>
        <label>Date</label>
        <input type="date" id="f-date" value="${today}">
      </div>

      <div class="card">
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">Scanne les brebis à la suite — en lecture continue ou brebis par brebis selon le réglage du bâton, chaque bip valide ajoute directement la brebis au panier.</div>
        <label>Scanner une brebis</label>
        <input type="text" id="scan-groupe" placeholder="Scanner ou saisir l'EID" autofocus>
        <div id="scan-groupe-err" class="error-box hidden"></div>
      </div>

      <div style="font-size:14px;font-weight:600;margin:16px 0 10px;">Panier (${panier.length})</div>
      <div>
        ${panier.map((eid, i) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:14px;">
            <span>n°${numeroVisuel(eid)}</span>
            <button type="button" class="btn btn-secondary btn-remove-panier" data-i="${i}" style="width:auto;padding:4px 10px;font-size:12px;">Retirer</button>
          </div>
        `).join('') || '<div style="font-size:13px;color:var(--text-muted);">Aucune brebis scannée pour l\'instant.</div>'}
      </div>

      <div id="err" class="error-box hidden" style="margin-top:14px;"></div>
      <button class="btn btn-primary" id="btn-valider-groupe" style="margin-top:10px;background:var(--danger);">Valider ${panier.length} mouvement(s)</button>
    `;

    function renderCauseChips() {
      const list = document.getElementById('cause-list');
      list.innerHTML = '';
      DB.causesMortalite.forEach(val => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (cause === val ? ' selected' : '');
        chip.textContent = val;
        chip.onclick = () => { cause = (cause === val) ? null : val; renderCauseChips(); };
        list.appendChild(chip);
      });
    }
    function renderAcheteurChips() {
      const list = document.getElementById('acheteur-list');
      list.innerHTML = '';
      DB.acheteurs.forEach(val => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (acheteur === val ? ' selected' : '');
        chip.textContent = val;
        chip.onclick = () => { acheteur = (acheteur === val) ? null : val; renderAcheteurChips(); };
        list.appendChild(chip);
      });
    }
    renderCauseChips();
    renderAcheteurChips();

    document.querySelectorAll('.type-opt').forEach(btn => {
      if (btn.dataset.val === type) btn.classList.add('selected');
      btn.onclick = () => {
        type = btn.dataset.val;
        document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('cause-block').classList.toggle('hidden', type !== 'Morte');
        document.getElementById('acheteur-block').classList.toggle('hidden', !(type === 'Vendue' || type === 'Vendue reproduction'));
      };
    });
    if (type === 'Morte') document.getElementById('cause-block').classList.remove('hidden');
    if (type === 'Vendue' || type === 'Vendue reproduction') document.getElementById('acheteur-block').classList.remove('hidden');

    document.getElementById('add-cause').onclick = () => {
      const input = document.getElementById('new-cause');
      const val = input.value.trim();
      if (!val) return;
      if (!DB.causesMortalite.includes(val)) DB.causesMortalite.push(val);
      saveData(DB); input.value = ''; cause = val; renderCauseChips();
    };
    document.getElementById('add-acheteur').onclick = () => {
      const input = document.getElementById('new-acheteur');
      const val = input.value.trim();
      if (!val) return;
      if (!DB.acheteurs.includes(val)) DB.acheteurs.push(val);
      saveData(DB); input.value = ''; acheteur = val; renderAcheteurChips();
    };

    const scanInput = document.getElementById('scan-groupe');
    scanInput.focus();
    scanInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const val = cleanEid(scanInput.value);
      const err = document.getElementById('scan-groupe-err');
      scanInput.value = '';
      if (!val) return;
      const sheep = DB.brebis.find(s => cleanEid(s.eid) === val);
      if (!sheep) {
        playBeepRate();
        err.textContent = "Aucune brebis trouvée avec cet EID.";
        err.classList.remove('hidden');
        return;
      }
      if (panier.includes(sheep.eid)) {
        playBeepDejaTrouve();
        err.textContent = "Déjà dans le panier.";
        err.classList.remove('hidden');
        return;
      }
      playBeepTrouve();
      err.classList.add('hidden');
      panier.push(sheep.eid);
      render_();
    });

    document.querySelectorAll('.btn-remove-panier').forEach(btn => {
      btn.onclick = () => { panier.splice(parseInt(btn.dataset.i, 10), 1); render_(); };
    });

    document.getElementById('btn-valider-groupe').onclick = () => {
      const errBox = document.getElementById('err');
      if (!type) { errBox.textContent = "Choisis un type de mouvement."; errBox.classList.remove('hidden'); return; }
      if ((type === 'Vendue' || type === 'Vendue reproduction') && !acheteur) { errBox.textContent = "Sélectionne ou ajoute un acheteur."; errBox.classList.remove('hidden'); return; }
      if (panier.length === 0) { errBox.textContent = "Scanne au moins une brebis."; errBox.classList.remove('hidden'); return; }
      if (!confirm('Appliquer "' + type + '" à ' + panier.length + ' brebis ?')) return;
      const date = document.getElementById('f-date').value;
      panier.forEach(eid => {
        const sheep = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(eid));
        if (!sheep) return;
        sheep.mouvements = sheep.mouvements || [];
        sheep.mouvements.push({ type, cause: type === 'Morte' ? cause : null, acheteur, date });
        sheep.statut = type === 'Morte' ? 'morte' : type === 'Vendue' ? 'vendue' : 'vendue reproduction';
      });
      saveData(DB);
      window.__panierGroupe = [];
      alert(panier.length + ' mouvement(s) enregistré(s).');
      render('lots');
    };
  }
  render_();
}

    if (sousType === 'Anti-inflammatoire') return 'antiinflammatoires';
    return null;
  }
  function renderProduitChips() {

    const list = document.getElementById('produit-list');
    list.innerHTML = '';
    if (!key) { document.getElementById('produit-block').classList.add('hidden'); return; }
    document.getElementById('produit-block').classList.remove('hidden');
    DB.produits[key].forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (produit === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => { produit = (produit === val) ? null : val; renderProduitChips(); document.getElementById('err').classList.add('hidden'); };
      list.appendChild(chip);
    });
  }

  document.querySelectorAll('.type-opt').forEach(btn => {
    btn.onclick = () => {
      type = btn.dataset.val;
      sousType = null; produit = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));

      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      document.getElementById('sous-type-block').classList.toggle('hidden', type !== 'Traitement');
      document.getElementById('autre-note').classList.toggle('hidden', type !== 'Autre');
      if (type === 'Vaccin') renderProduitChips();
      else document.getElementById('produit-block').classList.add('hidden');
      document.getElementById('err').classList.add('hidden');
    };
  });
  document.querySelectorAll('.sous-opt').forEach(btn => {
    btn.onclick = () => {
      sousType = btn.dataset.val;
      produit = null;
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderProduitChips();
      document.getElementById('err').classList.add('hidden');

    const key = categorieKey();
    if (!key) return;
    const input = document.getElementById('new-produit');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.produits[key].includes(val)) DB.produits[key].push(val);
    saveData(DB);
    input.value = '';
    produit = val;
    renderProduitChips();
  };

  document.getElementById('btn-save-collectif').onclick = () => {
    const err = document.getElementById('err');
    if (!type) { err.textContent = "Choisis un type d'évènement."; err.classList.remove('hidden'); return; }
    if (type === 'Traitement' && !sousType) { err.textContent = "Choisis une catégorie de traitement."; err.classList.remove('hidden'); return; }
    if (type !== 'Autre' && !produit) { err.textContent = "Sélectionne ou ajoute un produit."; err.classList.remove('hidden'); return; }

    err.classList.add('hidden');

      type: type, sousType: sousType, produit: type === 'Autre' ? 'Soin de plaie' : produit,
      date: document.getElementById('f-date').value,
      dose: document.getElementById('f-dose').value.trim(),
      commentaire: document.getElementById('f-comment').value.trim(),
      collectif: true
    };
    actives.forEach(s => {
      s.sanitaire = s.sanitaire || [];
      s.sanitaire.push(soin);
    });
    saveData(DB);
    alert('Traitement appliqué à ' + actives.length + ' brebis.');
    render('lots');
  };
}


/* ---------- Import CSV inventaire + échographies ---------- */
function parseEchoComment(comment) {
  const c = comment.trim();
  if (!DB.casParticuliers) DB.casParticuliers = ['Pseudogestation', 'Avortée'];
  if (DB.casParticuliers.includes(c)) {
    return { special: c, stade: null, agneaux: null, parasitisme: false };
  }
  const words = c.split(/\s+/);
  const stade = words[0];
  const stadesValides = ['Début', 'Milieu', 'Fin', 'Vide'];
  if (!stadesValides.includes(stade)) return null;
  const parasitisme = words.includes('P');
  const num = words.find(w => w === '1' || w === '2');
  const agneaux = num === '1' ? 'Simple' : num === '2' ? 'Double' : null;
  return { special: null, stade, agneaux, parasitisme };
}

function renderImportEcho() {
  pageTitle.textContent = 'Import CSV';
  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Fichier au format "EID";"COMMENT" (ex: Début 1, Milieu 2, Vide P, Pseudogestation...).</div>
      <label>Fichier CSV</label>
      <input type="file" id="import-echo-file" accept=".csv">
      <label style="margin-top:12px;">Date à appliquer à ces échographies</label>
      <input type="date" id="import-echo-date" value="${new Date().toISOString().slice(0,10)}">
      <div id="import-echo-err" class="error-box hidden"></div>
      <div id="import-echo-preview" style="margin-top:14px;"></div>
      <button class="btn btn-primary hidden" id="btn-confirm-import" style="margin-top:14px;">Confirmer l'import</button>
    </div>
  `;

  let parsedRows = null;

  document.getElementById('import-echo-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let text;
      try {
        const decoder = new TextDecoder('windows-1252');
        text = decoder.decode(reader.result);
      } catch (err) {
        text = new TextDecoder('utf-8').decode(reader.result);
      }
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      const rows = [];
      const erreurs = [];
      let nouvellesBrebis = 0;
      lines.slice(1).forEach((line, i) => {
        const parts = line.split(';').map(p => p.trim().replace(/^"|"$/g, ''));
        if (parts.length < 2) { erreurs.push('Ligne ' + (i+2) + ' : format invalide'); return; }
        const eid = parts[0];
        const comment = parts[1];
        if (cleanEid(eid).length < 11) { erreurs.push('Ligne ' + (i+2) + ' : EID invalide (' + eid + ')'); return; }
        const parsed = parseEchoComment(comment);
        if (!parsed) { erreurs.push('Ligne ' + (i+2) + ' : commentaire non reconnu (' + comment + ')'); return; }
        const existe = DB.brebis.some(s => cleanEid(s.eid) === cleanEid(eid));
        if (!existe) nouvellesBrebis++;
        rows.push({ eid, ...parsed });
      });
      parsedRows = rows;
      const preview = document.getElementById('import-echo-preview');
      preview.innerHTML = `
        <div style="background:#f0efe9;border-radius:var(--radius);padding:12px;font-size:13px;">
          <div>${rows.length} échographie(s) reconnue(s)</div>
          <div>${nouvellesBrebis} nouvelle(s) brebis à créer</div>
          <div style="color:${erreurs.length ? 'var(--danger)' : 'var(--text-muted)'};">${erreurs.length} ligne(s) ignorée(s)</div>
        </div>
        ${erreurs.length ? '<div style="font-size:12px;color:var(--danger);margin-top:8px;">' + erreurs.slice(0,10).join('<br>') + (erreurs.length > 10 ? '<br>... (' + (erreurs.length-10) + ' de plus)' : '') + '</div>' : ''}
      `;
      document.getElementById('btn-confirm-import').classList.toggle('hidden', rows.length === 0);
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById('btn-confirm-import').onclick = () => {
    if (!parsedRows || parsedRows.length === 0) return;
    if (!confirm('Importer ' + parsedRows.length + ' échographie(s) ? Cette action ajoute des données, elle ne supprime rien.')) return;
    const date = document.getElementById('import-echo-date').value;
    parsedRows.forEach(row => {
      let sheep = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(row.eid));
      if (!sheep) {
        sheep = { id: Date.now().toString() + Math.random().toString(36).slice(2,6), eid: row.eid, createdAt: Date.now(), echographies: [], agnelages: [], sanitaire: [], mouvements: [], controleLaitier: [], statut: 'active' };
        DB.brebis.push(sheep);
      }
      sheep.echographies = sheep.echographies || [];
      sheep.echographies.push({
        type: row.special ? 'stade_comptage' : (row.agneaux ? 'stade_comptage' : 'stade'),
        date: date,
        stade: row.stade,
        agneaux: row.agneaux,
        special: row.special,
        parasitisme: row.parasitisme
      });
    });
    saveData(DB);
    alert(parsedRows.length + ' échographie(s) importée(s) avec succès.');
    render('stats');
  };
}


function renderStats() {
  pageTitle.textContent = 'Tableau de bord';

  const active = DB.brebis.filter(s => (s.statut || 'active') === 'active');
  const total = active.length;

  const stadeCount = { 'Début': 0, 'Milieu': 0, 'Fin': 0, 'Vide': 0 };
  let gestantes = 0, avecEcho = 0;
  active.forEach(s => {
    const last = s.echographies[s.echographies.length - 1];
    if (!last) return;
    avecEcho++;
    if (last.type === 'constat') {
      if (last.stade === 'Pleine') gestantes++;
    } else if (last.stade && stadeCount.hasOwnProperty(last.stade)) {
      stadeCount[last.stade]++;
      if (last.stade !== 'Vide') gestantes++;
    }
  });
  const tauxReussite = avecEcho > 0 ? Math.round((gestantes / avecEcho) * 1000) / 10 : 0;

  let totalMisesBas = 0, totalAgneaux = 0, totalMortNes = 0;
  DB.brebis.forEach(s => {
    (s.agnelages || []).forEach(a => {
      totalMisesBas++;
      a.lambs.forEach(l => {
        totalAgneaux++;
        if (l.sexe === 'Mort-né') totalMortNes++;
      });
    });
  });
  const prolificite = totalMisesBas > 0 ? Math.round((totalAgneaux / totalMisesBas) * 100) / 100 : 0;

  function isGestanteEcho(echo) {
    if (!echo) return false;
    if (echo.type === 'constat') return echo.stade === 'Pleine';
    return echo.stade && echo.stade !== 'Vide';
  }

  const parAge = {};
  active.forEach(s => {
    const an = anneeNaissance(s.eid);
    if (an === null) return;
    if (!parAge[an]) parAge[an] = { effectif: 0, avecEcho: 0, gestantes: 0, misesBas: 0, agneaux: 0 };
    parAge[an].effectif++;
    const last = s.echographies[s.echographies.length - 1];
    if (last) {
      parAge[an].avecEcho++;
      if (isGestanteEcho(last)) parAge[an].gestantes++;
    }
    (s.agnelages || []).forEach(a => {
      parAge[an].misesBas++;
      parAge[an].agneaux += a.lambs.length;
    });
  });
  const ageRows = Object.keys(parAge).sort((a,b) => b - a).map(an => {
    const d = parAge[an];
    return {
      annee: an,
      age: new Date().getFullYear() - an,
      effectif: d.effectif,
      tauxReussite: d.avecEcho > 0 ? Math.round((d.gestantes / d.avecEcho) * 1000) / 10 : null,
      prolificite: d.misesBas > 0 ? Math.round((d.agneaux / d.misesBas) * 100) / 100 : null
    };
  });

  const misesBasRestantes = active.filter(s => {
    const last = s.echographies[s.echographies.length - 1];
    if (!isGestanteEcho(last)) return false;
    return !(s.agnelages && s.agnelages.length > 0);
  }).length;

  const attendueTraiteCount = active.filter(s => isAttendueTraite(s)).length;

  const controlesParNumero = { 1: [], 2: [], 3: [] };
  DB.brebis.forEach(s => {
    (s.controleLaitier || []).forEach(c => {
      if (controlesParNumero[c.controle]) controlesParNumero[c.controle].push(c.quantite);
    });
  });
  function moyenne(arr) {
    return arr.length > 0 ? Math.round((arr.reduce((a,b) => a+b, 0) / arr.length) * 100) / 100 : null;
  }
  const moyenne1 = moyenne(controlesParNumero[1]);
  const moyenne2 = moyenne(controlesParNumero[2]);
  const moyenne3 = moyenne(controlesParNumero[3]);
  const totalControles = controlesParNumero[1].length + controlesParNumero[2].length + controlesParNumero[3].length;

  DB.laitTank = DB.laitTank || [];
  const now = new Date();
  const moisActuel = now.toISOString().slice(0,7); // 'YYYY-MM'
  const anneeActuelle = now.toISOString().slice(0,4); // 'YYYY'
  const totalLaitMois = Math.round(DB.laitTank.filter(l => (l.date||'').startsWith(moisActuel)).reduce((s,l) => s + l.quantite, 0) * 10) / 10;
  const totalLaitAnnee = Math.round(DB.laitTank.filter(l => (l.date||'').startsWith(anneeActuelle)).reduce((s,l) => s + l.quantite, 0) * 10) / 10;

  DB.luttes = DB.luttes || [];
  const luttesBrebis = DB.luttes.filter(l => l.cible === 'Brebis');
  const luttesAgnelles = DB.luttes.filter(l => l.cible === 'Agnelles');
  const lastLutteBrebis = luttesBrebis.length ? luttesBrebis[luttesBrebis.length - 1] : null;
  const lastLutteAgnelles = luttesAgnelles.length ? luttesAgnelles[luttesAgnelles.length - 1] : null;

      <span>${label}</span><span style="color:var(--text-muted);">${count} (${pct}%)</span>

    <div style="height:10px;background:#eee;border-radius:6px;overflow:hidden;margin-bottom:10px;">

      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Effectif</div>
      <div class="grid2">
        <div style="background:var(--bg,#f7f6f2);border-radius:var(--radius);padding:12px;background:#f0efe9;">

          <div style="font-size:24px;font-weight:600;">${total}</div>
        </div>
        <div style="border-radius:var(--radius);padding:12px;background:#f0efe9;">

          <div style="font-size:24px;font-weight:600;">${DB.brebis.length}</div>
        </div>
      </div>
      <div style="margin-top:10px;border-radius:var(--radius);padding:12px;background:#f0efe9;">
        <div style="font-size:13px;color:var(--text-muted);">Agnelles (inventaire séparé)</div>
        <div style="font-size:22px;font-weight:600;">${(DB.agnelles||[]).length}</div>
        <div style="font-size:11px;color:var(--text-muted);">${(DB.agnelles||[]).filter(a=>a.origine==='née').length} née(s) · ${(DB.agnelles||[]).filter(a=>a.origine==='achetée').length} achetée(s)</div>
      </div>
      <div style="margin-top:10px;border-radius:var(--radius);padding:12px;background:#f0efe9;">
        <div style="font-size:13px;color:var(--text-muted);">Béliers actifs</div>
        <div style="font-size:22px;font-weight:600;">${(DB.beliers||[]).filter(b=>(b.statut||'actif')==='actif').length}</div>
      </div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Reproduction (campagne en cours)</div>
      <div class="grid2">
        <div style="border-radius:var(--radius);padding:12px;background:var(--bg-accent, #eaf0ea);">
          <div style="font-size:13px;color:var(--text-muted);">Mises bas</div>
          <div style="font-size:22px;font-weight:600;">${totalMisesBas}</div>
        </div>
        <div style="border-radius:var(--radius);padding:12px;background:var(--bg-accent, #eaf0ea);">
          <div style="font-size:13px;color:var(--text-muted);">Agneaux nés</div>
          <div style="font-size:22px;font-weight:600;">${totalAgneaux}</div>

        </div>
      </div>
    </div>

    <div class="card">

      ${bar('Milieu', stadeCount['Milieu'], 'var(--primary)')}

      ${bar('Vide', stadeCount['Vide'], '#b4b2a9')}
      <div style="font-size:12px;color:var(--text-muted);">${total - avecEcho} brebis sans échographie enregistrée</div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Taux de réussite</div>
      <div style="font-size:28px;font-weight:600;color:var(--primary);">${tauxReussite}%</div>
      <div style="font-size:12px;color:var(--text-muted);">Basé sur ${avecEcho} brebis échographiées</div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Prolificité</div>
      <div style="font-size:28px;font-weight:600;color:var(--accent);">${prolificite}</div>
      <div style="font-size:12px;color:var(--text-muted);">Agneaux nés par mise bas (${totalAgneaux} agneaux / ${totalMisesBas} mise(s) bas), mort-nés inclus</div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Mises bas restantes attendues</div>
      <div style="font-size:28px;font-weight:600;color:var(--warning);">${misesBasRestantes}</div>
      <div style="font-size:12px;color:var(--text-muted);">Brebis gestantes (dernière échographie) qui n'ont pas encore mis bas — fiable une fois toutes les vraies vides confirmées</div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Brebis attendues à la traite</div>
      <div style="font-size:28px;font-weight:600;color:var(--primary-light);">${attendueTraiteCount}</div>
      <div style="font-size:12px;color:var(--text-muted);">Tous les agneaux sont vendus, morts ou renouvelés</div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Taux de réussite et prolificité par âge</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse;">
        <tr style="color:var(--text-muted);text-align:left;">
          <th style="padding:4px 4px;font-weight:500;">Année</th>

          <th style="padding:4px 4px;font-weight:500;">Réussite</th>
          <th style="padding:4px 4px;font-weight:500;">Prolificité</th>
        </tr>
        ${ageRows.map(r => `

        <div>

          <div style="font-size:20px;font-weight:600;color:var(--primary-light);">${moyenne1 !== null ? moyenne1 + ' L' : '—'}</div>

        <div>
          <div style="font-size:12px;color:var(--text-muted);">2e contrôle</div>
          <div style="font-size:20px;font-weight:600;color:var(--primary-light);">${moyenne2 !== null ? moyenne2 + ' L' : '—'}</div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text-muted);">3e contrôle</div>
          <div style="font-size:20px;font-weight:600;color:var(--primary-light);">${moyenne3 !== null ? moyenne3 + ' L' : '—'}</div>
        </div>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:10px;">${totalControles} relevé(s) enregistré(s) au total</div>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Production laitière (tank)</div>
      <div class="grid2" style="margin-bottom:12px;">
        <div>
          <div style="font-size:12px;color:var(--text-muted);">Ce mois-ci</div>
          <div style="font-size:22px;font-weight:600;">${totalLaitMois} L</div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text-muted);">Cette année</div>
          <div style="font-size:22px;font-weight:600;">${totalLaitAnnee} L</div>
        </div>
      </div>
      <label>Ajouter le relevé du jour</label>
      <div class="row">
        <input type="date" id="f-lait-date" value="${new Date().toISOString().slice(0,10)}" style="flex:1;">
        <input type="number" step="0.1" id="f-lait-qte" placeholder="Litres" style="flex:1;">
      </div>
      <div id="lait-err" class="error-box hidden"></div>
      <button class="btn btn-secondary" id="btn-save-lait" style="margin-top:8px;">Enregistrer</button>
      ${DB.laitTank.length > 0 ? '<div style="font-size:12px;color:var(--text-muted);margin-top:12px;margin-bottom:6px;">Derniers relevés</div>' : ''}
      <div>
        ${[...DB.laitTank].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8).map(l => {
          const realIdx = DB.laitTank.indexOf(l);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13px;">
            <span>${l.date} — ${l.quantite} L</span>
            <button type="button" class="btn btn-secondary btn-del-lait" data-idx="${realIdx}" style="width:auto;padding:4px 10px;font-size:12px;color:var(--danger);border-color:var(--danger);">Suppr.</button>
          </div>`;
        }).join('')}

    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Lutte</div>
      <div class="grid2" style="margin-bottom:6px;">

          <div style="font-size:12px;color:var(--text-muted);">Brebis</div>
          <div style="font-weight:600;">${lastLutteBrebis ? lastLutteBrebis.date : 'Non renseignée'}</div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text-muted);">Agnelles</div>
          <div style="font-weight:600;">${lastLutteAgnelles ? lastLutteAgnelles.date : 'Non renseignée'}</div>
        </div>

      <div class="grid2" style="margin-bottom:8px;">

      <label>Campagne actuelle (année de fin — ex: 2026 pour la campagne du 1er octobre 2025 au 30 septembre 2026)</label>
      <div class="row">
        <input type="number" id="f-campagne-annee" value="${DB.campagneDebut ? DB.campagneDebut + 1 : ''}" placeholder="ex: 2026">
        <button type="button" class="btn btn-secondary" id="btn-save-campagne-annee" style="width:auto;padding:0 16px;">OK</button>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">Cette valeur sert juste à afficher la bonne campagne dans l'en-tête — elle ne supprime aucune donnée. Utilise le bouton ci-dessous pour le vrai changement de campagne avec bascule des agnelles.</div>
    </div>

    <div class="card" style="border-color:var(--accent);">
      <div style="font-size:14px;font-weight:600;margin-bottom:6px;">Changement de campagne</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Campagne actuelle : ${DB.campagneDebut ? ('Campagne ' + (DB.campagneDebut + 1) + ' (1er octobre ' + DB.campagneDebut + ' au 30 septembre ' + (DB.campagneDebut + 1) + ')') : 'non définie'}. À déclencher au 1er octobre : les ${(DB.agnelles||[]).length} agnelle(s) de l'inventaire rejoignent le troupeau de brebis, et les mises bas, agneaux et mouvements de la campagne écoulée sont supprimés des fiches des brebis actives.</div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:6px;">Import CSV — inventaire + échographies</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Importe un fichier au format "EID";"COMMENT" (ex: export de contrôle de gestation). Les brebis inconnues sont créées automatiquement, les échographies ajoutées à leur historique.</div>

      <div style="font-size:14px;font-weight:600;margin-bottom:6px;">Sauvegarde des données</div>

      <button class="btn btn-secondary" id="btn-export" style="margin-bottom:10px;">Exporter mes données (sauvegarde)</button>
      <input type="file" id="import-file" accept=".json" class="hidden">
      <button class="btn btn-secondary" id="btn-import">Importer une sauvegarde</button>
    </div>

  document.getElementById('btn-goto-import').onclick = () => render('import-echo');

    if (isNaN(qte) || qte < 0) {
      err.textContent = "Saisis une quantité valide.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    DB.laitTank.push({ date: document.getElementById('f-lait-date').value, quantite: Math.round(qte * 10) / 10 });

    render('stats');

      if (!confirm('Supprimer ce relevé ?')) return;
      DB.laitTank.splice(parseInt(btn.dataset.idx, 10), 1);
      saveData(DB);
      render('stats');
    };

      document.getElementById('lutte-err').classList.add('hidden');

      err.textContent = "Choisis Brebis ou Agnelles.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');

    render('stats');
  };
  document.querySelectorAll('.btn-del-lutte').forEach(btn => {

      if (!confirm('Supprimer cette date de lutte ?')) return;
      DB.luttes.splice(parseInt(btn.dataset.idx, 10), 1);
      saveData(DB);
      render('stats');
    };
  });

  document.getElementById('btn-nouvelle-campagne').onclick = () => {

      'Démarrer une nouvelle campagne ?\n\n' +
      '- ' + nbAgnelles + ' agnelle(s) rejoindront le troupeau de brebis\n' +
      '- Les mises bas, agneaux et mouvements de toutes les brebis actives seront supprimés\n\n' +
      'Cette action est irréversible.'
    )) return;

    (DB.agnelles || []).forEach(ag => {
      DB.brebis.push({ id: Date.now().toString() + Math.random().toString(36).slice(2,6), eid: ag.eid, mereEid: ag.motherEid || null, createdAt: Date.now(), echographies: [], agnelages: [], sanitaire: ag.sanitaire || [], mouvements: [], controleLaitier: [], statut: 'active' });
    });
    DB.agnelles = [];

    DB.brebis.forEach(sheep => {
      if ((sheep.statut || 'active') === 'active') {
        sheep.agnelages = [];
        sheep.mouvements = [];
      }
    });

    const now = new Date();
    DB.campagneDebut = now.getMonth() >= 9 ? now.getFullYear() : now.getFullYear() - 1;
    saveData(DB);
    render('stats');
  };

  document.getElementById('btn-save-exploitation').onclick = () => {
    DB.exploitation = {
      nom: document.getElementById('f-exp-nom').value.trim(),
      numeroCheptel: document.getElementById('f-exp-cheptel').value.trim(),
      indicatifMarquage: document.getElementById('f-exp-marquage').value.trim(),
      adresse: document.getElementById('f-exp-adresse').value.trim(),
      telephone: document.getElementById('f-exp-tel').value.trim()
    };
    saveData(DB);
    alert('Informations enregistrées.');
  };
  document.getElementById('btn-save-campagne-annee').onclick = () => {
    const val = parseInt(document.getElementById('f-campagne-annee').value, 10);
    if (isNaN(val)) { alert("Saisis une année valide."); return; }
    DB.campagneDebut = val - 1;
    saveData(DB);
    render('stats');
  };

  document.getElementById('btn-export').onclick = () => {
    const dataStr = JSON.stringify(DB, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'troupeau-sauvegarde-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  document.getElementById('btn-import').onclick = () => {
    document.getElementById('import-file').click();
  };
  document.getElementById('import-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.brebis) throw new Error('format invalide');
        if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ? Cette action est irréversible.')) return;
        DB = parsed;
        saveData(DB);
        render('list');
      } catch (err) {
        alert("Ce fichier ne semble pas être une sauvegarde valide.");
      }
    };
    reader.readAsText(file);
  };
}

/* ---------- Démarrage ---------- */
render('list');
</script>
</body>
</html>
