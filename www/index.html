          <button type="button" class="btn btn-secondary" id="add-acheteur" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-mouvement">${editing ? 'Enregistrer les modifications' : 'Enregistrer le mouvement'}</button>
    </div>
  `;

  let type = null, cause = null, acheteur = null;

  function renderCauseChips() {
    const list = document.getElementById('cause-list');
    list.innerHTML = '';
    if (DB.causesMortalite.length === 0) {
      list.innerHTML = "<div style=\"font-size:13px;color:var(--text-muted);\">Aucune cause enregistrée pour l'instant — ajoute-en une ci-dessous.</div>";
    }
    DB.causesMortalite.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (cause === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => {
        cause = (cause === val) ? null : val;
        renderCauseChips();
        document.getElementById('err').classList.add('hidden');
      };
      list.appendChild(chip);
    });
  }

  function renderAcheteurChips() {
    const list = document.getElementById('acheteur-list');
    list.innerHTML = '';
    if (DB.acheteurs.length === 0) {
      list.innerHTML = "<div style=\"font-size:13px;color:var(--text-muted);\">Aucun acheteur enregistré pour l'instant — ajoute-en un ci-dessous.</div>";
    }
    DB.acheteurs.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (acheteur === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => {
        acheteur = (acheteur === val) ? null : val;
        renderAcheteurChips();
        document.getElementById('err').classList.add('hidden');
      };
      list.appendChild(chip);
    });
  }
  renderCauseChips();
  renderAcheteurChips();

  document.querySelectorAll('.type-opt').forEach(btn => {
    btn.onclick = () => {
      type = btn.dataset.val;
      cause = null; acheteur = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('cause-block').classList.toggle('hidden', type !== 'Morte');
      document.getElementById('acheteur-block').classList.toggle('hidden', !(type === 'Vendue' || type === 'Vendue reproduction'));
      renderCauseChips();
      renderAcheteurChips();
      document.getElementById('err').classList.add('hidden');
    };
  });

  document.getElementById('add-cause').onclick = () => {
    const input = document.getElementById('new-cause');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.causesMortalite.includes(val)) DB.causesMortalite.push(val);
    saveData(DB);
    input.value = '';
    cause = val;
    renderCauseChips();
  };
  document.getElementById('add-acheteur').onclick = () => {
    const input = document.getElementById('new-acheteur');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.acheteurs.includes(val)) DB.acheteurs.push(val);
    saveData(DB);
    input.value = '';
    acheteur = val;
    renderAcheteurChips();
  };

  document.getElementById('btn-save-mouvement').onclick = () => {
    const err = document.getElementById('err');
    if (!type) {
      err.textContent = "Choisis un type de mouvement.";
      err.classList.remove('hidden');
      return;
    }
    if ((type === 'Vendue' || type === 'Vendue reproduction') && !acheteur) {
      err.textContent = "Sélectionne ou ajoute un acheteur.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const mouvement = {
      type: type,
      cause: type === 'Morte' ? cause : null,
      acheteur: acheteur,
      date: document.getElementById('f-date').value
    };
    sheep.mouvements = sheep.mouvements || [];
    if (editing) sheep.mouvements[editContext.idx] = mouvement;
    else sheep.mouvements.push(mouvement);
    editContext = null;
    const last = sheep.mouvements[sheep.mouvements.length - 1];
    if (!last) sheep.statut = 'active';
    else if (last.type === 'Morte') sheep.statut = 'morte';
    else if (last.type === 'Vendue') sheep.statut = 'vendue';
    else if (last.type === 'Vendue reproduction') sheep.statut = 'vendue reproduction';
    saveData(DB);
    render('detail', sheep.id);
  };

  if (existing) {
    const typeBtn = [...document.querySelectorAll('.type-opt')].find(b => b.dataset.val === existing.type);
    if (typeBtn) typeBtn.click();
    if (existing.cause) {
      const chip = [...document.querySelectorAll('#cause-list .chip')].find(c => c.textContent === existing.cause);
      if (chip) chip.click();
    }
    if (existing.acheteur) {
      const chip = [...document.querySelectorAll('#acheteur-list .chip')].find(c => c.textContent === existing.acheteur);
      if (chip) chip.click();
    }
  }
}

/* ---------- Inventaire agnelles ---------- */
function getCandidatesATrier() {
  const candidates = [];
  DB.brebis.forEach(sheep => {
    (sheep.agnelages || []).forEach(ag => {
      ag.lambs.forEach(l => {
        if (l.sexe === 'Femelle' && l.eid && !l.triStatut) {
          candidates.push({ lamb: l, motherEid: sheep.eid, date: ag.date });
        }
      });
    });
  });
  return sortLambItemsByAge(candidates);
}

function getEcartees() {
  const list = [];
  DB.brebis.forEach(sheep => {
    (sheep.agnelages || []).forEach(ag => {
      ag.lambs.forEach(l => {
        if (l.sexe === 'Femelle' && l.eid && l.triStatut === 'écartée') {
          list.push({ lamb: l, motherEid: sheep.eid, date: ag.date });
        }
      });
    });
  });
  return sortLambItemsByAge(list);
}

function renderAgnelles() {
  DB.agnelles = DB.agnelles || [];
  const candidates = getCandidatesATrier();
  pageTitle.textContent = 'Chantier de tri';

  const candidatesHtml = candidates.length === 0
    ? '<div style="font-size:13px;color:var(--text-muted);padding:8px 0 16px;">Aucune femelle en attente de tri pour le moment.</div>'
    : candidates.map((c, i) => `
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
          ${iconCircle(ICON_SHEEP, 'amber', 'sm')}
          <div>
            <div style="font-weight:600;">n°${numeroVisuel(c.lamb.eid)}</div>
            <div style="font-size:12px;color:var(--text-muted);">Née le ${c.date} de la brebis n°${numeroVisuel(c.motherEid)}</div>
          </div>
        </div>
        <div class="row">
          <button type="button" class="btn btn-primary btn-garder" data-i="${i}" style="background:var(--accent);">Garder (trier)</button>
          <button type="button" class="btn btn-secondary btn-ecarter" data-i="${i}" style="width:auto;padding:0 14px;">Écarter</button>
        </div>
        <button type="button" class="btn btn-secondary btn-voir-mere" data-eid="${c.motherEid}" style="margin-top:8px;">Voir la fiche de la mère</button>
      </div>
    `).join('');

  const listHtml = DB.agnelles.length === 0
    ? '<div style="font-size:13px;color:var(--text-muted);padding:8px 0;">Aucune agnelle triée ou achetée pour l\'instant.</div>'
    : sortByAge(DB.agnelles).map(ag => `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:12px;">
            ${iconCircle(ICON_SHEEP, 'amber', 'sm')}
            <div>
              <div style="font-weight:600;">n°${numeroVisuel(ag.eid)}</div>
              <div style="font-size:12px;color:var(--text-muted);">${ag.origine === 'née' ? 'Née sur l\'exploitation' : 'Achetée'} · triée/entrée le ${ag.dateEntree}</div>
              ${ag.origine === 'achetée' && (ag.pere || ag.mere) ? `<div style="font-size:11px;color:var(--text-muted);">${ag.pere ? 'Père : ' + ag.pere + ' ' : ''}${ag.mere ? '· Mère : ' + ag.mere : ''}</div>` : ''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <button type="button" class="btn btn-secondary btn-edit-agnelle" data-id="${ag.id}" style="width:auto;padding:6px 14px;font-size:13px;">Modifier</button>
            <button type="button" class="btn btn-secondary btn-remove-agnelle" data-id="${ag.id}" style="color:var(--danger);border-color:var(--danger);width:auto;padding:6px 14px;font-size:13px;">Suppr.</button>
          </div>
        </div>
        <div class="row" style="margin-top:8px;">
          ${ag.origine === 'née' ? `<button type="button" class="btn btn-secondary btn-annuler-tri" data-id="${ag.id}">Revenir sur le tri</button>` : ''}
          ${ag.motherEid ? `<button type="button" class="btn btn-secondary btn-voir-mere" data-eid="${ag.motherEid}">Voir la fiche de la mère</button>` : ''}
        </div>
      </div>
    `).join('');

  const ecartees = getEcartees();
  const ecarteesHtml = ecartees.length === 0
    ? '<div style="font-size:13px;color:var(--text-muted);padding:8px 0;">Aucune agnelle écartée.</div>'
    : ecartees.map((c, i) => `
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
          ${iconCircle(ICON_SHEEP, 'amber', 'sm')}
          <div>
            <div style="font-weight:600;">n°${numeroVisuel(c.lamb.eid)}</div>
            <div style="font-size:12px;color:var(--text-muted);">Née le ${c.date} de la brebis n°${numeroVisuel(c.motherEid)}</div>
          </div>
        </div>
        <button type="button" class="btn btn-secondary btn-reconsiderer" data-i="${i}">Reconsidérer (remettre à trier)</button>
      </div>
    `).join('');

  app.innerHTML = chantierTriTabBarHtml() + `
    <div style="font-size:14px;font-weight:600;margin-bottom:2px;">À trier (femelles nées sur l'exploitation)</div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Scanner une agnelle ci-dessous la marque directement comme gardée.</div>
    <label>Scanner l'agnelle à trier</label>
    <input type="text" id="scan-tri" placeholder="Scanner ou saisir l'EID" autofocus>
    <div id="scan-err" class="error-box hidden"></div>
    ${candidatesHtml}

    <div style="font-size:14px;font-weight:600;margin:20px 0 10px;">Agnelles triées / achetées</div>
    ${listHtml}
    <button class="btn btn-primary" id="btn-add-agnelle" style="margin-top:10px;">+ Ajouter manuellement (achetée ou autre)</button>

    <div style="font-size:14px;font-weight:600;margin:20px 0 10px;">Écartées</div>
    ${ecarteesHtml}
  `;

  wireChantierTriTabBar();
  const scanInput = document.getElementById('scan-tri');
  attachEidBeep(scanInput);
  scanInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = cleanEid(scanInput.value);
    const err = document.getElementById('scan-err');
    if (!val) return;
    const match = candidates.find(c => cleanEid(c.lamb.eid) === val);
    if (!match) {
      err.textContent = "Aucune agnelle correspondante en attente de tri.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    garderAgnelle(match);
  });

  function garderAgnelle(c) {
    c.lamb.triStatut = 'gardée';
    DB.agnelles.push({ id: Date.now().toString() + Math.random().toString(36).slice(2,6), eid: c.lamb.eid, origine: 'née', motherEid: c.motherEid, dateEntree: new Date().toISOString().slice(0,10), sanitaire: (c.lamb.sanitaire || []).slice(), mouvements: [] });
    saveData(DB);
    render('agnelles');
  }

  document.querySelectorAll('.btn-garder').forEach(btn => {
    btn.onclick = () => garderAgnelle(candidates[parseInt(btn.dataset.i, 10)]);
  });
  document.querySelectorAll('.btn-ecarter').forEach(btn => {
    btn.onclick = () => {
      const c = candidates[parseInt(btn.dataset.i, 10)];
      if (!confirm('Écarter cette agnelle (non gardée pour le renouvellement) ?')) return;
      c.lamb.triStatut = 'écartée';
      saveData(DB);
      render('agnelles');
    };
  });
  document.querySelectorAll('.btn-reconsiderer').forEach(btn => {
    btn.onclick = () => {
      const c = ecartees[parseInt(btn.dataset.i, 10)];
      delete c.lamb.triStatut;
      saveData(DB);
      render('agnelles');
    };
  });
  document.querySelectorAll('.btn-remove-agnelle').forEach(btn => {
    btn.onclick = () => {
      if (!confirm('Supprimer cette agnelle de l\'inventaire ? Son carnet sanitaire et ses mouvements resteront conservés dans le registre d\'élevage réglementaire.')) return;
      const ag = DB.agnelles.find(a => a.id === btn.dataset.id);
      if (ag) archiverDansRegistre('agneaux', ag.eid, { sanitaire: ag.sanitaire, mouvements: ag.mouvements });
      DB.agnelles = DB.agnelles.filter(a => a.id !== btn.dataset.id);
      saveData(DB);
      render('agnelles');
    };
  });
  document.querySelectorAll('.btn-annuler-tri').forEach(btn => {
    btn.onclick = () => {
      const ag = DB.agnelles.find(a => a.id === btn.dataset.id);
      if (!ag) return;
      if (!confirm('Revenir sur le tri de la n°' + numeroVisuel(ag.eid) + ' ? Elle repassera dans la liste "à trier".')) return;
      const lamb = findLambByEid(ag.eid);
      if (lamb) delete lamb.triStatut;
      DB.agnelles = DB.agnelles.filter(a => a.id !== ag.id);
      saveData(DB);
      render('agnelles');
    };
  });
  document.querySelectorAll('.btn-voir-mere').forEach(btn => {
    btn.onclick = () => {
      const mother = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(btn.dataset.eid));
      if (!mother) { alert("Fiche de la mère introuvable (peut-être supprimée)."); return; }
      detailOrigin = 'agnelles';
      previousDetailId = null;
      render('detail', mother.id);
    };
  });
  document.getElementById('btn-add-agnelle').onclick = () => { editingAgnelleId = null; render('add-agnelle'); };
  document.querySelectorAll('.btn-edit-agnelle').forEach(btn => {
    btn.onclick = () => { editingAgnelleId = btn.dataset.id; render('add-agnelle'); };
  });
}

function renderAddAgnelle() {
  const editing = !!editingAgnelleId;
  const existing = editing ? DB.agnelles.find(a => a.id === editingAgnelleId) : null;
  pageTitle.textContent = editing ? 'Modifier une agnelle' : 'Ajouter une agnelle';
  const today = existing ? existing.dateEntree : new Date().toISOString().slice(0,10);
  const origineFixe = existing ? existing.origine : null;

  const origineBlock = editing
    ? `<div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Origine : <strong>${origineFixe === 'née' ? 'Née sur l\'exploitation' : 'Achetée'}</strong> (non modifiable)</div>`
    : `<label>Origine</label>
       <div class="grid2" style="margin-bottom:10px;">
         <button type="button" class="opt-btn origine-opt warn" data-val="née">Née sur l'exploitation</button>
         <button type="button" class="opt-btn origine-opt warn" data-val="achetée">Achetée</button>
       </div>`;

  const eidBlock = (editing && origineFixe === 'née')
    ? `<label>EID</label><div style="font-size:14px;margin-bottom:12px;">${existing.eid} (non modifiable, lié à l'agnelage d'origine)</div>`
    : `<label>Scanner ou saisir l'EID</label>
       <input type="text" id="input-eid" value="${existing ? existing.eid : ''}" placeholder="ex: 250 016299131098" autofocus>
       <div id="preview" style="font-size:13px;color:var(--text-muted);margin-bottom:12px;"></div>`;

  app.innerHTML = `
    <div class="card">
      ${origineBlock}
      ${eidBlock}
      <label>Date (tri ou entrée)</label>
      <input type="date" id="f-date" value="${today}">
      <div id="parents-block" class="${(!editing || origineFixe === 'achetée') ? '' : 'hidden'}" style="${(!editing) ? 'display:none;' : ''}">
        <label>Père (facultatif, ex: issue d'IA)</label>
        <input type="text" id="f-pere" placeholder="Identifiant ou nom du père" value="${existing && existing.pere ? existing.pere : ''}">
        <label>Mère (facultatif, ex: issue d'IA)</label>
        <input type="text" id="f-mere" placeholder="Identifiant ou nom de la mère" value="${existing && existing.mere ? existing.mere : ''}">
      </div>
      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-agnelle">${editing ? 'Enregistrer les modifications' : "Ajouter à l'inventaire"}</button>
    </div>
  `;

  let origine = origineFixe;
  const parentsBlock = document.getElementById('parents-block');

  document.querySelectorAll('.origine-opt').forEach(btn => {
    btn.onclick = () => {
      origine = btn.dataset.val;
      document.querySelectorAll('.origine-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      parentsBlock.style.display = origine === 'achetée' ? 'block' : 'none';
      document.getElementById('err').classList.add('hidden');
    };
  });

  const inputEid = document.getElementById('input-eid');
  if (inputEid) {
    attachEidBeep(inputEid);
    const preview = document.getElementById('preview');
    inputEid.addEventListener('input', () => {
      const v = inputEid.value;
      preview.textContent = cleanEid(v).length >= 11 ? ('Numéro officiel : n°' + numeroVisuel(v)) : '';
    });
    inputEid.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('btn-save-agnelle').click();
    });
  }

  document.getElementById('btn-save-agnelle').onclick = () => {
    const err = document.getElementById('err');
    const date = document.getElementById('f-date').value;

    if (editing && origineFixe === 'née') {
      existing.dateEntree = date;
      editingAgnelleId = null;
      saveData(DB);
      render('agnelles');
      return;
    }

    if (!origine) {
      err.textContent = "Choisis l'origine (née ou achetée).";
      err.classList.remove('hidden');
      return;
    }
    const eid = inputEid.value.trim();
    if (cleanEid(eid).length < 11) {
      err.textContent = "Numéro EID incomplet.";
      err.classList.remove('hidden');
      return;
    }
    const eidTakenElsewhere = DB.agnelles.some(a => cleanEid(a.eid) === cleanEid(eid) && a.id !== editingAgnelleId)
      || DB.brebis.some(s => cleanEid(s.eid) === cleanEid(eid));
    if (eidTakenElsewhere) {
      err.textContent = "Cet animal existe déjà.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const pere = document.getElementById('f-pere') ? document.getElementById('f-pere').value.trim() : '';
    const mere = document.getElementById('f-mere') ? document.getElementById('f-mere').value.trim() : '';

    if (editing) {
      existing.eid = eid;
      existing.dateEntree = date;
      existing.pere = pere;
      existing.mere = mere;
      editingAgnelleId = null;
    } else {
      DB.agnelles.push({
        id: Date.now().toString(), eid, origine: origine, dateEntree: date, pere: pere, mere: mere, sanitaire: [],
        mouvements: origine === 'achetée' ? [{ type: 'Entrée', cause: 'Achat', date: date }] : []
      });
    }
    saveData(DB);
    render('agnelles');
  };
}

function renderAddBelier() {

      <input type="text" id="input-eid" placeholder="ex: 250 016299131098" autofocus>

      <input type="date" id="input-date-entree">

    const v = inputEid.value;
    preview.textContent = cleanEid(v).length >= 11 ? `Numéro officiel : n°${numeroVisuel(v)} — Âge estimé : ${age(v)} an(s)` : '';
  });
  inputEid.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('btn-save-belier').click(); });

    DB.beliers.push(belier);
    saveData(DB);
    currentBelierId = belier.id;
    belierDetailOrigin = 'beliers';
    render('belier-detail');
  };
}

function renderBelierDetail() {
  const belier = DB.beliers.find(b => b.id === currentBelierId);
  if (!belier) { render('beliers'); return; }
  pageTitle.textContent = 'Bélier n°' + numeroVisuel(belier.eid);

  const sanitaire = belier.sanitaire || [];
  const sanitaireHtml = sanitaire.map((s,i) => ({...s, idx:i})).reverse().map(s => `
    <div class="swipe-wrap" data-kind="belier-sanitaire" data-idx="${s.idx}">
      <div class="swipe-bg"><span class="zone-delete">Supprimer</span><span class="zone-edit">Modifier</span></div>
      <div class="swipe-fg history-item">
        ${iconCircle(ICON_SANTE, 'coral', 'sm')}
        <div class="content">
          <div>${s.type}${s.sousType ? ' — ' + s.sousType : ''}${s.produit ? ' — ' + s.produit : ''}${s.dose ? ' (' + s.dose + ')' : ''}</div>
          <div class="date">${s.date}${s.commentaire ? ' · ' + s.commentaire : ''}</div>
        </div>
      </div>
    </div>
  `).join('') || '<div style="color:var(--text-muted);font-size:14px;padding:10px 0;">Aucun soin enregistré.</div>';

  const mouvements = belier.mouvements || [];
  const mouvementHtml = mouvements.map((m,i) => ({...m, idx:i})).reverse().map(m => `
    <div class="swipe-wrap" data-kind="belier-mouvements" data-idx="${m.idx}">
      <div class="swipe-bg"><span class="zone-delete">Supprimer</span><span class="zone-edit">Modifier</span></div>
      <div class="swipe-fg history-item">
        ${iconCircle(ICON_MOUVEMENT, 'coral', 'sm')}
        <div class="content">
          <div>${m.type}${m.acheteur ? ' — ' + m.acheteur : ''}${m.cause ? ' — ' + m.cause : ''}</div>
          <div class="date">${m.date}</div>
        </div>
      </div>
    </div>
  `).join('') || '<div style="color:var(--text-muted);font-size:14px;padding:10px 0;">Aucun mouvement enregistré.</div>';

  const statutBadge = (belier.statut && belier.statut !== 'actif')
    ? `<div style="background:#f0efe9;color:var(--text-muted);padding:8px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;">Statut actuel : <strong>${belier.statut}</strong></div>`
    : '';

  app.innerHTML = `
    <div class="card">
      <div style="font-size:12px;color:var(--text-muted);">EID complet</div>
      <div style="font-size:14px;margin-bottom:10px;">${belier.eid}</div>
      <div class="grid2">
        <div><div style="font-size:12px;color:var(--text-muted);">Âge</div><div style="font-weight:600;">${age(belier.eid)} an(s) (${anneeNaissance(belier.eid)})</div></div>
        <div><div style="font-size:12px;color:var(--text-muted);">Numéro officiel</div><div style="font-weight:600;">n°${numeroVisuel(belier.eid)}</div></div>
      </div>
      ${belier.dateEntree ? `<div style="margin-top:10px;font-size:12px;color:var(--text-muted);">Date d'entrée : <strong style="color:var(--text);">${belier.dateEntree}</strong></div>` : ''}
    </div>
    ${statutBadge}
    <div class="row" style="margin-bottom:16px;">
      <button class="btn btn-primary" id="btn-add-sanitaire-belier" style="background:var(--danger);">+ Carnet sanitaire</button>
      <button class="btn btn-primary" id="btn-add-mouvement-belier" style="background:var(--danger);">+ Mouvement</button>
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Carnet sanitaire</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${sanitaireHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Mouvements</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${mouvementHtml}
    </div>
    <button class="btn btn-secondary" id="btn-delete-belier" style="color:var(--danger);border-color:var(--danger);">Supprimer ce bélier</button>
  `;
  document.getElementById('btn-add-sanitaire-belier').onclick = () => { editBelierContext = null; render('add-sanitaire-belier'); };
  document.getElementById('btn-add-mouvement-belier').onclick = () => { editBelierContext = null; render('add-mouvement-belier'); };
  document.getElementById('btn-delete-belier').onclick = () => {
    if (!confirm('Supprimer le bélier n°' + numeroVisuel(belier.eid) + ' de la liste active ? Son carnet sanitaire et ses mouvements resteront conservés dans le registre d\'élevage réglementaire.')) return;
    archiverDansRegistre('beliers', belier.eid, { sanitaire: belier.sanitaire, mouvements: belier.mouvements });
    DB.beliers = DB.beliers.filter(b => b.id !== belier.id);
    saveData(DB);
    render('beliers');
  };
  activateSwipes(app);
}

/* ---------- Ajout carnet sanitaire bélier ---------- */
function renderAddSanitaireBelier() {
  const belier = DB.beliers.find(b => b.id === currentBelierId);
  const editing = editBelierContext && editBelierContext.kind === 'sanitaire';
  const existing = editing ? belier.sanitaire[editBelierContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le soin' : 'Carnet sanitaire';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Bélier n°${numeroVisuel(belier.eid)}</div>

      <label>Type d'évènement</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px;">
        <button type="button" class="opt-btn type-opt coral" data-val="Vaccin">Vaccin</button>
        <button type="button" class="opt-btn type-opt coral" data-val="Traitement">Traitement</button>
        <button type="button" class="opt-btn type-opt coral" data-val="Autre">Autre</button>
      </div>

      <div id="sous-type-block" class="hidden" style="margin-bottom:10px;">
        <label>Catégorie de traitement</label>
        <div class="grid2" id="sous-type-group">
          <button type="button" class="opt-btn sous-opt coral" data-val="Antibiotique">Antibiotique</button>
          <button type="button" class="opt-btn sous-opt coral" data-val="Antiparasitaire">Antiparasitaire</button>
        </div>
        <div class="grid2">
          <button type="button" class="opt-btn sous-opt coral" data-val="Anti-inflammatoire" style="grid-column:span 2;">Anti-inflammatoire</button>
        </div>
      </div>

      <div id="autre-note" class="hidden" style="font-size:13px;color:var(--text-muted);margin-bottom:14px;padding:10px;background:#f0efe9;border-radius:var(--radius);">Soin de plaie — pas de produit à sélectionner.</div>

      <div id="produit-block" class="hidden" style="margin-bottom:14px;">
        <label>Produit utilisé</label>
        <div class="chip-list" id="produit-list"></div>
        <div class="row">
          <input type="text" id="new-produit" placeholder="Ajouter un nouveau produit...">
          <button type="button" class="btn btn-secondary" id="add-produit" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <label>Dose (facultatif)</label>
      <input type="text" id="f-dose" placeholder="ex: 2 ml" value="${existing ? (existing.dose || '') : ''}">

      <label>Commentaire (facultatif)</label>
      <input type="text" id="f-comment" placeholder="ex: rappel dans 3 semaines" value="${existing ? (existing.commentaire || '') : ''}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-sanitaire">${editing ? 'Enregistrer les modifications' : 'Enregistrer le soin'}</button>
    </div>
  `;

  let type = null, sousType = null, produit = null;

  function categorieKey() {
    if (type === 'Vaccin') return 'vaccins';
    if (sousType === 'Antibiotique') return 'antibiotiques';
    if (sousType === 'Antiparasitaire') return 'antiparasitaires';
    if (sousType === 'Anti-inflammatoire') return 'antiinflammatoires';
    return null;
  }
  function renderProduitChips() {
    const key = categorieKey();
    const list = document.getElementById('produit-list');
    list.innerHTML = '';
    if (!key) { document.getElementById('produit-block').classList.add('hidden'); return; }
    document.getElementById('produit-block').classList.remove('hidden');
    DB.produits[key].forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (produit === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => { const wasSelected = produit === val; produit = wasSelected ? null : val; renderProduitChips(); document.getElementById('err').classList.add('hidden'); updatePosologieBox(produit); if (!wasSelected) maybeAssociateAnmv(val, () => updatePosologieBox(produit)); };
      list.appendChild(chip);
    });
  }

  document.querySelectorAll('.type-opt').forEach(btn => {
    btn.onclick = () => {
      type = btn.dataset.val;
      sousType = null; produit = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      document.getElementById('sous-type-block').classList.toggle('hidden', type !== 'Traitement');
      document.getElementById('autre-note').classList.toggle('hidden', type !== 'Autre');
      if (type === 'Vaccin') renderProduitChips();
      else document.getElementById('produit-block').classList.add('hidden');
      document.getElementById('err').classList.add('hidden');
    };
  });
  document.querySelectorAll('.sous-opt').forEach(btn => {
    btn.onclick = () => {
      sousType = btn.dataset.val;
      produit = null;
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderProduitChips();
      document.getElementById('err').classList.add('hidden');
    };
  });
  document.getElementById('add-produit').onclick = () => {
    const key = categorieKey();
    if (!key) return;
    const input = document.getElementById('new-produit');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.produits[key].includes(val)) DB.produits[key].push(val);
    saveData(DB);
    input.value = '';
    produit = val;
    renderProduitChips();
    maybeAssociateAnmv(val, () => updatePosologieBox(produit));
  };

  document.getElementById('btn-save-sanitaire').onclick = () => {
    const err = document.getElementById('err');
    if (!type) { err.textContent = "Choisis un type d'évènement."; err.classList.remove('hidden'); return; }
    if (type === 'Traitement' && !sousType) { err.textContent = "Choisis une catégorie de traitement."; err.classList.remove('hidden'); return; }
    if (type !== 'Autre' && !produit) { err.textContent = "Sélectionne ou ajoute un produit."; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    const soin = {
      type: type, sousType: sousType, produit: type === 'Autre' ? 'Soin de plaie' : produit,
      date: document.getElementById('f-date').value,
      dose: document.getElementById('f-dose').value.trim(),
      commentaire: document.getElementById('f-comment').value.trim()
    };
    belier.sanitaire = belier.sanitaire || [];
    if (editing) belier.sanitaire[editBelierContext.idx] = soin;
    else belier.sanitaire.push(soin);
    editBelierContext = null;
    saveData(DB);
    render('belier-detail');
  };

  if (existing) {
    const typeBtn = [...document.querySelectorAll('.type-opt')].find(b => b.dataset.val === existing.type);
    if (typeBtn) typeBtn.click();
    if (existing.sousType) {
      const sousBtn = [...document.querySelectorAll('.sous-opt')].find(b => b.dataset.val === existing.sousType);
      if (sousBtn) sousBtn.click();
    }
    if (existing.produit && existing.type !== 'Autre') {
      const chip = [...document.querySelectorAll('#produit-list .chip')].find(c => c.textContent === existing.produit);
      if (chip) chip.click();
    }
  }
}

/* ---------- Ajout mouvement bélier ---------- */
function renderAddMouvementBelier() {
  const belier = DB.beliers.find(b => b.id === currentBelierId);
  const editing = editBelierContext && editBelierContext.kind === 'mouvements';
  const existing = editing ? belier.mouvements[editBelierContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le mouvement' : 'Nouveau mouvement';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Bélier n°${numeroVisuel(belier.eid)}</div>

      <label>Type de mouvement</label>
      <div class="grid2" style="margin-bottom:10px;">
        <button type="button" class="opt-btn type-opt coral" data-val="Mort">Mort</button>
        <button type="button" class="opt-btn type-opt coral" data-val="Vendu">Vendu</button>
        <button type="button" class="opt-btn type-opt coral" data-val="Vendu reproduction" style="grid-column:span 2;">Vendu reproduction</button>
      </div>

      <div id="cause-block" class="hidden" style="margin-bottom:14px;">
        <label>Cause</label>
        <div class="chip-list" id="cause-list"></div>
        <div class="row">
          <input type="text" id="new-cause" placeholder="Ajouter une nouvelle cause...">
          <button type="button" class="btn btn-secondary" id="add-cause" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <div id="acheteur-block" class="hidden" style="margin-bottom:14px;">
        <label>Acheteur</label>
        <div class="chip-list" id="acheteur-list"></div>
        <div class="row">
          <input type="text" id="new-acheteur" placeholder="Ajouter un nouvel acheteur...">
          <button type="button" class="btn btn-secondary" id="add-acheteur" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-mouvement">${editing ? 'Enregistrer les modifications' : 'Enregistrer le mouvement'}</button>
    </div>
  `;

  let type = existing ? existing.type : null, cause = existing ? existing.cause : null, acheteur = existing ? existing.acheteur : null;

  function renderCauseChips() {
    const list = document.getElementById('cause-list');
    list.innerHTML = '';
    if (DB.causesMortalite.length === 0) list.innerHTML = '<div style="font-size:13px;color:var(--text-muted);">Aucune cause enregistrée pour l\'instant.</div>';
    DB.causesMortalite.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (cause === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => { cause = (cause === val) ? null : val; renderCauseChips(); document.getElementById('err').classList.add('hidden'); };
      list.appendChild(chip);
    });
  }
  function renderAcheteurChips() {
    const list = document.getElementById('acheteur-list');
    list.innerHTML = '';
    if (DB.acheteurs.length === 0) list.innerHTML = '<div style="font-size:13px;color:var(--text-muted);">Aucun acheteur enregistré pour l\'instant.</div>';
    DB.acheteurs.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (acheteur === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => { acheteur = (acheteur === val) ? null : val; renderAcheteurChips(); document.getElementById('err').classList.add('hidden'); };
      list.appendChild(chip);
    });
  }
  renderCauseChips();
  renderAcheteurChips();

  document.querySelectorAll('.type-opt').forEach(btn => {
    if (btn.dataset.val === type) btn.classList.add('selected');
    btn.onclick = () => {
      type = btn.dataset.val;
      cause = null; acheteur = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('cause-block').classList.toggle('hidden', type !== 'Mort');
      document.getElementById('acheteur-block').classList.toggle('hidden', !(type === 'Vendu' || type === 'Vendu reproduction'));
      renderCauseChips(); renderAcheteurChips();
      document.getElementById('err').classList.add('hidden');
    };
  });
  if (type === 'Mort') document.getElementById('cause-block').classList.remove('hidden');
  if (type === 'Vendu' || type === 'Vendu reproduction') document.getElementById('acheteur-block').classList.remove('hidden');

  document.getElementById('add-cause').onclick = () => {
    const input = document.getElementById('new-cause');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.causesMortalite.includes(val)) DB.causesMortalite.push(val);
    saveData(DB); input.value = ''; cause = val; renderCauseChips();
  };
  document.getElementById('add-acheteur').onclick = () => {
    const input = document.getElementById('new-acheteur');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.acheteurs.includes(val)) DB.acheteurs.push(val);
    saveData(DB); input.value = ''; acheteur = val; renderAcheteurChips();
  };

  document.getElementById('btn-save-mouvement').onclick = () => {
    const err = document.getElementById('err');
    if (!type) { err.textContent = "Choisis un type de mouvement."; err.classList.remove('hidden'); return; }
    if ((type === 'Vendu' || type === 'Vendu reproduction') && !acheteur) { err.textContent = "Sélectionne ou ajoute un acheteur."; err.classList.remove('hidden'); return; }
    err.classList.add('hidden');
    const mouvement = { type: type, cause: type === 'Mort' ? cause : null, acheteur: acheteur, date: document.getElementById('f-date').value };
    belier.mouvements = belier.mouvements || [];
    if (editing) belier.mouvements[editBelierContext.idx] = mouvement;
    else belier.mouvements.push(mouvement);
    editBelierContext = null;
    const last = belier.mouvements[belier.mouvements.length - 1];
    if (!last) belier.statut = 'actif';
    else if (last.type === 'Mort') belier.statut = 'mort';
    else if (last.type === 'Vendu') belier.statut = 'vendu';
    else if (last.type === 'Vendu reproduction') belier.statut = 'vendu reproduction';
    saveData(DB);
    render('belier-detail');
  };
}


/* ---------- Journal / événements ponctuels (Agenda) ---------- */
function renderJournal() {
  DB.journal = DB.journal || [];
  DB.typesJournal = DB.typesJournal || [];
  DB.laitTank = DB.laitTank || [];
  DB.luttes = DB.luttes || [];
  pageTitle.textContent = 'Agenda';

  const now = new Date();
  const moisActuel = now.toISOString().slice(0,7); // 'YYYY-MM'
  const anneeActuelle = now.toISOString().slice(0,4); // 'YYYY'
  const totalLaitMois = Math.round(DB.laitTank.filter(l => (l.date||'').startsWith(moisActuel)).reduce((s,l) => s + l.quantite, 0) * 10) / 10;
  const totalLaitAnnee = Math.round(DB.laitTank.filter(l => (l.date||'').startsWith(anneeActuelle)).reduce((s,l) => s + l.quantite, 0) * 10) / 10;

  const luttesBrebis = DB.luttes.filter(l => l.cible === 'Brebis');
  const luttesAgnelles = DB.luttes.filter(l => l.cible === 'Agnelles');
  const lastLutteBrebis = luttesBrebis.length ? luttesBrebis[luttesBrebis.length - 1] : null;
  const lastLutteAgnelles = luttesAgnelles.length ? luttesAgnelles[luttesAgnelles.length - 1] : null;

    <div class="card">

          <div style="font-size:12px;color:var(--text-muted);">Cette année</div>

        </div>
      </div>
      <label>Ajouter le relevé du jour</label>
      <div class="row">
        <input type="date" id="f-lait-date" value="${new Date().toISOString().slice(0,10)}" style="flex:1;">
        <input type="number" step="0.1" id="f-lait-qte" placeholder="Litres" style="flex:1;">
      </div>
      <div id="lait-err" class="error-box hidden"></div>
      <button class="btn btn-secondary" id="btn-save-lait" style="margin-top:8px;">Enregistrer</button>
      ${DB.laitTank.length > 0 ? '<div style="font-size:12px;color:var(--text-muted);margin-top:12px;margin-bottom:6px;">Derniers relevés</div>' : ''}
      <div>
        ${[...DB.laitTank].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,8).map(l => {
          const realIdx = DB.laitTank.indexOf(l);
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--border);font-size:13px;">
            <span>${l.date} — ${l.quantite} L</span>
            <button type="button" class="btn btn-secondary btn-del-lait" data-idx="${realIdx}" style="width:auto;padding:4px 10px;font-size:12px;color:var(--danger);border-color:var(--danger);">Suppr.</button>

        }).join('')}

      <div class="grid2" style="margin-bottom:6px;">

          <div style="font-size:12px;color:var(--text-muted);">Brebis</div>

      DB.luttes.splice(parseInt(btn.dataset.idx, 10), 1);

      DB.journal.splice(parseInt(btn.dataset.idx, 10), 1);
      saveData(DB);
      render('journal');
    };
  });

/* Ouvre (en le créant ou en le rafraîchissant s'il existe déjà) un lot de
   recherche technique, identifié par un id fixe — utilisé par les raccourcis
   cliquables de l'accueil (ex: "Attendues à la traite") pour générer
   automatiquement un lot de recherche en bergerie sur un critère donné,
   sans passer par l'écran "Nouveau lot". */
function openAutoLot(id, nom, membres) {
  DB.lots = DB.lots || [];
  let lot = DB.lots.find(l => l.id === id);
  if (lot) {
    lot.membres = membres;
    lot.dateCreation = new Date().toISOString().slice(0,10);
  } else {
    lot = { id, nom, membres, dateCreation: new Date().toISOString().slice(0,10), auto: true };
    DB.lots.push(lot);
  }
  saveData(DB);
  if (window.__lotSessions) delete window.__lotSessions['trouvees_' + id];
  currentLotId = id;
  render('lot-search');
}

/* ---------- Composant de sélection généralisé (clic dans une liste OU bip en série) ----------
   Réutilisé partout où l'on choisit un sous-ensemble d'animaux : Nouveau lot,
   Mouvement groupé, Traitement collectif, Lot de réforme. Les deux façons de
   sélectionner ne s'excluent pas : on peut bipper en série puis affiner à la
   main dans la liste (ou l'inverse), la sélection est partagée entre les
   deux onglets.
   - containerEl : élément DOM où injecter le composant (vidé et reconstruit
     à chaque appel).
   - pool : tableau des animaux disponibles ({id, eid, ...}).
   - selectedIds : Set (fourni et conservé par l'appelant) des `id` cochés.
   - opts.renderMeta(item) : texte optionnel affiché à droite de chaque ligne.
   - opts.onChange() : rappelée après chaque changement de sélection. */
function renderSelectionPicker(containerEl, pool, selectedIds, opts) {
  opts = opts || {};
  const renderMeta = opts.renderMeta || (() => '');
  const onChange = opts.onChange || (() => {});
  const state = { mode: opts.initialMode || 'liste', filtre: '' };

  function findByEid(val) {
    return pool.find(it => cleanEid(it.eid) === val);
  }

  function renderCounter() {
    const el = containerEl.querySelector('.sp-counter');
    if (el) el.textContent = selectedIds.size + ' sélectionnée(s) sur ' + pool.length + '.';
  }

  function renderRows() {
    const listEl = containerEl.querySelector('.sp-list');
    if (!listEl) return;
    let items = pool;
    if (state.filtre.trim()) {
      const f = state.filtre.trim().toLowerCase();
      items = items.filter(it => numeroVisuel(it.eid).toLowerCase().includes(f));
    }
    listEl.innerHTML = items.map(it => `
      <label style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);">
        <input type="checkbox" class="sp-check" data-id="${it.id}" ${selectedIds.has(it.id) ? 'checked' : ''} style="width:18px;height:18px;margin:0;flex-shrink:0;">
        <span style="font-size:14px;">N°${numeroVisuel(it.eid)}</span>
        <span style="font-size:12px;color:var(--text-muted);margin-left:auto;">${renderMeta(it)}</span>
      </label>
    `).join('') || '<div style="font-size:13px;color:var(--text-muted);padding:8px 0;">Aucun animal.</div>';
    listEl.querySelectorAll('.sp-check').forEach(cb => {
      cb.onchange = () => {
        if (cb.checked) selectedIds.add(cb.dataset.id);
        else selectedIds.delete(cb.dataset.id);
        renderCounter();
        onChange();
      };
    });
  }

  function full() {
    containerEl.innerHTML = `
      <div class="tab-bar" style="margin-bottom:10px;">
        <button type="button" class="tab-btn sp-mode-btn${state.mode === 'liste' ? ' active' : ''}" data-mode="liste">Sélection dans la liste</button>
        <button type="button" class="tab-btn sp-mode-btn${state.mode === 'bip' ? ' active' : ''}" data-mode="bip">Bip en série</button>
      </div>
      <div class="sp-counter" style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">${selectedIds.size} sélectionnée(s) sur ${pool.length}.</div>
      ${state.mode === 'bip' ? `
        <input type="text" class="sp-scan" placeholder="Scanner ou saisir l'EID" autofocus>
        <div class="sp-scan-feedback" style="margin-top:8px;font-size:13px;"></div>
      ` : `
        <input type="text" class="sp-filtre" placeholder="Filtrer par numéro..." value="${state.filtre}" style="margin-bottom:4px;">
      `}
      <div class="sp-list" style="max-height:360px;overflow-y:auto;"></div>
    `;

    containerEl.querySelectorAll('.sp-mode-btn').forEach(btn => {
      btn.onclick = () => { state.mode = btn.dataset.mode; full(); };
    });

    if (state.mode === 'bip') {
      const scan = containerEl.querySelector('.sp-scan');
      const feedback = containerEl.querySelector('.sp-scan-feedback');
      scan.focus();
      scan.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        const val = cleanEid(scan.value);
        scan.value = '';
        if (!val) return;
        const item = findByEid(val);
        if (!item) {
          playBeepRate();
          feedback.textContent = 'n°' + numeroVisuel(val) + ' introuvable dans cette liste.';
          feedback.style.color = 'var(--danger)';
          return;
        }
        if (selectedIds.has(item.id)) {
          playBeepDejaTrouve();
          feedback.textContent = 'n°' + numeroVisuel(item.eid) + ' déjà sélectionnée.';
          feedback.style.color = 'var(--warning)';
          return;
        }
        playBeepTrouve();
        feedback.textContent = 'n°' + numeroVisuel(item.eid) + ' ajoutée.';
        feedback.style.color = 'var(--green-fg)';
        selectedIds.add(item.id);
        renderCounter();
        onChange();
      });
    } else {
      const filtre = containerEl.querySelector('.sp-filtre');
      filtre.addEventListener('input', () => { state.filtre = filtre.value; renderRows(); });
    }
    renderRows();
  }
  full();
}

function renderAddLot() {
  pageTitle.textContent = 'Nouveau lot';
  const actives = DB.brebis.filter(s => (s.statut || 'active') === 'active');

  app.innerHTML = `
    <div class="card">
      <label>Nom du lot</label>
      <input type="text" id="f-lot-nom" placeholder="ex: Brebis vides à trier">

      <label>Filtrer par dernier résultat d'échographie (facultatif)</label>
      <div class="chip-list" id="critere-list">
        <button type="button" class="chip" data-val="Début">Début</button>
        <button type="button" class="chip" data-val="Milieu">Milieu</button>
        <button type="button" class="chip" data-val="Fin">Fin</button>
        <button type="button" class="chip" data-val="Vide">Vide</button>
        <button type="button" class="chip" data-val="Pleine">Pleine (constat)</button>
        <button type="button" class="chip" data-val="Aucune">Sans échographie</button>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">Coche un ou plusieurs critères pour présélectionner des brebis ci-dessous — tu peux ensuite ajuster la sélection à la main ou au bip.</div>

      <label>Brebis du lot</label>
      <div id="lot-picker" style="margin-bottom:14px;"></div>

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-lot">Créer le lot</button>
    </div>
  `;

  const selected = new Set();
  const criteres = new Set();

  function lastStadeOf(sheep) {
    const last = sheep.echographies[sheep.echographies.length - 1];
    if (!last) return 'Aucune';
    return last.stade || 'Aucune';
  }

  const picker = document.getElementById('lot-picker');
  renderSelectionPicker(picker, actives, selected, { renderMeta: lastStadeOf });

  document.querySelectorAll('#critere-list .chip').forEach(chip => {
    chip.onclick = () => {
      const val = chip.dataset.val;
      if (criteres.has(val)) { criteres.delete(val); chip.classList.remove('selected'); }
      else { criteres.add(val); chip.classList.add('selected'); }
      actives.forEach(s => {
        if (criteres.has(lastStadeOf(s))) selected.add(s.id);
      });
      renderSelectionPicker(picker, actives, selected, { renderMeta: lastStadeOf });
    };
  });

  document.getElementById('btn-save-lot').onclick = () => {
    const err = document.getElementById('err');
    const nom = document.getElementById('f-lot-nom').value.trim();
    if (!nom) {
      err.textContent = "Donne un nom au lot.";
      err.classList.remove('hidden');
      return;
    }
    if (selected.size === 0) {
      err.textContent = "Sélectionne au moins une brebis.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const membres = actives.filter(s => selected.has(s.id)).map(s => s.eid);
    DB.lots = DB.lots || [];
    DB.lots.push({ id: Date.now().toString(), nom, dateCreation: new Date().toISOString().slice(0,10), membres });
    saveData(DB);
    render('lots');
  };
}

  const trouveesKey = 'trouvees_' + lot.id;
  if (!window.__lotSessions) window.__lotSessions = {};
  if (!window.__lotSessions[trouveesKey]) window.__lotSessions[trouveesKey] = new Set();
  const trouvees = window.__lotSessions[trouveesKey];

  function render_() {
    const restants = lot.membres.filter(eid => !trouvees.has(cleanEid(eid)));
    app.innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
          ${iconCircle(ICON_SEARCH, 'green', 'sm')}

        </div>

      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
        ${restants.map(eid => `<span class="badge badge-muted pill-tag">n°${numeroVisuel(eid)}</span>`).join('') || '<span style="font-size:13px;color:var(--text-muted);">Toutes trouvées !</span>'}
      </div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">Trouvées (${trouvees.size})</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${[...trouvees].map(eid => `<span class="badge badge-green pill-tag">n°${numeroVisuel(eid)}</span>`).join('')}
      </div>
    `;
    const scanInput = document.getElementById('scan-lot');
    scanInput.focus();
    scanInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const val = cleanEid(scanInput.value);
      const feedback = document.getElementById('scan-feedback');
      scanInput.value = '';
      if (!val) return;
      const isMember = lot.membres.some(m => cleanEid(m) === val);
      if (!isMember) {
        playBeepRate();
        feedback.textContent = 'n°' + numeroVisuel(val) + " n'est pas dans ce lot.";
        feedback.style.color = 'var(--danger)';
        return;
      }
      if (trouvees.has(val)) {
        playBeepDejaTrouve();
        feedback.textContent = 'n°' + numeroVisuel(val) + ' déjà trouvée.';
        feedback.style.color = 'var(--warning)';
        return;
      }
      playBeepTrouve();
      feedback.textContent = '';
      trouvees.add(val);
      render_();
    });
  }
  render_();
}

/* ---------- Mouvement groupé (vente / sortie multiple) ---------- */
function renderMouvementGroupe() {
  pageTitle.textContent = 'Mouvement groupé';
  const today = new Date().toISOString().slice(0,10);
  const actives = DB.brebis.filter(s => (s.statut || 'active') === 'active');

  if (!window.__mouvementGroupeSelected) window.__mouvementGroupeSelected = new Set();
  const selected = window.__mouvementGroupeSelected;
  // Ne garde que les ids encore actifs (une sélection lancée puis reprise
  // plus tard ne doit pas pointer vers une brebis déjà sortie entre-temps).
  Array.from(selected).forEach(id => { if (!actives.some(s => s.id === id)) selected.delete(id); });

  let type = null, cause = null, acheteur = null;

  function render_() {
    app.innerHTML = `
      <div class="card">
        <label>Type de mouvement</label>
        <div class="grid2" style="margin-bottom:10px;">

        <label>Brebis concernées</label>
        <div id="groupe-picker"></div>
      </div>

      <button class="btn btn-primary" id="btn-valider-groupe" style="margin-top:10px;background:var(--danger);">Valider ${selected.size} mouvement(s)</button>

      onChange: () => { document.getElementById('btn-valider-groupe').textContent = 'Valider ' + selected.size + ' mouvement(s)'; }
    });

    function renderCauseChips() {
      const list = document.getElementById('cause-list');

        list.appendChild(chip);
      });
    }
    function renderAcheteurChips() {
      const list = document.getElementById('acheteur-list');
      list.innerHTML = '';
      DB.acheteurs.forEach(val => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (acheteur === val ? ' selected' : '');
        chip.textContent = val;
        chip.onclick = () => { acheteur = (acheteur === val) ? null : val; renderAcheteurChips(); };
        list.appendChild(chip);
      });
    }
    renderCauseChips();
    renderAcheteurChips();

    document.querySelectorAll('.type-opt').forEach(btn => {
      if (btn.dataset.val === type) btn.classList.add('selected');
      btn.onclick = () => {

    if (type === 'Vendue' || type === 'Vendue reproduction') document.getElementById('acheteur-block').classList.remove('hidden');

    document.getElementById('add-cause').onclick = () => {
      const input = document.getElementById('new-cause');
      const val = input.value.trim();
      if (!val) return;
      if (!DB.causesMortalite.includes(val)) DB.causesMortalite.push(val);
      saveData(DB); input.value = ''; cause = val; renderCauseChips();
    };
    document.getElementById('add-acheteur').onclick = () => {
      const input = document.getElementById('new-acheteur');
      const val = input.value.trim();
      if (!val) return;
      if (!DB.acheteurs.includes(val)) DB.acheteurs.push(val);

        sheep.statut = type === 'Morte' ? 'morte' : type === 'Vendue' ? 'vendue' : 'vendue reproduction';
      });
      saveData(DB);
      selected.clear();
      alert(concernees.length + ' mouvement(s) enregistré(s).');
      render('lots');
    };
  }
  render_();
}

/* ---------- Historique des traitements collectifs (suppression en masse) ----------
   Les traitements créés après l'ajout du collectifId sont retrouvés via
   DB.traitementsCollectifs. Les entrées créées avant ce correctif n'ont pas
   de collectifId : on les détecte a posteriori en regroupant, sur les brebis
   actives, les soins collectifs qui partagent exactement le même
   {type, sousType, produit, date} — c'est le seul repère disponible pour ces
   anciennes saisies (cas typique : un traitement Chlamyvax appliqué en masse
   avant que cet écran n'existe). */
function detectLegacyCollectifGroups() {
  const groups = {};
  DB.brebis.forEach(s => {
    (s.sanitaire || []).forEach(soin => {
      if (!soin.collectif || soin.collectifId) return;
      const key = JSON.stringify([soin.type, soin.sousType || null, soin.produit || null, soin.date || null]);
      if (!groups[key]) groups[key] = { type: soin.type, sousType: soin.sousType, produit: soin.produit, date: soin.date, membres: [] };
      groups[key].membres.push(s.eid);
    });
  });
  return Object.values(groups).filter(g => g.membres.length >= 2);
}

function renderTraitementsCollectifsHistorique() {
  pageTitle.textContent = 'Traitements collectifs';
  DB.traitementsCollectifs = DB.traitementsCollectifs || [];
  const legacyGroups = detectLegacyCollectifGroups();

  const itemHtml = (t, isLegacy) => `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        ${iconCircle(ICON_SANTE, 'coral', 'sm')}
        <div>
          <div style="font-weight:600;">${t.produit || t.type}${t.sousType ? ' · ' + t.sousType : ''}</div>
          <div style="font-size:12px;color:var(--text-muted);">${t.date || 'date inconnue'} · ${t.membres.length} brebis${isLegacy ? ' · saisie ancienne (sans identifiant)' : ''}</div>
        </div>
      </div>
      <button type="button" class="btn btn-secondary btn-del-collectif" data-key="${isLegacy ? 'legacy:' + encodeURIComponent(JSON.stringify([t.type, t.sousType || null, t.produit || null, t.date || null])) : 'id:' + t.id}" style="color:var(--danger);border-color:var(--danger);">Supprimer ce traitement collectif</button>
    </div>
  `;

  const recentHtml = DB.traitementsCollectifs.length === 0
    ? '<div class="empty">Aucun traitement collectif enregistré avec identifiant pour l\'instant.</div>'
    : [...DB.traitementsCollectifs].reverse().map(t => itemHtml(t, false)).join('');

  const legacyHtml = legacyGroups.length === 0 ? '' : `
    <div style="font-size:13px;color:var(--text-muted);margin:18px 2px 8px;">Groupes détectés dans d'anciennes saisies (avant cet écran) — vérifie le nombre de brebis avant de supprimer :</div>
    ${legacyGroups.map(g => itemHtml(g, true)).join('')}
  `;

  app.innerHTML = `
    <div style="font-size:13px;color:var(--text-muted);margin:2px 2px 14px;">Retrouve un traitement appliqué à plusieurs brebis en une fois et supprime-le d'un coup de toutes les fiches concernées.</div>
    ${recentHtml}
    ${legacyHtml}
  `;

  document.querySelectorAll('.btn-del-collectif').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.key;
      if (key.startsWith('id:')) {
        const id = key.slice(3);
        const t = DB.traitementsCollectifs.find(x => x.id === id);
        if (!t) return;
        if (!confirm('Supprimer ce traitement collectif de ' + t.membres.length + ' brebis ? Cette action est irréversible.')) return;
        DB.brebis.forEach(s => {
          if (!s.sanitaire) return;
          s.sanitaire = s.sanitaire.filter(soin => soin.collectifId !== id);
        });
        DB.traitementsCollectifs = DB.traitementsCollectifs.filter(x => x.id !== id);
      } else {
        const [type, sousType, produit, date] = JSON.parse(decodeURIComponent(key.slice(7)));
        const g = legacyGroups.find(x => x.type === type && (x.sousType || null) === sousType && (x.produit || null) === produit && (x.date || null) === date);
        if (!g) return;
        if (!confirm('Supprimer ce groupe détecté (' + g.membres.length + ' brebis) ? Cette action est irréversible.')) return;
        DB.brebis.forEach(s => {
          if (!s.sanitaire) return;
          s.sanitaire = s.sanitaire.filter(soin => !(soin.collectif && !soin.collectifId && soin.type === type && (soin.sousType || null) === sousType && (soin.produit || null) === produit && (soin.date || null) === date));
        });
      }
      saveData(DB);
      render('traitements-collectifs');
    };
  });
}

/* ---------- Registre d'élevage réglementaire (conditionnalité PAC) ----------
   Écran de consultation (lecture seule) qui fusionne, pour chaque EID, les
   données encore actives (fiche en cours) et les données archivées dans
   DB.registre (fiches supprimées ou remises à zéro de campagne) — voir
   archiverDansRegistre(). Conformément à l'arrêté du 5 juin 2000 relatif au
   registre d'élevage (base de la conditionnalité PAC sur ce point) : contenu
   couvrant sanitaire/mises bas/mouvements, conservation 5 ans, édition papier
   possible à partir d'une tenue informatique. */
let registreTab = 'brebis';
let registreFiltre = '';

function registreEntriesFor(categorie) {
  const archive = (DB.registre && DB.registre[categorie]) || {};
  const map = {};
  Object.keys(archive).forEach(eid => {
    const a = archive[eid];
    map[eid] = { eid, actif: false, sanitaire: (a.sanitaire || []).slice(), agnelages: (a.agnelages || []).slice(), mouvements: (a.mouvements || []).slice() };
  });
  const actifs = categorie === 'brebis' ? DB.brebis : categorie === 'beliers' ? DB.beliers : DB.agnelles;
  (actifs || []).forEach(a => {
    if (!map[a.eid]) map[a.eid] = { eid: a.eid, actif: true, sanitaire: [], agnelages: [], mouvements: [] };
    else map[a.eid].actif = true;
    map[a.eid].sanitaire = map[a.eid].sanitaire.concat(a.sanitaire || []);
    map[a.eid].agnelages = map[a.eid].agnelages.concat(a.agnelages || []);
    map[a.eid].mouvements = map[a.eid].mouvements.concat(a.mouvements || []);
  });
  return Object.values(map).sort((x, y) => (anneeNaissance(x.eid) || 0) - (anneeNaissance(y.eid) || 0));
}

function registreAnimalLinesHtml(entry, categorie) {
  const sanitaireHtml = entry.sanitaire.length
    ? entry.sanitaire.map(s => `<div class="registre-line">${s.date || '?'} — ${s.type}${s.sousType ? ' · ' + s.sousType : ''}${s.produit ? ' · ' + s.produit : ''}${s.dose ? ' (' + s.dose + ')' : ''}</div>`).join('')
    : '<div class="registre-line muted">Aucun soin.</div>';
  const agnelagesHtml = entry.agnelages.length
    ? entry.agnelages.map(a => `<div class="registre-line">${a.date || '?'} — mise bas (${(a.agneaux || []).length} agneau(x))</div>`).join('')
    : '<div class="registre-line muted">Aucune mise bas.</div>';
  const mouvementsHtml = entry.mouvements.length
    ? entry.mouvements.map(m => `<div class="registre-line">${m.date || '?'} — ${m.type}${m.cause ? ' · ' + m.cause : ''}${m.acheteur ? ' · ' + m.acheteur : ''}</div>`).join('')
    : '<div class="registre-line muted">Aucun mouvement.</div>';
  return `

/* ---------- Import CSV inventaire + échographies ---------- */
function normalizeTexte(s) {
  return String(s).normalize('NFD').replace(new RegExp('[̀-ͯ]', 'g'), '').toLowerCase().trim();
}

function parseEchoComment(comment) {
  const c = String(comment).trim();
  if (!DB.casParticuliers) DB.casParticuliers = ['Pseudogestation', 'Avortée'];
  const cas = DB.casParticuliers.find(cp => normalizeTexte(cp) === normalizeTexte(c));
  if (cas) {
    return { special: cas, stade: null, agneaux: null, parasitisme: false };
  }
  const words = c.split(/\s+/).filter(Boolean);
  if (words.length === 0) return null;
  const stadesValides = { 'debut': 'Début', 'milieu': 'Milieu', 'fin': 'Fin', 'vide': 'Vide' };
  const stade = stadesValides[normalizeTexte(words[0])];
  if (!stade) return null;
  const parasitisme = words.some(w => normalizeTexte(w) === 'p');
  const num = words.find(w => w === '1' || w === '2');
  const agneaux = num === '1' ? 'Simple' : num === '2' ? 'Double' : null;
  return { special: null, stade, agneaux, parasitisme };
}

/* Décode un CSV en devinant l'encodage (UTF-8 si valide, sinon Windows-1252)
   et le séparateur (';', ',' ou tabulation — le plus fréquent sur les 1res lignes). */
function decodeCsvBuffer(buffer) {
  let text;
  try {
    text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
  } catch (e) {
    text = new TextDecoder('windows-1252').decode(buffer);
  }
  text = text.replace(/^﻿/, '');
  const sampleLines = text.split(/\r?\n/).slice(0, 5);
  const counts = { ';': 0, ',': 0, '\t': 0 };
  sampleLines.forEach(l => {
    counts[';'] += (l.match(/;/g) || []).length;
    counts[','] += (l.match(/,/g) || []).length;
    counts['\t'] += (l.match(/\t/g) || []).length;
  });
  const delimiter = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || ';';
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const toRow = (line) => line.split(delimiter).map(p => p.trim().replace(/^"|"$/g, ''));
  return lines.map(toRow);
}

/* ---------- Lecteur XLSX minimal (ZIP + OOXML), sans dépendance externe ---------- */
async function readXlsxRows(buffer) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  let eocd = -1;
  const minEocd = Math.max(0, bytes.length - 22 - 65557);
  for (let i = bytes.length - 22; i >= minEocd; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd === -1) throw new Error("Fichier .xlsx invalide ou corrompu.");
  const entryCount = view.getUint16(eocd + 10, true);
  let cdOffset = view.getUint32(eocd + 16, true);
  const files = {};
  for (let i = 0; i < entryCount; i++) {
    if (view.getUint32(cdOffset, true) !== 0x02014b50) break;
    const compMethod = view.getUint16(cdOffset + 10, true);
    const compSize = view.getUint32(cdOffset + 20, true);
    const nameLen = view.getUint16(cdOffset + 28, true);
    const extraLen = view.getUint16(cdOffset + 30, true);
    const commentLen = view.getUint16(cdOffset + 32, true);
    const localHeaderOffset = view.getUint32(cdOffset + 42, true);
    const name = new TextDecoder('utf-8').decode(bytes.slice(cdOffset + 46, cdOffset + 46 + nameLen));
    files[name] = { compMethod, compSize, localHeaderOffset };
    cdOffset += 46 + nameLen + extraLen + commentLen;
  }
  async function getFileText(name) {
    const f = files[name];
    if (!f) return null;
    const lh = f.localHeaderOffset;
    if (view.getUint32(lh, true) !== 0x04034b50) throw new Error('Entrée ZIP invalide.');
    const lNameLen = view.getUint16(lh + 26, true);
    const lExtraLen = view.getUint16(lh + 28, true);
    const dataStart = lh + 30 + lNameLen + lExtraLen;
    const compData = bytes.slice(dataStart, dataStart + f.compSize);
    let plain;
    if (f.compMethod === 0) {
      plain = compData;
    } else if (f.compMethod === 8) {
      if (!window.DecompressionStream) throw new Error('DECOMPRESSION_UNSUPPORTED');
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([compData]).stream().pipeThrough(ds);
      plain = new Uint8Array(await new Response(stream).arrayBuffer());
    } else {
      throw new Error("Méthode de compression du fichier .xlsx non supportée.");
    }
    return new TextDecoder('utf-8').decode(plain);
  }

  const sharedStringsXml = await getFileText('xl/sharedStrings.xml');
  let sharedStrings = [];
  if (sharedStringsXml) {
    const doc = new DOMParser().parseFromString(sharedStringsXml, 'application/xml');
    const siNodes = doc.getElementsByTagName('si');
    for (let i = 0; i < siNodes.length; i++) {
      const tNodes = siNodes[i].getElementsByTagName('t');
      let text = '';
      for (let j = 0; j < tNodes.length; j++) text += tNodes[j].textContent;
      sharedStrings.push(text);
    }
  }

  let sheetName = 'xl/worksheets/sheet1.xml';
  if (!files[sheetName]) {
    sheetName = Object.keys(files)
      .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
      .sort((a, b) => parseInt(a.match(/\d+/)[0], 10) - parseInt(b.match(/\d+/)[0], 10))[0];
  }
  const sheetXml = sheetName ? await getFileText(sheetName) : null;
  if (!sheetXml) throw new Error("Aucune feuille trouvée dans le fichier .xlsx.");

  const doc = new DOMParser().parseFromString(sheetXml, 'application/xml');
  const rowNodes = doc.getElementsByTagName('row');
  const rows = [];
  for (let i = 0; i < rowNodes.length; i++) {
    const cellNodes = rowNodes[i].getElementsByTagName('c');
    const row = [];
    for (let j = 0; j < cellNodes.length; j++) {
      const cell = cellNodes[j];
      const ref = cell.getAttribute('r') || '';
      const colMatch = ref.match(/^([A-Z]+)/);
      let colIdx = row.length;
      if (colMatch) {
        colIdx = 0;
        for (const ch of colMatch[1]) colIdx = colIdx * 26 + (ch.charCodeAt(0) - 64);
        colIdx -= 1;
      }
      const type = cell.getAttribute('t');
      let value = '';
      if (type === 'inlineStr') {
        const isNode = cell.getElementsByTagName('is')[0];
        value = isNode ? isNode.textContent : '';
      } else {
        const vNode = cell.getElementsByTagName('v')[0];
        const raw = vNode ? vNode.textContent : '';
        value = (type === 's') ? (sharedStrings[parseInt(raw, 10)] || '') : raw;
      }
      row[colIdx] = value;
    }
    for (let k = 0; k < row.length; k++) if (row[k] === undefined) row[k] = '';
    rows.push(row);
  }
  return rows;
}

function renderImportEcho() {
  pageTitle.textContent = 'Import CSV / Excel';
  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        ${iconCircle(ICON_ECHO, 'green', 'sm')}
        <div style="font-size:13px;color:var(--text-muted);">Fichier CSV ou Excel (.xlsx) avec 2 colonnes : EID et commentaire (ex: Début 1, Milieu 2, Vide P, Pseudogestation...). La 1re ligne peut être un en-tête ou déjà une donnée.</div>
      </div>
      <label>Fichier CSV ou Excel</label>
      <input type="file" id="import-echo-file" accept=".csv,.xlsx">
      <label style="margin-top:12px;">Date à appliquer à ces échographies</label>
      <input type="date" id="import-echo-date" value="${new Date().toISOString().slice(0,10)}">
      <div id="import-echo-err" class="error-box hidden"></div>
      <div id="import-echo-preview" style="margin-top:14px;"></div>
      <button class="btn btn-primary hidden" id="btn-confirm-import" style="margin-top:14px;">Confirmer l'import</button>
    </div>
  `;

  let parsedRows = null;

  function processTableRows(tableRows) {
    // Ignore la 1re ligne seulement si elle ressemble à un en-tête (1re colonne pas un EID valide)
    let dataRows = tableRows;
    if (tableRows.length > 0 && cleanEid(String(tableRows[0][0] || '')).length < 11) {
      dataRows = tableRows.slice(1);
    }
    const rows = [];
    const erreurs = [];
    let nouvellesBrebis = 0;
    dataRows.forEach((parts, i) => {
      if (!parts || parts.length < 2 || (!parts[0] && !parts[1])) return;
      const eid = String(parts[0] || '').trim();
      const comment = String(parts[1] || '').trim();
      if (cleanEid(eid).length < 11) { erreurs.push('Ligne ' + (i+2) + ' : EID invalide (' + eid + ')'); return; }
      const parsed = parseEchoComment(comment);
      if (!parsed) { erreurs.push('Ligne ' + (i+2) + ' : commentaire non reconnu (' + comment + ')'); return; }
      const existe = DB.brebis.some(s => cleanEid(s.eid) === cleanEid(eid));
      if (!existe) nouvellesBrebis++;
      rows.push({ eid, ...parsed });
    });
    parsedRows = rows;
    const err = document.getElementById('import-echo-err');
    err.classList.add('hidden');
    const preview = document.getElementById('import-echo-preview');
      preview.innerHTML = `
        <div class="grid2" style="grid-template-columns:repeat(3,1fr);">
          <div class="stat-card sc-green">
            <div class="stat-card-label">Reconnues</div>
            <div class="stat-card-value" style="font-size:20px;">${rows.length}</div>
          </div>
          <div class="stat-card sc-amber">
            <div class="stat-card-label">Nouvelles brebis</div>
            <div class="stat-card-value" style="font-size:20px;">${nouvellesBrebis}</div>
          </div>
          <div class="stat-card ${erreurs.length ? 'sc-coral' : ''}" style="${erreurs.length ? '' : 'background:#f0efe9;color:var(--text-muted);'}">
            <div class="stat-card-label">Ignorées</div>
            <div class="stat-card-value" style="font-size:20px;">${erreurs.length}</div>
          </div>
        </div>
        ${erreurs.length ? '<div style="font-size:12px;color:var(--coral-fg);margin-top:8px;">' + erreurs.slice(0,10).join('<br>') + (erreurs.length > 10 ? '<br>... (' + (erreurs.length-10) + ' de plus)' : '') + '</div>' : ''}
      `;
    document.getElementById('btn-confirm-import').classList.toggle('hidden', rows.length === 0);
  }

  document.getElementById('import-echo-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const err = document.getElementById('import-echo-err');
    err.classList.add('hidden');
    document.getElementById('import-echo-preview').innerHTML = '';
    document.getElementById('btn-confirm-import').classList.add('hidden');
    const isXlsx = /\.xlsx$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const tableRows = isXlsx ? await readXlsxRows(reader.result) : decodeCsvBuffer(reader.result);
        processTableRows(tableRows);
      } catch (ex) {
        if (ex && ex.message === 'DECOMPRESSION_UNSUPPORTED') {
          err.textContent = "Ce téléphone/navigateur ne sait pas décompresser les fichiers .xlsx — exporte plutôt en .csv depuis ton tableur.";
        } else {
          err.textContent = "Impossible de lire ce fichier : " + (ex && ex.message ? ex.message : 'format non reconnu.');
        }
        err.classList.remove('hidden');
      }
    };
    reader.onerror = () => {
      err.textContent = "Erreur de lecture du fichier.";
      err.classList.remove('hidden');
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById('btn-confirm-import').onclick = () => {
    if (!parsedRows || parsedRows.length === 0) return;
    if (!confirm('Importer ' + parsedRows.length + ' échographie(s) ? Cette action ajoute des données, elle ne supprime rien.')) return;
    const date = document.getElementById('import-echo-date').value;
    parsedRows.forEach(row => {
      let sheep = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(row.eid));
      if (!sheep) {
        sheep = { id: Date.now().toString() + Math.random().toString(36).slice(2,6), eid: row.eid, createdAt: Date.now(), echographies: [], agnelages: [], sanitaire: [], mouvements: [{ type: 'Entrée', cause: 'Import (fichier CSV/Excel)', date: date }], controleLaitier: [], statut: 'active' };
        DB.brebis.push(sheep);
      }
      sheep.echographies = sheep.echographies || [];
      sheep.echographies.push({
        type: row.special ? 'stade_comptage' : (row.agneaux ? 'stade_comptage' : 'stade'),
        date: date,
        stade: row.stade,
        agneaux: row.agneaux,
        special: row.special,
        parasitisme: row.parasitisme
      });
    });
    saveData(DB);
    alert(parsedRows.length + ' échographie(s) importée(s) avec succès.');
    render('parametres');
  };
}
