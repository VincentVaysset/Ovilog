ue possible afin d’éviter un sous-dosage. L’utilisation d’un équipement de mesure convenablement étalonné est recommandée. Ne pas perforer le bouchon plus de 50 fois.En cas de traitement simultané de groupes d’animaux, utiliser une aiguille à ponction afin d’éviter de perforer de manière excessive le bouchon. L’aiguille à ponction doit être retirée après le traitement."},{"n":"FLUKIVER","l":null,"v":107,"p":"Voie sous-cutanée. Ovins, bovins de moins de 200 kg :5 mg de closantel par kg de poids vif en une administration unique, soit 1 mL pour 10 kg de poids vif. Bovins de plus de 200 kg :2,5 à 5 mg de closantel par kg de poids vif en une administration unique, soit 0,5 à 1 mL pour 10 kg de poids vif selon la règle suivante :Bovins de 200 à 400 kg : 20 mL.Bovins de plus de 400 kg : 20 mL plus 5 mL pour 100 kg de poids vif supplémentaire. Le volume total à administrer doit être divisé, si nécessaire, afin de ne pas dépasser 20 mL par point d’injection pour les bovins. Le volume total à administrer doit être divisé, si nécessaire, afin de ne pas dépasser 8 mL par point d’injection pour les ovins. Utiliser un matériel pour administrer le médicament permettant un dosage précis.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible.Un sous-dosage peut entraîner une inefficacité et favoriser le développement de résistance."},{"n":"FLUMIQUIL POUDRE A 3 %","l":2,"v":2,"p":"Chez les bovins, chevaux, ovins, caprins :\\n12 mg de fluméquine par kg de poids vif et par jour pendant 5 jours par voie orale.\\n \\nChez les porcins :\\n12 mg de fluméquine par kg de poids vif et par jour pendant 3 à 5 jours par voie orale.\\n \\nChez les lapins et les volailles :\\n12 mg de fluméquine par kg de poids vif et par jour pendant 5 jours par voie orale.\\n \\nLa quantité d’eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en fluméquine doit être ajustée en conséquence.\\n \\nChez les poissons :\\n12 mg de fluméquine par kg de poids vif et par jour pendant 5 jours par voie orale."},{"n":"FORESPIX 100 MG/ML, SOLUTION INJECTABLE POUR BOVINS, PORCINS ET OVINS","l":null,"v":22,"p":"BovinsVoie sous-cutanée.Une injection unique de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL du médicament vétérinaire/40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 7,5 mL au même site d’administration. PorcinsVoie intramusculaire.Une injection unique de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL du médicament vétérinaire /40 kg de poids vif) dans le cou.Pour le traitement des porcins pesant plus de 80 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 2 mL au même site d’administration. Pour les maladies respiratoires, il est recommandé de traiter les animaux dans les premiers stades de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques de pathologie respiratoire persistent ou s’aggravent, ou en cas de rechute, le traitement doit être changé en utilisant un autre antibiotique et poursuivi jusqu’à ce que les signes cliniques disparaissent. OvinsVoie intramusculaire.Une injection unique de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL du médicament vétérinaire /40 kg de poids vif) dans le cou. Pour assurer un dosage correct, le poids de l’animal doit être déterminé aussi précisément que possible. En cas d'utilisation fréquente du flacon, l'utilisation d'une aiguille de prélèvement ou d'une seringue multidose est recommandée pour éviter un perçage excessif du bouchon. Le bouchon peut être perforé en toute sécurité jusqu'à 125 fois dans le cas d'un flacon de 50 mL et 100 mL.Le bouchon peut être perforé en toute sécurité jusqu'à 250 fois dans le cas d'un flacon de 250 mL."},{"n":"G. PROMYCINE","l":30,"v":null,"p":"11,4 à 17,1 mg de benzylpénicilline et 16,4 à 24,6 mg de dihydrostreptomycine par kg de poids vif et par jour par voie intramusculaire ou sous-cutanée pendant 3 à 5 jours, soit 1 à 1,5 mL de suspension pour 10 kg de poids vif par voie intramusculaire ou sous-cutanée, correspondant à 10 mL de suspension pour 100 kg de poids vif chez les bovins, les ovins et les porcins adultes et à 1,50 mL pour 10 kg de poids vif chez les veaux, les agneaux et les porcelets.\\n\\nBien agiter le flacon pour homogénéiser la suspension avant l'emploi."},{"n":"GENABILINE 100 MG/ML SOLUTION INJECTABLE","l":0,"v":0,"p":"Voie intramusculaire ou intraveineuse selon l’espèce. Chez les jeunes bovins, les ovins, les caprins et les porcins :10 mg de menbutone par kg de poids vif par voie intramusculaire ou intraveineuse, correspondant à une injection de 1 mL de solution pour 10 kg de poids vif. Chez les bovins de plus de 6 mois :5 mg à 7,5 mg de menbutone par kg de poids vif par voie intraveineuse, correspondant à une injection de 1 mL de solution pour 15 à 20 kg de poids vif. Chez les chevaux :2,5 mg à 5 mg de menbutone par kg de poids vif par voie intraveineuse lente, correspondant à une injection de 1 mL de solution pour 20 à 40 kg de poids vif. À renouveler une fois si nécessaire au bout de 24 heures."},{"n":"GLUCAN","l":0,"v":0,"p":"Voie intraveineuse lente, intramusculaire et sous cutanée.\\n\\n12,51 à 25,03 mg de calcium et 26,47 à 52,94 mg d'hypophosphite de magnésium par kg de poids vif par administration, soit 0,5 mL à 1 mL par kg de poids vif par administration intraveineuse lente, intramusculaire, intra-péritonéale ou sous cutanée.\\n\\nL'administration peut être renouvelée, si nécessaire, toutes les 12 heures pendant un à deux jours."},{"n":"GLUCOSE OSALIA 5% SOLUTION POUR PERFUSION POUR BOVINS, CHEVAUX, PORCS, OVINS, CAPRINS, CHIENS ET CHATS","l":0,"v":0,"p":"Voie intraveineuse lente ou perfusion intraveineuse, intra-péritonéale ou sous-cutanée. La quantité de liquide à administrer sera fonction des déficits existants, des besoins d'entretien et des pertes continues estimés à partir des antécédents de l'animal, de l'examen clinique et des résultats biologiques.Chez toutes les espèces cibles, la dose maximale recommandée est de 50 mL de solution par kg de poids vif par jour. Par voie sous-cutanée, des doses réduites sont recommandées. Par perfusion, la vitesse d'administration doit être adaptée à chaque animal. L'objectif doit être de corriger environ la moitié du déficit calculé au cours des une à deux premières heures. En règle générale, un débit de perfusion maximum de 10 mL de solution par kg de poids vif par heure ne doit normalement pas être dépassé.Pendant la perfusion intraveineuse les animaux doivent être sous surveillance pour tout signe de surcharge liquidienne (principalement un signe d'oedème pulmonaire)."},{"n":"GLUCOSE/CHLORURE DE SODIUM OSALIA 25 MG/ML + 4,5 MG/ML, SOLUTION INJECTABLE POUR BOVINS, CHEVAUX, PORCINS, OVINS, CAPRINS, CHIENS ET CHATS","l":0,"v":0,"p":"Voie intraveineuse lente ou perfusion intraveineuse, intrapéritonéale ou sous-cutanée. La quantité de liquide à administrer sera fonction des déficits existants, des besoins d'entretien et des pertes continues estimés à partir des antécédents de l'animal, de l'examen clinique et des résultats biologiques. Par voie sous-cutanée, des doses réduites sont recommandées. Par perfusion, la vitesse d'administration doit être adaptée à chaque animal. L'objectif doit être de corriger environ la moitié du déficit calculé au cours des une à deux premières heures. En règle générale, un débit de perfusion maximum de 10 mL de solution par kg de poids vif par heure ne doit normalement pas être dépassé. Pendant la perfusion intraveineuse les animaux doivent être sous surveillance pour tout signe de surcharge liquidienne (principalement un signe d'oedème pulmonaire)."},{"n":"HEMOCED SOLUTION INJECTABLE","l":0,"v":1,"p":"Voies intraveineuse ou intramusculaire. 5 à 10 mg d'étamsylate par kg de poids vif et par jour pendant 1 à 3 jours, correspondant environ à : Bovins, équins adultes : 2 à 3 ampoules de 10 mLBovins, équins jeunes : 2 ampoules de 2 mLOvins, caprins : 3 ampoules de 2 mLPorcins : 2 ampoules de 2 mLCarnivores : 1 ampoule de 2 mL Renouveler si nécessaire."},{"n":"HEMOSILATE 125 MG/ML SOLUTION INJECTABLE","l":0,"v":1,"p":"Voie intraveineuse ou intramusculaire. 5 à 12,5 mg d'étamsylate/kg de poids vif ou corporel, correspondant à 0,04 à 0,1 mL/kg de poids vif ou corporel de médicament vétérinaire, selon la gravité de la procédure/de l'hémorragie. Le traitement est normalement administré jusqu'à ce que l'effet désiré soit atteint; il peut être fait sur un jour mais peut être répété pendant 2 à 3 jours supplémentaires afin d'obtenir le contrôle du saignement.Pour prévenir les saignements chirurgicaux, le médicament vétérinaire doit être administré au moins 30 minutes avant l’opération.Pour le traitement d'une hémorragie en cours, le médicament vétérinaire peut être administré toutes les 6 heures jusqu'à l'arrêt complet du saignement. En cas de rupture de gros vaisseaux sanguins, il est nécessaire de ligaturer les vaisseaux concernés avant d'administrer ce médicament vétérinaire. Ne pas administrer plus de 20 mL de ce médicament vétérinaire en un seul site d’injection. Chaque injection doit être faite sur un site différent.Le bouchon ne doit pas être perforé plus de 25 fois."},{"n":"HIBITANE IRRIGATION SOLUTION POUR APPLICATION CUTANEE","l":0,"v":0,"p":"Voie cutanée.Toutes espèces. Avant de réaliser les applications locales :Diluer extemporanément la solution concentrée pour obtenir une solution à 0,02 % de digluconate de chlorhexidine (1/5000), soit 1 mL de solution concentrée pour 1 litre d'eau distillée stérile ou de soluté isotonique (0,9 %) de chlorure de sodium."},{"n":"HIDROCOL 4 000 000 UI/ML SOLUTION POUR ADMINISTRATION DANS L'EAU DE BOISSON OU LE LAIT","l":null,"v":1,"p":"Voie orale.Dans l'eau/le lait. Veaux, agneaux et porcins : 100 000 UI de sulfate de colistine par kg de poids vif par jour pendant 3 à 5 jours consécutifs dans l'eau de boisson ou le lait (de remplacement) chez les veaux, équivalent à 0,25 mL de solution à diluer par 10 kg de poids vif par jour pendant 3 à 5 jours. Poules et dindes : 75 000 UI de sulfate de colistine par kg de poids vif par jour pendant 3 à 5 jours consécutifs dans l'eau de boisson, équivalent à 18,75 mL de solution à diluer par tonne de poids vif par jour pendant 3 à 5 jours. La durée du traitement doit être limitée au temps minimal nécessaire pour le traitement de la maladie.L'eau médicamentée qui n'est pas consommée dans les 24 heures doit être jetée.Le lait médicamenté qui n'est pas consommé dans les 3 heures doit être jeté. Administration orale directe aux animauxLa dose quotidienne recommandée doit être divisée en deux si le produit doit être administré directement dans la bouche de l’animal.Avant de procéder à l'administration orale, le produit doit être dilué avec un volume d'eau de boisson équivalent à 2 fois le volume de produit concentré à administrer. Administration dans l'eau de boissonLa consommation d’eau médicamentée dépend de l’état clinique des animaux.Afin d’obtenir un dosage correct, la concentration de sulfate de colistine doit être ajustée en conséquence. Le poids vif moyen à traiter ainsi que la consommation d'eau quotidienne moyenne doivent être soigneusement calculés avant chaque traitement.La consommation d'eau doit être contrôlée à intervalles fréquents. L'eau médicamentée doit être préparée chaque jour, immédiatement avant son administration.L'eau médicamentée doit être la seule source d'eau de boisson pour les animaux pendant toute la durée du traitement. La dose journalière exacte sera calculée en appliquant la formule suivante : \\n1 mL de produit par kg de poids vifet par jourxPoids moyen (kg) mL de produit par litre d’eau de boisson\\n-------------------------------------------------------------------------------------------------------=\\nConsommation journalière moyenne d’eau (L/animal)par litre d’eau de boisson Administration sans recours à une pompe doseuse :Le traitement est distribué via un réservoir pour une période de 24 heures pendant 3 à 5 jours consécutifs.Le produit est ajouté à une quantité d'eau de boisson correspondant au volume d'eau consommé par les animaux pendant la durée du traitement (24 heures) pour atteindre une dose de 100 000 UI de sulfate de colistine par kg de poids vif chez les porcs, les agneaux et les veaux et une dose de 75 000 UI par kg de poids vif chez les poules et les dindes. Administration avec pompe doseuse :Le traitement est distribué pour une période de 24 heures pendant 3 à 5 jours consécutifs.Une pompe doseuse est utilisée pour diluer une solution mère à une concentration déterminée dans l'eau de boisson."},{"n":"HUVEXXIN 100 MG/ML SOLUTION INJECTABLE POUR  BOVINS PORCINS ET OVINS","l":null,"v":22,"p":"Bovins Voie sous-cutanée.Une injection unique par voie sous-cutanée de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 7,5 mL au même site d’administration. Porcins Voie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Pour le traitement de porcins pesant plus de 80 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 2 mL au même site d’administration. Pour les maladies respiratoires, il est recommandé de traiter les animaux en phase précoce de maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques de pathologie respiratoire persistent ou augmentent, ou en cas de rechute, le traitement doit être changé en utilisant un autre antibiotique et poursuivi jusqu’à ce que les signes cliniques disparaissent. OvinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible. Le bouchon peut être perforé en toute sécurité jusqu'à 15 fois. Afin d'éviter un percement excessif du bouchon, utiliser un équipement adapté pour le dosage multiple."},{"n":"INSECINOR 10 MG/ML SOLUTION POUR SPOT-ON POUR BOVINS ET OVINS","l":0,"v":35,"p":"Application en spot-on.Pour un usage externe. Posologie :Bovins : 100 mg de deltaméthrine par animal, soit 10 mL de médicament vétérinaire.Ovins : 50 mg de deltaméthrine par animal, soit 5 mL de médicament vétérinaire.Agneaux (en dessous de 10 kg de poids vif ou d'un mois d'âge) : 25 mg de deltaméthrine par animal, soit 2,5 mL de médicament vétérinaire. Administration : appliquer une seule dose de médicament vétérinaire à l'aide du dispositif d'application « Presser et verser » spécialement conçu ou l'applicateur Spot-On en un seul point sur la ligne médiane du dos au niveau des épaules. En cas de myiase à calliphoridés chez les ovins, voir la procédure particulière décrite ci-dessous. Poux chez les bovins : une application suffit généralement pour éradiquer tous les poux. Leur éradication complète peut prendre quatre à cinq semaines, période pendant laquelle les lentes éclosent et les poux sont tués. Quelques poux peuvent survivre sur une petite minorité d'animaux. Mouches chez les bovins : traitement et prévention des infestations par les mouches piqueuses et non piqueuses. Dans les régions à forte prédominance de mouches des cornes, le traitement et la prévention des infestations pourront prendre quatre à huit semaines. Le traitement contre les mouches ne devra pas être répété avant quatre semaines. Tiques chez les ovins : l'application du produit entre les épaules constitue un moyen efficace de traitement et de prévention des infestations par les tiques chez les animaux de tout âge. Le produit sera efficace jusqu'à six semaines après son application. Mélophages et poux chez les ovins : l'application du produit entre les épaules chez les ovins à toison courte ou longue réduira l'incidence des infestations par les poux broyeurs ou mélophages sur une période de quatre à six semaines.Il est conseillé de :- appliquer le produit juste après la tonte (sur toison courte) ;- garder les moutons traités à l'écart des moutons non traités pour éviter toute ré-infestation. Remarque : pour le traitement et la prévention des infestations par les tiques, les mélophages et les poux chez les ovins, il conviendra de dégager la zone de peau à traiter en séparant les poils de la toison pour y appliquer la solution. Cas établis de myiase à calliphoridés chez les ovins : appliquer le produit directement sur la zone infectée par les asticots dès que la myiase est constatée. Une application suffit pour tuer rapidement les larves de calliphoridés. En cas de lésions plus prononcées, il est conseillé de tondre la laine tachée préalablement au traitement. Poux et tiques chez les agneaux : l'application du produit entre les épaules constitue un moyen efficace de traitement et de prévention des infestations par les tiques jusqu'à six semaines et réduit l'incidence de poux broyeurs pendant quatre à six semaines."},{"n":"INTERFLOX-100, 100 MG/ML SOLUTION INJECTABLE POUR BOVINS OVINS CAPRINS ET PORCINS","l":4,"v":13,"p":"Bovins : voie intraveineuse, sous-cutanéeOvins : voie sous-cutanéePorcins : voie sous-cutanée, intramusculaire Les injections répétées doivent être faites à des sites différents.Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible. Chez les bovins5 mg d'enrofloxacine par kg de poids vif et par jour, soit 1 mL de solution pour 20 kg de poids vif et par jour pendant 3 à 5 jours. Traitement des arthrites aiguës dues à Mycoplasma bovis sensibles à l'enrofloxacine chez les bovins de moins de 2 ans : 5 mg d'enrofloxacine par kg de poids vif et par jour, soit 1 mL de solution pour 20 kg de poids vif et par jour, pendant 5 jours. Le médicament vétérinaire peut être administré par voie intraveineuse lente ou sous cutanée. Traitement des mammites aiguës dues à Escherichia coli : 5 mg d'enrofloxacine par kg de poids vif et par jour, soit 1 mL de solution pour 20 kg de poids vif et par jour, par voie intraveineuse lente, pendant 2 jours consécutifs.La deuxième injection peut être administrée par voie sous-cutanée. Dans ce cas, le temps d'attente par voie sous-cutanée s'applique. Ne pas injecter plus de 10 mL par site d'injection sous-cutanée. Chez les ovins et les caprins5 mg d'enrofloxacine par kg de poids vif, soit 1 mL pour 20 kg de poids vif, par voie sous-cutanée, une fois par jour, pendant 3 jours.Ne pas injecter plus de 6 mL par site d'injection sous-cutanée. Chez les porcins2,5 mg d'enrofloxacine par kg de poids vif soit 0,5 mL pour 20 kg de poids vif, par jour, par voie intramusculaire pendant 3 jours. Traitement des infections digestives ou septicémies causés par Escherichia coli : 5 mg d'enrofloxacine par kg de poids vif, soit 1 mL pour 20 kg de poids vif, par voie intramusculaire, une fois par jour pendant 3 jours.Chez les porcins, l'administration doit se faire dans le cou, à la base de l'oreille.Ne pas administrer plus de 3 mL par site d'injection intramusculaire. Le bouchon en caoutchouc peut être percé en toute sécurité jusqu'à 15 fois."},{"n":"INTRAMICINE","l":7,"v":30,"p":"Voie intramusculaire ou sous-cutanée. Chez les bovins, les ovins, les caprins et les porcins :11,4 à 17,1 mg de benzylpénicilline et 20 à 30 mg de dihydrostreptomycine par kg de poids vif et par jour par voie intramusculaire ou sous-cutanée pendant 3 à 5 jours, soit 1 à 1,5 mL de suspension pour 10 kg de poids vif, correspondant à 10 mL de suspension pour 100 kg de poids vif chez les bovins, les ovins, les caprins et les porcins adultes et à 1,50 mL pour 10 kg de poids vif chez les veaux, les agneaux, les chevreaux et les porcelets. Chez les chiens et les chats :22,8 mg de benzylpénicilline et 40 mg de dihydrostreptomycine par kg de poids corporel et par jour par voie intramusculaire ou sous-cutanée pendant 3 à 5 jours, soit 2 mL de suspension pour 10 kg de poids corporel. Bien agiter le flacon pour homogénéiser la suspension avant l'emploi. Le flacon peut être ponctionné jusqu'à 50 fois."},{"n":"IODURE VETOQUINOL SOLUTION INJECTABLE","l":0,"v":0,"p":"Voie intraveineuse lente. 80 mg d'iodure de sodium par kg de poids vif correspondant à 50 mL de solution pour 100 kg de poids vif par voie intraveineuse stricte. Répéter l'injection une semaine plus tard si nécessaire."},{"n":"IVOMEC SOLUTION INJECTABLE POUR OVINS","l":21,"v":28,"p":"Voie sous-cutanée. 0,2 mg d'ivermectine par kg de poids vif, soit 1 mL de solution pour 50 kg de poids vif, en une administration unique, dans un pli de peau, en arrière de l'épaule.Pour le traitement de l'infestation à Psoroptis ovis (gale du mouton), deux injections à 7 jours d'intervalle sont nécessaires pour enrayer les signes cliniques dus au psoropte et éliminer les parasites vivants."},{"n":"K-VET OTC 500 MG/G POUDRE POUR ADMINISTRATION DANS L’EAU DE BOISSON LE LAIT","l":null,"v":7,"p":"Voie orale. La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en oxytétracycline doit être ajustée en conséquence. Veaux, agneaux, chevreaux et porcins : 20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans la buvée, soit 400 mg de médicament vétérinaire pour 10 kg de poids vif par jour en 2 prises dans l'eau de boisson, le lait ou l’aliment d’allaitement. Volailles et lapins : 20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans l'eau de boisson.La concentration du médicament vétérinaire à distribuer dans l'eau de boisson est reprise dans le tableau suivant, pour une consommation d'eau estimée : \\nEspècesmg d'oxytétracycline/ kg de poids vif/ jourmg de médicament vétérinaire / 10 kg de poids vif / jourEstimation de l'eau consommée (L) pour 10 kg de poids vif)mg de médicament vétérinaire / L d'eau de boisson\\nLapins20 mg400 mg1,8 L220 mg / L\\nPoulets20 mg400 mg2 L200 mg / L Sur la base de la posologie recommandée, du nombre et du poids des animaux à traiter, la concentration journalière de médicament vétérinaire doit être calculée à l'aide de la formule suivante : \\nmg de médicament vétérinaire/ kg de poids vif / jourxPoids moyen (kg) des animaux à traiter mg de médicament vétérinaire par litre d'eau de boisson\\n______________________________________________________________=\\nConsommation moyenne journalière d'eau (L/animal) Afin d'assurer une posologie correcte et d'éviter un sous-dosage, le poids des animaux doit être déterminé aussi précisément que possible. Conseils pour une administration correcte :Il est recommandé d'utiliser un matériel de pesée correctement étalonné en cas de fractionnement des conditionnements. Dans l’eau de boisson : pour obtenir une solubilité maximale du médicament vétérinaire, il est recommandé de préparer une pré-solution concentrée contenant 400 grammes de médicament vétérinaire par litre d'eau de boisson puis de la diluer, si nécessaire, à la concentration thérapeutique préconisée.Il est également possible de distribuer la solution concentrée en utilisant une pompe doseuse.La solubilité du médicament vétérinaire a été étudiée à la concentration maximale de 400 g de médicament vétérinaire / L d’eau à 5°C et 20°C. Pour les solutions mères et lors de l'utilisation d'un doseur, veillez à ne pas dépasser la solubilité maximale pouvant être atteinte dans les conditions données. Réglez les paramètres de débit de la pompe doseuse en fonction de la concentration de la solution mère et de la consommation d'eau des animaux à traiter. Dans le lait ou l’aliment d’allaitement : le médicament vétérinaire doit d’abord être dissout dans l’eau de boisson à une concentration de 13 g/L. Cette solution est ensuite diluée dans le lait à 40°C ou dans l’aliment d’allaitement à 40°C, pour obtenir la concentration thérapeutique.Les durées de conservation après reconstitution du produit varient selon le liquide utilisé, eau de boisson, lait ou aliment d’allaitement. Voir la rubrique « Durée de conservation ». La quantité journalière de poudre doit être ajoutée au liquide de telle sorte que le médicament soit entièrement consommé en 24 heures pour l’eau de boisson, 6 heures pour le lait et 1 heure pour l’aliment d’allaitement."},{"n":"K-VET OXYTETRACYCLINE 50 % POUDRE","l":null,"v":7,"p":"Veaux, agneaux et porcins :20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans la buvée, soit 400 mg de poudre pour solution buvable pour 10 kg de poids vif par jour en 2 prises dans le lait, l'aliment liquide ou l'eau de boisson. Volailles et lapins :20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans l'eau de boisson, soit environ 400 mg de poudre pour solution buvable par litre d'eau de boisson. La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en oxytétracycline doit être ajustée en conséquence."},{"n":"KAOPECTATE SUSPENSION BUVABLE POUR EQUINS BOVINS OVINS PORCINS CHIENS ET CHATS","l":0,"v":0,"p":"Voie orale. Poulains et veaux : 60 mLAgneaux : 10 à 20 mLPorcelets : 3 à 5 mLChiens : 5 à 30 mLChats : 3 à 5 mL Ces doses seront administrées 2 fois par jour et le traitement sera poursuivi pendant 3 à 5 jours."},{"n":"KETABEL 100 MG/ML SOLUTION INJECTABLE","l":0,"v":1,"p":"Administration par voie intramusculaire et intraveineuse lente.Chez les animaux de laboratoire, une utilisation par voie intrapéritonéale est également possible. La kétamine doit être associée à un sédatif. Une dose de 10 mg de kétamine par kg de poids vif/corporel correspond à 0,1 mL de solution à 100 mg/mL par kg de poids vif/corporel.En cas d’injection intramusculaire, le volume maximal par site d’injection est de 20 mL.Les effets de la kétamine peuvent varier de façon importante d’un individu à l’autre. Par conséquent, la posologie utilisée doit être définie au cas par cas chez chaque animal, en fonction de facteurs tels que l’âge et l’état de santé ainsi que la profondeur et la durée d’anesthésie requises. Avant d’administrer la kétamine, il faut s’assurer que l’animal est correctement sédaté.Les conseils de dosage suivants présentent des associations possibles avec la kétamine. L'utilisation concomitante d'autres pré-anesthésiques, anesthésiques ou sédatifs doit être soumise à une évaluation du rapport bénéfice / risque menée par le vétérinaire responsable. ChiensEn association avec la xylazine ou la médétomidine De la xylazine (1,1 mg/kg IM) ou de la médétomidine (10 à 30 µg/kg IM) peuvent être utilisées avec la kétamine (5 à 10 mg/kg, soit 0,5 à 1 mL/10 kg IM) pour une courte anesthésie de 25 à 40 min. La dose de kétamine peut être ajustée en fonction de la durée souhaitée de l’intervention.En cas d’administration par voie intraveineuse, la dose doit être réduite à 30 - 50 % par rapport à la dose recommandée par voie intramusculaire. ChatsEn association avec la xylazine La xylazine (0,5 à 1,1 mg/kg IM), avec ou sans atropine, doit être administrée 20 min avant la kétamine (11 à 22 mg/kg IM, soit 0,11 à 0,22 mL/kg IM). En association avec la médétomidine De la médétomidine (10 à 80 µg/kg IM) peut être associée à la kétamine (2,5 à 7,5 mg/kg IM, soit 0,025 à 0,075 mL/kg IM). Plus la dose de médétomidine est importante, plus la dose de kétamine devra être réduite. ChevauxEn association avec la détomidine Détomidine à 20 µg/kg IV, suivie après 5 minutes de 2,2 mg/kg de kétamine en injection IV rapide (2,2 mL/100 kg IV).L’apparition de l’effet est progressive, l’animal mettant environ 1 minute pour passer en décubitus, et l’effet anesthésique dure environ 10 à 15 minutes. En association avec la xylazine Xylazine à 1,1 mg/kg IV, suivie de 2,2 mg/kg IV de kétamine (2,2 mL/100 kg IV).L’apparition de l’effet est progressive (1 minute environ) et la durée de l’effet anesthésique est variable et comprise entre 10 et 30 minutes mais généralement inférieure à 20 minutes.Après l’injection, le cheval se couche spontanément, sans avoir besoin d’assistance. Si un relâchement musculaire distinct est nécessaire en parallèle, des myorelaxants peuvent être administrés à l’animal couché, jusqu’à ce qu’il montre les premiers symptômes de relâchement. BovinsEn association avec la xylazine Administration par voie intraveineuse :Le bovin adulte peut être anesthésié pendant de courtes périodes à l’aide de xylazine (0,1 mg/kg IV) suivie de kétamine (2 mg/kg IV, soit 2 mL/100 kg IV). L’anesthésie dure environ 30 min, mais elle peut être prolongée de 15 min par une administration supplémentaire de kétamine (0,75 à 1,25 mg/kg IV, soit 0,75 à 1,25 mL/100 kg IV).Administration par voie intramusculaire :Les doses de kétamine et de xylazine doivent être doublées en cas d’administration intramusculaire. Ovins, caprinsAdministration par voie intraveineuse :Kétamine à la dose de 0,5 à 22 mg/kg IV, soit 0,05 à 2,2 mL/10 kg IV, selon le sédatif utilisé.Administration par voie intramusculaire :Kétamine à la dose de 10 à 22 mg/kg IM, soit 1,0 à 2,2 mL/10 kg IM, selon le sédatif utilisé. PorcinsEn association avec l’azapérone : Kétamine à 15-20 mg/kg IM (1,5-2 mL/10 kg) et 2 mg/kg d’azapérone IM.Chez les porcs âgés de 4 à 5 mois, l’apparition de l’effet anesthésique prend en moyenne 29 minutes et la durée de l’effet s’élève à 27 minutes environ après…"},{"n":"KETEXX 100 MG/ML SOLUTION INJECTABLE","l":0,"v":1,"p":"\\nChiens, chats, bovins, chevaux :voie intraveineuse lente et voie intramusculaire\\nCobayes, hamsters, lapins de compagnie, rats et souris :voie intrapéritonéale, voie intraveineuse lente et voie intramusculaire\\nOvins et caprins :voie intraveineuse lente La kétamine doit être associée à un sédatif.Une dose de 10 mg de kétamine par kg de poids vif/corporel correspond à 0,1 mL de médicament vétérinaire par kg de poids vif/corporel.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible.Avant d'administrer la kétamine, il convient de s'assurer que l'animal est correctement sédaté. Lors d'injection intramusculaire chez les bovins et les chevaux, le volume maximal par site d'injection est de 20 mL.Les effets de la kétamine peuvent varier de façon importante d'un individu à l'autre. Par conséquent, la posologie administrée doit être adaptée à chaque animal, en fonction de facteurs tels que l’âge, l’état de santé, ainsi que la profondeur et la durée de l’anesthésie requise. Les conseils de dosage suivants proposent des associations possibles avec la kétamine. L’utilisation concomitante d’autres pré-anesthésiques, anesthésiques ou sédatifs doit être soumise à une évaluation du rapport bénéfice/risque établie par le vétérinaire responsable. ChiensEn association avec la xylazine ou la médétomidine :Voie intramusculaire :La xylazine (1,1 mg/kg IM) ou la médétomidine (10 à 30 µg/kg IM) peuvent être utilisées avec la kétamine (5 à 10 mg/kg soit 0,5 à 1 mL/10 kg IM) pour une anesthésie de courte durée de 25 à 40 minutes. La dose de kétamine peut être ajustée en fonction de la durée souhaitée de l'intervention.Voie intraveineuse :En cas d’utilisation par voie intraveineuse, la dose doit être réduite à 30 - 50 % de la dose recommandée par voie intramusculaire. ChatsEn association avec la xylazine :La xylazine (0,5 à 1,1 mg/kg IM) avec ou sans atropine est administrée 20 minutes avant la kétamine (11 à 22 mg/kg IM, soit 0,11 à 0,22 mL/kg IM). En association avec la médétomidine :La médétomidine (10 à 80 µg/kg IM) peut être associée à la kétamine (2,5 à 7,5 mg/kg IM, soit 0,025 à 0,075 mL/kg IM). Plus la dose de médétomidine est importante plus la dose de kétamine devra être réduite. ChevauxEn association avec la détomidine :Détomidine à 20 µg/kg IV, suivie après 5 minutes de 2,2 mg/kg de kétamine en injection IV rapide (2,2 mL/100 kg IV).L'apparition de l'effet est progressive, l'animal mettant environ 1 minute pour passer en décubitus, et l’effet anesthésique dure environ 10 à 15 minutes. En association avec la xylazine :Xylazine à 1,1 mg/kg IV, suivie de 2,2 mg/kg de kétamine par voie IV (2,2 mL/100 kg IV).L'apparition de l'effet est progressive, 1 minute environ, et la durée de l’effet anesthésique est variable et comprise entre 10 et 30 minutes, mais généralement inférieure à 20 minutes.Après l'injection, le cheval se couche spontanément sans avoir besoin d'assistance. Si une relaxation musculaire distincte est nécessaire en parallèle, des myorelaxants peuvent être administrés à l’animal couché, jusqu’à ce qu'il présente les premiers symptômes de relaxation. BovinsEn association avec la xylazine :Voie intraveineuse :Le bovin adulte peut être anesthésié pendant de courtes périodes à l'aide de xylazine (0,1 mg/kg IV) suivie de kétamine (2 mg/kg IV, soit 2 mL/100 kg IV). L’anesthésie dure environ 30 minutes, mais elle peut être prolongée de 15 minutes avec un supplément de kétamine (0,75 à 1,25 mg/kg IV, soit 0,75 à 1,25 mL/100 kg IV).Voie intramusculaire :Les doses de kétamine et de xylazine doivent être doublées en cas d’administration intramusculaire. Ovins et caprinsVoie intraveineuse :Kétamine à la dose de 0,5 à 7 mg/kg IV, soit 0,05 à 0,7 mL/10 kg IV, selon le sédatif utilisé. Lapins de compagnie et rongeurs En association avec la xylazine : Lapins de compagnie : xylazine (5-10 mg/kg IM) + kétamine (35-50 mg/kg IM, soit 0,35 à 0,50 mL/kg IM).Rats : xylazine (5-10 mg/kg IP, IM) +…"},{"n":"KYNOSELEN SOLUTION INJECTABLE","l":null,"v":4,"p":"Voie intramusculaire, intraveineuse et sous-cutanée. Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. Prévention : 0,044 mg de sélénium par kg de poids vif, par voie intramusculaire, voie sous-cutanée ou voie intraveineuse lente.Soit les doses suivantes en une administration unique :- Veaux : 2 mL/10 kg- Agneaux : 2 mL/10 kg- Porcelets : 2 mL/10 kg- Chiens et chats : 2 mL/10 kg On traitera préventivement les mères un mois avant la mise bas et les jeunes à la naissance ou dans d'autres circonstances. Traitement : Chez les veaux, les agneaux, les porcelets, les chiens et les chats, les doses sont identiques à celles indiquées ci-dessus, mais à administrer pendant 3 jours consécutifs et à renouveler si nécessaire 8 à 10 jours plus tard. Le bouchon ne doit pas être percé plus de 25 fois."},{"n":"LEVAMISOLE 3,75 % BUVABLE","l":null,"v":3,"p":"Voie orale. Administration dans l’eau de boisson. Chez les bovins et les ovins :7,5 mg de lévamisole par kg de poids vif, en administration unique sans dépasser la dose totale par animal de 3,75 g chez les bovins et 0,375 g chez les ovins, soit 0,24 mL de médicament vétérinaire par kg de poids vif sans dépasser la dose de 100 mL chez les bovins et de 10 mL chez les ovins. Chez les porcins :7,5 mg de lévamisole par kg de poids vif, en administration unique sans dépasser la dose totale par animal de 0,75 g, soit 0,24 mL de solution par kg sans dépasser la dose de 20 mL par animal. Chez les volailles :20 mg de lévamisole par kg de poids vif, soit environ 5 mL de médicament vétérinaire par litre d'eau de boisson.La consommation d'eau de boisson médicamenteuse consommée par les volailles dépend de l’état clinique des animaux. Afin d'obtenir la posologie appropriée, il peut être nécessaire d’ajuster en conséquence la concentration en lévamisole. Utiliser un pistolet doseur propre et correctement étalonné."},{"n":"LEVAMISOLE 5 % VIRBAC","l":null,"v":3,"p":"Chez les bovins et les ovins :\\n7,5 mg de lévamisole par kg de poids vif, en administration unique par voie orale sans dépasser la dose totale par animal de 3,75 g chez les bovins et 0,375 g chez les ovins, soit 0,15 ml de solution par kg de poids vif sans dépasser la dose de 75 ml chez les bovins et de 7,5 ml chez les ovins.\\n \\nChez les porcins :\\n7,5 mg de lévamisole par kg de poids vif, en administration unique par voie orale sans dépasser la dose totale par animal de 0,75 g , soit 0,15 ml de solution par kg sans dépasser la dose de 15 ml par animal.\\n \\nChez les volailles :\\n20 mg de lévamisole par kg de poids vif, soit environ 4 ml de solution par litre d'eau de boisson\\n \\nLa quantité d'eau de boisson médicamenteuse consommée par les volailles dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en lévamisole doit être ajustée en conséquence.\\n \\nUtiliser un pistolet doseur propre et correctement étalonné."},{"n":"LEVASOLE 20","l":null,"v":3,"p":"Chez les bovins et les ovins :\\n7,5 mg de lévamisole par kg de poids vif, en administration unique par voie orale sans dépasser la dose totale par animal de 3,75 g chez les bovins et 0,375 g chez les ovins, soit 0,37 g de poudre pour 10 kg de poids vif dilué dans un peu d'eau sans dépasser la dose de 18,75 g chez les bovins et de 1,87 g chez les ovins.\\nChez les porcins :\\n7,5 mg de lévamisole par kg de poids vif, en administration unique par voie orale sans dépasser la dose totale par animal de 0,75 g, soit 0,37 g de poudre par 10kg dilué dans un peu d'eau ou la soupe dilué sans dépasser la dose de 3,75 g par animal.\\n\\nChez les volailles :\\n20 mg de lévamisole par kg de poids vif, soit environ 1 g de poudre par litre d'eau de boisson.\\nLa quantité d'eau de boisson médicamenteuse consommée par les volailles dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en lévamisole doit être ajustée en conséquence.\\n\\nUtiliser un pistolet doseur propre et correctement étalonné."},{"n":"LEVISOLE INJECTABLE","l":null,"v":3,"p":"Chez les bovins :\\n7,5 mg de lévamisole par kg de poids vif, en administration unique par voie intramusculaire profonde, soit 0,75 mL pour 10 kg de poids vif sans dépasser 37,5 mL par animal.\\n \\nChez les ovins :\\n7,5 mg de lévamisole par kg de poids vif, en administration unique par voie intramusculaire profonde, soit 0,75 mL pour 10 kg de poids vif sans dépasser 3,75 mL par animal."},{"n":"LINCO-SPECTIN SOLUTION INJECTABLE POUR BOVINS (VEAUX) OVINS CAPRINS PORCINS VOLAILLES CHATS ET CHIENS","l":null,"v":14,"p":"Voie d'administration : voie intramusculaire ou voie sous-cutanée.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. Veaux :5 mg de lincomycine et 10 mg de spectinomycine par kg de poids vif (correspondant à 1 mL de solution pour 10 kg de poids vif) par voie intramusculaire. Deux injections à 12 heures d'intervalle le premier jour de traitement, puis une injection par jour pendant 3 à 5 jours. Ovins, caprins :5 mg de lincomycine et 10 mg de spectinomycine par kg de poids vif (correspondant à 1 mL de solution pour 10 kg de poids vif) par voie intramusculaire, une fois par jour, pendant 3 à 5 jours. Porcins :5 mg de lincomycine et 10 mg de spectinomycine par kg de poids vif (correspondant à 1 mL de solution pour 10 kg de poids vif) par voie intramusculaire, à renouveler, si nécessaire, 24 heures plus tard et pendant 5 jours maximum. Volailles :10 mg de lincomycine et 20 mg de spectinomycine par kg de poids vif (correspondant à 1 mL de solution pour 5 kg de poids vif) par voie sous-cutanée, une fois par jour, pendant 3 jours. Chiens et chats :10 mg de lincomycine et 20 mg de spectinomycine par kg de poids corporel (correspondant à 1 mL de solution pour 5 kg de poids corporel par voie intramusculaire. Le traitement peut être renouvelé entre 12 et 24 heures d'intervalle pendant 3 à 7 jours selon la réponse clinique."},{"n":"LONGAMOX SUSPENSION INJECTABLE","l":5,"v":63,"p":"Voie intramusculaire. Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. 15 mg d'amoxicilline par kg de poids vif deux fois à 48 heures d'intervalle soit 1 mL de suspension pour 10 kg de poids vif deux fois à 48 heures d'intervalle.Bien agiter le flacon pour homogénéiser la suspension avant utilisation."},{"n":"LONGICINE SOLUTION INJECTABLE POUR BOVINS OVINS ET PORCINS","l":7,"v":21,"p":"Bovins, ovins et porcins (adultes) : voie intramusculaire.Porcelets : voie sous-cutanée. 20 mg d'oxytétracycline / kg de poids vif en une injection unique, soit 1 mL de solution injectable pour 10 kg de poids vif. Si des signes cliniques de maladie persistent 72 heures après la première administration, une deuxième administration de 20 mg d'oxytétracycline par kg peut être effectuée.Ne pas injecter plus de 20 mL de solution par site d'injection."},{"n":"MACROSYN 100 MG/ML SOLUTION INJECTABLE POUR BOVINS, PORCINS ET OVINS","l":null,"v":22,"p":"BovinsVoie sous-cutanée.Une injection unique par voie sous-cutanée de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif). Pour le traitement des bovins dont le poids vif dépasse 300 kg, diviser la dose de manière à ne pas injecter plus de 7,5 mL dans un même site. PorcinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Pour le traitement des porcins pesant plus de 80 kg, diviser la dose de manière à ne pas injecter plus de 2 mL au même site d’administration. Pour les maladies respiratoires, il est recommandé de traiter les animaux dans les premiers stades de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques de la pathologie respiratoire persistent ou s’aggravent, ou en cas de rechute, le traitement doit être changé en utilisant un autre antibiotique et poursuivi jusqu’à ce que les signes cliniques disparaissent. OvinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Pour assurer un dosage correct, le poids de l’animal doit être déterminé aussi précisément que possible pour éviter un sous-dosage. Lorsqu’un groupe d’animaux est traité en une fois, il est recommandé d'utiliser une aiguille de prélèvement ou une seringue automatique afin de limiter le nombre de perforations du bouchon. Les bouchons de 20 mm peuvent être percés en toute sécurité jusqu’à 30 fois, et les bouchons de 30 mm jusqu’à 50 fois."},{"n":"MAGNESIO CALCIQUE SOLUTION INJECTABLE","l":0,"v":null,"p":"Voie intraveineuse, intramusculaire, intra-péritonéale et sous-cutanée.15,38 à 30,76 mg de calcium, 3,58 à 7,17 mg de magnésium et 24 à 48 mg de glucose par kg de poids vif par administration, soit 0,5 mL à 1 mL de médicament vétérinaire par kg de poids vif par administration intraveineuse lente, intramusculaire, intra-péritonéale ou sous-cutanée.L'administration peut être renouvelée, si nécessaire, toutes les 12 heures pendant un à deux jours."},{"n":"MECTAJECT 10 MG/ML SOLUTION INJECTABLE POUR BOVINS ET OVINS","l":60,"v":49,"p":"Une seule administration de 0,5 mL pour 25 kg de poids corporel de bovins ou d’ovins, ce qui correspond à 200 µg d’ivermectine par kg de poids corporel. Pour les jeunes agneaux pesant moins de 20 kg, administrer 0,1 mL par 5 kg. Pour ces agneaux, il est recommandé d’utiliser une seringue permettant de délivrer avec précision une quantité aussi faible que 0,1 mL. L’administration doit se faire par injection sous-cutanée sous un pli de peau lâche, à l’avant ou en arrière de l’épaule chez les bovins, ou au niveau du cou chez les ovins. Le volume administré par site d’injection ne doit pas dépasser 10 mL. Un sous-dosage peut entraîner une utilisation inefficace et favoriser le développement d’une résistance. Pour garantir un dosage correct, le poids corporel doit être déterminé aussi précisément que possible. Si les animaux doivent être traités collectivement, des groupes raisonnablement homogènes doivent être constitués, et tous les animaux d’un groupe doivent recevoir la dose correspondant à l’animal le plus lourd. La précision du dispositif de dosage doit être soigneusement vérifiée. Le moment du traitement doit être basé sur des facteurs épidémiologiques et doit être adapté à chaque exploitation. Un programme posologique doit être établi par le vétérinaire."},{"n":"MELOVINE","l":0,"v":0,"p":"Voie sous-cutanée. 18 mg de mélatonine par brebis ou agnelle correspondant à un implant par animal. Administrer à la base de l'oreille à l'aide d'un pistolet spécial muni d'une aiguille et d'un guide dans lequel est glissée la cartouche de 25 implants. Introduire l'aiguille dans le territoire sous-cutané de la base de l'oreille. Appuyer sur la gâchette du pistolet pour libérer un implant. Le relâchement de la gâchette entraîne l'avancement d'un cran de la cartouche dans le guide du pistolet pour préparer la pose d'un implant sur l'animal suivant. Schéma de traitement sans synchronisation (lutte naturelle) : Jour 1 (30 semaines avant la date prévue de l'agnelage) : isoler les brebis des béliers, si elles ne sont pas normalement tenues isolées. Jour 7 : administrer l'implant. Jour 42 (30 à 40 jours après l'administration de l'implant) : introduire les béliers. L'activité sexuelle peut ne pas commencer immédiatement mais après un délai de 14 à 21 jours.L'introduction de béliers vasectomisés pendant les 14 premiers jours permet d'obtenir une période d'agnelage plus brève. Le pic d'activité sexuelle se produit environ 25 à 35 jours après l'introduction des béliers. Schéma de traitement avec synchronisation (insémination artificielle / lutte naturelle) : Le traitement avec ce médicament vétérinaire peut être couplé à un traitement de synchronisation des chaleurs à l'aide d'éponges vaginales à base d'acétate de fluorogestone et d'une administration de PMSG selon le schéma suivant : Jour 1 : pose d'un implant. Jour 18 à jour 28 : pose d'une éponge vaginale à base d'acétate de fluorogestone. Jour 30 à jour 40 : retrait de l'éponge et administration intramusculaire de PMSG (selon les schémas d'utilisation préconisés pour les médicaments vétérinaires à base d'acétate de fluorogestone et de PMSG). L'insémination artificielle doit être pratiquée 55 ± 1 heures après retrait de l'éponge."},{"n":"MENBUTIL 100 MG/ML SOLUTION INJECTABLE POUR BOVINS, PORCINS, CHEVAUX, OVINS ET CAPRINS","l":0,"v":0,"p":"Voie intramusculaire, voie intraveineuse. Veaux (jusqu'à 6 mois), ovins, caprins et porcins : voie intramusculaire profonde ou voie intraveineuse lenteBovins, chevaux : voie intraveineuse lente Veaux (jusqu'à 6 mois), ovins, caprins et porcins :10 mg de menbutone par kg de poids vif, soit 1 mL de solution injectable pour 10 kg de poids vif. Bovins :5 à 7,5 mg de menbutone par kg de poids vif, soit 1 mL de solution injectable pour 15 à 20 kg de poids vif. Chevaux :2,5 à 5 mg de menbutone par kg de poids vif, soit 1 mL de solution injectable pour 20 à 40 kg de poids vif. Par voie intramusculaire, il est recommandé de ne pas injecter plus de 20 mL au même site d’administration. Si nécessaire, l'administration du médicament vétérinaire peut être renouvelée une fois, au bout de 24 heures."},{"n":"METOXYL SOLUTION BUVABLE","l":null,"v":12,"p":"Voie orale. Volailles, lapins :La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie en mg/kg recommandée, la concentration en sulfadiméthoxine doit être ajustée en conséquence. - Coccidioses intestinales et maladies infectieuses :37 à 46,5 mg de sulfadiméthoxine par kg de poids vif par jour, correspondant à 1,6 à 2 mL du médicament vétérinaire par litre d'eau de boisson pendant 5 à 7 jours sur la base d'une consommation hydrique journalière de 100 mL d'eau par kg de poids vif. - Coccidioses hépatiques (lapins) :55,7 mg de sulfadiméthoxine par kg de poids vif par jour, correspondant à 2,4 mL du médicament vétérinaire par litre d'eau de boisson pendant 7 jours sur la base d'une consommation hydrique journalière de 100 mL d'eau par kg de poids vif. Agneaux, veaux, chevreaux :- Maladies infectieuses :55 mg de sulfadiméthoxine par kg de poids vif, soit 0,24 mL par kg de poids vif le premier jour, puis 28 mg de sulfadiméthoxine par kg de poids vif soit 0,12 mL par kg de poids vif les 4 jours suivants. - Coccidioses : 46 mg de sulfadiméthoxine par kg de poids vif par jour, soit 0,2 mL par kg de poids vif par jour pendant 5 jours."},{"n":"MICOTIL 300 MG/ML SOLUTION INJECTABLE","l":36,"v":70,"p":"Pour injection sous-cutanée seulement.\\n\\nUtiliser 10 mg de tilmicosine par kg de poids corporel (correspondant à 1 mL de MICOTIL pour 30 kg de poids corporel).\\n\\nBovins :\\nMode d'administration :\\nPrélever la dose requise du flacon et retirer l'aiguille de la seringue, en laissant l'aiguille dans le flacon. Lorsqu'il faut traiter un groupe d'animaux, laisser l'aiguille dans le flacon pour prélever les doses suivantes. Immobiliser l'animal et insérer une aiguille distincte par voie sous-cutanée au niveau du site d'injection, de préférence dans un pli de peau au niveau de la cage thoracique, derrière l'épaule. Adapter la seringue à l'aiguille et injecter à la base du pli de peau. Ne pas injecter plus de 20 mL par site d'injection.\\n\\nOvins :\\nMode d'administration :\\nIl est important de peser précisément les agneaux afin d'éviter un surdosage. L'utilisation d'une seringue de 2 mL ou de plus petite taille améliore la précision du dosage.\\n\\nPrélever la dose requise du flacon et retirer la seringue de l'aiguille, en laissant l'aiguille dans le flacon. Immobiliser l'animal en se penchant sur lui et insérer une aiguille distincte par voie sous-cutanée au niveau du site d'injection, de préférence dans un pli de peau au niveau de la cage thoracique, derrière l'épaule. Adapter la seringue à l'aiguille et injecter à la base du pli de peau. Ne pas injecter plus de 2 mL par site d'injection.\\n\\nSi aucune amélioration ne se manifeste dans un délai de 48 heures, il faut alors confirmer le diagnostic.\\n\\nÉviter toute contamination du flacon au cours de l'utilisation. Le flacon doit être inspecté visuellement pour y détecter toute particule étrangère et/ou aspect physique anormal. Dans le cas où l'un ou l'autre a été détecté, jetez le flacon. Le bouchon ne doit pas être ponctionné plus de 20 fois."},{"n":"MILICOLI 2 MUI/ML SOLUTION BUVABLE POUR VEAUX, AGNEAUX, PORCINS ET VOLAILLES.","l":null,"v":1,"p":"Voie orale.La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en colistine doit être ajustée en conséquence.Chez les veaux, les agneaux et les porcs, la dose recommandée est de 100 000 UI de colistine par kilogramme de poids vif par jour, pendant 3 à 5 jours consécutifs dans le lait, l'aliment liquide ou l'eau de boisson soit 0,50 mL de solution pour 10 kg de poids vif par jour pendant 3 à 5 jours.La dose quotidienne recommandée doit être divisée en deux, en cas d'administration buccale directe du médicament vétérinaire à l'animal.Chez les volailles, la dose recommandée est de 75 000 UI de colistine par kilogramme de poids vif par jour, pendant 3 à 5 jours consécutifs dans l'eau de boisson soit 37,5 mL de solution par tonne de poids vif par jour pendant 3 à 5 jours.La durée de traitement doit être limitée au temps minimal nécessaire pour le traitement de la maladie."},{"n":"MOXODEX 1 MG/ML SOLUTION BUVABLE POUR OVINS","l":5,"v":14,"p":"Voie orale.Administration en une seule fois, par voie orale (drenchage) de 1 mL de produit pour 5 kg de poids vif soit 200 µg de moxidectine / kg de poids vif, à l'aide de tout équipement de drenchage standard.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible.et vérifier la précision d'administration du traitement."},{"n":"NAFPENZAL T POMMADE INTRAMAMMAIRE POUR VACHES BREBIS ET CHEVRES","l":46,"v":28,"p":"Voie intramammaire 170,41 mg de benzylpénicilline (soit 300 mg de benzylpénicilline procaïne monohydratée), 100 mg de nafcilline et 100 mg de dihydrostreptomycine par quartier soit 1 seringue intramammaire par quartier, au tarissement. Après la dernière traite, désinfecter l'orifice des trayons. En respectant les précautions habituelles d'asepsie, administrer, par le canal du trayon, le contenu entier d'une seringue intramammaire dans chacun des quartiers.Il est recommandé de procéder ensuite à un dernier trempage des trayons avec une solution désinfectante appropriée."},{"n":"NEMISOL SOLUTION INJECTABLE","l":null,"v":3,"p":"Voie intramusculaire, intrapéritonéale ou sous-cutanée. Chez les bovins :7,5 mg de lévamisole par kg de poids vif, en administration unique par voie intramusculaire ou intrapéritonéale, soit 1 mL de médicament vétérinaire pour 20 kg de poids vif sans dépasser 25 mL par animal. Chez les ovins :7,5 mg de lévamisole par kg de poids vif, en administration unique par voie intramusculaire, soit 1 mL de médicament vétérinaire pour 20 kg de poids vif sans dépasser 2,5 mL par animal. Chez les porcins7,5 mg de lévamisole par kg de poids vif, en administration unique par voie sous-cutanée, soit 1 mL de médicament vétérinaire pour 20 kg de poids vif sans dépasser 5 mL par animal."},{"n":"NEO-SOL 500 MG/G","l":null,"v":14,"p":"Voie orale. Veaux, agneaux, chevreaux, porcelets et lapins :10 à 15 mg de néomycine par kg de poids vif toutes les 12 heures pendant 3 à 5 jours consécutifs ; soit 2 à 3 g de médicament vétérinaire pour 100 kg de poids vif toutes les 12 heures pendant 3 à 5 jours consécutifs. Volailles :20 à 30 mg de néomycine par kg de poids vif par jour pendant 3 à 5 jours consécutifs ; soit 4 à 6 g de médicament vétérinaire pour 10 litres d'eau de boisson pendant 3 à 5 jours consécutifs, à ajuster en fonction de la consommation réelle des animaux pour respecter la posologie pondérale (en mg/kg)."},{"n":"NEOMYCINE 40 LAPIN-VOLAILLE-PORC ET AGNEAU-CHEVREAU SEVRES","l":null,"v":14,"p":"Voie orale.\\n\\nVolailles, lapins, porcs, agneaux sevrés et chevreaux sevrés :\\n20000 UI de néomycine par kg de poids vif par jour pendant 10 jours.\\n\\nTaux d'incorporation :\\nVolailles, lapins : Pour un ingéré alimentaire quotidien de 100 g d'aliment par kg de poids vif, cette posologie correspond à 200000 UI de néomycine par kg d'aliment médicamenteux, soit 5 kg de prémélange par tonne d'aliment.\\n\\nPorcs : Pour un ingéré alimentaire quotidien de 50 g d'aliment par kg de poids vif, cette posologie correspond à 400000 UI de néomycine par kg d'aliment médicamenteux, soit 10 kg de prémélange par tonne d'aliment.\\n\\nAgneaux sevrés, chevreaux sevrés : Pour un ingéré alimentaire quotidien de 40 g d'aliment par kg de poids vif, cette posologie correspond à 500000 UI de néomycine par kg d'aliment médicamenteux, soit 12,5 kg de prémélange par tonne d'aliment.\\n\\nLa quantité d'aliment médicamenteux consommée par les animaux dépend de leur état physiologique (âge) et clinique. Pour respecter les doses recommandées en néomycine et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué."},{"n":"NEOMYCINE 50 COOPHAVET POUDRE POUR SOLUTION BUVABLE","l":null,"v":14,"p":"Voie orale. La quantité d'eau de boisson médicamenteuse, de lait ou d'aliment liquide consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la dose recommandée en néomycine par kg de poids vif, la quantité de médicament vétérinaire à diluer dans le liquide doit être ajustée en conséquence. Veaux, agneaux, chevreaux, porcins, lapins :20 000 UI à 30 000 UI de néomycine par kg de poids vif et par jour, en deux prises égales, pendant 3 à 5 jours dans le lait, l'aliment d'allaitement, l'aliment liquide ou l'eau de boisson, soit 0,4 à 0,6 g de médicament vétérinaire pour 10 kg de poids vif et par jour, en deux prises égales, pendant 3 à 5 jours. Volailles :20 000 UI à 30 000 UI de néomycine par kg de poids vif et par jour dans l'eau de boisson pendant 3 à 5 jours ; soit 40 à 60 grammes de médicament vétérinaire par tonne de poids vif et par jour pendant 3 à 5 jours."},{"n":"NEOSKILAB SOLUTION INJECTABLE POUR BOVINS, OVINS, CAPRINS ET CHEVAUX","l":0,"v":0,"p":"Voie sous-cutanée ou voie intramusculaire.0,022 mg/kg de poids vif de métilsulfate de néostigmine ou 0,015 mg/kg de poids vif de néostigmine (équivalant à 0,15 mL/10 kg de poids vif de produit). La posologie doit être adaptée par le vétérinaire. Le bouchon en caoutchouc du flacon peut être percé sans danger jusqu'à 20 fois."},{"n":"NEOXYNE","l":null,"v":14,"p":"Voie orale. Veaux, agneaux, porcins : 10 mg de néomycine et de 10 mg d'oxytétracycline par kg de poids vif toutes les 12 heurespendant 3 jours, soit 5 g de poudre pour 100 kg de poids vif matin et soir dans le lait, l'aliment d'allaitement, l'aliment liquide ou l'eau de boisson pendant 3 jours. Volailles : 20 mg de néomycine et 20 mg d'oxytétracycline par kg de poids vif par jourpendant 3 jours, soit 10 g de poudre pour 100 kg de poids vif par jour pendant 3 jours dans l'eau de boisson. La quantité d'eau de boisson médicamenteuse, de lait ou d'aliment liquide consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la dose recommandée en néomycine et en oxytétracycline par kg de poids vif, la quantité de poudre à diluer dans le liquide doit être ajustée en conséquence."},{"n":"NUFLOR 300 MG/ML SOLUTION INJECTABLE POUR BOVINS ET OVINS","l":null,"v":44,"p":"Essuyer le bouchon avant prélèvement de chaque dose. Utiliser une seringue et une aiguille stérile et sèche. Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible afin d'éviter un sous-dosage. Les bouchons ne doivent pas être perforés plus de 20 fois. Par conséquent, l’utilisateur doit sélectionner la taille de flacon la plus appropriée en fonction de l’espèce animale à traiter.Lorsque plusieurs groupes d’animaux doivent être traités au même moment, l’utilisation d’une aiguille de prélèvement placée dans le bouchon est recommandée afin d’éviter une perforation excessive. L’aiguille de prélèvement doit être retirée du bouchon après le traitement. Traitement Chez les bovins : Voie intramusculaire : 20 mg de florfénicol par kg de poids vif, soit 1 mL de solution pour 15 kg de poids vif, 2 fois à 48 heures d'intervalle, à l'aide d'une aiguille de 16 gauges.Voie sous-cutanée : 40 mg de florfénicol par kg de poids vif, soit 2 mL de solution pour 15 kg de poids vif, une seule fois, à l'aide d'une aiguille de 16 gauges. Le volume administré ne doit pas excéder 10 mL par site d'injection.L'injection doit être réalisée au niveau du cou de l'animal. Chez les ovins : Voie intramusculaire : 20 mg de florfénicol par kg de poids vif, soit 1 mL de solution pour 15 kg de poids vif, par jour pendant 3 jours consécutifs.Le volume administré ne doit pas excéder 4 mL par site d’injection.Des études pharmacocinétiques ont montré que les concentrations plasmatiques moyennes restent supérieures à la CMI90 (1 µg/mL) jusqu'à 18 heures après administration du médicament vétérinaire à la dose de traitement recommandée. Les données précliniques fournies soutiennent l'intervalle de traitement recommandé (24 heures) pour les pathogènes cibles ayant une CMI jusqu'à 1 µg/mL. Métaphylaxie Chez les bovins : Voie sous-cutanée : 40 mg de florfénicol par kg de poids vif, soit 2 mL de solution pour 15 kg de poids vif, une seule fois, à l'aide d'une aiguille de 16 gauges.Le volume administré ne doit pas excéder 10 mL par site d'injection.L'injection doit être réalisée au niveau du cou de l'animal."},{"n":"NUTRA B SOLUTION INJECTABLE POUR BOVINS OVINS EQUINS PORCINS CHIENS CHATS","l":0,"v":0,"p":"Voie intramusculaire (bovins, ovins, porcins)Voie sous-cutanée (chiens, chats)Voie intraveineuse (équins, bovins, ovins, porcins). Posologie :Bovins adultes : 20 à 30 mL par voie intramusculaire ou intraveineuse.Equins adultes : 20 à 30 mL par voie intraveineuse en perfusion.Veaux : 10 mL par voie intramusculaire ou intraveineuse.Poulains : 10 mL par voie intraveineuse en perfusion.Ovins, porcins : 5 à 10 mL par voie intramusculaire ou intraveineuse.Chiens, chats : 3 à 5 mL selon la taille par voie sous-cutanée. Pratiquer deux injections à 24 heures d'intervalle. Par voie intramusculaire, limiter le volume en chaque point (5 à 10 mL selon la taille de l'animal)."},{"n":"OCYTOVEM","l":0,"v":0,"p":"Chez les vaches :\\n30 à 50 UI administrées par voie intramusculaire, sous-cutanée ou intraveineuse.\\n\\nChez les brebis :\\n15 à 20 UI administrées par voie intramusculaire, sous-cutanée ou intraveineuse.\\n\\nChez les truies :\\n20 à 40 UI administrées par voie intramusculaire, sous-cutanée ou intraveineuse.\\n\\nChez les chiennes :\\n5 à 10 UI administrées par voie intramusculaire, sous-cutanée ou intraveineuse.\\n\\nPar voie intraveineuse, ces posologies doivent être diminuées de moitié.\\nCes posologies peuvent être répétées toutes les 2 heures si nécessaire."},{"n":"ORAMEC SOLUTION BUVABLE POUR OVINS","l":28,"v":6,"p":"Voie orale. 0,2 mg d'ivermectine par kg de poids vif, soit 2,5 mL de solution pour 10 kg de poids vif, en une administration unique."},{"n":"ORNIPURAL SOLUTION INJECTABLE","l":0,"v":0,"p":"Afin de garantir une posologie appropriée, le poids corporel/vif doit être déterminé aussi précisément que possible. Chez les bovins et les équins adultes :Administrer 50 à 100 mL par voie intraveineuse lente, intramusculaire ou sous-cutanée. Chez les veaux et les poulains :Administrer 1 ml pour 5 à 10 kg de poids vif par voie intraveineuse lente, intramusculaire ou sous-cutanée. Chez les porcs et les ovins adultes :Administrer 10 à 15 mL par voie intraveineuse lente, intramusculaire ou sous-cutanée. Chez les porcelets et les agneaux :Administrer 3 à 5 mL par voie intraveineuse lente, intramusculaire ou sous-cutanée. Chez les chiens et les chats :Administrer 2 à 5 mL suivant la taille par voie intraveineuse lente, intramusculaire ou sous-cutanée. Renouveler les injections 4 à 5 fois à intervalle de 2 jours."},{"n":"OROSPRAY","l":null,"v":0,"p":"Usage externe.\\n\\nLe produit s'utilise en pulvérisation à raison de deux à trois interventions par jour.\\nPulvériser de façon à couvrir la région concernée d'une mince couche de produit qui restera suffisamment perméable à l'air.\\nUne bonne utilisation du produit suppose son emploi après nettoyage, désinfection et parage de la lésion."},{"n":"OROTAR GRANULES","l":0,"v":0,"p":"Voie orale. Chez les vaches : 1 tube, pouvant être utilisé seul ou en même temps que des traitements anti-infectieux administrés par voie intramammaire. Chez les brebis : ½ tube. Administrer deux bouchons du tube pour une 1/2 dose (2 g). Respecter le trait de jauge en butée présent sur le bouchon (voir schéma ci-dessous). Administrer après la dernière traite en déposant directement les granules entre la gencive inférieure et la lèvre inférieure (pli gingivo-labial)."},{"n":"OSTEOCYNESINE VETERINAIRE COMPRIMES","l":0,"v":0,"p":"Voie orale. Chiens : 2 à 3 comprimés.Chiots et chats : 1 à 2 comprimés. Chevaux : 5 comprimés.Poulains : 4 comprimés. Bovins, vaches laitières : 5 comprimés.Veaux : 4 comprimés. Moutons, chèvres : 4 comprimés.Agneaux, chevreaux : 2 à 3 comprimés. Porcs, truies : 4 comprimés.Porcelets : 2 à 3 comprimés. A administrer 2 fois par jour pour toutes les espèces."},{"n":"OSTEOTRAUMYL POUDRE ORALE","l":null,"v":0,"p":"10 à 20 g (soit 1 à 2 cuillères à soupe) par jour pendant 3 semaines. Administrer soit directement dans la gueule de l'animal, soit diluer dans l'eau de boisson, soit mélanger à l'aliment."},{"n":"OTC 50 HVP","l":null,"v":7,"p":"Voie orale. Administration dans l'eau de boisson/ le lait / l’aliment liquide.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. Veaux, agneaux et porcs : 20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans la buvée, soit 400 mg de poudre orale pour 10 kg de poids vif par jour en 2 prises dans le lait, l'aliment liquide ou l'eau de boisson.Volailles et lapins : 20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans l'eau de boisson, soit environ 400 mg de poudre orale par litre d'eau de boisson.La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en oxytétracycline doit être ajustée en conséquence.La solubilité maximale de la poudre orale est de 5 g/L à une température de 20°C et de 3 g/L à une température de 5°C. Pour la préparation de solutions mères et lors de l'utilisation en pompe doseuse, veillez à ne pas dépasser la solubilité maximale pouvant être atteinte dans les conditions choisies. Ajustez le débit de la pompe doseuse en fonction de la concentration de la solution mère et de la quantité d'eau consommée par les animaux à traiter. L'eau de boisson contenant le médicament doit être fraîchement préparée toutes les 24 heures."},{"n":"OVILIS CHLAMYDIA LYOPHILISAT ET SOLVANT POUR SUSPENSION INJECTABLE POUR OVINS","l":0,"v":7,"p":"Une dose de 2 mL, par voie sous-cutanée ou intramusculaire, un mois avant la saison de lutte.La protection porte sur les 3 saisons de reproduction suivant la vaccination. Reconstitution : elle doit être réalisée immédiatement avant l'utilisation du vaccin. Prélever 5 mL de solvant UNISOLVE du flacon avec une seringue, injecter dans le flacon contenant le vaccin, secouer jusqu'à ce que la poudre soit entièrement dissoute, réinjecter le liquide vaccinal dans le flacon de solvant et agiter correctement.Veiller à ne pas générer d'aérosol. Apparence visuelle après reconstitution : suspension blanc cassé."},{"n":"OVILIS TOXOVAX SUSPENSION A DILUER ET SOLVANT POUR SUSPENSION INJECTABLE POUR OVINS","l":0,"v":42,"p":"Chez les brebis âgées d'au moins 4 mois :Une dose de 0,1 mL du vaccin concentré dilué dans 2 mL de solvant par brebis, par voie intramusculaire, au moins 3 semaines avant la mise à la reproduction, selon le schéma vaccinal suivant : La première année, vacciner l'ensemble du troupeau ; les années suivantes, uniquement les agnelles de renouvellement.Dans certains cas (troupeau de haute valeur, troupeau sans historique connu de toxoplasmose), un rappel tous les deux ans est conseillé. Mode d'administrationLe concentré vaccinal est présenté en flacons de 20 ou 50 doses. Il doit être dilué immédiatement avant usage avec 2 mL par dose du solvant UNISOLVE. Le transfert du concentré vaccinal peut être réalisé à l'aide d'une seringue stérile de 10 mL, munie d'une aiguille stérile (16 ou 18 G) : veiller à aspirer de l'air avant d'enlever la seringue du flacon de solvant, afin de maintenir le flacon de la solution vaccinale sous pression négative et d'éviter ainsi les projections. Apparence visuelle après reconstitution : suspension trouble."},{"n":"OXFENIL 22,65 MG/ML SUSPENSION BUVABLE","l":14,"v":28,"p":"Voie orale. Chez les bovins : 4,5 mg d'oxfendazole par kg de poids vif, soit 20 mL de la suspension pour 100 kg de poids vif en administration unique. Chez les ovins : 5 mg d'oxfendazole par kg de poids vif, soit 2,2 mL de la suspension pour 10 kg de poids vif en administration unique. Chez les caprins : 10 mg d'oxfendazole par kg de poids vif, soit 4,4 mL de la suspension pour 10 kg de poids vif en administration unique. Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. Bien agiter la suspension avant utilisation pour une bonne homogénéité du médicament vétérinaire. L’utilisation d’un pistolet doseur propre et convenablement étalonné est recommandée."},{"n":"OXYTETRACYCLINE 10 % VETOQUINOL SOLUTION INJECTABLE","l":3,"v":14,"p":"Chez les bovins, ovins, caprins et porcins : voies intraveineuse lente, intramusculaire, sous-cutanée ou intrapéritonéale.Chez les chevaux, utiliser impérativement la voie intraveineuse lente. 5 à 10 mg d'oxytétracycline par kg de poids vif et par jour pendant 3 à 5 jours, soit 0,5 à 1 mL de solution injectable pour 10 kg de poids vif. Chez les chevaux, les bovins, les ovins, les caprins et les porcins adultes : 1 mL par 20 kg de poids vif.Chez les poulains, les veaux, les agneaux, les chevreaux et les porcelets : 1 mL par 10 kg de poids vif."},{"n":"OXYTETRACYCLINE 100-CR PORC ET AGNEAU-CHEVREAU SEVRES","l":null,"v":14,"p":"Chez les porcins :\\nPrévention en milieu infecté : 25 mg d'oxytétracycline par kg de poids vif et par jour, par voie orale, pendant 10 jours.\\nTraitement : 50 mg d'oxytétracycline par kg de poids vif et par jour, par voie orale, pendant 10 jours.\\n\\nChez les agneaux et chevreaux :\\nPrévention en milieu infecté : 20 mg d'oxytétracycline par kg de poids vif et par jour, par voie orale, pendant 10 jours.\\nTraitement : 40 mg d'oxytétracycline par kg de poids vif et par jour, par voie orale, pendant 10 jours.\\n\\nTaux d'incorporation :\\nLa quantité d'aliment médicamenteux consommée par les animaux dépend de leur état physiologique (âge) et clinique. Pour respecter les doses recommandées en oxytétracycline et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué dans la limite minimale d'incorporation de 5 kg/tonne. Cela peut conduire à des teneurs en ppm d'oxytétracycline différentes dans l'aliment médicamenteux de celles mentionnées ci-dessous à titre indicatif.\\n\\nPorcins : Pour un ingéré alimentaire quotidien de 50 g d'aliment par kg de poids vif, cette posologie correspond, en prévention à 500 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 5 kg de prémélange médicamenteux par tonne d'aliment et en traitement à 1000 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 10 kg de prémélange médicamenteux par tonne d'aliment.\\n\\nAgneaux et chevreaux : Pour un ingéré alimentaire quotidien de 20 g d'aliment / kg de poids vif, cette posologie correspond, en prévention à 1000 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 10 kg de prémélange médicamenteux par tonne d'aliment et en traitement, prévention à 2000 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 20 kg de prémélange médicamenteux par tonne d'aliment."},{"n":"OXYTETRACYCLINE 40-CR LAPIN-VOLAILLE-PORC ET AGNEAU-CHEVREAU SEVRES","l":null,"v":14,"p":"Voie orale\\n\\nChez les porcins :\\nPrévention en milieu infecté : 25 mg d'oxytétracycline par kg de poids vif et par jour, par voie orale, pendant 10 jours. Traitement : 50 mg d'oxytétracycline par kg de poids vif et par jour, par voie orale, pendant 10 jours.\\n\\nChez les agneaux, les chevreaux, les volailles et les lapins :\\nPrévention en milieu infecté : 20 mg d'oxytétracycline par kg de poids vif et par jour, par voie orale, pendant 10 jours.\\nTraitement : 40 mg d'oxytétracycline par kg de poids vif et par jour, par voie orale, pendant 10 jours.\\n\\nTaux d'incorporation.\\nLa quantité d'aliment médicamenteux consommée par les animaux dépend de leur état physiologique (âge) et clinique. Pour respecter les doses recommandées en oxytétracycline et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué dans la limite minimale d'incorporation de 5 kg/tonne. Cela peut conduire à des teneurs en ppm d'oxytétracycline différentes dans l'aliment médicamenteux de celles mentionnées ci-dessous à titre indicatif.\\n\\nVolailles et lapins :\\nPour un ingéré alimentaire quotidien de 100 g d'aliment par kg de poids vif, cette posologie correspond, en prévention à 200 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 5 kg de prémélange médicamenteux par tonne d'aliment, et en traitement curatif à 400 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 10 kg de prémélange médicamenteux par tonne d'aliment.\\n\\nPorcins :\\nPour un ingéré alimentaire quotidien de 50 g d'aliment par kg de poids vif, cette posologie correspond, en prévention à 500 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 12,5 kg de prémélange médicamenteux par tonne d'aliment, et en traitement curatif à 1000 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 25 kg de prémélange médicamenteux par tonne d'aliment.\\n\\nAgneaux et chevreaux :\\nPour un ingéré alimentaire quotidien de 20 g d'aliment / kg de poids vif, cette posologie correspond, en prévention à 1000 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 25 kg de prémélange médicamenteux par tonne d'aliment et en traitement curatif à 2000 ppm d'oxytétracycline dans l'aliment, soit un taux d'incorporation de 50 kg de prémélange médicamenteux par tonne d'aliment."},{"n":"OXYTETRACYCLINE 5 % VETOQUINOL","l":3,"v":14,"p":"Voies intraveineuse lente, intramusculaire, sous-cutanée ou intrapéritonéale. Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. 5 à 10 mg d'oxytétracycline / kg de poids vif par jour pendant 3 à 5 jours, soit 1 à 2 mL de solution injectable pour 10 kg de poids vif. Chez les chevaux et bovins :- adultes : 1 mL pour 15 kg de poids vif ;- veaux, poulains : 1 mL pour 5 kg de poids vif. Chez les ovins :- adultes : 1 mL pour 10 kg de poids vif ;- agneaux : 1 mL pour 5 à 10 kg de poids vif. Chez les porcins :- adultes : 10 à 15 mL pour 100 kg de poids vif ;- porcelets : 1 mL par 5 kg de poids vif. Chez les chiens et chats : 1 mL pour 5 à 10 kg de poids."},{"n":"OXYTETRIN P SUSPENSION POUR PULVERISATION CUTANEE POUR BOVINS OVINS CAPRINS EQUINS PORCINS ET LAPINS","l":0,"v":0,"p":"Voie cutanée. Agiter le flacon avant emploi. Avant application, effectuer un parage et un nettoyage des plaies.Effectuer une pulvérisation pendant quelques secondes en tenant le flacon en position verticale. Dans les cas graves, l'application doit être renouvelée quotidiennement durant 3 jours consécutifs. Le colorant permet de bien visualiser les zones traitées."},{"n":"OXYTOBEL 10 UI/ML SOLUTION INJECTABLE POUR CHEVAUX BOVINS PORCINS OVINS CAPRINS CHIENS ET CHATS","l":0,"v":0,"p":"Voie intraveineuse, sous-cutanée ou intramusculaire. Posologie en cas d’administration par injection sous-cutanée ou intramusculaire :Jument et vache : 4 à 6 mLTruie : 1 à 3 mLBrebis et chèvre : 1 à 2 mLChienne et chatte : 0,25 à 1 mL. Pour le traitement de l'agalactie, la posologie la plus élevée indiquée ci-dessus doit être administrée. Le médicament vétérinaire peut être administré par injection intraveineuse lente à des dosages égaux à un tiers de ce qui est indiqué ci-dessus. Des dosages plus forts n'entraîneront pas des effets pharmacologiques proportionnellement accrus."},{"n":"OXYVETO-50 S","l":null,"v":7,"p":"Veaux, agneaux, chevreaux et porcs :20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans la buvée, soit 400 mg de poudre orale pour 10 kg de poids vif par jour en 2 prises dans le lait, l'aliment liquide ou l'eau de boisson. Volailles, lapins :20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans l'eau de boisson, soit environ 400 mg de poudre orale par litre d'eau de boisson. La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en oxytétracycline doit être ajustée en conséquence."},{"n":"PANACUR 2,5 % SUSPENSION BUVABLE POUR BOVINS OVINS ET CAPRINS","l":6,"v":16,"p":"Voie orale. Chez les bovins : 7,5 mg de fenbendazole par kg de poids vif, en administration unique, soit 30 mL de suspension par 100 kg de poids vif. Chez les ovins :- Cas général :5 mg de fenbendazole par kg de poids vif, en administration unique, soit 2 mL de suspension par 10 kg de poids vif. - Monieziose :10 mg de fenbendazole par kg de poids vif, en administration unique, soit 4 mL de suspension par 10 kg de poids vif. Chez les caprins :10 mg de fenbendazole par kg de poids vif, en administration unique, soit 4 mL de suspension par 10 kg de poids vif. La suspension est prête à l’emploi et doit être administrée sans dilution préalable.Agiter le flacon avant l’emploi.Utiliser un pistolet doseur propre et correctement étalonné. Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible."},{"n":"PANACUR 4 % POUDRE ORALE","l":6,"v":19,"p":"Voie orale. Chez les bovins :7,5 mg de fenbendazole par kg de poids vif, en administration unique, soit 18,75 g de médicament vétérinaire par 100 kg de poids vif à mélanger à l'aliment. Chez les ovins :- Cas général :5 mg de fenbendazole par kg de poids vif, en administration unique, soit 1,25 g de médicament vétérinaire par 10 kg de poids vif à mélanger à l'aliment.- Monieziose :10 mg de fenbendazole par kg de poids vif, en administration unique, soit 2,5 g de médicament vétérinaire par 10 kg de poids vif à mélanger à l'aliment. Chez les caprins :10 mg de fenbendazole par kg de poids vif, en administration unique, soit 2,5 g de médicament vétérinaire par 10 kg de poids vif à mélanger à l'aliment. Chez les porcins :5 mg de fenbendazole par kg de poids vif, en administration unique, soit 12,5 g de médicament vétérinaire par 100 kg de poids vif à mélanger à l'aliment."},{"n":"PAXOLIP","l":0,"v":0,"p":"Voie orale dissous dans l'eau de boisson, en mélange dans l'aliment liquide ou en drogage.\\n\\n12 à 80 mg de méthionine, 3 à 20 mg de sorbitol, 5,6 à 37,2 mg de choline et 4,6 à 31 mg de bétaïne par kg de poids vif par jour, correspondant aux posologies suivantes :\\n\\nBovins adultes : 30 g de poudre par jour.\\nVeaux : 10 g de poudre par jour.\\nOvins, caprins : 10 g de poudre par jour.\\nPorcs adultes : 20 g de poudre par jour.\\nPorcs charcutiers : 5 g de poudre par jour.\\nPorcelet : 2 g de poudre par jour."},{"n":"PENI DHS COOPHAVET SUSPENSION INJECTABLE","l":7,"v":30,"p":"Voie intramusculaire ou sous-cutanée. 11,4 à 17,1 mg de benzylpénicilline et 16,4 à 24,6 mg de dihydrostreptomycine par kg de poids vif et par jour pendant 3 à 5 jours, soit 1 à 1,5 mL de médicament vétérinaire pour 10 kg de poids vif, correspondant à 10 mL de médicament vétérinaire pour 100 kg de poids vif chez les bovins et les porcins adultes et à 1,50 mL pour 10 kg de poids vif chez les veaux, les ovins, les caprins et les porcelets. Bien agiter le flacon pour homogénéiser la suspension avant l'emploi."},{"n":"PENIJECTYL SUSPENSION INJECTABLE","l":7,"v":30,"p":"Voie intramusculaire ou sous-cutanée. 11,4 à 17,1 mg de benzylpénicilline et 16,4 à 24,6 mg de dihydrostreptomycine par kg de poids vif et par jour pendant 3 à 5 jours, soit 1 à 1,5 mL de suspension pour 10 kg de poids vif, correspondant à 10 mL de suspension pour 100 kg de poids vif chez les bovins adultes et à 1,50 mL pour 10 kg de poids vif chez les veaux, les ovins, les caprins et les porcins. Bien agiter le flacon pour homogénéiser la suspension avant l'emploi."},{"n":"PHARMASIN 200 MG/ML SOLUTION INJECTABLE POUR BOVINS, OVINS, CAPRINS ET PORCINS","l":5,"v":42,"p":"Voie intramusculaire ou intraveineuse lente (bovins uniquement).\\n\\nBovins :\\n5 à 10 mg de tylosine/kg de poids vif par jour, pendant 3 jours (soit 2,5 à 5 mL de solution injectable pour 100 kg de poids vif). Le volume administré ne doit pas excéder 15 mL par site d'injection.\\nOvins et caprins :\\n10 mg de tylosine/kg de poids vif par jour, pendant 3 jours (soit 5 mL de solution injectable pour 100 kg de poids vif).Pour les ovins dont le poids vif est supérieur à 50 kg, l'injection doit être répartie sur 2 sites d'injection (avec un volume d'injection maximal de 2,5 mL par site d'injection).\\nPorcins :\\n5 à 10 mg
