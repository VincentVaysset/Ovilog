cliniques disparaissent. OvinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Pour assurer un dosage correct, le poids de l’animal doit être déterminé aussi précisément que possible. Le capuchon peut être perforé jusqu’à 20 fois en toute sécurité. Lorsqu’un groupe d’animaux est traité en une fois, utiliser une aiguille de prélèvement placée sur le bouchon du flacon afin d'éviter de trop percer le bouchon. L’aiguille de prélèvement doit être retirée après le traitement."},{"n":"TYLAN 200 000 UI/ML SOLUTION INJECTABLE","l":5,"v":42,"p":"Voie intramusculaire ou intraveineuse lente (bovins uniquement). La durée de traitement est de 3 jours. \\nESPECESDOSES JOURNALIERES \\nTylosineTYLAN 200 000 UI/mL\\nBovins5 000 à 10 000 UI de tylosine par kg de poids vif2,5 à 5 mL de solution pour 100 kg de poids vif \\nOvins et caprins10 000 UI de tylosine par kg de poids vif5 mL de solution pour 100 kg de poids vif\\nPorcins2 000 à 10 000 UI de tylosine par kg de poids vif1 à 5 mL de solution pour 100 kg de poids vif Indications nécessaires à une administration correcte : Bovins : le volume maximal par site d'injection doit être limité à 15 mL. Ovins : l'injection doit être répartie sur 2 sites d'injection pour les ovins dont le poids vif est supérieur à 50 kg (avec un volume d'injection maximal de 2,5 mL par site d'injection). Porcins : ne pas administrer plus de 5 mL par site d’injection. Utiliser le médicament dans les 90 jours suivant la première ponction du flacon. Ne pas ponctionner le flacon de 100 mL plus de 20 fois. Ne pas ponctionner le flacon de 250 mL plus de 25 fois."},{"n":"UCAMIX V DECOQUINATE 6 VEAUX ET AGNEAUX SEVRES","l":null,"v":0,"p":"Voie orale.\\n\\n- Chez les agneaux sevrés :\\n1 mg de décoquinate par kg de poids vif et par jour pendant 9 semaines par voie orale.\\n\\nPour un ingéré alimentaire quotidien de 10 g d'aliment médicamenteux par kg de poids vif, cette posologie correspond à 100 ppm de décoquinate dans l'aliment médicamenteux, soit un taux d'incorporation de 16,7 kg de prémélange médicamenteux par tonne d'aliment.\\n\\n- Chez les veaux sevrés :\\n0,5 mg de décoquinate par kg de poids vif et par jour pendant 4 à 5 semaines par voie orale.\\n\\nPour un ingéré alimentaire quotidien de 10 g d'aliment médicamenteux par kg de poids vif, cette posologie correspond à 50 ppm de décoquinate dans l'aliment médicamenteux, soit un taux d'incorporation de 8,35 kg de prémélange médicamenteux par tonne d'aliment.\\n\\nTaux d'incorporation\\nLa quantité d'aliment médicamenteux consommée par les animaux varie considérablement en fonction de leur poids vif, du type de production, du type de ration et de la consommation d'aliment complémentaire.\\nPour respecter les doses recommandées en décoquinate et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué dans la limite minimale d'incorporation de 5 kg/tonne. Cela peut conduire à des teneurs en ppm de décoquinate très différentes dans l'aliment médicamenteux de celles mentionnées ci-dessus à titre indicatif."},{"n":"ULTRA B","l":0,"v":0,"p":"Chez les porcs :\\n9 mg de thiamine et 0,66 mg de pyridoxine par kg de poids vif et par jour, correspondant à 1 mL de produit pour 10 kg de poids vif par jour pendant 2 jours, par voie intramusculaire ou orale.\\n\\nChez les bovins, les équins, les ovins, les caprins et les chiens :\\n9 mg de thiamine et 0,66 mg de pyridoxine par kg de poids vif et par jour, correspondant à 1 mL de produit pour 10 kg de poids vif par jour pendant 2 jours, par voie intraveineuse, intramusculaire ou orale.\\n\\nLa prévention de la nécrose du cortex cérébral peut être effectuée à raison de 1 mL/100 kg/jour."},{"n":"VALBAZEN MOUTONS ET CHEVRES 1,9 % SUSPENSION BUVABLE","l":6,"v":10,"p":"Voie orale. Chez les ovins :- Nématodes gastro-intestinaux, strongles pulmonaires et cestode :3,8 mg d'albendazole par kg de poids vif, soit 2 mL par 10 kg de poids vif, en une administration unique. - Grandes douves (adultes) :7,5 mg d'albendazole par kg de poids vif, soit 4 mL par 10 kg de poids vif, en une administration unique. - Petites douves (adultes) :15 mg d'albendazole par kg de poids vif, soit 8 mL par 10 kg de poids vif, en une administration unique. Chez les caprins :- Nématodes gastro-intestinaux, strongles pulmonaires, cestodes et grandes douves (adultes) :7,5 mg d'albendazole par kg de poids vif, soit 4 mL par 10 kg de poids vif, en une administration unique. - Petites douves (adultes) :15 mg d'albendazole par kg de poids vif, soit 8 mL par 10 kg de poids vif, en une administration unique. Bien agiter la suspension avant utilisation pour une bonne homogénéité du médicament vétérinaire.Utiliser un pistolet doseur propre et correctement étalonné."},{"n":"VECOXAN 2,5 MG/ML SUSPENSION BUVABLE","l":null,"v":0,"p":"Voie orale. Bien agiter avant emploi. Administration unique de 1 mg de diclazuril par kg de poids vif (soit 1 mL de suspension buvale par 2,5 kg de poids vif).Afin garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible.Lorsque les animaux doivent être traités collectivement plutôt qu'individuellement, ils doivent être regroupés en fonction de leur poids corporel et recevoir une dose de traitement adaptée, afin d'éviter toute administration insuffisante ou excessive. L’utilisation d’un équipement de mesure convenablement étalonné est recommandée."},{"n":"VERMAX D","l":null,"v":28,"p":"La dose recommandée est 200 µg d'ivermectine par kg de poids vif et 5 mg de closantel par kg de poids vif (soit 1 mL de solution pour 25 kg de poids vif).Injecter par voie sous-cutanée dans l'encolure.Utiliser de préférence une aiguille stérile de diamètre 16 G et de longueur 2,5 cm. Ce produit ne contient aucun conservateur. Désinfecter le bouchon avant chaque ponction. Utiliser une aiguille et une seringue sèches et stériles. Pour les flacons de 250 mL et de 500 mL, il est conseillé d'utiliser une seringue automatique. Pour remplir la seringue, l'usage d'une aiguille réservée à la ponction est recommandé afin de ne pas perforer exagérément le bouchon du flacon. Si plus de 40 ponctions par flacon sont nécessaires, l'utilisation d'une aiguille de ponction est recommandée. Le programme de traitement doit être adapté en fonction de la situation épidémiologique locale de chaque élevage. Le programme de traitement doit être établi par une personne qualifiée qui déterminera le dosage le plus adapté ainsi que la gestion du troupeau permettant un contrôle optimal des parasites et une limitation du développement des résistances. Pour garantir l'administration d'une dose correcte, le poids des animaux devra être déterminé le plus précisément possible. La précision du matériel de dosage utilisé devra aussi être vérifiée. Dans le cas de traitements collectifs, il est recommandé de regrouper les animaux en fonction de leur poids et d'ajuster la dose afin d'éviter un surdosage ou un sous-dosage.Pour le traitement et le contrôle de la gale du mouton, l'injection du produit sera suivie d'une seconde injection d'ivermectine à 7 jours d'intervalle pour traiter les signes cliniques et éliminer les agents de la gale. Cette seconde injection sera réalisée de l'autre côté du cou."},{"n":"VERSATRINE SOLUTION POUR POUR-ON POUR BOVINS ET OVINS","l":1,"v":28,"p":"Usage externe. Application en pour-on. Bovins :100 mg de deltaméthrine par animal en une application externe, soit 10 mL de la solution pure par bovin. Ovins :50 mg de deltaméthrine par animal en une application externe, soit 5 mL de la solution pure par ovin. Le médicament vétérinaire doit être versé sans dilution préalable entre les épaules de l'animal le long de la ligne du dos. La durée de protection contre les mouches se maintient pendant 4 à 6 semaines. L'éradication des poux et des mélophages est obtenue après une seule application du médicament vétérinaire."},{"n":"VET-OXY 5 % INJECTABLE","l":5,"v":14,"p":"Voies intraveineuse, intramusculaire, sous-cutanée ou intrapéritonéale. 5 à 10 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours soit 1 à 2 mL de solution injectable pour 10 kg de poids vif. En cas d'utilisation répétée du flacon, il est recommandé d’utiliser une aiguille de prélèvement ou une seringue multidose pour éviter un perçage excessif du bouchon. Le bouchon des flacons de 100 mL peut être percé jusqu’à 20 fois. Le bouchon des flacons de 250 mL peut être percé jusqu’à 25 fois."},{"n":"VETBUTON 100 MG/ML SOLUTION INJECTABLE POUR BOVINS, PORCINS, CHEVAUX, OVINS ET CAPRINS","l":0,"v":0,"p":"Veaux, ovins, caprins et porcins: injection intramusculaire ou intraveineuse.Bovins: injection intraveineuse.Chevaux: injection lente intraveineuse. Veaux (jusqu'à 6 mois), ovins, caprins et porcins:10 mg de menbutone par kg de poids vif administré en intramusculaire profonde ou en intraveineuse lente, soit 1 mL de solution injectable pour 10 kg de poids vif. Bovins:5 à 7,5 mg de menbutone par kg de poids vif en intraveineuse, soit 1 mL de solution injectable pour 15 à 20 kg de poids vif. Chevaux:2,5 à 5 mg de menbutone par kg de poids vif en intraveineuse lente, soit 1 mL de solution injectable pour 20 à 40 kg de poids vif. L'administration peut être répétée une fois si nécessaire au bout de 24 heures.Le flacon ne doit pas être ponctionné plus de 125 fois."},{"n":"VETEDINE SAVON","l":0,"v":0,"p":"Voie externe.\\n\\nMouiller la zone à nettoyer à l'eau.\\nAppliquer la solution et savonner pendant 2 à 3 minutes environ.\\nRincer après usage à l'eau stérile ou bouillie."},{"n":"VETEDINE SOLUTION POUR APPLICATION CUTANEE","l":0,"v":0,"p":"Voie externe.\\n\\nAntisepsie de la peau et des sites opératoires et désinfection des plaies :\\nUtiliser le produit pur en badigeonnage ou en irrigation.\\n\\nAntisepsie des muqueuses\\nUtiliser le produit dilué (1 à 2 cuillerées à soupe par litre d'eau bouillie tiède) en gynécologie, pour l'hygiène de la mamelle durant la lactation."},{"n":"VETOMECTIN 10 MG/ML SOLUTION INJECTABLE POUR BOVINS OVINS ET PORCINS","l":60,"v":49,"p":"Utilisation sous-cutanée. Administrer une dose unique seulement (sauf pour le traitement des infections à Psoroptes ovis chez les ovins). Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible La précision du dispositif doit être vérifiée. Lorsque les animaux doivent être traités collectivement plutôt qu'individuellement, ils doivent être regroupés en fonction de leur poids vif et recevoir une dose de traitement adaptée, afin d'éviter toute administration insuffisante ou excessive. Lors de l'utilisation des flacons de 200 mL, 250 mL ou 500 mL, utiliser uniquement des dispositifs à seringue automatique. Pour le flacon de 50 mL, il est conseillé d'employer une seringue multidose. Pour remplir la seringue, l'utilisation d'une aiguille de soutirage est recommandée afin d'éviter un perçage excessif du bouchon. Bovins : Dosage : 1,0 mL de médicament vétérinaire pour 50 kg de poids vif (basé sur une dose de 200 microgrammes d'ivermectine par kg de poids vif). Administration : Injection sous-cutanée sur l'avant ou l'arrière de l'épaule en utilisant une technique aseptique.Il est recommandé d'utiliser une aiguille stérile de calibre 15 x 15/10 mm (17 G). Ovins : Dosage : 0,5 mL de médicament vétérinaire pour 25 kg de poids vif (basé sur une dose de 200 microgrammes d'ivermectine par kg de poids vif). Administration : Pour le traitement des nématodes gastro-intestinaux, des vers pulmonaires et des oestres nasaux, effectuer une injection unique par voie sous-cutané dans le cou en utilisant des précautions d'asepsie ; il est recommandé d'utiliser une aiguille stérile de calibre 15 x 15/10 mm (17 G). Pour le traitement de l'infestation à Psoroptis ovis (gale du mouton), deux injections à 7 jours d'intervalle sont nécessaires pour enrayer les signes cliniques du psoropte et éliminer les parasites vivants.Chez les jeunes agneaux pesant moins de 20 kg, administrer 0,1 mL de solution pour 5 kg de poids vif. Chez ces agneaux, il est recommandé d'utiliser une seringue permettant d'administrer un volume aussi faible que 0,1 mL. Porcins : Dosage : 1,5 mL de médicament vétérinaire pour 50 kg de poids vif (basé sur une dose de 300 microgrammes d'ivermectine par kg de poids vif). Administration : L’injection sous-cutanée dans le cou en utilisant une technique aseptique et une aiguille stérile de calibre 15 x 15/10 mm (17 G) est recommandée.Pour les porcelets pesant moins de 16 kg, administrer 0,1 mL de solution pour 3 kg de poids vif. Chez ces porcelets, il est recommandé d'utiliser une seringue permettant d'administrer un volume aussi faible que 0,1 mL."},{"n":"VIRGOCILLINE, SOLUTION INJECTABLE POUR BOVINS, OVINS, EQUINS, PORCINS, LAPINS ET VOLAILLES","l":2,"v":21,"p":"Voie intramusculaire, sous-cutanée ou intrapéritonéale. 25 000 UI de colistine par kg de poids vif toutes les 12 heures durant 3 jours, soit 0,5 mL de solution pour 10 kg de poids vif matin et soir pendant 3 jours."},{"n":"VITA-C VETOQUINOL SOLUTION INJECTABLE ET BUVABLE","l":0,"v":0,"p":"Voies : intraveineuse, intramusculaire et orale. Afin de garantir une posologie appropriée, le poids corporel/vif doit être déterminé aussi précisément que possible. Posologie quotidienne : 20 à 60 mg d'acide ascorbique par kg de poids corporel/vif par jour, correspondant à : Équins, bovins :Adultes : 50 à 100 mL de médicament vétérinaireJeunes : 10 à 30 mL de médicament vétérinaire Ovins, caprins, porcins : 5 à 25 mL de médicament vétérinaireChiens : 1 à 5 mL de médicament vétérinaireChats : 0,5 à 1 mL de médicament vétérinaireVolailles (pour 10 animaux) : 1 à 5 mLl de médicament vétérinaire par litre d'eau de boisson. La voie orale sera préférée dans les affections chroniques ou en complément de la voie parentérale.Par voie orale, Le médicament vétérinaire peut être administré pur, mélangé de façon homogène à l'alimentation, ou dilué dans l'eau de boisson (ne pas mélanger au lait)."},{"n":"VITAMINE B12 VETOQUINOL","l":0,"v":0,"p":"Voies intraveineuse, intramusculaire, sous-cutanée et orale.\\n\\nEquins, bovins, ovins, porcins adultes :\\n0,01 à 0,02 mg de cyanocobalamine par kg de poids vif, soit 1 à 2 ml de solution pour 100 kg de poids vif.\\n\\nPoulains, veaux, agneaux, porcelets :\\n0,04 à 0,2 mg de cyanocobalamine par kg de poids vif, soit 1 à 2 ml de solution par animal.\\n\\nChiens :\\n0,05 à 0,1 mg de cyanocobalamine par kg de poids corporel, soit 0,5 à 1 ml de solution pour 10 kg de poids corporel\\n\\nChats, chiens nains :\\n0,1 mg de cyanocobalamine par kg de poids corporel, soit 0,5 ml de solution par animal.\\n\\nCes doses peuvent être renouvelées chaque jour pendant 8 jours."}];
let ANMV_INDEX = null;

function normAnmv(s) {
  return (s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, ' ')
    .trim();
}
function getAnmvIndex() {
  if (!ANMV_INDEX) ANMV_INDEX = ANMV_DB.map(e => ({ n: e.n, l: e.l, v: e.v, p: e.p || null, norm: normAnmv(e.n) }));
  return ANMV_INDEX;
}
/* Recherche conservatrice : ne propose une correspondance que si elle est
   raisonnablement sûre (nom exact, ou l'un est un préfixe complet de
   l'autre, ou un seul produit partage le même premier mot significatif).
   Mieux vaut ne rien proposer que proposer un mauvais produit. */
function findAnmvMatch(nomProduit) {
  const q = normAnmv(nomProduit);
  if (!q || q.length < 3) return null;
  const index = getAnmvIndex();
  const exact = index.find(e => e.norm === q);
  if (exact) return exact;
  if (q.length < 4) return null;
  const startsWith = index.filter(e => e.norm.startsWith(q));
  if (startsWith.length) {
    startsWith.sort((a, b) => a.norm.length - b.norm.length);
    return startsWith[0];
  }
  const containedBy = index.filter(e => e.norm.length >= 4 && q.startsWith(e.norm));
  if (containedBy.length) {
    containedBy.sort((a, b) => b.norm.length - a.norm.length);
    return containedBy[0];
  }
  const qFirst = q.split(' ')[0];
  if (qFirst.length >= 4) {
    const firstWordMatches = index.filter(e => e.norm.split(' ')[0] === qFirst);
    if (firstWordMatches.length === 1) return firstWordMatches[0];
  }
  return null;
}
function formatDelaiAnmv(v) {
  if (v === null || v === undefined) return 'non renseigné';
  if (v === 0) return 'aucun (0 jour)';
  return v + ' jour' + (v > 1 ? 's' : '');
}
function addDaysToDateStr(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}
function showAnmvMatchModal(nomSaisi, match, callback) {
  const overlay = document.createElement('div');

/* Propose une association ANMV pour ce produit s'il n'a pas déjà été traité
   (accepté ou refusé) et si une correspondance fiable existe. Ne fait rien
   sinon (onDone est quand même appelé, pour chaîner facilement). */
function maybeAssociateAnmv(nom, onDone) {
  if (!nom || DB.produitsInfo[nom] !== undefined) { if (onDone) onDone(); return; }
  const match = findAnmvMatch(nom);
  if (!match) { if (onDone) onDone(); return; }
  showAnmvMatchModal(nom, match, (accepted) => {
    DB.produitsInfo[nom] = accepted
      ? { lait: match.l, viande: match.v, anmvNom: match.n, posologie: match.p || null }
      : { declined: true };
    saveData(DB);
    if (onDone) onDone();
  });
}
/* Affiche/actualise, juste après le bloc de sélection du produit (#produit-block),
   un petit encart avec la posologie/voie d'administration ANMV connue pour ce

   été associé (voir maybeAssociateAnmv). Réutilisé dans les 3 formulaires de
   saisie sanitaire (brebis, bélier, traitement collectif) sans dupliquer de HTML. */
function updatePosologieBox(produit) {
  const anchor = document.getElementById('produit-block');
  if (!anchor) return;
  let box = document.getElementById('posologie-info');
  const info = produit ? DB.produitsInfo[produit] : null;
  const html = (info && !info.declined && info.posologie)
    ? `<div style="font-size:12px;color:var(--text-muted);background:#f0efe9;border-radius:var(--radius);padding:10px 12px;margin-bottom:14px;"><strong>Posologie ANMV (RCP — toutes espèces cibles confondues) :</strong> ${info.posologie}</div>`
    : '';
  if (!html) { if (box) box.remove(); return; }
  if (!box) {
    box = document.createElement('div');
    box.id = 'posologie-info';
    anchor.insertAdjacentElement('afterend', box);
  }
  box.innerHTML = html;
}
/* Calcule, pour une brebis, les dates de fin de délai d'attente lait/viande
   encore actives (dans le futur) à partir de son carnet sanitaire. Quand
   plusieurs soins ont des délais qui se chevauchent, on retient la date la
   plus tardive (le délai n'est levé que lorsque le dernier soin le permet). */
function computeWithdrawalAlerts(sheep) {
  const today = new Date().toISOString().slice(0, 10);
  let laitFin = null, viandeFin = null;
  (sheep.sanitaire || []).forEach(s => {
    const info = DB.produitsInfo[s.produit];
    if (!info || info.declined || !s.date) return;
    if (info.lait !== null && info.lait !== undefined) {
      const fin = addDaysToDateStr(s.date, info.lait);
      if (fin >= today && (!laitFin || fin > laitFin)) laitFin = fin;
    }
    if (info.viande !== null && info.viande !== undefined) {
      const fin = addDaysToDateStr(s.date, info.viande);
      if (fin >= today && (!viandeFin || fin > viandeFin)) viandeFin = fin;
    }
  });
  return { laitFin, viandeFin };
}

/* ---------- Utilitaires EID ---------- */
function cleanEid(eid) {
  return eid.replace(/\s+/g, '');
}
function numeroVisuel(eid) {
  const c = cleanEid(eid);
  return c.slice(-5);
}
function anneeNaissance(eid) {
  const c = cleanEid(eid);
  if (c.length < 11) return null;
  const digit = parseInt(c.charAt(10), 10);
  const currentYear = new Date().getFullYear();
  let year = 2020 + digit;
  if (year > currentYear) year -= 10;
  return year;
}
function age(eid) {
  const y = anneeNaissance(eid);
  if (y === null) return null;
  return new Date().getFullYear() - y;
}
/* Tri commun à toutes les listes d'animaux : du plus vieux au plus jeune,
   par année de naissance croissante (déduite de l'EID), puis par numéro
   visuel croissant à âge égal (ex: 90059, 90060, 90061 avant 02001, 02002
   s'ils sont nés une autre année — mais 02001 avant 02002 s'ils sont nés
   la même année). Sans ce second critère, deux animaux nés la même année
   se retrouvaient dans un ordre arbitraire. Ne mute pas le tableau reçu. */
function sortByAge(list) {
  return [...list].sort((a, b) => {
    const ya = anneeNaissance(a.eid), yb = anneeNaissance(b.eid);
    if (ya !== yb) {
      if (ya === null) return 1;
      if (yb === null) return -1;
      return ya - yb;
    }
    const na = parseInt(numeroVisuel(a.eid), 10);
    const nb = parseInt(numeroVisuel(b.eid), 10);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return numeroVisuel(a.eid).localeCompare(numeroVisuel(b.eid));
  });
}

/* Une échographie est-elle un constat de gestation positif ? Le type
   "constat" (visuel simple) code juste Pleine/Vide ; les autres types
   (stade, stade_comptage) sont positifs à partir du moment où un stade est
   renseigné et différent de "Vide" (Début/Milieu/Fin/Pleine). */
function isGestanteEcho(echo) {
  if (!echo) return false;
  if (echo.type === 'constat') return echo.stade === 'Pleine';
  return echo.stade && echo.stade !== 'Vide';
}

/* ---------- Vide définitive ----------
   Une brebis peut être notée "Vide" à plusieurs échographies d'affilée sans
   que ce soit définitif (elle peut redevenir pleine à l'écho suivante) —
   seule une action explicite ("dernière écho de la campagne" ou le bouton
   de la fiche) fait foi. Tagué par campagne comme les échographies, pour
   ne jamais écraser l'historique des campagnes passées et pouvoir annuler
   sans ambiguïté. Volontairement indépendant de sheep.agnelages : si les
   deux coexistent pour la même campagne (mise bas ET vide définitive), on
   ne corrige rien silencieusement — voir l'alerte "Incohérences fin de
   campagne" du Bilan de campagne, à corriger à la main. */
function estVideDefinitiveCampagne(sheep) {
  const list = Array.isArray(sheep.videesDefinitives) ? sheep.videesDefinitives : [];
  return list.some(v => v && v.campagne === DB.campagneDebut);
}
function marquerVideDefinitive(sheep) {
  if (estVideDefinitiveCampagne(sheep)) return; // idempotent : pas de doublon si déjà marquée cette campagne
  sheep.videesDefinitives = sheep.videesDefinitives || [];
  sheep.videesDefinitives.push({ campagne: DB.campagneDebut, date: new Date().toISOString().slice(0,10) });
}
function annulerVideDefinitive(sheep) {
  if (!Array.isArray(sheep.videesDefinitives)) return;
  const idx = sheep.videesDefinitives.findIndex(v => v && v.campagne === DB.campagneDebut);
  if (idx !== -1) sheep.videesDefinitives.splice(idx, 1);
}

/* Chiffres-clé de la campagne en cours, partagés par l'écran d'accueil et
   le Bilan de campagne :
   - Troupeau à mettre bas = actives − vides définitives
   - Mises bas restantes attendues = troupeau à mettre bas − mises bas déjà réalisées
   Une brebis à la fois "mise bas" et "vide définitive" (incohérence, voir
   l'alerte dédiée du Bilan de campagne) compte comme mise bas ici — on ne
   veut pas qu'une donnée contradictoire fasse passer "mises bas restantes"
   en négatif ; Math.max(0, …) protège en plus contre ce cas. */
function campagneBilanChiffres(activeList) {
  const misesBasActives = activeList.filter(s => s.agnelages && s.agnelages.length > 0).length;
  const videsDefinitivesActives = activeList.filter(s => estVideDefinitiveCampagne(s) && !(s.agnelages && s.agnelages.length > 0)).length;
  const troupeauAMettreBas = activeList.length - videsDefinitivesActives;
  const misesBasRestantes = Math.max(0, troupeauAMettreBas - misesBasActives);
  return { misesBasActives, videsDefinitivesActives, troupeauAMettreBas, misesBasRestantes };
}

/* Taux de réussite global (gestantes / brebis échographiées sur leur
   dernière écho) — n'a de sens qu'en fin de campagne, affiché uniquement
   dans Bilan de campagne (voir renderBilanCampagne). */
function tauxReussiteGlobal(activeList) {
  let gestantes = 0, avecEcho = 0;
  activeList.forEach(s => {
    const last = s.echographies[s.echographies.length - 1];
    if (!last) return;
    avecEcho++;
    if (isGestanteEcho(last)) gestantes++;
  });
  return { avecEcho, gestantes, taux: avecEcho > 0 ? Math.round((gestantes / avecEcho) * 1000) / 10 : 0 };
}

/* Date de référence pour "brebis présentes" (voir campagneCohortPresente
   ci-dessous) : la date RÉELLE du clic sur "Démarrer une nouvelle campagne"
   (DB.campagneDateDemarrage, posée à la bascule agnelles→brebis) si elle a
   été enregistrée pour cette campagne — plus fidèle que toute date calculée,
   puisque c'est le vrai instant où le troupeau a basculé. À défaut (campagne
   démarrée avant l'ajout de ce champ), repli sur le 1er octobre calculé de
   l'année de campagne, comme avant. Jamais recalculée rétroactivement : une
   campagne déjà en cours garde son 1er octobre calculé pour toujours. */
function campagneRefDate() {
  if (DB.campagneDateDemarrage) return new Date(DB.campagneDateDemarrage);
  if (DB.campagneDebut) return new Date(DB.campagneDebut, 9, 1); // 1er octobre (mois 9 = octobre, 0-indexé)
  return null;
}

/* Reconstruit la population de brebis "présentes" à la date de référence de
   la campagne en cours (voir campagneRefDate) — l'appli ne garde pas
   d'instantané du troupeau à une date passée, donc on le déduit de
   l'historique de mouvements de chaque brebis (actives ou non aujourd'hui).
   Une brebis compte si elle était déjà entrée avant cette date ET pas
   encore sortie à cette date : une vente ou une mort survenue PENDANT la
   campagne ne la retire pas de cette population, puisqu'elle était bien là
   au démarrage. Sert de base à statsDetailleesParGroupeAge, pour que toutes
   ses lignes restent cohérentes entre elles (sinon une vente en cours de
   campagne gonflerait artificiellement "% mises bas"). Sans date de
   référence disponible (campagne non configurée du tout), retombe sur les
   brebis actives aujourd'hui. */
function campagneCohortPresente() {
  const refDate = campagneRefDate();
  if (!refDate) return DB.brebis.filter(s => (s.statut || 'active') === 'active');
  return DB.brebis.filter(s => {
    const mouvements = s.mouvements || [];
    const entreeMvt = mouvements.find(m => m.type === 'Entrée');
    const entreeDateStr = (entreeMvt && entreeMvt.date) || s.dateEntree || null;
    const entreeDate = entreeDateStr ? new Date(entreeDateStr) : (s.createdAt ? new Date(s.createdAt) : null);
    if (!entreeDate || isNaN(entreeDate.getTime()) || entreeDate > refDate) return false; // entrée après la date de référence : pas présente au démarrage
    if ((s.statut || 'active') === 'active') return true;
    // Inactive aujourd'hui : ne compte que si sa sortie a eu lieu APRÈS la date de référence.
    const sortieMvt = [...mouvements].reverse().find(m => ['Vendue', 'Morte', 'Vendue reproduction'].includes(m.type));
    if (!sortieMvt || !sortieMvt.date) return true; // pas de mouvement de sortie retrouvé (anomalie de données) : on la compte plutôt que de la perdre silencieusement
    const sortieDate = new Date(sortieMvt.date);
    return isNaN(sortieDate.getTime()) || sortieDate >= refDate;
  });
}

/* Tableau détaillé de Bilan de reproduction, par groupe d'âge (agnelles de
   1 an / brebis de 2 ans et plus, basé sur l'EID comme partout ailleurs —
   voir campagneCohortPresente ci-dessus pour la population de référence).
   Un agneau adopté n'existe qu'à un seul endroit dans les données (dans
   agnelages de sa mère biologique — le champ adoptif n'est qu'une note,
   jamais une entrée dupliquée chez la mère adoptive), donc pas de risque de
   double-comptage en parcourant simplement les agnelages de chaque brebis.
   Les brebis d'âge 0 (nées cette année, trop jeunes pour la lutte en cours)
   ou d'âge inconnu (EID invalide) sont exclues des deux groupes. */
function statsDetailleesParGroupeAge(cohort) {
  const groupes = {
    '1 an': { presentes: 0, misesBas: 0, males: 0, femelles: 0, mortNes: 0, morts: 0 },
    '2 ans et plus': { presentes: 0, misesBas: 0, males: 0, femelles: 0, mortNes: 0, morts: 0 }
  };
  cohort.forEach(s => {
    const a = age(s.eid);
    if (a === null || a < 1) return;
    const g = groupes[a === 1 ? '1 an' : '2 ans et plus'];
    g.presentes++;
    const agnelages = s.agnelages || [];
    if (agnelages.length === 0) return;
    g.misesBas++; // une brebis ne peut avoir qu'un agnelage par campagne (voir renderAddAgnelage)
    agnelages.forEach(ag => {
      ag.lambs.forEach(l => {
        if (l.sexe === 'Mort-né') { g.mortNes++; g.morts++; }
        else {
          if (l.sexe === 'Mâle') g.males++;
          else if (l.sexe === 'Femelle') g.femelles++;
          if (l.statutFinal === 'mort') g.morts++; // né vivant puis décédé (voir showLambSortieModal)
        }
      });
    });
  });
  const div = (num, den) => den > 0 ? num / den : null;
  return Object.keys(groupes).map(key => {
    const g = groupes[key];
    const nesTotal = g.mortNes + g.males + g.femelles;
    const pctMisesBas = div(g.misesBas, g.presentes);
    const prolificite = div(nesTotal, g.misesBas);
    const pctMortalite = div(g.morts, nesTotal);
    return {
      label: key === '1 an' ? 'Agnelles de 1 an' : 'Brebis de 2 ans et plus',
      presentes: g.presentes,
      misesBas: g.misesBas,
      males: g.males,
      femelles: g.femelles,
      mortNes: g.mortNes,
      morts: g.morts,
      nesTotal,
      pctMisesBas: pctMisesBas !== null ? Math.round(pctMisesBas * 1000) / 10 : null,
      prolificite: prolificite !== null ? Math.round(prolificite * 100) / 100 : null,
      pctMortalite: pctMortalite !== null ? Math.round(pctMortalite * 1000) / 10 : null
    };
  });
}

/* Statut de reproduction d'une brebis pour la campagne EN COURS — utile en
   fin de campagne pour s'assurer qu'aucune brebis ne reste "dans le flou"
   (ex: vide mais jamais confirmée comme telle). Ne considère QUE les
   échographies taguées de la campagne actuelle (voir DB.campagneDebut et le
   champ `campagne` posé sur chaque nouvelle échographie) — les
   échographies plus anciennes ne sont jamais remises à zéro (contrairement
   aux agnelages/mouvements) donc on ne peut pas s'y fier sans ce tag pour
   savoir "où on en est cette campagne".
   - 'Mise bas' : un agnelage existe déjà cette campagne (le plus fiable).
   - 'Vide définitive' : marquage explicite (bouton fiche ou case "dernière
     écho de la campagne"), prioritaire sur toute échographie car c'est une
     décision volontaire de l'éleveur, pas une simple lecture d'écho.
   - 'Non suivie' : aucune échographie taguée de cette campagne pour l'instant.
   - Sinon, dérivé de la dernière échographie de la campagne : cas
     particulier (Avortée/Pseudogestation), gestante en cours, ou vide
     confirmée (provisoire, contrairement à "Vide définitive" ci-dessus). */
function statutReproductionCampagne(sheep) {
  try {
    if (Array.isArray(sheep.agnelages) && sheep.agnelages.length > 0) return 'Mise bas';
    if (estVideDefinitiveCampagne(sheep)) return 'Vide définitive';
    const echos = Array.isArray(sheep.echographies) ? sheep.echographies : [];
    const echosCampagne = echos.filter(e => e && e.campagne === DB.campagneDebut);
    if (echosCampagne.length === 0) return 'Non suivie';
    const dernier = echosCampagne[echosCampagne.length - 1];
    if (dernier.special === 'Avortée') return 'Avortée';
    if (dernier.special === 'Pseudogestation') return 'Pseudogestation';
    if (isGestanteEcho(dernier)) return 'Gestante (en cours)';
    return 'Vide confirmée';
  } catch (e) {
    return 'Non suivie'; // donnée inattendue — mieux vaut la lister comme "à suivre" que planter l'écran
  }
}

/* ---------- Bip sonore de confirmation de scan ---------- */
function playBeep(freq, dur, type) {
  freq = freq || 880;
  dur = dur || 0.15;
  type = type || 'sine';
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch (e) { /* audio non disponible, on ignore silencieusement */ }
}

function playBeepTrouve() {
  playBeep(1046, 0.1);
  setTimeout(() => playBeep(1568, 0.15), 110);
}
function playBeepRate() {
  playBeep(220, 0.35, 'square');
}
function playBeepDejaTrouve() {
  playBeep(440, 0.2, 'triangle');
}

function attachEidBeep(inputEl) {
  let wasValid = false;
  inputEl.addEventListener('input', () => {
    const v = cleanEid(inputEl.value);
    if (v.length >= 11 && !wasValid) {
      playBeep();
      wasValid = true;
    } else if (v.length < 11) {
      wasValid = false;
    }
  });
}

let editContext = null; // { kind, idx }

function deleteItem(kind, idx) {
  if (kind.startsWith('belier-')) return deleteBelierItem(kind.slice(7), idx);
  if (!confirm('Supprimer cet élément ? Cette action est irréversible.')) return;
  const sheep = findSheep(currentSheepId);
  if (!sheep) return;
  sheep[kind] = sheep[kind] || [];
  sheep[kind].splice(idx, 1);
  if (kind === 'mouvements') {
    const last = sheep.mouvements[sheep.mouvements.length - 1];
    if (!last) sheep.statut = 'active';
    else if (last.type === 'Morte') sheep.statut = 'morte';
    else if (last.type === 'Vendue') sheep.statut = 'vendue';
    else if (last.type === 'Vendue reproduction') sheep.statut = 'vendue reproduction';
  }
  saveData(DB);
  render('detail', sheep.id);
}

function editItem(kind, idx) {
  if (kind.startsWith('belier-')) return editBelierItem(kind.slice(7), idx);
  editContext = { kind, idx };
  const viewMap = { echographies: 'add-echo', agnelages: 'add-agnelage', sanitaire: 'add-sanitaire', mouvements: 'add-mouvement', controleLaitier: 'add-controle' };
  render(viewMap[kind], currentSheepId);
}

function deleteBelierItem(kind, idx) {
  if (!confirm('Supprimer cet élément ? Cette action est irréversible.')) return;
  const belier = DB.beliers.find(b => b.id === currentBelierId);
  if (!belier) return;
  belier[kind] = belier[kind] || [];
  belier[kind].splice(idx, 1);
  if (kind === 'mouvements') {
    const last = belier.mouvements[belier.mouvements.length - 1];
    if (!last) belier.statut = 'actif';
    else if (last.type === 'Mort') belier.statut = 'mort';
    else if (last.type === 'Vendu') belier.statut = 'vendu';
    else if (last.type === 'Vendu reproduction') belier.statut = 'vendu reproduction';
  }
  saveData(DB);
  render('belier-detail');
}

function editBelierItem(kind, idx) {
  editBelierContext = { kind, idx };
  render(kind === 'sanitaire' ? 'add-sanitaire-belier' : 'add-mouvement-belier');
}

function activateSwipes(container) {
  container.querySelectorAll('.swipe-wrap').forEach(wrap => {
    const fg = wrap.querySelector('.swipe-fg');
    let startX = 0, dx = 0, dragging = false;
    fg.addEventListener('pointerdown', e => {
      dragging = true; startX = e.clientX; dx = 0;
      fg.style.transition = 'none';
      try { fg.setPointerCapture(e.pointerId); } catch(err) {}
    });
    fg.addEventListener('pointermove', e => {
      if (!dragging) return;
      dx = e.clientX - startX;
      fg.style.transform = `translateX(${dx}px)`;
    });
    function finish() {
      if (!dragging) return;
      dragging = false;
      fg.style.transition = 'transform 0.2s';
      fg.style.transform = 'translateX(0px)';
      const threshold = 70;
      const kind = wrap.dataset.kind;
      const idx = parseInt(wrap.dataset.idx, 10);
      if (dx > threshold) deleteItem(kind, idx);
      else if (dx < -threshold) editItem(kind, idx);
      dx = 0;
    }
    fg.addEventListener('pointerup', finish);
    fg.addEventListener('pointercancel', finish);
  });
}

/* Filet de sécurité : si un écran plante (donnée inattendue, bug), on
   affiche un écran récupérable plutôt que de laisser #app vide (rien
   d'autre ne se réaffiche ensuite, tant que l'utilisateur ne force pas la
   fermeture de l'appli — voir la discussion du bug "écran blanc" sur le
   Bilan de campagne). Rien n'est perdu : les données ne sont pas touchées
   par une erreur d'affichage. */
function renderCrashScreen(view) {
  pageTitle.textContent = 'Oups';
  btnBack.classList.add('hidden');
  btnMenu.classList.remove('hidden');
  app.innerHTML = `
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px;">Un problème est survenu sur cet écran</div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Rien n'a été perdu. Reviens à l'accueil et réessaie — si ça se reproduit, dis-nous ce que tu faisais juste avant.</div>
      <button type="button" class="btn btn-primary" id="btn-crash-home">Retour à l'accueil</button>
    </div>
  `;
  document.getElementById('btn-crash-home').onclick = () => render('home');
}

/* ---------- KPIs du tableau de bord (fusionnés dans l'écran d'accueil) ---------- */
function dashboardKpiHtml() {
  const active = DB.brebis.filter(s => (s.statut || 'active') === 'active');
  const total = active.length;

  const stadeCount = { 'Début': 0, 'Milieu': 0, 'Fin': 0, 'Vide': 0 };
  let avecEcho = 0;
  active.forEach(s => {
    const last = s.echographies[s.echographies.length - 1];
    if (!last) return;
    avecEcho++;
    if (last.type !== 'constat' && last.stade && stadeCount.hasOwnProperty(last.stade)) {
      stadeCount[last.stade]++;
    }
  });

  let totalMisesBas = 0, totalAgneaux = 0, totalMortNes = 0;
  DB.brebis.forEach(s => {
    (s.agnelages || []).forEach(a => {
      totalMisesBas++;
      a.lambs.forEach(l => {
        totalAgneaux++;
        if (l.sexe === 'Mort-né') totalMortNes++;
      });
    });
  });
  const prolificite = totalMisesBas > 0 ? Math.round((totalAgneaux / totalMisesBas) * 100) / 100 : 0;

  // Troupeau à mettre bas / Mises bas restantes attendues : voir
  // campagneBilanChiffres — même formule qu'au Bilan de campagne, où le
  // taux de réussite global et le détail par groupe d'âge sont affichés
  // (ces indicateurs n'ont de sens qu'en fin de campagne, pas au quotidien).
  const { troupeauAMettreBas, misesBasRestantes } = campagneBilanChiffres(active);

  const attendueTraiteCount = active.filter(s => isAttendueTraite(s)).length;

  const controlesParNumero = { 1: [], 2: [], 3: [] };
  DB.brebis.forEach(s => {
    (s.controleLaitier || []).forEach(c => {
      if (controlesParNumero[c.controle]) controlesParNumero[c.controle].push(c.quantite);
    });
  });
  function moyenne(arr) {
    return arr.length > 0 ? Math.round((arr.reduce((a,b) => a+b, 0) / arr.length) * 100) / 100 : null;
  }
  const moyenne1 = moyenne(controlesParNumero[1]);
  const moyenne2 = moyenne(controlesParNumero[2]);
  const moyenne3 = moyenne(controlesParNumero[3]);
  const totalControles = controlesParNumero[1].length + controlesParNumero[2].length + controlesParNumero[3].length;

  function bar(label, count, color) {

    <div style="height:10px;background:#eee;border-radius:6px;overflow:hidden;margin-bottom:10px;">
      <div style="height:100%;width:${pct}%;background:${color};"></div>
    </div>`;

      <div class="stat-card sc-indigo">
        ${iconCircle(ICON_RAM, 'indigo', 'sm')}
        <div class="stat-card-label" style="margin-top:8px;">Béliers actifs</div>
        <div class="stat-card-value">${(DB.beliers||[]).filter(b=>(b.statut||'actif')==='actif').length}</div>
      </div>
      <div class="stat-card sc-amber">
        ${iconCircle(ICON_SHEEP, 'amber', 'sm')}
        <div class="stat-card-label" style="margin-top:8px;">Mises bas (campagne)</div>
        <div class="stat-card-value">${totalMisesBas}</div>
        <div class="stat-card-sub">${totalAgneaux} agneaux nés, dont ${totalMortNes} mort-né(s)</div>
      </div>
      <div class="stat-card sc-amber">
        ${iconCircle(ICON_SHEEP, 'amber', 'sm')}
        <div class="stat-card-label" style="margin-top:8px;">Prolificité</div>

        <div>
          <div style="font-size:12px;color:var(--text-muted);">2e contrôle</div>
          <div style="font-size:20px;font-weight:600;color:var(--blue-fg);">${moyenne2 !== null ? moyenne2 + ' L' : '—'}</div>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text-muted);">3e contrôle</div>
          <div style="font-size:20px;font-weight:600;color:var(--blue-fg);">${moyenne3 !== null ? moyenne3 + ' L' : '—'}</div>
        </div>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:10px;">${totalControles} relevé(s) enregistré(s) au total</div>
    </div>
  `;
}

/* ---------- Écran d'accueil ----------
   Vue d'ensemble de l'exploitation (pastilles, KPIs) — distincte de l'onglet
   "Brebis" du menu, qui n'affiche que l'inventaire pur et son propre scan
   (voir renderList ci-dessous). */
function renderHome() {
  const actives = DB.brebis.filter(s => (s.statut || 'active') === 'active');
  pageTitle.textContent = 'Mon troupeau';

  const nbBeliersActifs = DB.beliers.filter(b => (b.statut || 'actif') === 'actif').length;
  const hero = document.createElement('div');
  hero.className = 'home-hero';
  hero.innerHTML = `
    <div class="stat-pill" id="hero-brebis">
      ${iconCircle(ICON_SHEEP, 'green', 'lg')}
      <div><div class="stat-value">${actives.length}</div><div class="stat-label">Brebis</div></div>
    </div>
    <div class="stat-pill" id="hero-agnelles">
      ${iconCircle(ICON_SHEEP, 'amber', 'lg')}
      <div><div class="stat-value">${(DB.agnelles || []).length}</div><div class="stat-label">Agnelles</div></div>
    </div>
    <div class="stat-pill" id="hero-beliers">
      ${iconCircle(ICON_RAM, 'indigo', 'lg')}
      <div><div class="stat-value">${nbBeliersActifs}</div><div class="stat-label">Béliers</div></div>
    </div>
  `;
  app.appendChild(hero);
  hero.querySelector('#hero-brebis').onclick = () => render('list');
  hero.querySelector('#hero-agnelles').onclick = () => render('agnelles');
  hero.querySelector('#hero-beliers').onclick = () => render('beliers');

  const dashboard = document.createElement('div');
  dashboard.innerHTML = dashboardKpiHtml();
  app.appendChild(dashboard);
  const kpiAgnelles = document.getElementById('kpi-agnelles');
  if (kpiAgnelles) kpiAgnelles.onclick = () => render('agnelles');
  const kpiAttendues = document.getElementById('kpi-attendues-traite');
  if (kpiAttendues) kpiAttendues.onclick = () => {
    openAutoLot('auto-attendues-traite', 'Attendues à la traite', actives.filter(isAttendueTraite).map(s => s.eid));
  };
  const kpiBilan = document.getElementById('kpi-bilan-campagne');
  if (kpiBilan) kpiBilan.onclick = () => render('bilan-campagne');
}

/* ---------- Onglet "Brebis" du menu ----------
   Inventaire pur : uniquement la liste des brebis actives, sans les cadres
   de stats (déplacés sur l'écran d'accueil, voir renderHome ci-dessus) —
   même logique que les onglets Béliers/Agneaux. */
function renderList() {
  const actives = DB.brebis.filter(s => (s.statut || 'active') === 'active');
  pageTitle.textContent = 'Brebis (' + actives.length + ')';

  const scanCard = document.createElement('div');
  scanCard.className = 'card';
  scanCard.innerHTML = `
    <label>Scanner une brebis pour ouvrir sa fiche</label>
    <input type="text" id="scan-open" placeholder="Scanner ou saisir l'EID" autofocus>
    <div id="scan-open-err" class="error-box hidden"></div>
  `;
  app.appendChild(scanCard);
  const scanOpen = document.getElementById('scan-open');
  scanOpen.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const val = cleanEid(scanOpen.value);
    const err = document.getElementById('scan-open-err');
    if (!val) return;
    const sheep = DB.brebis.find(s => cleanEid(s.eid) === val);
    if (!sheep) {
      playBeepRate();
      err.textContent = "Aucune brebis trouvée avec cet EID.";
      err.classList.remove('hidden');
      return;
    }
    playBeepTrouve();
    detailOrigin = 'list';
    previousDetailId = null;
    render('detail', sheep.id);
  });

  if (actives.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.innerHTML = 'Aucune brebis active pour l\'instant.<br>Appuie sur le bouton + pour en ajouter une.';
    app.appendChild(empty);
    return;
  }
  const sorted = sortByAge(actives);
  sorted.forEach(sheep => {
    const lastAgnelage = (sheep.agnelages || [])[sheep.agnelages.length - 1];
    const badgeHtml = isAttendueTraite(sheep)
      ? `<span class="badge badge-blue">Attendue à la traite</span>`
      : lastAgnelage
        ? `<span class="badge badge-amber">${lastAgnelage.date} · ${lastAgnelage.lambs.length} agn.</span>`
        : `<span class="badge badge-muted">Aucun agnelage</span>`;
    // Statut de reproduction de la campagne : redondant avec badgeHtml pour
    // "Mise bas" (déjà visible ci-dessus) et sans intérêt pour "Non suivie"
    // (pas encore d'échographie cette campagne) — affiché uniquement pour
    // les statuts qui apportent une information nouvelle.
    const repro = statutReproductionCampagne(sheep);
    const reproBadgeHtml = repro === 'Vide confirmée' ? `<span class="badge badge-gray">Vide confirmée</span>`
      : repro === 'Avortée' ? `<span class="badge badge-coral">Avortée</span>`
      : repro === 'Pseudogestation' ? `<span class="badge badge-indigo">Pseudogestation</span>`
      : repro === 'Gestante (en cours)' ? `<span class="badge badge-green">Gestante</span>`
      : '';
    const div = document.createElement('div');
    div.className = 'sheep-item';
    div.innerHTML = `
      <div class="sheep-item-left">
        ${iconCircle(ICON_SHEEP, 'green')}
        <div>
          <div class="num">Brebis n°${numeroVisuel(sheep.eid)}</div>
          <div class="sub">${age(sheep.eid) !== null ? age(sheep.eid) + ' an(s)' : 'âge inconnu'}</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;">${badgeHtml}${reproBadgeHtml}</div>
    `;
    div.onclick = () => { detailOrigin = 'list'; previousDetailId = null; render('detail', sheep.id); };
    app.appendChild(div);
  });
}

/* Une ligne "brebis" cliquable (numéro + âge), réutilisée par les deux
   onglets de Bilan de campagne — le clic ouvre toujours sa fiche (voir le
   wiring commun .bilan-eid-link dans renderBilanCampagne). */
function bilanBrebisRowsHtml(list) {
  return sortByAge(list).map(s => `
    <div class="bilan-eid-link" data-id="${s.id}" style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);cursor:pointer;">
      <span style="font-size:14px;">n°${numeroVisuel(s.eid)}</span>
      <span style="font-size:12px;color:var(--text-muted);">${age(s.eid) !== null ? age(s.eid) + ' an(s)' : 'âge inconnu'}</span>
    </div>
  `).join('');
}

/* ---------- Bilan de campagne ----------
   Deux onglets, sur une variable d'état locale (même principe que
   l'Inventaire Brebis/Béliers/Agneaux) :
   - "Incohérences fin de campagne" : ce qui reste à vérifier ou à corriger
     avant la clôture — brebis sans aucun suivi, et les deux issues connues
     (mise bas / vide définitive), plus l'alerte de contradiction.
   - "Bilan de reproduction" : les indicateurs chiffrés qui n'ont de sens
     qu'en fin de campagne (taux de réussite, troupeau à mettre bas, détail
     par groupe d'âge) — voir campagneBilanChiffres/tauxReussiteGlobal/
     statsDetailleesParGroupeAge.
   Les statuts intermédiaires (Gestante en cours, Vide confirmée, Avortée,
   Pseudogestation) ne sont pas repris ici : ils restent visibles sur la
   fiche de chaque brebis et en badge dans l'onglet "Brebis" du menu. */
function renderBilanCampagne() {
  pageTitle.textContent = 'Bilan de campagne';
  const actives = DB.brebis.filter(s => (s.statut || 'active') === 'active');

  const tabs = [
    { key: 'incoherences', label: 'Incohérences fin de campagne' },
    { key: 'reproduction', label: 'Bilan de reproduction' }
  ];
  const tabBarHtml = `<div class="tab-bar">${tabs.map(t =>
    `<button type="button" class="tab-btn${bilanCampagneTab === t.key ? ' active' : ''}" data-tab="${t.key}">${t.label}</button>`
  ).join('')}</div>`;

  const bodyHtml = bilanCampagneTab === 'incoherences' ? bilanIncoherencesHtml(actives) : bilanReproductionHtml(actives);

  app.innerHTML = tabBarHtml + bodyHtml;

  document.querySelectorAll('.tab-bar .tab-btn').forEach(btn => {
    btn.onclick = () => { bilanCampagneTab = btn.dataset.tab; render('bilan-campagne'); };
  });
  document.querySelectorAll('.bilan-eid-link').forEach(el => {
    el.onclick = () => { detailOrigin = 'bilan-campagne'; previousDetailId = null; render('detail', el.dataset.id); };
  });
}

function bilanIncoherencesHtml(actives) {
  const groupes = { 'Non suivie': [], 'Mise bas': [], 'Vide définitive': [] };
  actives.forEach(s => {
    const statut = statutReproductionCampagne(s);
    if (groupes[statut]) groupes[statut].push(s);
  });

  // Incohérence fin de campagne : mise bas ET vide définitive enregistrées
  // pour la même brebis cette campagne. Volontairement non corrigée toute
  // seule (voir marquerVideDefinitive/renderAddAgnelage) — listée ici pour
  // une correction manuelle, en plus du bouton "Annuler" déjà sur la fiche.
  const incoherentes = actives.filter(s => (s.agnelages && s.agnelages.length > 0) && estVideDefinitiveCampagne(s));

  // "Non suivie" en tête : c'est la liste la plus actionnable (aucune info
  // de reproduction cette campagne — ni écho, ni mise bas, ni vide définitive —
  // donc celle à vérifier en priorité pour ne rien laisser passer).
  const config = [
    { key: 'Non suivie', label: 'Non suivies', color: 'amber', intro: "Aucune information de reproduction cette campagne (ni échographie, ni mise bas) — à vérifier en priorité." },
    { key: 'Mise bas', label: 'Ont mis bas', color: 'green' },
    { key: 'Vide définitive', label: 'Vides définitives', color: 'blue' }
  ];

  return `
    <div style="font-size:13px;color:var(--text-muted);margin:2px 2px 14px;">Ce qui reste à vérifier ou à corriger avant la clôture de la campagne en cours (${DB.campagneDebut ? DB.campagneDebut + 1 : 'année non définie'}).</div>

    ${incoherentes.length > 0 ? `
    <div class="card" style="border-color:var(--danger);margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
        ${iconCircle(ICON_WARNING, 'coral', 'sm')}
        <div style="font-weight:700;color:var(--coral-fg);">Incohérences fin de campagne (${incoherentes.length})</div>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">Mise bas ET vide définitive enregistrées pour ces brebis cette campagne — à corriger toi-même sur leur fiche (bouton "Annuler" du statut reproduction).</div>
      <div>${bilanBrebisRowsHtml(incoherentes)}</div>
    </div>
    ` : ''}

    ${config.map(c => {
      const list = groupes[c.key] || [];
      if (list.length === 0) return '';
      return `<div class="card" style="margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span class="badge badge-${c.color}">${c.label}</span>
          <span style="font-size:13px;color:var(--text-muted);">${list.length} brebis (${actives.length > 0 ? Math.round(list.length / actives.length * 1000) / 10 : 0}%)</span>
        </div>
        ${c.intro ? `<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">${c.intro}</div>` : ''}
        <div>${bilanBrebisRowsHtml(list)}</div>
      </div>`;
    }).join('') || (actives.length === 0 ? '<div class="empty">Aucune brebis active.</div>' : '')}
  `;
}

function bilanReproductionHtml(actives) {
  const { troupeauAMettreBas, misesBasRestantes } = campagneBilanChiffres(actives);
  const { avecEcho, taux: tauxReussite } = tauxReussiteGlobal(actives);

  // Population de référence du tableau détaillé ci-dessous : brebis
  // présentes à la date de référence de la campagne (voir campagneRefDate/
  // campagneCohortPresente), pas les actives d'aujourd'hui — pour rester
  // cohérente avec elle-même (une vente en cours de campagne ne doit pas
  // gonfler "% mises bas").
  const cohort = campagneCohortPresente();
  const refDateLabel = DB.campagneDateDemarrage
    ? new Date(DB.campagneDateDemarrage).toLocaleDateString('fr-FR') + ' (date du changement de campagne)'
    : DB.campagneDebut
    ? '1<sup>er</sup> octobre ' + DB.campagneDebut + ' (date calculée, campagne démarrée avant l\'enregistrement de cette date)'
    : null;
  const [g1An, g2AnsPlus] = statsDetailleesParGroupeAge(cohort);
  const rows = [
    { label: 'Brebis présentes', v1: g1An.presentes, v2: g2AnsPlus.presentes },
    { label: 'Brebis ayant mis bas', v1: g1An.misesBas, v2: g2AnsPlus.misesBas },
    { label: 'Mâles nés', v1: g1An.males, v2: g2AnsPlus.males },
    { label: 'Femelles nées', v1: g1An.femelles, v2: g2AnsPlus.femelles },
    { label: 'Mort-nés', v1: g1An.mortNes, v2: g2AnsPlus.mortNes },
    { label: 'Agneaux morts totaux', v1: g1An.morts, v2: g2AnsPlus.morts },
    { label: 'Agneaux nés totaux', v1: g1An.nesTotal, v2: g2AnsPlus.nesTotal },
    { label: '% mises bas', v1: g1An.pctMisesBas !== null ? g1An.pctMisesBas + '%' : '—', v2: g2AnsPlus.pctMisesBas !== null ? g2AnsPlus.pctMisesBas + '%' : '—' },
    { label: 'Prolificité', v1: g1An.prolificite !== null ? g1An.prolificite : '—', v2: g2AnsPlus.prolificite !== null ? g2AnsPlus.prolificite : '—' },
    { label: '% mortalité', v1: g1An.pctMortalite !== null ? g1An.pctMortalite + '%' : '—', v2: g2AnsPlus.pctMortalite !== null ? g2AnsPlus.pctMortalite + '%' : '—' }
  ];

  return `
    <div style="font-size:13px;color:var(--text-muted);margin:2px 2px 14px;">Indicateurs de reproduction de la campagne en cours (${DB.campagneDebut ? DB.campagneDebut + 1 : 'année non définie'}) — n'ont de sens qu'une fois la campagne suffisamment avancée.</div>

    <div class="card" style="margin-bottom:10px;">
      <div style="font-size:14px;font-weight:600;margin-bottom:10px;">Troupeau à mettre bas</div>
      <div class="grid2">
        <div><div style="font-size:12px;color:var(--text-muted);">Troupeau à mettre bas</div><div style="font-size:20px;font-weight:600;">${troupeauAMettreBas}</div></div>
        <div><div style="font-size:12px;color:var(--text-muted);">Mises bas restantes attendues</div><div style="font-size:20px;font-weight:600;">${misesBasRestantes}</div></div>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:10px;">Troupeau actif total moins les brebis vides définitives ; mises bas restantes = troupeau à mettre bas moins les mises bas déjà réalisées.</div>
    </div>

    <div class="card" style="margin-bottom:10px;">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Taux de réussite</div>
      <div style="font-size:20px;font-weight:600;">${tauxReussite}%</div>
      <div style="font-size:12px;color:var(--text-muted);">Sur ${avecEcho} brebis échographiées (dernière échographie)</div>
    </div>

    <div class="card" style="margin-bottom:10px;">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Bilan détaillé par groupe d'âge</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Population de référence : brebis présentes le ${refDateLabel || 'campagne non définie, brebis actives aujourd\'hui utilisées à la place'}. Colonnes : agnelles de 1 an (première reproduction) / brebis de 2 ans et plus.</div>
      <div style="overflow-x:auto;">
        <table style="width:100%;font-size:13px;border-collapse:collapse;min-width:300px;">
          <tr style="color:var(--text-muted);text-align:left;">
            <th style="padding:4px 4px;font-weight:500;">Indicateur</th>
            <th style="padding:4px 4px;font-weight:500;text-align:right;">1 an</th>
            <th style="padding:4px 4px;font-weight:500;text-align:right;">2 ans+</th>
          </tr>
          ${rows.map(r => `
            <tr style="border-top:1px solid var(--border);">
              <td style="padding:6px 4px;">${r.label}</td>
              <td style="padding:6px 4px;text-align:right;">${r.v1}</td>
              <td style="padding:6px 4px;text-align:right;">${r.v2}</td>
            </tr>
          `).join('')}
        </table>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:10px;">% mises bas = brebis ayant mis bas ÷ brebis présentes. Prolificité = agneaux nés totaux ÷ brebis ayant mis bas. % mortalité = agneaux morts totaux ÷ agneaux nés totaux.</div>
    </div>
  `;
}

/* ---------- Sorties (brebis mortes / vendues) ---------- */
function inventaireBrebisHtml() {
  const sorties = DB.brebis.filter(s => (s.statut || 'active') !== 'active');
  if (sorties.length === 0) return '<div class="empty">Aucune brebis sortie du troupeau pour l\'instant.</div>';
  const sorted = sortByAge(sorties);
  return sorted.map(sheep => `
    <div class="sheep-item inventaire-brebis-item" data-id="${sheep.id}" style="opacity:0.7;">
      <div class="sheep-item-left">
        ${iconCircle(ICON_SHEEP, 'coral')}
        <div>
          <div class="num">Brebis n°${numeroVisuel(sheep.eid)}</div>
          <div class="sub">${age(sheep.eid) !== null ? age(sheep.eid) + ' an(s)' : 'âge inconnu'}</div>
        </div>
      </div>
      <span class="badge badge-muted">${sheep.statut}</span>
    </div>
  `).join('');
}
function wireInventaireBrebis() {
  document.querySelectorAll('.inventaire-brebis-item').forEach(div => {
    div.onclick = () => {
      detailOrigin = 'inventaire';
      previousDetailId = null;
      render('detail', div.dataset.id);
    };
  });
}

function inventaireBeliersHtml() {
  const sorties = (DB.beliers || []).filter(b => (b.statut || 'actif') !== 'actif');
  if (sorties.length === 0) return '<div class="empty">Aucun bélier sorti pour l\'instant.</div>';
  const sorted = sortByAge(sorties);
  return sorted.map(b => `
    <div class="sheep-item inventaire-belier-item" data-id="${b.id}" style="opacity:0.7;">
      <div class="sheep-item-left">
        ${iconCircle(ICON_RAM, 'coral')}
        <div>
          <div class="num">Bélier n°${numeroVisuel(b.eid)}</div>
          <div class="sub">${age(b.eid) !== null ? age(b.eid) + ' an(s)' : 'âge inconnu'}</div>
        </div>
      </div>
      <span class="badge badge-muted">${b.statut}</span>
    </div>
  `).join('');
}
function wireInventaireBeliers() {
  document.querySelectorAll('.inventaire-belier-item').forEach(div => {
    div.onclick = () => {
      currentBelierId = div.dataset.id;
      belierDetailOrigin = 'inventaire';
      render('belier-detail');
    };
  });
}

function inventaireAgneauxHtml() {
  const items = [];
  DB.brebis.forEach(sheep => {
    (sheep.agnelages || []).forEach(a => {
      a.lambs.forEach(l => {
        if (l.sexe === 'Mort-né') return; // déjà visible dans l'historique d'agnelage
        if (l.sexe === 'Femelle' && l.triStatut === 'gardée') return; // renouvelée, pas une sortie
        if (l.statutFinal !== 'vendu' && l.statutFinal !== 'mort') return;
        items.push({ lamb: l, mereEid: sheep.eid, date: a.date });
      });
    });
  });
  if (items.length === 0) return '<div class="empty">Aucun agneau vendu ou mort pour l\'instant.</div>';
  return sortLambItemsByAge(items).map(it => `
    <div class="sheep-item inventaire-agneau-item" data-mere-eid="${it.mereEid}">
      <div class="sheep-item-left">
        ${iconCircle(ICON_SHEEP, 'coral')}
        <div>
          <div class="num">n°${it.lamb.eid ? numeroVisuel(it.lamb.eid) : '?'} — ${it.lamb.sexe}</div>
          <div class="sub">Né le ${it.date} de la brebis n°${numeroVisuel(it.mereEid)}</div>
        </div>
      </div>
      <span class="badge badge-muted">${it.lamb.statutFinal === 'vendu' ? 'Vendu' : 'Mort'}</span>
    </div>
  `).join('');
}
function wireInventaireAgneaux() {
  document.querySelectorAll('.inventaire-agneau-item').forEach(div => {
    div.onclick = () => {
      const mother = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(div.dataset.mereEid));
      if (!mother) { alert("Fiche de la mère introuvable (peut-être supprimée)."); return; }
      detailOrigin = 'inventaire';
      previousDetailId = null;
      render('detail', mother.id);
    };
  });
}

function renderInventaire() {
  pageTitle.textContent = 'Inventaire';
  const tabs = [
    { key: 'brebis', label: 'Brebis' },
    { key: 'beliers', label: 'Béliers' },
    { key: 'agneaux', label: 'Agneaux' }
  ];
  const tabBarHtml = `<div class="tab-bar">${tabs.map(t =>
    `<button type="button" class="tab-btn${inventaireTab === t.key ? ' active' : ''}" data-tab="${t.key}">${t.label}</button>`
  ).join('')}</div>`;

  const bodyHtml = inventaireTab === 'brebis' ? inventaireBrebisHtml()
    : inventaireTab === 'beliers' ? inventaireBeliersHtml()
    : inventaireAgneauxHtml();

  // Le bouton est placé AU-DESSUS des onglets Brebis/Béliers/Agneaux et
  // affiché quel que soit l'onglet actif : le mouvement groupé choisit sa
  // propre catégorie à l'intérieur de son propre écran (voir
  // renderMouvementGroupe), donc les onglets de l'Inventaire — qui ne
  // gouvernent que la liste des sorties affichée ci-dessous — n'ont aucun
  // effet sur lui. Les montrer juste au-dessus du bouton laissait croire
  // le contraire.
  app.innerHTML = `
    <button class="btn btn-secondary" id="btn-mouvement-groupe" style="border-color:var(--danger);color:var(--danger);margin-bottom:14px;">Mouvement groupé (vente / sortie multiple)</button>
    ${tabBarHtml}
    ${bodyHtml}
  `;

  document.getElementById('btn-mouvement-groupe').onclick = () => render('mouvement-groupe');
  document.querySelectorAll('.tab-bar .tab-btn').forEach(btn => {
    btn.onclick = () => { inventaireTab = btn.dataset.tab; render('inventaire'); };
  });

  if (inventaireTab === 'brebis') wireInventaireBrebis();
  else if (inventaireTab === 'beliers') wireInventaireBeliers();
  else wireInventaireAgneaux();
}

/* ---------- Fiche détail brebis ---------- */
function findSheep(id) { return DB.brebis.find(s => s.id === id); }

function findLambByEid(eid) {
  for (const sheep of DB.brebis) {
    for (const ag of (sheep.agnelages || [])) {
      for (const l of ag.lambs) {
        if (l.eid && cleanEid(l.eid) === cleanEid(eid)) return l;
      }
    }
  }
  return null;
}

function isLambResolved(l) {
  if (l.sexe === 'Mort-né') return true;
  if (l.sexe === 'Femelle' && l.triStatut === 'gardée') return true;
  if (l.statutFinal === 'vendu' || l.statutFinal === 'mort') return true;
  return false;
}

/* ---------- Traçabilité des agneaux (entrée à la naissance, sortie vendu/mort) ----------
   Les agneaux restent stockés comme sous-objets dans sheep.agnelages[].lambs
   (pas de collection séparée) mais portent désormais leur propre carnet de
   mouvements, comme une brebis ou un bélier : une "Entrée" (Naissance) posée
   une fois qu'ils sont bouclés, et une "Sortie" (Vendu/Mort) quand leur
   devenir est décidé — tracée dans le registre d'élevage au même titre que
   les autres catégories (voir lambMouvementsRows()). */
function ensureLambEntreeMouvement(l, dateNaissance) {
  if (!l.eid || l.sexe === 'Mort-né') return; // pas bouclé, ou mort-né : rien à tracer
  l.mouvements = l.mouvements || [];
  if (!l.mouvements.some(m => m.type === 'Entrée')) {
    l.mouvements.push({ type: 'Entrée', cause: 'Naissance', date: dateNaissance });
  }
}

/* Affiche le formulaire de sortie (Vendu : date + acheteur ; Mort : date
   seule), avec confirmation, puis trace le mouvement sur l'agneau. */
function showLambSortieModal(lamb, type, onDone) {
  const isVendu = type === 'vendu';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const today = new Date().toISOString().slice(0,10);
  let acheteur = null;
  overlay.innerHTML = `
    <div class="modal-card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        ${iconCircle(ICON_SHEEP, 'coral', 'md')}
        <div>
          <div style="font-weight:700;font-size:15px;">${isVendu ? 'Vendre' : 'Déclarer mort'} l'agneau n°${lamb.eid ? numeroVisuel(lamb.eid) : '?'}</div>
        </div>
      </div>
      ${isVendu ? `
        <label>Acheteur</label>
        <div class="chip-list" id="lambsortie-acheteur-list" style="margin-bottom:8px;"></div>
        <div class="row" style="margin-bottom:14px;"><input type="text" id="lambsortie-new-acheteur" placeholder="Ajouter un nouvel acheteur..."><button type="button" class="btn btn-secondary" id="lambsortie-add-acheteur" style="width:auto;padding:0 16px;">+</button></div>
      ` : ''}
      <label>Date</label>
      <input type="date" id="lambsortie-date" value="${today}" style="margin-bottom:14px;">
      <div id="lambsortie-err" class="error-box hidden"></div>
      <button type="button" class="btn btn-primary" id="lambsortie-confirm" style="background:var(--coral-fg);margin-bottom:8px;">Valider</button>
      <button type="button" class="btn btn-secondary" id="lambsortie-cancel">Annuler</button>
    </div>
  `;
  document.body.appendChild(overlay);

  if (isVendu) {
    function renderAcheteurChips() {
      const list = overlay.querySelector('#lambsortie-acheteur-list');
      list.innerHTML = '';
      (DB.acheteurs || []).forEach(val => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (acheteur === val ? ' selected' : '');
        chip.textContent = val;
        chip.onclick = () => { acheteur = (acheteur === val) ? null : val; renderAcheteurChips(); };
        list.appendChild(chip);
      });
    }
    renderAcheteurChips();
    overlay.querySelector('#lambsortie-add-acheteur').onclick = () => {
      const input = overlay.querySelector('#lambsortie-new-acheteur');
      const val = input.value.trim();
      if (!val) return;
      DB.acheteurs = DB.acheteurs || [];
      if (!DB.acheteurs.includes(val)) DB.acheteurs.push(val);
      saveData(DB); input.value = ''; acheteur = val; renderAcheteurChips();
    };
  }

  overlay.querySelector('#lambsortie-cancel').onclick = () => document.body.removeChild(overlay);
  overlay.querySelector('#lambsortie-confirm').onclick = () => {
    const err = overlay.querySelector('#lambsortie-err');
    const date = overlay.querySelector('#lambsortie-date').value;
    if (!date) { err.textContent = "Choisis une date."; err.classList.remove('hidden'); return; }
    if (isVendu && !acheteur) { err.textContent = "Sélectionne ou ajoute un acheteur."; err.classList.remove('hidden'); return; }
    if (!confirm((isVendu ? 'Confirmer la vente' : 'Confirmer la mort') + ' de l\'agneau n°' + (lamb.eid ? numeroVisuel(lamb.eid) : '?') + ' ?')) return;
    lamb.mouvements = lamb.mouvements || [];
    lamb.mouvements.push({ type: isVendu ? 'Vendu' : 'Mort', cause: isVendu ? null : 'Mort', acheteur: isVendu ? acheteur : null, date });
    lamb.statutFinal = type;
    saveData(DB);
    document.body.removeChild(overlay);
    onDone();
  };
}

/* Annule une sortie déjà saisie (même principe que "Revenir sur le tri"
   pour les agnelles) : retire le dernier mouvement de sortie correspondant
   et remet l'agneau "en attente de devenir". */
function annulerSortieLamb(lamb, onDone) {
  const label = lamb.statutFinal === 'vendu' ? 'cette vente' : 'cette mort';
  if (!confirm('Annuler ' + label + ' ? L\'agneau n°' + (lamb.eid ? numeroVisuel(lamb.eid) : '?') + ' repassera "en attente de devenir".')) return;
  const matchType = lamb.statutFinal === 'vendu' ? 'Vendu' : 'Mort';
  if (Array.isArray(lamb.mouvements)) {
    const idx = lamb.mouvements.map(m => m.type).lastIndexOf(matchType);
    if (idx !== -1) lamb.mouvements.splice(idx, 1);
  }
  delete lamb.statutFinal;
  saveData(DB);
  onDone();
}

function isAttendueTraite(sheep) {
  if (!sheep.agnelages || sheep.agnelages.length === 0) return false;
  const allLambs = sheep.agnelages.flatMap(a => a.lambs);
  if (allLambs.length === 0) return false;
  return allLambs.every(l => isLambResolved(l));
}

/* ---------- Agneaux (vue agrégée, en attente de devenir) ---------- */
/* Tri commun aux listes d'agneaux/agnelles issues d'agnelages : du plus vieux
   au plus jeune par date de naissance exacte (plus précise que l'année
   déduite de l'EID pour des animaux nés la même campagne). */
function sortLambItemsByAge(items) {
  return [...items].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
}

/* Inventaire complet des agneaux bouclés — au même titre que Brebis/
   Béliers, mais sans collection dédiée : ils restent des sous-objets de
   sheep.agnelages[].lambs. Inclut aussi bien ceux en attente de devenir que
   ceux déjà vendus/morts (contrairement à l'ancien écran qui ne montrait
   que les premiers). Les femelles gardées pour le renouvellement ne sont
   pas listées ici : elles ont leur propre roster (Chantier de tri >
   Agnelles, DB.agnelles), avec sa propre gestion de sortie. */
function getAgneauxInventaire() {
  const items = [];
  DB.brebis.forEach(sheep => {
    (sheep.agnelages || []).forEach(a => {
      a.lambs.forEach(l => {
        if (l.sexe === 'Mort-né') return;
        if (l.sexe === 'Femelle' && l.triStatut === 'gardée') return;
        if (!l.eid) return; // pas encore bouclé — pas de traçabilité individuelle possible
        items.push({ lamb: l, mereEid: sheep.eid, date: a.date });
      });
    });
  });
  return sortLambItemsByAge(items);
}
