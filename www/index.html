    </div>
  `;

  const legacyItemHtml = (g) => `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;">
        ${iconCircle(ICON_SANTE, 'coral', 'sm')}
        <div>
          <div style="font-weight:600;">${catLabel(g.categorie)} · ${g.produit || g.type}${g.sousType ? ' · ' + g.sousType : ''}</div>
          <div style="font-size:12px;color:var(--text-muted);">${dateRangeLabel(g.dates)} · ${g.membres.length} ${catLabel(g.categorie).toLowerCase()} · saisie ancienne (sans identifiant)</div>
        </div>
      </div>
      <button type="button" class="btn btn-secondary btn-del-collectif" data-key="legacy:${encodeURIComponent(JSON.stringify([g.categorie, g.type, g.sousType || null, g.produit || null]))}" style="color:var(--danger);border-color:var(--danger);">Supprimer ce traitement collectif</button>
    </div>
  `;

  const recentHtml = DB.traitementsCollectifs.length === 0
    ? '<div class="empty">Aucun traitement collectif enregistré avec identifiant pour l\'instant.</div>'
    : [...DB.traitementsCollectifs].reverse().map(recentItemHtml).join('');

  const legacyHtml = legacyGroups.length === 0 ? '' : `
    <div style="font-size:13px;color:var(--text-muted);margin:18px 2px 8px;">Groupes détectés dans d'anciennes saisies (avant cet écran), regroupés par produit toutes dates confondues — vérifie le nombre d'animaux et la plage de dates avant de supprimer :</div>
    ${legacyGroups.map(legacyItemHtml).join('')}
  `;

  app.innerHTML = `
    <div style="font-size:13px;color:var(--text-muted);margin:2px 2px 14px;">Retrouve un traitement appliqué à plusieurs animaux en une fois et supprime-le d'un coup de toutes les fiches concernées.</div>
    ${recentHtml}
    ${legacyHtml}
  `;

  document.querySelectorAll('.btn-del-collectif').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.key;
      if (key.startsWith('id:')) {
        const id = key.slice(3);
        const t = DB.traitementsCollectifs.find(x => x.id === id);
        if (!t) return;
        if (!confirm('Supprimer ce traitement collectif de ' + t.membres.length + ' ' + catLabel(t.categorie).toLowerCase() + ' ? Cette action est irréversible.')) return;
        const pool = CATEGORIE_ANIMAL_CONFIG[t.categorie || 'brebis'].pool();
        pool.forEach(a => {
          if (!a.sanitaire) return;
          a.sanitaire = a.sanitaire.filter(soin => soin.collectifId !== id);
        });
        DB.traitementsCollectifs = DB.traitementsCollectifs.filter(x => x.id !== id);
      } else {
        const [cat, type, sousType, produit] = JSON.parse(decodeURIComponent(key.slice(7)));
        const g = legacyGroups.find(x => x.categorie === cat && x.type === type && (x.sousType || null) === sousType && (x.produit || null) === produit);
        if (!g) return;
        if (!confirm('Supprimer ce groupe détecté (' + g.membres.length + ' ' + catLabel(cat).toLowerCase() + ', ' + dateRangeLabel(g.dates) + ') ? Cette action est irréversible.')) return;
        const pool = CATEGORIE_ANIMAL_CONFIG[cat || 'brebis'].pool();
        pool.forEach(a => {
          if (!a.sanitaire) return;
          a.sanitaire = a.sanitaire.filter(soin => !(soin.collectif && !soin.collectifId && soin.type === type && (soin.sousType || null) === sousType && (soin.produit || null) === produit));
        });
      }
      saveData(DB);
      render('traitements-collectifs');
    };
  });
}

/* ---------- Registre d'élevage réglementaire (conditionnalité PAC) ----------
   Écran de consultation (lecture seule) qui fusionne, pour chaque EID, les
   données encore actives (fiche en cours) et les données archivées dans
   DB.registre (fiches supprimées ou remises à zéro de campagne) — voir
   archiverDansRegistre(). Conformément à l'arrêté du 5 juin 2000 relatif au
   registre d'élevage (base de la conditionnalité PAC sur ce point) : contenu
   couvrant sanitaire/mises bas/mouvements, conservation 5 ans, édition papier
   possible à partir d'une tenue informatique. */
let registreView = 'agnelage'; // 'agnelage' | 'mouvements' | 'sanitaire'
let registreFiltre = '';
let registreColFiltres = { agnelage: { sexe: '' }, mouvements: { categorie: '', type: '' }, sanitaire: { categorie: '', type: '' } };
const REGISTRE_CATEGORIES = [
  { key: 'brebis', label: 'Brebis' },
  { key: 'beliers', label: 'Bélier' },
  { key: 'agneaux', label: 'Agnelle' }
];

/* Fusionne, pour une catégorie donnée, les animaux encore actifs et ceux
   archivés dans DB.registre (fiches supprimées ou remises à zéro de
   campagne) — voir archiverDansRegistre(). C'est la brique de base des 3
   tableaux de synthèse ci-dessous : chacun y puise ses lignes sans jamais
   ignorer un animal supprimé, tout l'intérêt du registre. */
function registreEntriesFor(categorie) {
  const archive = (DB.registre && DB.registre[categorie]) || {};
  const map = {};
  Object.keys(archive).forEach(eid => {
    const a = archive[eid];
    map[eid] = { eid, actif: false, sanitaire: (a.sanitaire || []).slice(), agnelages: (a.agnelages || []).slice(), mouvements: (a.mouvements || []).slice() };
  });
  const actifs = categorie === 'brebis' ? DB.brebis : categorie === 'beliers' ? DB.beliers : DB.agnelles;
  (actifs || []).forEach(a => {
    if (!map[a.eid]) map[a.eid] = { eid: a.eid, actif: true, sanitaire: [], agnelages: [], mouvements: [] };
    else map[a.eid].actif = true;
    map[a.eid].sanitaire = map[a.eid].sanitaire.concat(a.sanitaire || []);
    map[a.eid].agnelages = map[a.eid].agnelages.concat(a.agnelages || []);
    map[a.eid].mouvements = map[a.eid].mouvements.concat(a.mouvements || []);
  });
  return Object.values(map);
}

/* ---------- Lignes des 3 tableaux de synthèse (toutes catégories confondues) ---------- */
function registreAgnelageRows() {
  const rows = [];
  registreEntriesFor('brebis').forEach(entry => {
    entry.agnelages.forEach(ag => {
      (ag.lambs || []).forEach(l => {
        rows.push({
          mereEid: entry.eid,
          agneauEid: (l.sexe === 'Mort-né' || !l.eid) ? null : l.eid,
          sexe: l.sexe || '?',
          date: ag.date || ''
        });
      });
    });
  });
  rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return rows;
}

/* Mouvements des agneaux bouclés (Entrée à la naissance, Sortie
   Vendu/Mort) — stockés sur le sous-objet lamb lui-même (voir
   ensureLambEntreeMouvement/showLambSortieModal), pas dans une collection
   séparée. On les puise via registreEntriesFor('brebis'), qui fusionne déjà
   les agnelages actifs et archivés de chaque mère — pas besoin d'archivage
   dédié, la traçabilité suit l'agnelage. Catégorie "Agneau" distincte
   d'"Agnelle" (qui désigne le roster de renouvellement, DB.agnelles). */
function lambMouvementsRows() {
  const rows = [];
  registreEntriesFor('brebis').forEach(entry => {
    entry.agnelages.forEach(ag => {
      (ag.lambs || []).forEach(l => {
        if (!l.eid) return; // pas bouclé : pas de traçabilité individuelle possible
        (l.mouvements || []).forEach(m => {
          rows.push({ eid: l.eid, categorie: 'Agneau', type: m.type || '', detail: m.cause || m.acheteur || '', date: m.date || '' });
        });
      });
    });
  });
  return rows;
}

function registreMouvementsRows() {
  const rows = [];
  REGISTRE_CATEGORIES.forEach(c => {
    registreEntriesFor(c.key).forEach(entry => {
      entry.mouvements.forEach(m => {
        rows.push({ eid: entry.eid, categorie: c.label, type: m.type || '', detail: m.cause || m.acheteur || '', date: m.date || '' });
      });
    });
  });
  rows.push(...lambMouvementsRows());
  rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return rows;
}

function registreSanitaireRows() {
  const rows = [];
  REGISTRE_CATEGORIES.forEach(c => {
    registreEntriesFor(c.key).forEach(entry => {
      entry.sanitaire.forEach(s => {
        rows.push({
          eid: entry.eid, categorie: c.label,
          type: (s.type || '') + (s.sousType ? ' · ' + s.sousType : ''),
          produit: s.produit || '', date: s.date || '', dose: s.dose || ''
        });
      });
    });
  });
  rows.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return rows;
}

const REGISTRE_TH = 'text-align:left;padding:8px 10px;border-bottom:2px solid var(--border);white-space:nowrap;font-size:12px;color:var(--text-muted);';
const REGISTRE_TD = 'padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-size:13px;';

/* Construit un <select> de filtre par colonne : les options listent les
   valeurs réellement présentes dans les lignes (calculées AVANT filtrage,
   pour ne jamais faire disparaître une option déjà sélectionnée). */
function registreColSelectHtml(col, label, valeurs, valeurCourante) {
  const distinct = Array.from(new Set(valeurs.filter(Boolean))).sort();
  return `<select class="registre-col-filter" data-col="${col}" style="margin-right:8px;margin-bottom:8px;">
    <option value="">${label} (tous)</option>
    ${distinct.map(v => `<option value="${v}"${v === valeurCourante ? ' selected' : ''}>${v}</option>`).join('')}
  </select>`;
}

/* Chacune des 3 fonctions ci-dessous retourne { controlsHtml, tableHtml } :
   controlsHtml (les <select> de filtre par colonne, propres à ce tableau)
   ne doit être injecté qu'une fois par changement d'onglet — pas à chaque
   frappe dans le champ de recherche numéro, sous peine de perdre le focus
   du champ texte à chaque caractère (voir renderRegistre()). */
/* Applique les filtres actifs (numéro + colonnes) à un tableau du registre.
   Isolé des fonctions *TableHtml ci-dessous pour que l'export .xlsx utilise
   EXACTEMENT la même logique de filtrage que ce que l'écran affiche — voir
   buildRegistreXlsxSheets(). */
function registreAgnelageFilteredRows(filtreNumero, colFiltres) {
  let rows = registreAgnelageRows();
  if (filtreNumero.trim()) {
    const f = filtreNumero.trim().toLowerCase();
    rows = rows.filter(r => numeroVisuel(r.mereEid).toLowerCase().includes(f) || (r.agneauEid && numeroVisuel(r.agneauEid).toLowerCase().includes(f)));
  }
  if (colFiltres.sexe) rows = rows.filter(r => r.sexe === colFiltres.sexe);
  return rows;
}
function registreMouvementsFilteredRows(filtreNumero, colFiltres) {
  let rows = registreMouvementsRows();
  if (filtreNumero.trim()) {
    const f = filtreNumero.trim().toLowerCase();
    rows = rows.filter(r => numeroVisuel(r.eid).toLowerCase().includes(f));
  }
  if (colFiltres.categorie) rows = rows.filter(r => r.categorie === colFiltres.categorie);
  if (colFiltres.type) rows = rows.filter(r => r.type === colFiltres.type);
  return rows;
}
function registreSanitaireFilteredRows(filtreNumero, colFiltres) {
  let rows = registreSanitaireRows();
  if (filtreNumero.trim()) {
    const f = filtreNumero.trim().toLowerCase();
    rows = rows.filter(r => numeroVisuel(r.eid).toLowerCase().includes(f));
  }
  if (colFiltres.categorie) rows = rows.filter(r => r.categorie === colFiltres.categorie);
  if (colFiltres.type) rows = rows.filter(r => r.type === colFiltres.type);
  return rows;
}

function registreAgnelageTableHtml(filtreNumero, colFiltres) {
  const allRows = registreAgnelageRows();
  const controlsHtml = registreColSelectHtml('sexe', 'Sexe', allRows.map(r => r.sexe), colFiltres.sexe);
  const rows = registreAgnelageFilteredRows(filtreNumero, colFiltres);
  const tableHtml = rows.length === 0 ? '<div class="empty">Aucune mise bas ne correspond aux filtres.</div>' : `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">
    <thead><tr><th style="${REGISTRE_TH}">N° mère</th><th style="${REGISTRE_TH}">N° agneau</th><th style="${REGISTRE_TH}">Sexe</th><th style="${REGISTRE_TH}">Date de naissance</th></tr></thead>
    <tbody>${rows.map(r => `
    <tr>
      <td style="${REGISTRE_TD}">n°${numeroVisuel(r.mereEid)}</td>
      <td style="${REGISTRE_TD}">${r.agneauEid ? 'n°' + numeroVisuel(r.agneauEid) : '<span style="color:var(--text-muted);">Mort-né</span>'}</td>
      <td style="${REGISTRE_TD}">${r.sexe}</td>
      <td style="${REGISTRE_TD}">${r.date}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
  return { controlsHtml, tableHtml };
}

function registreMouvementsTableHtml(filtreNumero, colFiltres) {
  const allRows = registreMouvementsRows();
  const controlsHtml =
    registreColSelectHtml('categorie', 'Catégorie', allRows.map(r => r.categorie), colFiltres.categorie) +
    registreColSelectHtml('type', 'Type', allRows.map(r => r.type), colFiltres.type);
  const rows = registreMouvementsFilteredRows(filtreNumero, colFiltres);
  const tableHtml = rows.length === 0 ? '<div class="empty">Aucun mouvement ne correspond aux filtres.</div>' : `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">
    <thead><tr><th style="${REGISTRE_TH}">N°</th><th style="${REGISTRE_TH}">Catégorie</th><th style="${REGISTRE_TH}">Type</th><th style="${REGISTRE_TH}">Cause / détail</th><th style="${REGISTRE_TH}">Date</th></tr></thead>
    <tbody>${rows.map(r => `
    <tr>
      <td style="${REGISTRE_TD}">n°${numeroVisuel(r.eid)}</td>
      <td style="${REGISTRE_TD}">${r.categorie}</td>
      <td style="${REGISTRE_TD}">${r.type}</td>
      <td style="${REGISTRE_TD}">${r.detail}</td>
      <td style="${REGISTRE_TD}">${r.date}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
  return { controlsHtml, tableHtml };
}

function registreSanitaireTableHtml(filtreNumero, colFiltres) {
  const allRows = registreSanitaireRows();
  const controlsHtml =
    registreColSelectHtml('categorie', 'Catégorie', allRows.map(r => r.categorie), colFiltres.categorie) +
    registreColSelectHtml('type', 'Type de soin', allRows.map(r => r.type), colFiltres.type);
  const rows = registreSanitaireFilteredRows(filtreNumero, colFiltres);
  const tableHtml = rows.length === 0 ? '<div class="empty">Aucun soin ne correspond aux filtres.</div>' : `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">
    <thead><tr><th style="${REGISTRE_TH}">N°</th><th style="${REGISTRE_TH}">Catégorie</th><th style="${REGISTRE_TH}">Type de soin</th><th style="${REGISTRE_TH}">Produit</th><th style="${REGISTRE_TH}">Date</th><th style="${REGISTRE_TH}">Dose</th></tr></thead>
    <tbody>${rows.map(r => `
    <tr>
      <td style="${REGISTRE_TD}">n°${numeroVisuel(r.eid)}</td>
      <td style="${REGISTRE_TD}">${r.categorie}</td>
      <td style="${REGISTRE_TD}">${r.type}</td>
      <td style="${REGISTRE_TD}">${r.produit}</td>
      <td style="${REGISTRE_TD}">${r.date}</td>
      <td style="${REGISTRE_TD}">${r.dose}</td>
    </tr>`).join('')}</tbody>
  </table></div>`;
  return { controlsHtml, tableHtml };
}

function registreTableFor(view, filtreNumero, colFiltres) {
  return view === 'agnelage' ? registreAgnelageTableHtml(filtreNumero, colFiltres)
    : view === 'mouvements' ? registreMouvementsTableHtml(filtreNumero, colFiltres)
    : registreSanitaireTableHtml(filtreNumero, colFiltres);
}

/* ---------- Export .xlsx (ZIP + OOXML minimal, sans dépendance) ----------
   Même principe que le lecteur .xlsx utilisé pour l'import CSV/Excel
   (CompressionStream('deflate-raw') pour compresser chaque partie), mais en
   écriture : construit un classeur Excel valide en JS pur. Structure
   alignée sur celle d'un vrai classeur (styles.xml, thème Office par
   défaut, docProps) pour une compatibilité maximale — un classeur qui
   n'a que le strict minimum ouvre parfois avec un avertissement
   "fichier endommagé" dans Excel. */
const XLSX_CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();
function xlsxCrc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = XLSX_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function xlsxDosDateTime(date) {
  const d = date || new Date();
  const dosTime = ((d.getHours() & 0x1F) << 11) | ((d.getMinutes() & 0x3F) << 5) | ((d.getSeconds() >> 1) & 0x1F);
  const dosDate = (((d.getFullYear() - 1980) & 0x7F) << 9) | (((d.getMonth() + 1) & 0xF) << 5) | (d.getDate() & 0x1F);
  return { dosTime, dosDate };
}
async function xlsxDeflateRaw(bytes) {
  const cs = new CompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
/* Construit un fichier ZIP minimal (méthode deflate, pas de zip64) à partir
   d'une liste de {name, data (string ou Uint8Array)}. */
async function xlsxBuildZip(entries) {
  const textEncoder = new TextEncoder();
  const { dosTime, dosDate } = xlsxDosDateTime();
  const localParts = [], centralParts = [];
  let offset = 0;
  for (const entry of entries) {
    const nameBytes = textEncoder.encode(entry.name);
    const dataBytes = typeof entry.data === 'string' ? textEncoder.encode(entry.data) : entry.data;
    const crc = xlsxCrc32(dataBytes);
    const compressed = await xlsxDeflateRaw(dataBytes);

    const localHeader = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(localHeader.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(8, 8, true);
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, compressed.length, true);
    lv.setUint32(22, dataBytes.length, true);
    lv.setUint16(26, nameBytes.length, true);
    localHeader.set(nameBytes, 30);
    localParts.push(localHeader, compressed);

    const centralHeader = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(centralHeader.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(10, 8, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, compressed.length, true);
    cv.setUint32(24, dataBytes.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    centralHeader.set(nameBytes, 46);
    centralParts.push(centralHeader);

    offset += localHeader.length + compressed.length;
  }
  const centralSize = centralParts.reduce((a, p) => a + p.length, 0);
  const centralOffset = offset;
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, centralOffset, true);

  const allParts = [...localParts, ...centralParts, eocd];
  const totalLen = allParts.reduce((a, p) => a + p.length, 0);
  const result = new Uint8Array(totalLen);
  let pos = 0;
  for (const p of allParts) { result.set(p, pos); pos += p.length; }
  return result;
}
function xlsxEscape(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function xlsxColLetter(idx) {
  let n = idx + 1, s = '';
  while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function xlsxSheetXml(rows) {
  const rowsXml = rows.map((row, r) => {
    const cellsXml = row.map((val, c) => {
      const ref = xlsxColLetter(c) + (r + 1);
      if (val === null || val === undefined || val === '') return `<c r="${ref}"/>`;
      if (typeof val === 'number' && isFinite(val)) return `<c r="${ref}"><v>${val}</v></c>`;
      return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xlsxEscape(val)}</t></is></c>`;
    }).join('');
    return `<row r="${r + 1}">${cellsXml}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rowsXml}</sheetData></worksheet>`;
}

/* sheets : [{name, rows: [[...], ...]}] (1re ligne = en-têtes). Retourne les
   octets du classeur .xlsx complet. */
async function buildXlsxWorkbook(sheets) {
  const now = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
  <Default Extension="xml" ContentType="application/xml"/>
  <Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
  <Override PartName="/xl/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>
  <Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>
  <Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>
  ${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
  <Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
</Types>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
  <Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>
  <Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>
</Relationships>`;
  const coreXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <dc:creator>Ovilog</dc:creator>
  <dcterms:created xsi:type="dcterms:W3CDTF">${now}</dcterms:created>
  <dcterms:modified xsi:type="dcterms:W3CDTF">${now}</dcterms:modified>
</cp:coreProperties>`;
  const appXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Ovilog</Application></Properties>`;
  const workbookXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
  <sheets>
    ${sheets.map((s, i) => `<sheet name="${xlsxEscape(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}
  </sheets>
</workbook>`;
  const nSheets = sheets.length;
  const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  ${sheets.map((s, i) => `<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
  <Relationship Id="rId${nSheets+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
  <Relationship Id="rId${nSheets+2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/theme" Target="theme/theme1.xml"/>
</Relationships>`;

  const entries = [
    { name: '[Content_Types].xml', data: contentTypes },
    { name: '_rels/.rels', data: rootRels },
    { name: 'docProps/core.xml', data: coreXml },
    { name: 'docProps/app.xml', data: appXml },
    { name: 'xl/workbook.xml', data: workbookXml },
    { name: 'xl/_rels/workbook.xml.rels', data: workbookRels },
    { name: 'xl/styles.xml', data: XLSX_STYLES_XML },
    { name: 'xl/theme/theme1.xml', data: XLSX_THEME1_XML },
    ...sheets.map((s, i) => ({ name: `xl/worksheets/sheet${i+1}.xml`, data: xlsxSheetXml(s.rows) }))
  ];
  return xlsxBuildZip(entries);
}

function uint8ToBase64(bytes) {
  let binary = '';
  const chunkSize = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

function showFileSavedModal(filename) {

/* Enregistre un fichier binaire généré en mémoire. Priorité au plugin natif
   @capacitor/filesystem (Directory.Documents) : dans la WebView Android
   packagée, ni navigator.share() ni <a download> sur une blob: URL ne se
   sont montrés fiables (aucun DownloadListener natif configuré, et
   navigator.share n'est pas garanti disponible selon la version de
   WebView) — écrire directement le fichier via le pont natif Capacitor
   est la voie recommandée par Capacitor lui-même pour ce cas d'usage.
   Si le pont natif n'est pas présent (test en navigateur desktop
   classique, hors app packagée), on retombe sur partage/téléchargement web
   qui fonctionne normalement dans ce contexte-là. */
async function saveOrShareBinaryFile(filename, bytes, mimeType) {
  const Filesystem = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Filesystem;
  if (Filesystem) {
    try {
      try {
        const perm = await Filesystem.checkPermissions();
        if (perm && perm.publicStorage && perm.publicStorage !== 'granted') {
          await Filesystem.requestPermissions();
        }
      } catch (e) { /* API non implémentée sur cette plateforme (ex: Android 11+, permission obsolète) — on tente l'écriture quand même */ }
      await Filesystem.writeFile({ path: filename, data: uint8ToBase64(bytes), directory: 'DOCUMENTS' });
      showFileSavedModal(filename);
      return;
    } catch (e) {
      console.error('Filesystem.writeFile a échoué, on tente le partage/téléchargement web', e);
    }
  }
  try {
    if (typeof navigator.canShare === 'function' && typeof navigator.share === 'function') {
      const file = new File([bytes], filename, { type: mimeType });
      if (navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;
  }
  const blob = new Blob([bytes], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* Génère le classeur .xlsx du registre (3 feuilles) en respectant
   exactement les filtres actifs à l'instant de l'export — voir
   registre*FilteredRows(), partagées avec l'affichage à l'écran. */
async function exportRegistreXlsx() {
  const sheets = [
    { name: 'Agnelage', rows: [
      ['N° mère', 'N° agneau', 'Sexe', 'Date de naissance'],
      ...registreAgnelageFilteredRows(registreFiltre, registreColFiltres.agnelage).map(r =>
        ['n°' + numeroVisuel(r.mereEid), r.agneauEid ? 'n°' + numeroVisuel(r.agneauEid) : 'Mort-né', r.sexe, r.date])
    ]},
    { name: 'Mouvements', rows: [
      ['N°', 'Catégorie', 'Type', 'Cause / détail', 'Date'],
      ...registreMouvementsFilteredRows(registreFiltre, registreColFiltres.mouvements).map(r =>
        ['n°' + numeroVisuel(r.eid), r.categorie, r.type, r.detail, r.date])
    ]},
    { name: 'Sanitaire', rows: [
      ['N°', 'Catégorie', 'Type de soin', 'Produit', 'Date', 'Dose'],

        ['n°' + numeroVisuel(r.eid), r.categorie, r.type, r.produit, r.date, r.dose])
    ]}
  ];
  const bytes = await buildXlsxWorkbook(sheets);

/* ---------- Import CSV inventaire + échographies ---------- */
function normalizeTexte(s) {
  return String(s).normalize('NFD').replace(new RegExp('[̀-ͯ]', 'g'), '').toLowerCase().trim();
}

function parseEchoComment(comment) {
  const c = String(comment).trim();
  if (!DB.casParticuliers) DB.casParticuliers = ['Pseudogestation', 'Avortée'];
  const cas = DB.casParticuliers.find(cp => normalizeTexte(cp) === normalizeTexte(c));
  if (cas) {
    return { special: cas, stade: null, agneaux: null, parasitisme: false };
  }
  const words = c.split(/\s+/).filter(Boolean);
  if (words.length === 0) return null;
  const stadesValides = { 'debut': 'Début', 'milieu': 'Milieu', 'fin': 'Fin', 'vide': 'Vide' };
  const stade = stadesValides[normalizeTexte(words[0])];
  if (!stade) return null;
  const parasitisme = words.some(w => normalizeTexte(w) === 'p');
  const num = words.find(w => w === '1' || w === '2');
  const agneaux = num === '1' ? 'Simple' : num === '2' ? 'Double' : null;
  return { special: null, stade, agneaux, parasitisme };
}

/* Décode un CSV en devinant l'encodage (UTF-8 si valide, sinon Windows-1252)
   et le séparateur (';', ',' ou tabulation — le plus fréquent sur les 1res lignes). */
function decodeCsvBuffer(buffer) {
  let text;
  try {
    text = new TextDecoder('utf-8', { fatal: true }).decode(buffer);
  } catch (e) {
    text = new TextDecoder('windows-1252').decode(buffer);
  }
  text = text.replace(/^﻿/, '');
  const sampleLines = text.split(/\r?\n/).slice(0, 5);
  const counts = { ';': 0, ',': 0, '\t': 0 };
  sampleLines.forEach(l => {
    counts[';'] += (l.match(/;/g) || []).length;
    counts[','] += (l.match(/,/g) || []).length;
    counts['\t'] += (l.match(/\t/g) || []).length;
  });
  const delimiter = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0] || ';';
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const toRow = (line) => line.split(delimiter).map(p => p.trim().replace(/^"|"$/g, ''));
  return lines.map(toRow);
}

/* ---------- Lecteur XLSX minimal (ZIP + OOXML), sans dépendance externe ---------- */
async function readXlsxRows(buffer) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);
  let eocd = -1;
  const minEocd = Math.max(0, bytes.length - 22 - 65557);
  for (let i = bytes.length - 22; i >= minEocd; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd === -1) throw new Error("Fichier .xlsx invalide ou corrompu.");
  const entryCount = view.getUint16(eocd + 10, true);
  let cdOffset = view.getUint32(eocd + 16, true);
  const files = {};
  for (let i = 0; i < entryCount; i++) {
    if (view.getUint32(cdOffset, true) !== 0x02014b50) break;
    const compMethod = view.getUint16(cdOffset + 10, true);
    const compSize = view.getUint32(cdOffset + 20, true);
    const nameLen = view.getUint16(cdOffset + 28, true);
    const extraLen = view.getUint16(cdOffset + 30, true);
    const commentLen = view.getUint16(cdOffset + 32, true);
    const localHeaderOffset = view.getUint32(cdOffset + 42, true);
    const name = new TextDecoder('utf-8').decode(bytes.slice(cdOffset + 46, cdOffset + 46 + nameLen));
    files[name] = { compMethod, compSize, localHeaderOffset };
    cdOffset += 46 + nameLen + extraLen + commentLen;
  }
  async function getFileText(name) {
    const f = files[name];
    if (!f) return null;
    const lh = f.localHeaderOffset;
    if (view.getUint32(lh, true) !== 0x04034b50) throw new Error('Entrée ZIP invalide.');
    const lNameLen = view.getUint16(lh + 26, true);
    const lExtraLen = view.getUint16(lh + 28, true);
    const dataStart = lh + 30 + lNameLen + lExtraLen;
    const compData = bytes.slice(dataStart, dataStart + f.compSize);
    let plain;
    if (f.compMethod === 0) {
      plain = compData;
    } else if (f.compMethod === 8) {
      if (!window.DecompressionStream) throw new Error('DECOMPRESSION_UNSUPPORTED');
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([compData]).stream().pipeThrough(ds);
      plain = new Uint8Array(await new Response(stream).arrayBuffer());
    } else {
      throw new Error("Méthode de compression du fichier .xlsx non supportée.");
    }
    return new TextDecoder('utf-8').decode(plain);
  }

  const sharedStringsXml = await getFileText('xl/sharedStrings.xml');
  let sharedStrings = [];
  if (sharedStringsXml) {
    const doc = new DOMParser().parseFromString(sharedStringsXml, 'application/xml');
    const siNodes = doc.getElementsByTagName('si');
    for (let i = 0; i < siNodes.length; i++) {
      const tNodes = siNodes[i].getElementsByTagName('t');
      let text = '';
      for (let j = 0; j < tNodes.length; j++) text += tNodes[j].textContent;
      sharedStrings.push(text);
    }
  }

  let sheetName = 'xl/worksheets/sheet1.xml';
  if (!files[sheetName]) {
    sheetName = Object.keys(files)
      .filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
      .sort((a, b) => parseInt(a.match(/\d+/)[0], 10) - parseInt(b.match(/\d+/)[0], 10))[0];
  }
  const sheetXml = sheetName ? await getFileText(sheetName) : null;
  if (!sheetXml) throw new Error("Aucune feuille trouvée dans le fichier .xlsx.");

  const doc = new DOMParser().parseFromString(sheetXml, 'application/xml');
  const rowNodes = doc.getElementsByTagName('row');
  const rows = [];
  for (let i = 0; i < rowNodes.length; i++) {
    const cellNodes = rowNodes[i].getElementsByTagName('c');
    const row = [];
    for (let j = 0; j < cellNodes.length; j++) {
      const cell = cellNodes[j];
      const ref = cell.getAttribute('r') || '';
      const colMatch = ref.match(/^([A-Z]+)/);
      let colIdx = row.length;
      if (colMatch) {
        colIdx = 0;
        for (const ch of colMatch[1]) colIdx = colIdx * 26 + (ch.charCodeAt(0) - 64);
        colIdx -= 1;
      }
      const type = cell.getAttribute('t');
      let value = '';
      if (type === 'inlineStr') {
        const isNode = cell.getElementsByTagName('is')[0];
        value = isNode ? isNode.textContent : '';
      } else {
        const vNode = cell.getElementsByTagName('v')[0];
        const raw = vNode ? vNode.textContent : '';
        value = (type === 's') ? (sharedStrings[parseInt(raw, 10)] || '') : raw;
      }
      row[colIdx] = value;
    }
    for (let k = 0; k < row.length; k++) if (row[k] === undefined) row[k] = '';
    rows.push(row);
  }
  return rows;
}

function renderImportEcho() {
  pageTitle.textContent = 'Import CSV / Excel';
  app.innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
        ${iconCircle(ICON_ECHO, 'green', 'sm')}
        <div style="font-size:13px;color:var(--text-muted);">Fichier CSV ou Excel (.xlsx) avec 2 colonnes : EID et commentaire (ex: Début 1, Milieu 2, Vide P, Pseudogestation...). La 1re ligne peut être un en-tête ou déjà une donnée.</div>
      </div>
      <label>Fichier CSV ou Excel</label>
      <input type="file" id="import-echo-file" accept=".csv,.xlsx">
      <label style="margin-top:12px;">Date à appliquer à ces échographies</label>
      <input type="date" id="import-echo-date" value="${new Date().toISOString().slice(0,10)}">
      <div id="import-echo-err" class="error-box hidden"></div>
      <div id="import-echo-preview" style="margin-top:14px;"></div>
      <button class="btn btn-primary hidden" id="btn-confirm-import" style="margin-top:14px;">Confirmer l'import</button>
    </div>
  `;

  let parsedRows = null;

  function processTableRows(tableRows) {
    // Ignore la 1re ligne seulement si elle ressemble à un en-tête (1re colonne pas un EID valide)
    let dataRows = tableRows;
    if (tableRows.length > 0 && cleanEid(String(tableRows[0][0] || '')).length < 11) {
      dataRows = tableRows.slice(1);
    }
    const rows = [];
    const erreurs = [];
    let nouvellesBrebis = 0;
    dataRows.forEach((parts, i) => {
      if (!parts || parts.length < 2 || (!parts[0] && !parts[1])) return;
      const eid = String(parts[0] || '').trim();
      const comment = String(parts[1] || '').trim();
      if (cleanEid(eid).length < 11) { erreurs.push('Ligne ' + (i+2) + ' : EID invalide (' + eid + ')'); return; }
      const parsed = parseEchoComment(comment);
      if (!parsed) { erreurs.push('Ligne ' + (i+2) + ' : commentaire non reconnu (' + comment + ')'); return; }
      const existe = DB.brebis.some(s => cleanEid(s.eid) === cleanEid(eid));
      if (!existe) nouvellesBrebis++;
      rows.push({ eid, ...parsed });
    });
    parsedRows = rows;
    const err = document.getElementById('import-echo-err');
    err.classList.add('hidden');
    const preview = document.getElementById('import-echo-preview');
      preview.innerHTML = `
        <div class="grid2" style="grid-template-columns:repeat(3,1fr);">
          <div class="stat-card sc-green">
            <div class="stat-card-label">Reconnues</div>
            <div class="stat-card-value" style="font-size:20px;">${rows.length}</div>
          </div>
          <div class="stat-card sc-amber">
            <div class="stat-card-label">Nouvelles brebis</div>
            <div class="stat-card-value" style="font-size:20px;">${nouvellesBrebis}</div>
          </div>
          <div class="stat-card ${erreurs.length ? 'sc-coral' : ''}" style="${erreurs.length ? '' : 'background:#f0efe9;color:var(--text-muted);'}">
            <div class="stat-card-label">Ignorées</div>
            <div class="stat-card-value" style="font-size:20px;">${erreurs.length}</div>
          </div>
        </div>
        ${erreurs.length ? '<div style="font-size:12px;color:var(--coral-fg);margin-top:8px;">' + erreurs.slice(0,10).join('<br>') + (erreurs.length > 10 ? '<br>... (' + (erreurs.length-10) + ' de plus)' : '') + '</div>' : ''}
      `;
    document.getElementById('btn-confirm-import').classList.toggle('hidden', rows.length === 0);
  }

  document.getElementById('import-echo-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const err = document.getElementById('import-echo-err');
    err.classList.add('hidden');
    document.getElementById('import-echo-preview').innerHTML = '';
    document.getElementById('btn-confirm-import').classList.add('hidden');
    const isXlsx = /\.xlsx$/i.test(file.name);
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const tableRows = isXlsx ? await readXlsxRows(reader.result) : decodeCsvBuffer(reader.result);
        processTableRows(tableRows);
      } catch (ex) {
        if (ex && ex.message === 'DECOMPRESSION_UNSUPPORTED') {
          err.textContent = "Ce téléphone/navigateur ne sait pas décompresser les fichiers .xlsx — exporte plutôt en .csv depuis ton tableur.";
        } else {
          err.textContent = "Impossible de lire ce fichier : " + (ex && ex.message ? ex.message : 'format non reconnu.');
        }
        err.classList.remove('hidden');
      }
    };
    reader.onerror = () => {
      err.textContent = "Erreur de lecture du fichier.";
      err.classList.remove('hidden');
    };
    reader.readAsArrayBuffer(file);
  });

  document.getElementById('btn-confirm-import').onclick = () => {
    if (!parsedRows || parsedRows.length === 0) return;
    if (!confirm('Importer ' + parsedRows.length + ' échographie(s) ? Cette action ajoute des données, elle ne supprime rien.')) return;
    const date = document.getElementById('import-echo-date').value;
    let skipped = 0;
    parsedRows.forEach(row => {
      let sheep = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(row.eid));
      if (!sheep) {
        sheep = { id: Date.now().toString() + Math.random().toString(36).slice(2,6), eid: row.eid, createdAt: Date.now(), echographies: [], agnelages: [], sanitaire: [], mouvements: [{ type: 'Entrée', cause: 'Import (fichier CSV/Excel)', date: date }], controleLaitier: [], statut: 'active' };
        DB.brebis.push(sheep);
      }
      sheep.echographies = sheep.echographies || [];
      if (sheep.echographies.some(e => e.date === date)) { skipped++; return; } // une échographie existe déjà à cette date pour cette brebis
      sheep.echographies.push({
        type: row.special ? 'stade_comptage' : (row.agneaux ? 'stade_comptage' : 'stade'),
        date: date,
        stade: row.stade,
        agneaux: row.agneaux,
        special: row.special,
        parasitisme: row.parasitisme,
        campagne: DB.campagneDebut
      });
    });
    saveData(DB);
    alert((parsedRows.length - skipped) + ' échographie(s) importée(s) avec succès.' + (skipped > 0 ? ' ' + skipped + ' ignorée(s) car une échographie existait déjà à cette date pour ces brebis.' : ''));
    render('parametres');
  };
}

      <label>Campagne actuelle (année de fin — ex: 2026 pour la campagne du 1er octobre 2025 au 30 septembre 2026)</label>
      <div class="row">
        <input type="number" id="f-campagne-annee" value="${DB.campagneDebut ? DB.campagneDebut + 1 : ''}" placeholder="ex: 2026">
        <button type="button" class="btn btn-secondary" id="btn-save-campagne-annee" style="width:auto;padding:0 16px;">OK</button>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:6px;">Cette valeur sert juste à afficher la bonne campagne dans l'en-tête — elle ne supprime aucune donnée. Utilise le bouton ci-dessous pour le vrai changement de campagne avec bascule des agnelles.</div>
    </div>

    <div class="card" style="border-color:var(--accent);">
      <div style="font-size:14px;font-weight:600;margin-bottom:6px;">Changement de campagne</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Campagne actuelle : ${DB.campagneDebut ? ('Campagne ' + (DB.campagneDebut + 1) + ' (1er octobre ' + DB.campagneDebut + ' au 30 septembre ' + (DB.campagneDebut + 1) + ')') : 'non définie'}. À déclencher au 1er octobre : les ${(DB.agnelles||[]).length} agnelle(s) de l'inventaire rejoignent le troupeau de brebis, et les mises bas, agneaux et mouvements de la campagne écoulée sont supprimés des fiches des brebis actives.</div>
      <button class="btn btn-secondary" id="btn-nouvelle-campagne" style="color:var(--accent);border-color:var(--accent);">Démarrer une nouvelle campagne</button>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">
        ${iconCircle(ICON_ECHO, 'green', 'sm')}
        <div style="font-size:14px;font-weight:600;">Import CSV/Excel — inventaire + échographies</div>
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Importe un fichier CSV ou Excel (.xlsx) avec les colonnes EID et commentaire (ex: export de contrôle de gestation). Les brebis inconnues sont créées automatiquement, les échographies ajoutées à leur historique.</div>
      <button class="btn btn-secondary" id="btn-goto-import">Importer un fichier</button>
    </div>

    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:6px;">Sauvegarde des données</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Important : à chaque fois qu'une nouvelle version du fichier est installée, exporte d'abord tes données ici, puis réimporte-les une fois la nouvelle version ouverte — sinon tout repart à zéro.</div>
      <button class="btn btn-secondary" id="btn-export" style="margin-bottom:10px;">Exporter mes données (sauvegarde)</button>
      <input type="file" id="import-file" accept=".json" class="hidden">
      <button class="btn btn-secondary" id="btn-import">Importer une sauvegarde</button>
    </div>
  `;

  document.getElementById('btn-goto-import').onclick = () => render('import-echo');

  document.getElementById('btn-sync-action').onclick = () => {
    if (syncState.loggedIn) {
      if (!confirm('Se déconnecter de la synchronisation ? L\'appli continuera de fonctionner avec les données actuelles, en local uniquement, jusqu\'à ta prochaine connexion.')) return;
      window.OvilogSync.logout();
      render('parametres');
    } else {
      render('sync-login');
    }
  };

  document.getElementById('btn-nouvelle-campagne').onclick = () => {
    const nbAgnelles = (DB.agnelles || []).length;
    if (!confirm(
      'Démarrer une nouvelle campagne ?\n\n' +
      '- ' + nbAgnelles + ' agnelle(s) rejoindront le troupeau de brebis\n' +
      '- Les mises bas et mouvements de la campagne précédente seront retirés des fiches actives (mais conservés dans le registre d\'élevage réglementaire)\n\n' +
      'Cette action est irréversible.'
    )) return;

    // Archive puis vide les brebis déjà actives AVANT d'ajouter les nouvelles
    // (renouvelées depuis les agnelles), pour ne pas effacer le mouvement
    // d'entrée qu'on vient de créer pour ces dernières.
    DB.brebis.forEach(sheep => {
      if ((sheep.statut || 'active') === 'active') {
        archiverDansRegistre('brebis', sheep.eid, { agnelages: sheep.agnelages, mouvements: sheep.mouvements });
        sheep.agnelages = [];
        sheep.mouvements = [];
      }
    });

    const dateRenouvellement = new Date().toISOString().slice(0,10);
    (DB.agnelles || []).forEach(ag => {
      DB.brebis.push({
        id: Date.now().toString() + Math.random().toString(36).slice(2,6), eid: ag.eid, mereEid: ag.motherEid || null,
        createdAt: Date.now(), echographies: [], agnelages: [], sanitaire: ag.sanitaire || [],
        mouvements: [{ type: 'Entrée', cause: 'Renouvellement (agnelle devenue brebis)', date: dateRenouvellement }],
        controleLaitier: [], statut: 'active'
      });
      archiverDansRegistre('agneaux', ag.eid, { mouvements: ag.mouvements });
    });
    DB.agnelles = [];

    const now = new Date();
    DB.campagneDebut = now.getMonth() >= 9 ? now.getFullYear() : now.getFullYear() - 1;
    // Date réelle de ce clic, utilisée comme référence pour "brebis présentes"
    // dans Bilan de reproduction (voir campagneCohortPresente) — plus fidèle
    // que le 1er octobre calculé, puisque c'est le vrai instant de bascule
    // agnelles→brebis pour CETTE campagne.
    DB.campagneDateDemarrage = dateRenouvellement;
    saveData(DB);
    render('parametres');
  };

  document.getElementById('btn-save-exploitation').onclick = () => {
    DB.exploitation = {
      nom: document.getElementById('f-exp-nom').value.trim(),
      numeroCheptel: document.getElementById('f-exp-cheptel').value.trim(),
      indicatifMarquage: document.getElementById('f-exp-marquage').value.trim(),
      adresse: document.getElementById('f-exp-adresse').value.trim(),
      telephone: document.getElementById('f-exp-tel').value.trim()
    };
    saveData(DB);
    alert('Informations enregistrées.');
  };
  document.getElementById('btn-save-campagne-annee').onclick = () => {
    const val = parseInt(document.getElementById('f-campagne-annee').value, 10);
    if (isNaN(val)) { alert("Saisis une année valide."); return; }
    DB.campagneDebut = val - 1;
    saveData(DB);
    render('parametres');
  };

  document.getElementById('btn-export').onclick = () => exportBackupFile(DB, 'troupeau-sauvegarde');

  document.getElementById('btn-import').onclick = () => {
    document.getElementById('import-file').click();
  };
  document.getElementById('import-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed.brebis)) throw new Error('format invalide');
        if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ? Cette action est irréversible.')) return;
        // migrateData comble les champs qui n'existaient pas encore dans une
        // sauvegarde plus ancienne, pour éviter toute erreur sur un champ
        // manquant juste après la restauration.
        DB = migrateData(parsed);
        saveData(DB);
        render('home');
      } catch (err) {
        alert("Ce fichier ne semble pas être une sauvegarde valide.");
      }
    };
    reader.readAsText(file);
  };
}

/* ---------- Connexion à la synchronisation cloud ---------- */
function renderSyncLogin() {
  pageTitle.textContent = 'Connexion à la synchronisation';
  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Connecte-toi avec le compte créé pour la synchronisation (même e-mail et mot de passe sur tous tes appareils).</div>
      <label>Adresse e-mail</label>
      <input type="email" id="f-sync-email" placeholder="ton@email.fr" autocomplete="username">
      <label>Mot de passe</label>
      <input type="password" id="f-sync-password" autocomplete="current-password">
      <div id="sync-err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-sync-login">Se connecter</button>
    </div>
  `;
  const emailInput = document.getElementById('f-sync-email');
  const passwordInput = document.getElementById('f-sync-password');
  const btn = document.getElementById('btn-sync-login');
  const err = document.getElementById('sync-err');

  function attemptLogin() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      err.textContent = "Renseigne l'e-mail et le mot de passe.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    btn.textContent = 'Connexion en cours...';
    btn.disabled = true;
    window.OvilogSync.login(email, password).then(() => {
      render('parametres');
    }).catch(e => {
      err.textContent = e.message || "Connexion impossible.";
      err.classList.remove('hidden');
      btn.textContent = 'Se connecter';
      btn.disabled = false;
    });
  }
  btn.onclick = attemptLogin;
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
}

/* ---------- Démarrage ---------- */
render('home');
</script>

<!--
  Synchronisation cloud (Firebase). Séparée du script principal ci-dessus
  car elle a besoin des imports ES module — elle s'exécute après lui (les
  scripts "module" sont différés par le navigateur), donc DB, render(),
  saveData() etc. existent déjà quand ce code tourne, et peut les lire/
  écrire directement (même portée globale que le script classique).
-->
<script type="module">
import {
  initializeApp, getAuth, setPersistence, browserLocalPersistence,
  signInWithEmailAndPassword, onAuthStateChanged, signOut,
  initializeFirestore, persistentLocalCache, persistentSingleTabManager,
  collection, doc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot, arrayUnion
} from './vendor/firebase.bundle.js';

const firebaseConfig = {
  apiKey: "AIzaSyDY_Z3Jqo92RAuJlYX5K4sZKTFmf-0P-h4",
  authDomain: "ovilog-15ef6.firebaseapp.com",
  projectId: "ovilog-15ef6",
  storageBucket: "ovilog-15ef6.firebasestorage.app",
  messagingSenderId: "861492569011",
  appId: "1:861492569011:web:67ade13ee7fdedff62a1c6"
};

const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const fbDb = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
});

// Champs regroupés dans un unique document 'meta' par compte (petits,
// bornés, pas besoin d'un document par enregistrement comme pour les
// animaux).
const META_FIELDS = ['exploitation', 'campagneDebut', 'produits', 'acheteurs',
  'causesMortalite', 'casParticuliers', 'typesJournal', 'lots', 'journal',
  'laitTank', 'luttes', 'produitsInfo'];
const ANIMAL_COLLECTIONS = ['brebis', 'beliers', 'agnelles'];
const BOOTSTRAP_FLAG_KEY = 'ovilog_sync_bootstrapped_uid';

const sync = {
  uid: null,
  email: null,
  applyingRemote: false,
  unsubscribers: [],
  // Dernier état connu de chaque collection/document tel qu'envoyé vers ou
  // reçu depuis Firestore, pour calculer un diff minimal à chaque sauvegarde
  // plutôt que de tout réécrire.
  lastSynced: { brebis: {}, beliers: {}, agnelles: {}, meta: undefined }
};

/* Copie profonde + remplace toute valeur undefined par null (Firestore
   refuse undefined). Sert à la fois pour ce qu'on envoie réellement à
   Firestore ET pour ce qu'on garde dans lastSynced : lastSynced doit être
   un instantané figé, jamais une référence vers le même objet que DB —
   sinon, comme l'appli modifie ses objets sur place avant d'appeler
   saveData(DB), l'« ancien » et le « nouveau » finiraient par être
   littéralement le même objet et plus aucun changement ne serait jamais
   détecté après le tout premier envoi. */
function deepClean(value) {
  if (value === undefined) return null;
  if (value === null || typeof value !== 'object') return value;
  if (Array.isArray(value)) return value.map(deepClean);
  const out = {};
  Object.keys(value).forEach(k => { out[k] = deepClean(value[k]); });
  return out;
}

/* Calcule un payload de mise à jour Firestore entre un ancien et un nouvel
   enregistrement : arrayUnion pour un simple ajout en fin de tableau (les
   ajouts concurrents depuis 2 appareils se combinent alors sans s'écraser),
   remplacement complet du champ dans les autres cas (édition, suppression,
   réordonnancement — dernier écrit gagne, comme le reste de Firestore). */
function buildUpdatePayload(oldRec, newRec) {
  const updates = {};
  const keys = new Set([...Object.keys(oldRec || {}), ...Object.keys(newRec || {})]);
  keys.forEach(key => {
    const oldVal = oldRec ? oldRec[key] : undefined;
    const newVal = newRec[key];
    if (JSON.stringify(oldVal) === JSON.stringify(newVal)) return;
    if (Array.isArray(oldVal) && Array.isArray(newVal) && newVal.length > oldVal.length &&
        JSON.stringify(newVal.slice(0, oldVal.length)) === JSON.stringify(oldVal)) {
      updates[key] = arrayUnion(...newVal.slice(oldVal.length));
    } else {
      updates[key] = newVal === undefined ? null : newVal;
    }
  });
  return Object.keys(updates).length ? updates : null;
}

async function syncAnimalCollection(colName, records) {
  const colRef = collection(fbDb, 'users', sync.uid, colName);
  const lastMap = sync.lastSynced[colName];
  const seenIds = new Set();
  for (const rawRec of (records || [])) {
    if (!rawRec.id) continue;
    const rec = deepClean(rawRec);
    seenIds.add(rec.id);
    const old = lastMap[rec.id];
    if (old === undefined) {
      await setDoc(doc(colRef, rec.id), rec);
    } else {
      const payload = buildUpdatePayload(old, rec);
      if (payload) await updateDoc(doc(colRef, rec.id), payload);
    }
    lastMap[rec.id] = rec;
  }
  for (const id of Object.keys(lastMap)) {
    if (!seenIds.has(id)) {
      await deleteDoc(doc(colRef, id));
      delete lastMap[id];
    }
  }
}

async function syncMeta(data) {
  const metaRecord = {};
  META_FIELDS.forEach(k => { metaRecord[k] = deepClean(data[k]); });
  const metaRef = doc(fbDb, 'users', sync.uid, 'meta', 'main');
  if (sync.lastSynced.meta === undefined) {
    await setDoc(metaRef, metaRecord);
  } else {
    const payload = buildUpdatePayload(sync.lastSynced.meta, metaRecord);
    if (payload) await updateDoc(metaRef, payload);
  }
  sync.lastSynced.meta = metaRecord;
}

async function syncAllToCloud(data) {
  for (const col of ANIMAL_COLLECTIONS) await syncAnimalCollection(col, data[col]);
  await syncMeta(data);
}

// Remplace la sauvegarde locale-uniquement par une version qui écrit aussi
// vers Firestore quand la synchro est active — sans toucher aux dizaines
// d'endroits de l'appli qui appellent déjà saveData(DB).
saveData = function(data) {
  localStorage.setItem(DB_KEY, JSON.stringify(data));
  DB = data;
  if (sync.uid && !sync.applyingRemote) {
    syncAllToCloud(data).catch(e => console.error('Erreur de synchronisation cloud :', e));
  }
};

/* Applique un changement reçu depuis Firestore (un autre appareil, ou notre
   propre écriture confirmée) : met à jour DB + le cache local + l'écran
   affiché, sans redéclencher un envoi vers le cloud (sync.applyingRemote). */
function applyRemoteUpdate(mutatorFn) {
  sync.applyingRemote = true;
  try {
    mutatorFn();
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    render(currentView);
  } finally {
    sync.applyingRemote = false;
  }
}

function startListeners() {
  ANIMAL_COLLECTIONS.forEach(colName => {
    const colRef = collection(fbDb, 'users', sync.uid, colName);
    const unsub = onSnapshot(colRef, snap => {
      const arr = [];
      snap.forEach(d => arr.push(d.data()));
      sync.lastSynced[colName] = {};
      // Instantané indépendant de ce qui va dans DB (voir deepClean) : DB
      // continue de contenir les objets « vivants » que l'appli modifie
      // directement sur place.
      arr.forEach(r => { sync.lastSynced[colName][r.id] = deepClean(r); });
      applyRemoteUpdate(() => { DB[colName] = arr; });
    }, err => console.error('Erreur d\'écoute Firestore (' + colName + ') :', err));
    sync.unsubscribers.push(unsub);
  });
  const metaRef = doc(fbDb, 'users', sync.uid, 'meta', 'main');
  const unsubMeta = onSnapshot(metaRef, snap => {
    if (!snap.exists()) return;
    const meta = snap.data();
    sync.lastSynced.meta = deepClean(meta);
    applyRemoteUpdate(() => { Object.assign(DB, meta); });
  }, err => console.error('Erreur d\'écoute Firestore (meta) :', err));
  sync.unsubscribers.push(unsubMeta);
}

function stopListeners() {
  sync.unsubscribers.forEach(u => u());
  sync.unsubscribers = [];
}

/* Décision prise une seule fois par appareil, la première fois qu'il se
   connecte à un compte donné : si le cloud est vide, on y pousse les
   données locales actuelles (cet appareil devient la source) ; s'il
   contient déjà des données (un autre appareil a synchronisé avant), on
   sauvegarde les données locales de cet appareil par sécurité puis on
   bascule sur celles du cloud (récupérées ensuite par startListeners). */
async function bootstrapDevice(uid) {
  const metaRef = doc(fbDb, 'users', uid, 'meta', 'main');
  const metaSnap = await getDoc(metaRef);
  if (!metaSnap.exists()) {
    await syncAllToCloud(DB);
  } else {
    exportBackupFile(DB, 'avant-synchronisation-cloud');
  }
  localStorage.setItem(BOOTSTRAP_FLAG_KEY, uid);
}

async function onSignedIn(user) {
  sync.uid = user.uid;
  sync.email = user.email;
  const alreadyBootstrapped = localStorage.getItem(BOOTSTRAP_FLAG_KEY) === user.uid;
  if (!alreadyBootstrapped) {
    await bootstrapDevice(user.uid);
  }
  startListeners();
}

function onSignedOut() {
  stopListeners();
  sync.uid = null;
  sync.email = null;
}

onAuthStateChanged(fbAuth, user => {
  if (user) onSignedIn(user).catch(e => console.error('Erreur de connexion à la synchronisation :', e));
  else onSignedOut();
});

function friendlyAuthError(e) {
  const code = e && e.code;
  if (code === 'auth/invalid-credential' || code === 'auth/invalid-email' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
    return "E-mail ou mot de passe incorrect.";
  }
  if (code === 'auth/too-many-requests') return "Trop de tentatives — réessaie dans quelques minutes.";
  if (code === 'auth/network-request-failed') return "Pas de connexion réseau — la première connexion nécessite d'être en ligne.";
  return "Connexion impossible (" + (code || (e && e.message) || 'erreur inconnue') + ").";
}

window.OvilogSync = {
  getState() {
    return { loggedIn: !!sync.uid, email: sync.email };
  },
  async login(email, password) {
    try {
      await setPersistence(fbAuth, browserLocalPersistence);
      await signInWithEmailAndPassword(fbAuth, email, password);
      // onAuthStateChanged prend le relais (bootstrap + écoute) juste après.
    } catch (e) {
      throw new Error(friendlyAuthError(e));
    }
  },
  logout() {
    signOut(fbAuth).catch(e => console.error('Erreur de déconnexion :', e));
  }
};
</script>
</body>
