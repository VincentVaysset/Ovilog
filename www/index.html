uperovulation : 1500 - 3000 UI par voie intramusculaire, entre J8 et J13 du cycle oestral ou vers la fin d'un traitement progestagène destiné à la synchronisation de l'ovulation Brebis et agnelles :Induction et synchronisation de l'ovulation : 600 UI par voie IM à la fin du traitement progestagène.Les doses administrées doivent être adaptées à la race et à la saison. Chèvres :Induction et synchronisation de l'ovulation : 600 UI par voie intramusculaire, à la fin du traitement progestagène (protocole long : 18 à 21 jours de pose) ou 48h +/-1h avant la fin du traitement progestagène (protocole court : 11 jours).Les doses administrées doivent être adaptées à la saison (doses plus élevées chez les chèvres non cyclées que chez les chèvres cyclées)."},{"n":"CHRONO GEST PMSG 6000 LYOPHILISAT POUR SOLUTION INJECTABLE","l":0,"v":0,"p":"----Mode de reconstitution de la solution : Il est conseillé d'utiliser 2 mL de solution reconstituée, à l'aide de CHRONOGEST PMSG Solvant, par animal. - Présentation unitaire en boîte de 1 flacon de lyophilisat et de 1 flacon vide de 30 mL :- Utiliser le flacon vide pour la reconstitution de la solution injectable. - Présentation en boîte de 10 flacons de lyophilisat et de 10 étiquettes autocollantes :- Utiliser le flacon de Chronogest PMSG Solvant (vendu séparément) pour la reconstitution de la solution injectable. Eliminer le volume de solvant non nécessaire à la reconstitution (voir schéma ci-dessous). Après reconstitution de la solution, identifier ce flacon en y apposant l'étiquette autocollante fournie à cet effet. Posologie : La dose doit être adaptée à la race, l'âge, l'activité sexuelle, l'intervalle mise bas - traitement, la saison.La dose choisie devra être adaptée selon le schéma suivant :\\nDose choisie (UI)40050060015003000\\nVolume de solvant nécessaire par flacon (1)30242084\\nNombre de femelles traitées15121042(1) Chronogest PMSG Solvant Administrer par voie intramusculaire. Vaches et génisses :- Induction et synchronisation de l'ovulation : 300 à 600 UI par voie intramusculaire, à la fin d'un traitement progestagène ; les animaux non cyclés doivent recevoir les doses les plus élevées.- Superovulation : 1500 - 3000 UI par voie intramusculaire, entre J8 et J13 du cycle oestral ou vers la fin d'un traitement progestagène destiné à la synchronisation de l'ovulation. Brebis :Induction et synchronisation de l'ovulation : 400 - 700 UI par voie IM à la fin du traitement progestagène.Les doses administrées doivent être adaptées à la race (doses plus faibles chez les races prolifiques que chez les races non prolifiques) et à la saison (doses plus élevées chez les brebis non cyclées que chez les brebis cyclées). Chèvres :Induction et synchronisation de l'ovulation : 400 - 600 UI par voie intramusculaire, à la fin du traitement progestagène (protocole long : 18 à 21 jours de pose) ou 48h +/-1h avant la fin du traitement progestagène (protocole court : 11 jours).Les dose administrées doivent être adaptées à la saison (doses plus élevées chez les chèvres non cyclées que chez les chèvres cyclées)."},{"n":"CHRONOGEST CR","l":0,"v":2,"p":"Une éponge par animal indépendamment de son poids, de sa race, de son type (viande ou lait) et de la saison.\\nL'éponge doit être administrée par voie intravaginale à l'aide d'un applicateur.\\nLa durée de pose de l'éponge est de 14 jours. À la fin de cette période, l'éponge est retirée doucement en tirant la ficelle du dispositif.\\nPour obtenir une synchronisation optimale de l'ovulation, une injection de PMSG (de 300 à 700 UI) par voie intramusculaire est recommandée au moment du retrait de l'éponge.\\nDans le cas d'une insémination artificielle à un temps prédéterminé, il est recommandé d'effectuer celle-ci 55 heures après le retrait de l'éponge."},{"n":"CIDR OVIS 0,35 G SYSTEME DE DIFFUSION VAGINAL POUR OVINS","l":0,"v":0,"p":"Voie vaginale. 0,35 g de progestérone (soit 1 dispositif) par animal pendant 12 jours. Insérer un dispositif dans le vagin de chaque brebis à traiter. Le dispositif doit rester en place pendant 12 jours suivant l'insertion, suivi d’une injection de gonadotrophine chorionique équine (eCG, anciennement connu sous le nom de PMSG) administrée au moment du retrait du dispositif. Le début de l’oestrus apparait de 1 à 2 jours suivant le retrait du dispositif. Dans une étude réalisée sur 11 brebis de race Lacaune, l’ovulation a eu lieu entre 42 heures et 58 heures suivant l’injection d’eCG, avec une majorité (73 %) ovulant entre 50 heures et 54 heures. Dans le cas où des protocoles d’insémination artificielle ou des techniques de sélection avancées (transferts embryonnaires) sont utilisées, le moment de l’ovulation doit être pris en considération afin d’optimiser les résultats. Administration :Un applicateur doit être utilisé pour l'insertion du dispositif, selon les instructions suivantes : 1. S’assurer que l’applicateur est propre et qu’il a été trempé dans une solution antiseptique non irritante avant l’utilisation.2. En portant des gants jetables stériles, replier les branches du dispositif et l’introduire dans l’applicateur. Les branches du dispositif doivent dépasser légèrement du bout de l’applicateur. Prendre soin d’éviter toute manipulation inutile ou prolongée du médicament vétérinaire afin de réduire le transfert de principe actif sur les gants.3. Appliquer une petite quantité de lubrifiant gynécologique au bout de l’applicateur chargé.4. Soulever la queue et nettoyer la vulve et le périnée.5. Insérer doucement l’applicateur dans le vagin, d’abord en direction verticale puis horizontalement jusqu’à l’apparition d’une résistance.6. S’assurer que la cordelette de retrait est libre et presser la poignée de l’applicateur. Cela libère les branches du dispositif, qui retiendront le dispositif dans le vagin antérieur.7. Une fois le dispositif correctement positionné, retirer l’applicateur et laisser pendre la cordelette de retrait par la vulve.L’applicateur doit être nettoyé et désinfecté avant d’être utilisé pour un autre animal. Retrait :Le dispositif doit être retiré en tirant doucement sur la cordelette. Dans certains cas, la cordelette peut ne pas être visible à l’extérieur de l’animal. Dans ce cas, elle peut être localisée avec un doigt ganté dans le vagin postérieur. Environ 1 dispositif sur 10 peut être perdu par l’animal. Le retrait du dispositif ne doit pas nécessiter de force. Si une résistance apparaît, utiliser un doigt ganté pour aider au retrait. S’il y a plus de difficultés que celles détaillées ci-dessus pour le retrait, un avis vétérinaire doit être demandé. Le dispositif ne doit être utilisé qu’une seule fois."},{"n":"CK 2 - COLISTINE 2 000 000 UI/ML SOLUTION BUVABLE POUR VEAUX, AGNEAUX, PORCINS ET VOLAILLES","l":null,"v":1,"p":"Voie orale. La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en colistine doit être ajustée en conséquence. Chez les veaux, les agneaux et les porcs, la dose recommandée est de 100 000 UI de colistine par kg de poids vif par jour, pendant 3 à 5 jours consécutifs dans le lait, l'aliment liquide ou l'eau de boisson soit 0,50 mL de solution pour 10 kg de poids vif par jour pendant 3 à 5 jours. La dose quotidienne recommandée doit être divisée en deux, en cas d'administration buccale directe du médicament vétérinaire à l'animal. Chez les volailles, la dose recommandée est de 75 000 UI de colistine par kg de poids vif par jour, pendant 3 à 5 jours consécutifs dans l'eau de boisson soit 37,5 mL de solution par tonne de poids vif par jour pendant 3 à 5 jours. La durée de traitement doit être limitée au temps minimal nécessaire pour le traitement de la maladie."},{"n":"CK 5 - OXYTETRACYCLINE 500 MG/G","l":null,"v":7,"p":"Voie orale. Administration dans l'eau de boisson/ le lait / l’aliment liquide.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. Veaux, agneaux et porcins : 20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans la buvée, soit 400 mg de poudre pour solution buvable pour 10 kg de poids vif par jour en 2 prises dans le lait, l'aliment liquide ou l'eau de boisson. Volailles et lapins : 20 mg d'oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans l'eau de boisson, soit environ 400 mg de poudre pour solution buvable par litre d'eau de boisson.La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en oxytétracycline doit être ajustée en conséquence."},{"n":"CK 7 - TRIMETHOPRIME 16,65 MG/ML SULFADIAZINE 83,35 MG/ML","l":null,"v":12,"p":"Voie d’administration : Voie orale, à utiliser dans l’eau de boisson/le lait de remplacement. Doses à administrer : Veaux et agneaux pré-ruminants : 12,5 mg de sulfadiazine et 2,5 mg de triméthoprime par kg de poids vif (correspondant à 1,5 mL de solution pour 10 kg de poids vif), toutes les 12 heures pendant 4 à 7 jours consécutifs à mélanger dans le lait de remplacement (au moment de l’ajout de l’eau). Porcins et lapins : 25 mg de sulfadiazine et 5 mg de triméthoprime par kg de poids vif par jour (correspondant à 3 mL de solution pour 10 kg de poids vif par jour en continu), pendant 4 à 7 jours consécutifs, à diluer dans l’eau de boisson. Poulets : 25 mg de sulfadiazine et 5 mg de triméthoprime par kg de poids vif par jour (correspondant à 0,3 mL de solution pour 1 kg de poids vif par jour en continu), pendant 4 à 7 jours consécutifs, à diluer dans l’eau de boisson. Conseils pour la préparation des solutions de produit : Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. La prise d’eau dépend de l’état clinique des animaux. Afin d’obtenir la posologie appropriée, il peut être nécessaire d’ajuster en conséquence la concentration en sulfadiazine et en triméthoprime. L’utilisation d’un équipement de mesure convenablement étalonné est recommandée. Sur la base de la dose recommandée et du nombre et du poids des animaux à traiter, la concentration journalière exacte du médicament vétérinaire doit être calculée selon la formule suivante : \\nmL du médicament vétérinaire / kg de poids vif / jour)xMoyenne du poids vif (en kg) des animaux à traiter = mL de médicament vétérinaire par litre d’eau de boisson/lait\\n___________________________________________________\\nMoyenne quotidienne de consommation d’eau par animal (L/animal) L’eau de boisson médicamenteuse doit être la seule source d’eau de boisson durant la durée du traitement. Toute eau de boisson médicamenteuse non consommée dans les 24 heures doit être jetée."},{"n":"CLAMOXYL LA SUSPENSION INJECTABLE POUR BOVINS PORCINS OVINS CAPRINS CHIENS ET CHATS","l":9,"v":93,"p":"Voie intramusculaire. 15 mg d'amoxicilline par kg de poids vif deux fois à 48 heures d'intervalle, soit 1 mL de suspension pour 10 kg de poids vif deux fois à 48 heures d'intervalle. Le volume administré ne doit pas excéder 10 mL pour les bovins, 5 mL pour les ovins et les caprins et 8 ml pour les porcins par site d'injection.Bien agiter le flacon pour homogénéiser la suspension avant utilisation."},{"n":"CLAMOXYL SUSPENSION 150 MG SUSPENSION INJECTABLE POUR BOVINS PORCINS OVINS CHIENS CHATS","l":5,"v":47,"p":"Voie intramusculaire, sous-cutanée. Bovins, porcins et ovins :7 mg d'amoxicilline par kg de poids vif, soit 0,5 mL de suspension pour 10 kg de poids vif, une fois par jour pendant 3 à 5 jours par voie intramusculaire. Bovins : ne pas administrer un volume supérieur à 15 mL par point d'injection.Porcins : ne pas administrer un volume supérieur à 5 mL par point d'injection.Ovins : ne pas administrer un volume supérieur à 4 mL par point d'injection. Chiens et chats :15 mg d'amoxicilline par kg de poids corporel, soit 1 mL de suspension pour 10 kg de poids corporel, une fois par jour pendant 5 jours par voie intramusculaire ou sous-cutanée. Bien agiter le flacon pour homogénéiser la suspension avant utilisation."},{"n":"CLIK","l":null,"v":40,"p":"Pour usage externe exclusivement.\\nLe médicament vétérinaire s'administre selon le schéma posologique suivant :\\nPoids vif (kg)Volume à administrer (mL)\\n10-2020\\n21-3025\\n31-5030\\n>5035\\n\\n(Les volumes indiqués correspondent à une dose de 0,6 à 2 mL de suspension (soit 30 à 100 mg de dicyclanil) par kg de poids vif).\\n\\nBien agiter le flacon avant utilisation.\\n\\nLe médicament vétérinaire doit être appliqué au pistolet, manuel ou automatique (le pistolet Elanco par exemple), équipé d'une buse de pulvérisation, qui garantit une bonne répartition du produit sur la toison. Les meilleurs résultats sont obtenus en tenant le pistolet à environ 45 cm du mouton pendant l’application. Pulvériser le médicament en utilisant une méthode d’application en quatre étapes, comme indiqué sur le pictogramme, le long de la ligne du dos de l'animal sur une bande d'au moins 10 cm de large du garrot à la croupe (la moitié de la dose) et une bande décrivant un arc de cercle autour de l'arrière-train et de la queue (reste de la dose).Le médicament vétérinaire doit être administré une seule fois, avant la période d'infestation prévue par Wohlfahrtia, et, avant ou au début de la période d'infestation par Lucilia. Une application correcte permet une protection pendant 16 semaines contre les myiases à Wohlfahrtia ou à Lucilia. Dans certains cas, un épisode de myiase peut survenir précocement ; il est donc recommandé de surveiller régulièrement les animaux.Ne pas tondre les moutons dans les trois mois qui suivent le traitement."},{"n":"CLIKZIN 12,5 MG/ML SUSPENSION POUR POUR-ON POUR OVINS","l":null,"v":7,"p":"Pour usage externe exclusivement.\\n\\nLe médicament vétérinaire s'administre selon le schéma posologique suivant : \\nPoids vif (kg)Volume à administrer (mL)\\n10-2020\\n21-3024\\n31-5030\\n>5036 \\n(Les volumes indiqués correspondent à une dose de 0,7 à 2 mL de suspension (soit 7,5 à 25 mg de dicyclanil) par kg de poids vif). Pour une bonne posologie, le poids de l'animal doit être mesuré aussi précisément que possible, afin d'éviter le sous-dosage; s’assurer de la précision du matériel de dispensation. Lors de traitements collectifs, rassembler les animaux selon leur poids et régler le dosage en fonction afin d’éviter tout surdosage ou sous-dosage. Ne pas traiter les ovins ayant une toison de moins de 3 semaines.\\nBien agiter le flacon avant utilisation.\\n\\nLe médicament vétérinaire doit être appliqué au pistolet, manuel ou automatique, équipé d'une buse de pulvérisation, qui garantit une bonne répartition du produit sur la toison. Les meilleurs résultats sont obtenus en tenant le pistolet à environ 45 cm du mouton. Pulvériser le médicament en utilisant une méthode d’application en quatre étapes, comme indiqué sur le pictogramme, le long de la ligne du dos de l'animal sur une bande d'au moins 10 cm de large du garrot à la croupe (la moitié de la dose) et une bande décrivant un arc de cercle autour de l'arrière train et de la queue (reste de la dose). \\nLe médicament vétérinaire doit être administré avant ou au début de la période d'infestation prévue mais peut également être utilisé pendant la saison des mouches.\\nUne application correcte permet une protection pendant 8 semaines. Selon les bonnes pratiques agricoles, il est recommandé de surveiller régulièrement les animaux."},{"n":"CLOSAMECTIN 5 MG/ML/125 MG/ML SOLUTION INJECTABLE POUR  OVINS","l":null,"v":28,"p":"La dose recommandée est 200 µg d'ivermectine par kg de poids vif et 5 mg de closantel par kg de poids vif (soit 1 mL de solution pour 25 kg de poids vif).\\nInjecter par voie sous-cutanée dans l'encolure.\\nUtiliser de préférence une aiguille stérile de diamètre 16 G et de longueur 2,5 cm.\\n\\nCe produit ne contient aucun conservateur. Désinfecter le bouchon avant chaque ponction. Utiliser une aiguille et une seringue sèches et stériles. Pour les flacons de 250 mL et de 500 mL, il est conseillé d'utiliser une seringue automatique. Pour remplir la seringue, l'usage d'une aiguille réservée à la ponction est recommandé afin de ne pas perforer exagérément le bouchon du flacon.\\nSi plus de 40 ponctions par flacon sont nécessaires, l'utilisation d'une aiguille de ponction est recommandée.\\n\\nLe programme de traitement doit être adapté en fonction de la situation épidémiologique locale de chaque élevage. Le programme de traitement doit être établi par une personne qualifiée qui déterminera le dosage le plus adapté ainsi que la gestion du troupeau permettant un contrôle optimal des parasites et une limitation du développement des résistances.\\n\\nPour garantir l'administration d'une dose correcte, le poids des animaux devra être déterminé le plus précisément possible. La précision du matériel de dosage utilisé devra aussi être vérifiée.\\nDans le cas de traitements collectifs, il est recommandé de regrouper les animaux en fonction de leur poids et d'ajuster la dose afin d'éviter un surdosage ou un sous-dosage.\\nPour le traitement et le contrôle de la gale du mouton, l'injection du produit sera suivie d'une seconde injection d'ivermectine à 7 jours d'intervalle pour traiter les signes cliniques et éliminer les agents de la gale. Cette seconde injection sera réalisée de l'autre côté du cou."},{"n":"COFACALCIUM SOLUTION INJECTABLE","l":0,"v":0,"p":"Voies intraveineuse, intramusculaire et sous cutanée. 12,5 à 25 mg de calcium et 26,5 à 52,9 mg d'hypophosphite de magnésium par kg de poids vif par administration, soit 0,5 mL à 1 mL de médicament vétérinaire par kg de poids vif par administration intraveineuse lente, intramusculaire et sous cutanée. L'administration peut être renouvelée, si nécessaire, toutes les 12 heures pendant un à deux jours."},{"n":"COFACOLI SOLUTION","l":null,"v":1,"p":"Administrer par voie orale.\\n\\nLa quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en colistine doit être ajustée en conséquence.\\n\\nChez les veaux, les agneaux et les porcs, la dose recommandée est de 100 000 UI de colistine par kilogramme de poids vif par jour, pendant 3 à 5 jours consécutifs dans le lait, l'aliment liquide ou l'eau de boisson soit 0,50 ml de solution pour 10 kg de poids vif par jour pendant 3 à 5 jours.\\n\\nLa dose quotidienne recommandée doit être divisée en deux, en cas d'administration buccale directe du produit à l'animal.\\n\\nChez les volailles, la dose recommandée est de 75 000 UI de colistine par kilogramme de poids vif par jour, pendant 3 à 5 jours consécutifs dans l'eau de boisson soit 37,5 ml de solution par tonne de poids vif par jour pendant 3 à 5 jours. La durée de traitement doit être limitée au temps minimal nécessaire pour le traitement de la maladie."},{"n":"COFAFER SOLUTION INJECTABLE","l":null,"v":0,"p":"Voie intramusculaire ou sous cutanée. Porcelets :- 100 à 200 mg de fer par animal, par voie intramusculaire profonde de préférence dans l'échine dans les 3 jours suivants la naissance, soit 1 mL à 2 mL de médicament vétérinaire en une seule injection. Veaux :- 300 à 400 mg de fer par animal, par voie intramusculaire ou sous cutanée au fanon dans les 3 jours suivants la naissance, soit 3 mL à 4 mL de médicament vétérinaire en une seule injection. Agneaux et chevreaux :- 100 à 200 mg de fer par animal, par voie intramusculaire ou sous cutanée dans les 3 jours suivants la naissance, soit 1 mL à 2 mL de médicament vétérinaire en une seule injection. L'injection peut être renouvelée si besoin après 8 jours ou 1 mois."},{"n":"COFAVIT 500 SOLUTION INJECTABLE","l":5,"v":308,"p":"Voie intramusculaire. Ce médicament vétérinaire ne doit pas être administré par voie sous-cutanée chez les espèces productrices de denrées alimentaires. Chez les espèces productrices de denrées alimentaires, ce médicament vétérinaire ne doit être administré qu’une seule fois et la dose recommandée ne doit pas être dépassée. 10 000 à 20 000 UI de vitamine A, 500 à 2 000 UI de vitamine D3 et 1 à 50 mg de vitamine E par kg de poids vif, en une administration unique, soit à titre indicatif et par animal : Bovins adultes : 5 à 10 mLVeaux, porcins : 2 à 4 mLOvins, caprins adultes : 1 à 2 mLPorcelets, agneaux, chevreaux, lapins : 0,5 mL"},{"n":"COFAVIT C POUDRE POUR SOLUTION BUVABLE","l":0,"v":0,"p":"Voie orale Volailles :50 mg à 100 mg d'acide ascorbique par kg de poids vif et par jour pendant 3 à 5 jours, soit 0,5 à 1 g de médicament vétérinaire par litre d'eau de boisson par jour pendant 3 à 5 jours. Autres espèces :10 mg à 20 mg d'acide ascorbique par kg de poids vif et par jour pendant 3 à 5 jours, soit 0,1 à 0,2 g de médicament vétérinaire pour 10 kg de poids vif et par jour pendant 3 à 5 jours. La quantité d'eau de boisson médicamenteuse, de lait ou d'aliment liquide consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée en acide ascorbique par kg de poids vif, la quantité de médicament vétérinaire à diluer dans le liquide doit être ajustée en conséquence."},{"n":"COLAMPI I","l":3,"v":21,"p":"Voie intramusculaire. 10 mg d'ampicilline et 25 000 UI de colistine par kg de poids vif toutes les 12 heures pendant 3 jours, soit 1 mL de médicament vétérinaire pour 10 kg de poids vif matin et soir pendant 3 jours. Bien agiter le flacon avant l'emploi."},{"n":"COLDOSTIN 4 800 000 UI/G POUDRE POUR ADMINISTRATION DANS L'EAU / LE LAIT","l":null,"v":1,"p":"Voie orale.Dans l’eau / le lait. Chez les veaux, les agneaux et les porcins :- 100 000 UI de sulfate de colistine par kilogramme de poids vif, c’est-à-dire 1 g de médicament vétérinaire pour 48 kg de poids vif, par jour, pendant 3 à 5 jours consécutifs. Chez les poulets et les dindes :- 75 000 UI de sulfate de colistine par kilogramme de poids vif, c’est-à-dire 1 g de médicament vétérinaire pour 64 kg de poids vif, par jour, pendant 3 à 5 jours consécutifs. La durée du traitement doit être limitée à la durée minimale nécessaire pour le traitement de la maladie. Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible. Sur la base de la dose recommandée et du nombre et du poids des animaux à traiter, la concentration journalière exacte du médicament vétérinaire doit être calculée selon la formule suivante : \\n... mg de médicament vétérinaire par kg poids vif, par jourxPoids vif moyen (kg)des animaux à traiter ... mg de médicament vétérinaire par litre d’eau de boisson\\n------------------------------------------------------------------------------------------=\\nConsommation d’eau moyenne par jour (litre par animal) La consommation d’eau de boisson médicamenteuse dépend de l'état physiologique et clinique des animaux. Afin d’obtenir la posologie adéquate, la concentration de sulfate de colistine doit être ajustée en conséquence.L'utilisation d’un équipement de mesure convenablement étalonné est recommandée.Le médicament vétérinaire peut être introduit à l’aide d’une pompe doseuse. Sélectionner le dosage du traitement. Régler le doseur à la vitesse d’administration souhaitée. Pour préparer la pré-solution concentrée, placer la quantité de médicament vétérinaire indiquée dans un contenant de 10 litres que vous remplirez avec de l’eau ; mélanger ensuite jusqu’à dissolution du médicament vétérinaire. La concentration maximale recommandée est de 250 grammes de médicament vétérinaire pour 10 litres d’eau de boisson et 500 mg de médicament vétérinaire pour 1 litre de lait (artificiel ou non).L’eau médicamenteuse doit être la seule source d’eau potable pour les animaux, pendant toute la durée de la période de traitement.La consommation d’eau doit être contrôlée à intervalles fréquents.Après la fin de la période de traitement, le système d’approvisionnement en eau devra être nettoyé correctement pour éviter toute consommation de substance active en quantités sous-thérapeutiques.L’eau de boisson médicamenteuse doit être fraîchement préparée toutes les 24 heures.Le lait (de remplacement) médicamenteux doit être consommé en l’espace de 4 heures."},{"n":"COLISTINE 200-CB LAPIN-VOLAILLE-PORC ET AGNEAU-CHEVREAU SEVRES","l":null,"v":7,"p":"100 000 UI de colistine par kg de poids vif et par jour, par voie orale, pendant 7 jours.\\n \\nTaux d'incorporation :\\nLa quantité d'aliment médicamenteux consommée par les animaux dépend de leur état physiologique et clinique. Pour respecter les doses recommandées en colistine et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué dans la limite minimale d'incorporation de 5 kg/tonne. Cela peut conduire à des teneurs en ppm de colistine différentes dans l'aliment médicamenteux de celles mentionnées ci-dessous à titre indicatif.\\n \\nPorcins : pour un ingéré alimentaire quotidien de 50 g d'aliment par kg de poids vif, cette posologie correspond à 2 000 UI/g d'aliment médicamenteux, soit un taux d'incorporation de 10 kg de prémélange médicamenteux par tonne d'aliment.\\n \\nAgneaux et chevreaux sevrés : pour un ingéré alimentaire quotidien de 20 g d'aliment par kg de poids vif, cette posologie correspond à 5 000 UI/g d'aliment médicamenteux, soit un taux d'incorporation de 25 kg de prémélange médicamenteux par tonne d'aliment.\\n \\nVolailles et lapins : pour un ingéré alimentaire quotidien de 100 g d'aliment par kg de poids vif, cette posologie correspond à 1 000 UI/g d'aliment médicamenteux, soit un taux d'incorporation de 5 kg de prémélange médicamenteux par tonne d'aliment. La durée de traitement doit être limitée au temps minimal nécessaire pour le traitement de la maladie."},{"n":"COLISTINE 400-F PORC ET AGNEAU-CHEVREAU SEVRES","l":null,"v":7,"p":"100 000 UI de colistine par kg de poids vif et par jour, par voie orale, pendant 7 jours.\\n\\nTaux d'incorporation\\nLa quantité d'aliment médicamenteux consommée par les animaux dépend de leur état physiologique et clinique. Pour respecter les doses recommandées en colistine et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué dans la limite minimale d'incorporation de 5 kg/tonne. Cela peut conduire à des teneurs en ppm de colistine différentes dans l'aliment médicamenteux de celles mentionnées ci-dessous à titre indicatif.\\n\\nPorcins : pour un ingéré alimentaire quotidien de 50 g d'aliment par kg de poids vif, cette posologie correspond à 2 000 UI/g d'aliment médicamenteux, soit un taux d'incorporation de 5 kg de prémélange médicamenteux par tonne d'aliment.\\n\\nAgneaux et chevreaux : pour un ingéré alimentaire quotidien de 20 g d'aliment par kg de poids vif, cette posologie correspond à 5 000 UI/g d'aliment médicamenteux, soit un taux d'incorporation de 12,5 kg de prémélange médicamenteux par tonne d'aliment. La durée de traitement doit être limitée au temps minimal nécessaire pour le traitement de la maladie."},{"n":"COLISTINE SULFATE 2 000 000 UI/ML SOLUTION BUVABLE VIRBAC","l":null,"v":1,"p":"Voie orale. La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en colistine doit être ajustée en conséquence. Chez les veaux, les agneaux et les porcs, la dose recommandée est de 100 000 UI de colistine par kilogramme de poids vif par jour, pendant 3 à 5 jours consécutifs dans le lait, l'aliment liquide ou l'eau de boisson soit 0,50 mL de solution pour 10 kg de poids vif par jour pendant 3 à 5 jours. La dose quotidienne recommandée doit être divisée en deux, en cas d'administration buccale directe du médicament vétérinaire à l'animal. Chez les volailles, la dose recommandée est de 75 000 UI de colistine par kilogramme de poids vif par jour, pendant 3 à 5 jours consécutifs dans l'eau de boisson soit 37,5 mL de solution par tonne de poids vif par jour pendant 3 à 5 jours. La durée de traitement doit être limitée au temps minimal nécessaire pour le traitement de la maladie."},{"n":"COLIVET SOLUTION","l":null,"v":1,"p":"Voie orale. La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en colistine doit être ajustée en conséquence. Chez les veaux, les agneaux et les porcs, la dose recommandée est de 100 000 UI de colistine par kilogramme de poids vif par jour, pendant 3 à 5 jours consécutifs dans le lait, l'aliment liquide ou l'eau de boisson soit 0,50 mL de solution pour 10 kg de poids vif par jour pendant 3 à 5 jours. La dose quotidienne recommandée doit être divisée en deux, en cas d'administration buccale directe du produit à l'animal. Chez les volailles, la dose recommandée est de 75 000 UI de colistine par kilogramme de poids vif par jour, pendant 3 à 5 jours consécutifs dans l'eau de boisson soit 37,5 mL de solution par tonne de poids vif par jour pendant 3 à 5 jours."},{"n":"COMPOMIX V NEOSTARTER","l":14,"v":null,"p":"Voie orale. Administration dans l’eau de boisson. 11,5 à 15,4 mg de néomycine et 16 à 22 mg d'oxytétracycline par kg de poids vif par jour pendant 6 jours, correspondant à : Veaux, agneaux, porcins :1,5 à 2,0 g de médicament vétérinaire pour 10 kg de poids vif par jour à répartir en 2 prises matin et soir pendant 6 jours dans le lait, l'aliment d'allaitement, l'aliment liquide ou l'eau de boisson. Volailles, lapins :1,5 à 2,0 g de médicament vétérinaire par litre d'eau de boisson pendant 6 jours. La consommation d'eau de boisson médicamenteuse, de lait ou d'aliment liquide dépend de l’état clinique des animaux. Afin d'obtenir la posologie appropriée, il peut être nécessaire d’ajuster en conséquence la concentration en néomycine et en oxytétracycline."},{"n":"COMPOMIX V SULFAPRIM","l":14,"v":null,"p":"Voie orale. A dissoudre dans l’eau de boisson ou l’aliment liquide. 11,6 à 23,2 mg de sulfadiméthoxine et 5 à 10 mg de triméthoprime par kg de poids vif et par jour, consécutifs, soit : Veaux : 2 à 4 g du médicament vétérinaire pour 10 kg de poids vif pendant 6 jours.Agneaux, porcins : 2 à 4 g de du médicament vétérinaire pour 10 kg de poids vif pendant 5 jours.Volailles, lapins : 2 à 4 g de du médicament vétérinaire par litre d'eau de boisson pendant 5 jours. La quantité d'eau de boisson médicamenteuse, de lait ou d'aliment liquide consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la dose recommandée en triméthoprime et en sulfadiméthoxine par kg de poids vif, la quantité de poudre à dissoudre dans le liquide doit être ajustée en conséquence."},{"n":"COREBRAL SOLUTION INJECTABLE","l":0,"v":0,"p":"Voies d'administration : intraveineuse et intramusculaire. 4,46 mg de thiamine et 2,06 mg de pyridoxine par kg de poids vif et par jour, correspondant à 1 mL de solution pour 10 kg de poids vif.Intervenir précocement dès les premiers signes de l'affection. Les doses peuvent être doublées suivant l'avis du vétérinaire traitant.Une seule injection suffit le plus souvent."},{"n":"CUBARMIX","l":null,"v":10,"p":"Voie orale. 12,5 mg de sulfadiazine et 2,5 mg de triméthoprime par kg de poids vif 2 fois par jour pendant 3 jours à dissoudre dans l'eau de boisson, l'aliment liquide ou le lait. Pour un veau de 50 kg cette posologie correspond à 11 g de produit matin et soir pendant 3 jours."},{"n":"CYCLOSOL 200 LA SOLUTION INJECTABLE POUR BOVINS OVINS ET PORCINS","l":8,"v":35,"p":"Voie intramusculaire pour les bovins, ovins et porcins (adultes).Voie sous-cutanée pour les porcelets. 20 mg d'oxytétracycline par kg de poids vif en une injection unique, soit 1 mL de solution injectable pour 10 kg de poids vif. Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. Si des signes cliniques de maladie persistent 72 heures après la première administration, une deuxième administration de 20 mg d'oxytétracycline par kg peut être effectuée."},{"n":"CYCLOSPRAY 2,45 % W/W SUSPENSION POUR PULVERISATION CUTANEE POUR BOVINS, OVINS ET PORCINS","l":0,"v":0,"p":"Voie cutanée.Agiter vigoureusement le récipient avant pulvérisation. Le récipient doit être maintenu à une distance d'environ 15 à 20 cm de la zone à pulvériser. Pulvériser pendant trois secondes, jusqu'à ce que la zone à traiter soit colorée de manière uniforme.En cas d'infection du sabot, ce traitement doit être répété après 30 secondes.- Pour le traitement des plaies superficielles traumatiques ou chirurgicales, contaminées par des germes sensibles à la chlortétracyline, une administration unique est recommandée.- Pour le traitement de la dermatite digitée, une administration à deux reprises, à 30 secondes d'intervalle, une à deux fois par jour pendant trois jours consécutifs, est recommandée.- Pour le traitement des autres infections du sabot (piétin et pourriture du pied), une administration à deux reprises, à 30 secondes d'intervalle, une à deux fois par jour, est recommandée. En fonction de la sévérité de la lésion et de la vitesse de cicatrisation, le traitement devra être répété après un à trois jours."},{"n":"CYDECTINE 0,1 % SOLUTION ORALE POUR OVINS","l":5,"v":14,"p":"Voie orale.200 µg par kg de poids vif (1 mL pour 5 kg) par voie orale en administration unique à l'aide d'un matériel multi-doseur.Un sous-dosage peut entraîner une inefficacité et favoriser le développement d'une résistance.Afin d'assurer l'administration de la dose correcte, déterminer aussi précisément que possible le poids. Si les animaux doivent être traités collectivement, il convient de constituer des groupes raisonnablement homogènes et de traiter tous les animaux d'un groupe à la dose correspondant à l'animal le plus lourd. La précision d'administration du traitement devra être soigneusement vérifiée. Ne pas mélanger avec d'autres produits."},{"n":"CYDECTINE 1 % SOLUTION INJECTABLE POUR OVINS","l":60,"v":82,"p":"Voie sous cutanée.200 µg de moxidectine par kg de poids vif (équivalent à 0,1 mL pour 5 kg) par voie sous-cutanée en injection unique. - Pour la gale, le traitement curatif nécessite deux injections à 10 jours d'intervalle, le traitement préventif, une seule injection. - L'administration doit se faire en avant ou en arrière de l'épaule, en utilisant une aiguille de 1,5 à 1,2 mm de diamètre et de 1,5 cm de longueur. Il est recommandé d'utiliser un matériel multi-doseur avec une aiguille amovible pour les présentations de 200 mL et 500 mL."},{"n":"CYDECTINE LA 20 MG/ML SOLUTION INJECTABLE POUR OVINS","l":null,"v":104,"p":"Voie sous-cutanée.La dose est de 0,5 mL/10 kg de poids vif soit 1 mg de moxidectine par kg de poids vif. Les bouchons des flacons de 50 mL ne doivent pas être percés plus de 10 fois. Utiliser un dispositif de seringue automatique pour les présentations de 200 mL et 500 mL.Un sous-dosage pourrait entraîner une utilisation inefficace et favoriser le développement de résistances. Pour permettre l'administration d'une dose correcte, le poids vif doit être déterminé le plus précisément possible ; la précision du dispositif d'administration doit être vérifiée. Si les animaux doivent être traités collectivement plutôt qu'individuellement, il faut les regrouper en fonction de leur poids vif et leur administrer le médicament en conséquence, afin d'éviter tout sous- ou surdosage.Le produit doit être administré par injection sous-cutanée unique à la base de l'oreille en utilisant une aiguille hypodermique de 25 mm de calibre 18. En maintenant la tête de l'animal, la formulation doit être administrée à la base de l'oreille à environ 2 cm en arrière du bord antérieur du pavillon. La peau à la base de l'oreille choisie doit être pincée et le médicament injecté dans le tissu sous-cutané. Après l'administration sous-cutanée, l'aiguille doit être retirée de la peau en appliquant une pression avec le pouce au point d'injection pendant plusieurs secondes. Si une fuite se produit, il faut alors appliquer la pression pendant quelques secondes de plus.\\nDiagramme : procédure d'injection auriculaire"},{"n":"CYDECTINE TRICLAMOX 1 MG/ML + 50 MG/ML SOLUTION BUVABLE POUR OVINS","l":null,"v":31,"p":"Voie orale.Administrer en une seule prise orale 1 mL de solution pour 5 kg de poids vif, soit 0,2 mg de moxidectine par kg de poids vif et 10 mg de triclabendazole par kg de poids vif, à l'aide d'un matériel de traitement standard.\\nPour permettre l'administration d'une dose correcte, le poids vif doit être déterminé le plus précisément possible; la précision du dispositif d'administration doit être vérifiée. Si les animaux doivent être traités collectivement plutôt qu'individuellement, il faut les regrouper en fonction de leur poids vif et leur administrer le médicament en conséquence, afin d'éviter tout sous- ou surdosage."},{"n":"DECTOMAX 10 MG/ML SOLUTION INJECTABLE POUR BOVINS OVINS ET PORCINS","l":70,"v":77,"p":"Bovins : voie sous-cutanée.Ovins : voie intramusculaire.Porcins : voie intramusculaire.Traitement et contrôle des nématodes gastro-intestinaux, respiratoires, de l'oeil, des hypodermes, des poux et des agents responsables de la gale chez les bovins et des nématodes gastro-intestinaux et des oestres chez les ovins, injection unique de 1 mL (10 mg de doramectine) pour 50 kg de poids vif, ce qui équivaut à 200 microgrammes de doramectine par kg de poids vif, administré dans la région du cou par voie sous-cutanée chez les bovins et par voie intramusculaire chez les ovins. Traitement des signes cliniques de Psoroptes ovis (gale ovine) et élimination des agents de la gale, injection unique à la dose de 1 mL pour 33 kg de poids vif, ce qui correspond à 300 microgrammes de doramectine par kg de poids vif, administré par voie intramusculaire dans le cou. De plus, des mesures de biosécurité doivent être mises en place pour éviter la réinfestation. Il est important de s'assurer que tous les ovins ayant été en contact avec des animaux infestés soient traités. Traitement de Sarcoptes scabei et des nématodes gastro-intestinaux, respiratoires, des reins et des poux piqueurs chez les porcs, traitement unique à la dose de 1 mL pour 33 kg de poids vif, ce qui équivaut à 300 microgrammes de doramectine par kg de poids vif, administré par voie intramusculaire. Les porcelets pesant 16 kg ou moins doivent recevoir un traitement selon le tableau suivant : \\nPoids (kg)Dose (mL)\\nMoins de 4 kg0,1\\n5-7 kg0,2\\n8-10 kg0,3\\n11-13 kg0,4\\n14-16 kg0,5 Pour assurer l'administration d'une dose correcte, le poids de l'animal doit être déterminé le plus précisément possible et le calibrage de l'appareil servant au dosage doit être vérifié. Si les animaux doivent être traités en groupe, plutôt qu'individuellement, ils doivent être regroupés selon leur poids et traités en conséquence, de façon à éviter tout sous-dosage ou surdosage. Volume d'injection maximal pour chaque espèce cible :Bovins : 5 mL par site d'injectionOvins : 1,5 mL par site d'injectionPorcins : 2,5 mL par site d'injection Le médicament vétérinaire peut être utilisé avec un système automatique d'injection. Ne pas ponctionner les bouchons plus d'une fois."},{"n":"DECTOSPOT 10 MG/ML SOLUTION POUR-ON POUR BOVINS ET OVINS","l":1,"v":35,"p":"Usage externe. Application en pour-on.Un sous-dosage peut entraîner une utilisation inefficace et favoriser le développement d’une résistance.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. Si les animaux doivent être traités en groupe, il faut former des groupes raisonnablement homogènes, et tous les animaux d’un groupe doivent recevoir la dose correspondant à l’animal le plus lourd. Posologie : Bovins : 100 mg de deltaméthrine par animal, soit 10 mL de médicament vétérinaire.Ovins : 50 mg de deltaméthrine par animal, soit 5 mL de médicament vétérinaire.Agneaux (de moins de 10 kg de poids vif ou âgé de moins d’un mois) : 25 mg de deltaméthrine par animal, soit 2,5 mL de médicament vétérinaire. Appliquer le médicament vétérinaire non dilué en un seul point entre les épaules de l’animal comme illustré dans le schéma ci-dessous. Pour le traitement et la prévention des infestations par les tiques, les mélophages et les poux chez les ovins, écarter les poils de la toison et appliquer le produit sur la peau de l’animal. Pour que l’efficacité soit maximale, il est recommandé de respecter les consignes suivantes :- traiter peu après la tonte (animaux à toison courte),- maintenir les ovins traités à l’écart des ovins non traités pour éviter toute ré-infestation. La protection contre les mouches est maintenue pendant 4 à 6 semaines. Poux chez les bovins : en règle générale, une application éradiquera tous les poux. L’éradication complète peut prendre 4 à 5 semaines, période pendant laquelle les oeufs éclosent et les poux sont tués. Quelques poux peuvent survivre sur une petite minorité d’animaux. Mélophages et poux chez les ovins : une application réduira l’incidence de l’infestation par les poux piqueurs ou les mélophages sur la période de 4 à 6 semaines qui suit le traitement. Cas établis de myiases cutanées des ovins : appliquer directement sur la zone infestée de mouches dès que les myiases sont détectées. Une seule application permet de s’assurer que les larves de mouche sont tuées en peu de temps. En cas de lésions plus avancées dues à la myiase, il est conseillé de tondre la laine souillée avant le traitement. L’influence des conditions météorologiques sur la durée de l’efficacité du traitement n’a pas été étudiée.La durée de la période de prévention contre Musca spp. peut varier. Le médicament doit être appliqué à l’aide d’un dispositif approprié :- Pour les présentations de 250 mL et de 500 mL, utiliser une chambre graduée raccordée au flacon.- Pour les présentations de 1 litre et de 2,5 litres, il est recommandé d’utiliser un applicateur approprié. Pour être approprié, l’applicateur doit être conforme aux spécifications suivantes :- il doit délivrer des doses de 5 mL et de 10 mL.- il doit être doté d’un tuyau flexible dont le diamètre interne est compris entre 6 mm et 12 mm. La procédure d’utilisation des dispositifs d’application qui est recommandée est illustrée dans les schémas ci-dessous. 1. Utilisation de la chambre graduée sur les flacons de 250 mL et de 500 mL : 2. Raccordement des flacons de 1 et de 2,5 litres à un applicateur approprié :"},{"n":"DELTANIL 10 MG/ML SOLUTION POUR POUR-ON POUR BOVINS ET OVINS","l":0,"v":35,"p":"Usage externe Utilisation en pour-on. Dose :Bovins : 100 mg de deltaméthrine par animal, soit 10 mL de médicament vétérinaire.Ovins : 50 mg de deltaméthrine par animal, soit 5 mL de médicament vétérinaire.Agneaux (moins de 10 kg de poids corporel ou moins d'1 mois) : 25 mg de deltaméthrine par animal, soit 2,5 mL de médicament vétérinaire. Administration :Le médicament vétérinaire doit être appliqué à l'aide d'un dispositif approprié :- pour les flacons de 0,5 litre et d'1 litre, le médicament vétérinaire est fourni avec un gobelet doseur.- pour les flacons de 2,5 litres et les poches souples de 2,5 litres et de 4,5 litres, il est recommandé d'utiliser un pistolet doseur approprié. Les poches souples doivent être transportées dans un sac à dos approprié. Un applicateur approprié doit être conforme aux spécifications suivantes :- il doit délivrer des doses de 2,5 mL, 5 mL et 10 mL.- il doit être accompagné d'un tuyau flexible d'un diamètre interne compris entre 10 et 14 mm. [Dans certains cas, une étape supplémentaire (n°5 ci-dessous) doit être prévue pour supprimer le sceau d’inviolabilité supplémentaire :] Bovins : Appliquer une dose de 10 mL à l'aide d'un applicateur approprié.Ovins : Appliquer une dose de 5 mL à l'aide d'un applicateur approprié.Agneaux : Appliquer une dose de 2,5 mL à l'aide d'un applicateur approprié. Site d'application :Appliquer le médicament vétérinaire le long de la ligne médiane du dos au niveau des épaules. Voir les instructions d'indication spécifiques ci-après. Poux chez les bovins : une seule application éradiquera généralement l'ensemble des poux. Une éradication complète de l'ensemble des poux peut prendre 4 à 5 semaines au cours desquelles les oeufs éclosent et les poux sont tués. Il est possible qu'un très petit nombre de poux survive sur une petite minorité d'animaux. Mouches chez les bovins : là où prédominent les mouches des cornes, le traitement et la prévention des infestations peuvent durer de 4 à 8 semaines. Tiques chez les ovins : une application entre les épaules permettra le traitement et la prévention des infestations par les tiques chez des animaux de tous âges, pendant une durée allant jusqu'à 6 semaines après le traitement. Mélophages et poux chez les ovins : une application entre les épaules chez les ovins à toison longue ou courte réduira l'incidence d'une infestation de poux ou de mélophages pendant une période de 4 à 6 semaines après le traitement. Il est conseillé de :- traiter rapidement après la tonte (animaux à toison courte),- maintenir les ovins traités à l'écart des ovins non traités afin d'éviter toute ré-infestation. N.B. Pour le traitement et la prévention des infestations par les tiques, les mélophages et les poux chez les ovins, il convient d'écarter la toison et d'appliquer le médicament vétérinaire sur la peau de l'animal. Myiases cutanées chez les ovins : appliquer directement sur la zone infestée de mouches dès que les myases sont détectées. Une seule application permet de s'assurer que les larves de mouche sont tuées en peu de temps. En cas de lésions plus avancées dues à la myase, il est conseillé de tondre la laine souillée avant le traitement. Poux et tiques chez les agneaux : une application le long de la ligne médiane du dos au niveau des épaules permettra le traitement et la prévention des infestations par les tiques jusqu'à 6 semaines après le traitement et permettra de réduire l'incidence des poux piqueurs pendant une période de 4 à 6 semaines après le traitement."},{"n":"DEPOCILLINE SUSPENSION INJECTABLE","l":10,"v":17,"p":"Voie intramusculaire. Bovins, ovins, porcins et chevaux :12 à 30 mg/kg de benzylpénicilline procaïne par kg de poids vif et par jour soit 4 à 10 mL pour 100 kg de poids vif et par jour pendant 3 à 7 jours. Chiens et chats :30 mg/kg de benzylpénicilline procaïne par kg de poids vif et par jour soit 0,1 mL par kg de poids vif par jour pendant 3 à 7 jours. Pour assurer un dosage correct, le poids vif doit être déterminé le plus précisément possible afin d'éviter un sous-dosage. La durée appropriée du traitement doit être choisie en fonction des besoins cliniques et du rétablissement individuel de l'animal traité. Il convient de tenir compte de l'accessibilité du tissu cible et des caractéristiques de l'agent pathogène cible. Bien agiter le flacon pour homogénéiser la suspension avant l'emploi.Ne pas répéter les injections au même site d'injection.Injecter en deux points si le volume excède 20 mL."},{"n":"DHS 50 COOPHAVET POUDRE POUR SOLUTION BUVABLE","l":null,"v":14,"p":"Voie orale. La quantité d'eau de boisson médicamenteuse, de lait ou d'aliment liquide consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la dose recommandée en dihydrostreptomycine par kg de poids vif, la quantité de poudre à diluer dans le liquide doit être ajustée en conséquence. Veaux, agneaux, chevreaux, porcins, lapins :50 à 100 mg de dihydrostreptomycine (sous forme de sulfate) par kg de poids vif et par jour, pendant 3 à 5 jours dans le lait, l'aliment d'allaitement, l'aliment liquide ou l'eau de boisson, soit 1 à 2 g de poudre pour 10 kg de poids vif et par jour, pendant 3 à 5 jours."},{"n":"DIACOX 2,5 MG/ML SUSPENSION BUVABLE POUR OVINS ET BOVINS","l":null,"v":0,"p":"Voie orale. Afin d'assurer l'administration d'une dose correcte, le poids vif doit être déterminé aussi précisément que possible. Lorsque les animaux doivent être traités collectivement plutôt qu'individuellement, ils doivent être regroupés en fonction de leur poids vif et doivent recevoir une dose de traitement adaptée, afin d'éviter toute administration insuffisante ou excessive. Si une réponse satisfaisante n'est pas observée, il est conseillé de vous rapprocher de votre vétérinaire, la cause de l'échec devra être étudiée. Il est recommandé d’améliorer les conditions d’hygiène du logement des animaux. Guide posologique : 1 mg de diclazuril par kg de poids vif (soit 1 mL du médicament vétérinaire par 2,5 kg de poids vif) en une administration orale unique. \\nPoids vif (kg)Volume de posologie (mL)\\n5,0 kg2 mL\\n7,5 kg3 mL\\n10,0 kg4 mL\\n12,5 kg5 mL\\n15,0 kg6 mL\\n20,0 kg8 mL\\n25,0 kg10 mL\\n50,0 kg20 mL\\n75,0 kg30 mL\\n100,0 kg40 mL\\n150,0 kg60 mL\\n175,0 kg70 mL\\n200,0 kg80 mL Agneaux :Administration orale unique de 1 mg de diclazuril par kg de poids vif ou 1 mL de médicament vétérinaire par 2,5 kg poids vif à environ 4-6 semaines d'âge au moment où l’on peut normalement s'attendre à voir apparaître de la coccidiose dans l’exploitation. En cas de forte pression parasitaire, un deuxième traitement peut être indiqué environ 3 semaines après la première administration. Veaux :Administration orale unique de1 mg de diclazuril par kg de poids vif ou 1 mL de médicament vétérinaire par 2,5 kg de poids vif, 14 jours après le placement dans un environnement potentiellement à haut risque. Méthode d'administration Bien agiter avant l'emploi. Il est recommandé d'utiliser des appareils de mesure correctement étalonnés.Le médicament vétérinaire doit être administré à l’aide d’un pistolet drogueur. Le pistolet utilisé devra permettre un dosage précis. Ceci est particulièrement important pour l’administration de petits volumes."},{"n":"DIAZIPRIM","l":null,"v":12,"p":"Voie d’administration : Voie orale, à utiliser dans l’eau de boisson/le lait de remplacement. Doses à administrer : Veaux et agneaux pré-ruminants 12,5 mg de sulfadiazine et 2,5 mg de triméthoprime par kg de poids vif (correspondant à 1,5 mL de solution pour 10 kg de poids vif), toutes les 12 heures pendant 4 à 7 jours consécutifs à mélanger dans le lait de remplacement (au moment de l’ajout de l’eau). Porcins et lapins 25 mg de sulfadiazine et 5 mg de triméthoprime par kg de poids vif par jour (correspondant à 3 mL de solution pour 10 kg de poids vif par jour en continu), pendant 4 à 7 jours consécutifs, à diluer dans l’eau de boisson. Poulets 25 mg de sulfadiazine et 5 mg de triméthoprime par kg de poids vif par jour (correspondant à 0,3 mL de solution pour 1 kg de poids vif par jour en continu), pendant 4 à 7 jours consécutifs, à diluer dans l’eau de boisson. Conseils pour la préparation des solutions de produit : Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. La prise d’eau dépend de l’état clinique des animaux. Afin d’obtenir la posologie appropriée, il peut être nécessaire d’ajuster en conséquence la concentration en sulfadiazine et en triméthoprime.L’utilisation d’un équipement de mesure convenablement étalonné est recommandée. Sur la base de la dose recommandée et du nombre et du poids des animaux à traiter, la concentration journalière exacte du médicament vétérinaire doit être calculée selon la formule suivante : \\nmL de médicament vétérinaire / kg de poids vif / jourxMoyenne du poids vif (en kg) des animaux à traiter mL de médicament vétérinaire par litre d'eau de boisson/lait\\n =\\nMoyenne quotidienne de consommation d’eau par animal(L / animal) L’eau de boisson médicamenteuse doit être la seule source d’eau de boisson durant la durée du traitement. Toute eau de boisson médicamenteuse non consommée dans les 24 heures doit être jetée."},{"n":"DISTOCUR 34 MG/ML SUSPENSION BUVABLE POUR BOVINS ET OVINS","l":7,"v":14,"p":"Voie orale. Administrer par voie orale avec un pistolet doseur. Agiter la suspension au moins 5 fois avant utilisation. Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible. La précision de l’appareil de mesure doit être vérifiée. Si des animaux doivent être traités collectivement, plutôt qu’individuellement, ces derniers doivent être regroupés selon leur poids et traités en conséquence, afin d’éviter tout sous- ou surdosage. Posologie : Bovins :10 mg d'oxyclozanide par kg de poids vif, correspondant à 3 mL du médicament vétérinaire pour 10 kg de poids vif.Pour les animaux de plus de 350 kg : 3,5 g d’oxyclozanide par animal soit 103 mL du médicament vétérinaire. Ovins :15 mg d’oxyclozanide par kg de poids vif, correspondant à 4,4 mL du médicament vétérinaire pour 10 kg de poids vif.Pour les animaux de plus de 45 kg : 0,68 g d’oxyclozanide par animal soit 20 mL du médicament vétérinaire."},{"n":"DOLISOVET INTRAMAMMAIRE POMMADE INTRAMAMMAIRE","l":null,"v":0,"p":"Voie intramammaire.1 seringue de 10 g, 2 fois par jour pendant 3 à 5 jours.Avant l'injection du médicament vétérinaire, vider totalement le quartier malade et désinfecter l'orifice du trayon."},{"n":"DORAXX 100 MG/ML SOLUTION INJECTABLE POUR BOVINS, PORCINS ET OVINS","l":null,"v":22,"p":"BovinsVoie sous-cutanée.Une injection unique par voie sous-cutanée de 2,5 mg de tulathromycine/kg de poids vif (équivalent à 1 mL/40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 7,5 mL au même site d’administration. PorcinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalent à 1 mL/40 kg de poids vif) dans le cou. Pour le traitement des porcins de plus de 80 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 2 mL au même site d’administration. Pour les maladies respiratoires, il est recommandé de traiter les animaux aux stades précoces de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques respiratoires persistent ou s’aggravent, ou en cas de rechute, le traitement doit être changé en utilisant un autre antibiotique, et poursuivi jusqu'à ce que les signes cliniques disparaissent. OvinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalent à 1 mL/40 kg de poids vif) dans le cou. Pour assurer un dosage correct, le poids de l’animal doit être déterminé aussi précisément que possible pour éviter un sous-dosage. Pour les flacons multidoses, il est recommandé d’utiliser une aiguille de prélèvement ou une seringue automatique afin de limiter le nombre de percements du bouchon. Le bouchon peut être percé en toute sécurité jusqu'à 25 fois pour les flacons de 100 mL et 50 fois pour les flacons de 250 mL."},{"n":"DORIMEC 10 MG/ML SOLUTION INJECTABLE POUR BOVINS OVINS ET PORCINS","l":70,"v":77,"p":"Voie sous-cutanée (bovins).Voie intramusculaire (ovins et porcins). Pour le traitement des nématodes gastro-intestinaux, des nématodes de l’appareil respiratoire, des nématodes de l’oeil, des hypodermes, des poux et des acariens responsables de la gale chez les bovins, tout comme des nématodes gastro-intestinaux et des larves d’oestres chez les ovins : un seul traitement de 1 mL (10 mg de doramectine) par 50 kg de poids vif, ce qui équivaut à 200 mcg/kg de poids vif, administré dans la région du cou par voie sous-cutanée chez les bovins et par voie intramusculaire chez les ovins.Pour le traitement des signes cliniques de Psoroptes ovis (gale du mouton) et l’élimination des acariens vivants chez les ovins : un seul traitement de 1 mL pour 33 kg de poids vif, ce qui équivaut à 300 µg/kg de poids vif, administré dans le cou par voie intramusculaire. De plus, des mesures de biosécurité adéquates doivent être mises en place afin d’éviter une ré infestation. Il est important d’assurer que tous les moutons étant entrés en contact avec des moutons infestés soient traités. Pour le traitement de Sarcoptes scabei et des nématodes gastro-intestinaux, des nématodes de l’appareil respiratoire, des nématodes des reins et des poux piqueurs chez les porcins : un seul traitement de 1 mL pour 33 kg de poids vif, ce qui équivaut à 300 µg/kg de poids vif, administré par voie intramusculaire. Les porcelets pesant 16 kg ou moins doivent recevoir les doses indiquées dans le tableau ci-dessous : \\nPoids vif (kg)Dose (mL)\\nMoins de 4 kg0,1 mL\\n5 à 7 kg0,2 mL\\n8 à 10 kg0,3 mL\\n11 à 13 kg0,4 mL\\n14 à 16 kg0,5 mL Pour garantir l’administration d’une dose correcte, le poids vif doit être déterminé avec autant d’exactitude que possible; il convient de vérifier la précision du dispositif doseur.Si les animaux doivent être traités collectivement et non individuellement, il convient de les regrouper selon leur poids vif et de les traiter en conséquence, en vue d’éviter tout sous-dosage ou surdosage. Volume maximum à injecter pour chaque espèce cible : Bovins : 5 mL par site d’injectionOvins : 1,5 mL par site d’injectionPorcins : 2,5 mL par site d’injection Le produit peut être utilisé avec du matériel d’injection automatique multi-dose. Lors de l’utilisation d’un dispositif automatique, les bouchons des flacons ne doivent pas être percés plus d’une fois. Lors du perçage manuel des flacons, les bouchons des flacons ne doivent pas être percés plus de 10 fois pour le conditionnement de 50 mL et plus de 25 fois pour les conditionnements de 250 mL et de 500 mL."},{"n":"DOUVISTOME","l":7,"v":14,"p":"Voie orale. Chez les bovins (jusqu'à 350 kg) : 10 mg d'oxyclozanide par kg de poids vif, correspondant à 3 mL de produit pour 10 kg de poids vif en une administration unique.Chez les bovins (à partir de 350 kg) : 3,5 g d'oxyclozanide par animal, correspondant à 100 mL de produit quel que soit le poids, en une administration unique. Chez les ovins (jusqu'à 45 kg) : 15 mg d'oxyclozanide par kg de poids vif, correspondant à 4,5 mL de produit pour 10 kg de poids vif en une administration unique.Chez les ovins (à partir de 45 kg) : 0,68 g d'oxyclozanide par animal correspondant à 20 mL de produit quel que soit le poids, en une administration unique. Bien agiter avant utilisation."},{"n":"DUOTECH","l":null,"v":42,"p":"5 mg d'oxfendazole et 10 mg de closantel (sous forme sodique) par kg de poids vif, soit une administration orale unique de 1 mL de suspension pour 5 kg de poids vif.\\n\\nBien agiter la suspension avant utilisation pour une bonne homogénéité du produit.\\nUtiliser un pistolet doseur propre et correctement étalonné.\\n\\nPour permettre l'administration d'une dose correcte, le poids vif doit être déterminé le plus précisément possible : la précision du dispositif d'administration doit être vérifiée. Si les animaux doivent être traités collectivement plutôt qu'individuellement, il faut les regrouper en fonction de leur poids et leur administrer le médicament en conséquence, afin d'éviter tout sous ou surdosage.\\n\\nLe tableau suivant indique la dose requise en fonction du poids de l'animal : \\nPoids vif (kg)Dose (ml de suspension)\\n51 mL\\n102 mL\\n153 mL\\n204 mL\\n255 mL\\n306 mL\\n408 mL\\n5010 mL\\n6012 mL\\n7014 mL\\n8016 mL\\nProgramme de traitement :\\n\\nLa période de traitement doit être déterminée en fonction des données épidémiologiques et adaptée à chaque élevage par le vétérinaire traitant.\\nConsulter le vétérinaire sur les programmes de traitement et la gestion des troupeaux afin d'obtenir un contrôle parasitaire adéquat et de réduire l'apparition des résistances aux anthelminthiques.\\nConsulter aussi le vétérinaire, si le produit ne présente pas l'efficacité clinique attendue car d'autres maladies, des désordres nutritionnels ou des résistances aux anthelminthiques peuvent être présentes."},{"n":"DUPHAMOX LA 150 MG/ML SUSPENSION INJECTABLE POUR BOVINS PORCINS OVINS CAPRINS ET CHATS","l":5,"v":44,"p":"Bovins, porcins, ovins, caprins : voie intramusculaire.Chats : voie sous-cutanée. Bovins, porcins, ovins, caprins : 15 mg d'amoxicilline par kg de poids vif, deux fois à 48 heures d'intervalle, soit 1 mL de suspension pour 10 kg de poids vif, deux fois à 48 heures d'intervalle.La dose est de 1 mL pour 10 kg de poids vif. Si le volume d'injection dépasse 15 mL chez les bovins et 4 mL chez les ovins, les porcins et les caprins, il devrait être divisé et injecté en 2 sites ou plus. Chats : 15 mg d'amoxicilline par kg de poids corporel, deux fois à 48 heures d'intervalle, soit 1 mL de suspension pour 10 kg de poids corporel, deux fois à 48 heures d'intervalle. Bien agiter le flacon pour homogénéiser la suspension avant utilisation."},{"n":"DYCOXAN 2,5 MG/ML SUSPENSION BUVABLE POUR OVINS ET BOVINS","l":null,"v":0,"p":"Voie orale. Afin d'assurer l'administration d'une dose correcte, le poids vif doit être déterminé aussi précisément que possible. Lorsque les animaux doivent être traités collectivement plutôt qu'individuellement, ils doivent être regroupés en fonction de leur poids vif et doivent recevoir une dose de traitement adaptée, afin d'éviter toute administration insuffisante ou excessive. Si une réponse satisfaisante n'est pas observée, il est conseillé de vous rapprocher de votre vétérinaire, la cause de l'échec devra être étudiée. Il est recommandé d’améliorer les conditions d’hygiène du logement des animaux. Guide posologique : 1 mg de diclazuril par kg de poids vif (soit 1 mL du médicament vétérinaire par 2,5 kg de poids vif) en une administration orale unique. TABLEAU DE POSOLOGIE : \\nPoids vif (kg)Volume de posologie (mL)\\n5,0 kg2 mL\\n7,5 kg3 mL\\n10,0 kg4 mL\\n12,5 kg5 mL\\n15,0 kg6 mL\\n20,0 kg8 mL\\n25,0 kg10 mL\\n50,0 kg20 mL\\n75,0 kg30 mL\\n100,0 kg40 mL\\n150,0 kg60 mL\\n175,0 kg70 mL\\n200,0 kg80 mL Agneaux :Administration orale unique de 1 mg de diclazuril par kg de poids vif ou 1 mL de médicament vétérinaire par 2,5 kg poids vif à environ 4-6 semaines d'âge au moment où l’on peut normalement s'attendre à voir apparaître de la coccidiose dans l’exploitation. En cas de forte pression parasitaire, un deuxième traitement peut être indiqué environ 3 semaines après la première administration. Veaux :Administration orale unique de 1 mg de diclazuril par kg de poids vif ou 1 mL de médicament vétérinaire par 2,5 kg de poids vif 14 jours après le placement dans un environnement potentiellement à haut risque. Méthode d'administration Il est recommandé d'utiliser des appareils de mesure correctement étalonnés.Le médicament vétérinaire doit être administré à l’aide d’un pistolet drogueur. Le pistolet utilisé devra permettre un dosage précis. Ceci est particulièrement important pour l’administration de petits volumes."},{"n":"ECTOFLY 12,5 MG/ML SOLUTION POUR-ON POUR OVINS","l":5,"v":8,"p":"Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible, la précision du dispositif de dosage doit être vérifié.A la fin de chaque cycle de traitement et avant de ranger le pistolet doseur, expulser immédiatement tout reste de médicament vétérinaire du pistolet doseur. Administrer le médicament vétérinaire au moyen du pistolet applicateur recommandé comme suit : Mouches responsables de myases :Prévention des myases \\nPoids vifDoseDoses par litre\\nJusqu'à 25 kg*20 mL50\\nDe 25 à 40 kg30 mL33\\nPlus de 40 kg40 mL25 *Ne pas administrer à des animaux dont le poids vif est inférieur à 12,5 kg.Le volume administré ne doit pas dépasser 40 mL par animal. Appliquer par pulvérisation en éventail sur la surface de la toison sur le dos et l'arrière-train du mouton en utilisant le pistolet Pour-On auquel est fixée une buse à pulvérisation en éventail. La moitié de la dose doit être appliquée sur les épaules, le dos et les flancs et l'autre moitié sur la culotte. La distance entre la buse et la toison doit être de 20 cm environ. Pour appliquer chaque dose il est nécessaire de repasser 2 ou 3 fois.LE MÉDICAMENT VÉTÉRINAIRE EMPECHERA L'ATTAQUE DES MOUCHES UNIQUEMENT SUR LES ZONES COUVERTES PAR LE SPRAY.Une application donne une protection de 6 à 8 semaines. Retraiter l'animal selon les besoins. \\nCoverage with spray = Couvert par le spray Traitement des myases Appliquer directement sur toutes les zones affectées à raison de 2,5 mL pour 100 -150 cm2 (à peu près la taille d'une main). La buse en forme de T sera utilisée. La plupart des parties attaquées nécessitent 5-10 mL. Veiller à ce que toutes les zones affectées soient traitées. Une seule application suffit à s'assurer de l'expulsion des larves et de leur mort en quelques heures. Poux :5 mLl par 20 kg de poids vif jusqu'à un maximum de 20 mL. \\nPoids vifDoseDoses par litre\\nJusqu'à 20 kg5 mL200\\nDe 21 à 40 kg10 mL100\\nDe 41 à 60 kg15 mL66\\nPlus de 60 kg20 mL50 A l'aide de la buse droite fixée sur le pistolet applicateur, appliquer sous forme de jet en ligne à partir des épaules jusqu'à la culotte le long de l'épine dorsale.Les moutons peuvent être traités après la tonte ou à tout moment pendant l'année.. Tiques :Moutons adultes et agneaux de plus de 10 kg : 10 mL par 20 kg de poids vif, jusqu'à un maximum de 40 mL.Agneaux de moins de 10 kg : 5 mL suivis 3 semaines plus tard d'une application de 10 mL. \\nPoids vifDoseDoses par litre\\nJusqu'à 10 kg5 mL200\\nDe 11 à 20 kg10 mL100\\nDe 21 à 40 kg20 mL50\\nDe 41 à 60 kg30 mL33\\nPlus de 60 kg40 mL25 A l'aide de la buse droite fixée sur le pistolet Pour-On, appliquer sous forme de jet en ligne à partir du haut de la tête jusqu'au haut de la culotte. Mouche de tête :5 mL par animal, quelle que soit sa taille.Appliquer sur le haut de la tête entre les oreilles, en utilisant la buse en forme de T.Eviter d'appliquer le médicament vétérinaire dans les yeux du mouton.Une application avant le début de la saison des mouches donne jusqu'à 4 semaines de protection.Retraiter l'animal selon les besoins. Ce médicament vétérinaire contient un colorant qui facilite l'identification des animaux traités. La couleur est temporaire et disparaît de la toison dans les 48 heures consécutives à l'application."},{"n":"ENERGIDEX SOLUTION POUR PERFUSION","l":0,"v":0,"p":"Voie intraveineuse lente. Equins, bovins adultes : 250 à 500 mL.Poulains, veaux : 50 à 100 mL.Ovins, porcins : 50 à 100 mL.Chiens, porcelets : 10 à 50 mL."},{"n":"ENGEMYCINE 10 % SOLUTION INJECTABLE POUR BOVINS, OVINS, CAPRINS ET PORCINS","l":7,"v":39,"p":"Voies intraveineuse ou intramusculaire. - Chez les bovins : 5 à 10 mg d’oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours, soit 0,5 à 1 mL de solution injectable pour 10 kg de poids vif.Le volume maximal par injection est de 28 mL. - Chez les porcins : 5 à 10 mg d’oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours, soit 0,5 à 1 mL de solution injectable pour 10 kg de poids vif.Le volume maximal par injection est de 6,5 mL. Chez les ovins et les caprins : 5 à 10 mg d’oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours, soit 0,5 à 1 mL de solution injectable pour 10 kg de poids vif."},{"n":"EPRECIS 20 MG/ML SOLUTION INJECTABLE POUR BOVINS, OVINS ET CAPRINS","l":0,"v":63,"p":"Voie sous-cutanée. Pour administration unique. Administration de 0,2 mg d’éprinomectine par kg de poids vif, soit 0,1 mL de la solution pour 10 kg de poids vif. Chez les caprins, le volume par site d’injection ne doit pas dépasser 0,6 mL. Flacons de 50 et 100 mL :Ne pas dépasser 30 ponctions par flacon. Si plus de 30 ponctions sont nécessaires, l’utilisation d’une aiguille de prélèvement est recommandée. Flacons de 250 et 500 mL :Ne pas dépasser 20 ponctions par flacon. Si plus de 20 ponctions sont nécessaires, l’utilisation d’une aiguille de prélèvement est recommandée. Un sous-dosage peut provoquer une inefficacité du traitement et favoriser le développement de résistances. Pour garantir une dose correcte, le poids de l’animal devra être déterminé aussi précisément que possible. Si les animaux doivent être traités collectivement, des groupes raisonnablement homogènes doivent être constitués, et tous les animaux d'un groupe doivent être traités au dosage correspondant à l’animal le plus lourd. La précision du matériel de dosage devra être minutieusement vérifiée."},{"n":"EPRECIS 5 MG/ML SOLUTION POUR POUR-ON POUR BOVINS, OVINS ET CAPRINS","l":0,"v":15,"p":"Pour-on. Pour une application unique. Afin de garantir une posologie appropriée, le poids corporel/vif doit être déterminé aussi précisément que possible. Lorsque les animaux doivent être traités collectivement plutôt qu'individuellement, ils doivent être regroupés en fonction de leur poids et recevoir une dose de traitement adaptée, afin d'éviter tout sur ou sous-dosage.Tous les animaux d'un même groupe doivent être traités en même temps. Bovins :Administrer uniquement en application topique à la dose de de 0,5 mg d'éprinomectine par kg de poids vif correspondant à la dose recommandée de 1 mL du produit pour 10 kg de poids vif. Le médicament vétérinaire doit être appliqué sur une bande étroite le long du dos de l'animal, du garrot jusqu'à la base de la queue. Ovins et caprins :Administrer uniquement en application topique à la dose de 1,0 mg d'éprinomectine par kg de poids vif, correspondant à la dose recommandée de 2 mL de médicament vétérinaire par 10 kg de poids vif. Lors de l'administration du médicament vétérinaire le long du dos, séparer la toison / le pelage et placer l'embout de l'applicateur ou le bec du flacon contre la peau. Méthode d’administration : Utiliser avec un système de dosage approprié tel qu’un pistolet doseur et son système d'alimentation.Remplacer le bouchon de transport par le bouchon d'alimentation.Connecter un côté du tuyau à ce bouchon d'alimentation et l'autre côté au pistolet doseur.Suivre les instructions du fabricant pour ajuster la dose, pour une utilisation et un entretien correct du pistolet doseur et du bouchon d'alimentation.Après utilisation, remplacer le système d’alimentation par le bouchon simple."},{"n":"EPRINEX MULTI 5 MG/ML SOLUTION POUR-ON POUR BOVINS OVINS ET CAPRINS","l":0,"v":15,"p":"Application pour-on.Administration en une seule application. Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible ; l'exactitude du système de dosage doit être vérifiée. Si les animaux sont traités collectivement plutôt qu’individuellement, il est recommandé de les regrouper en fonction de leur poids et d'ajuster la dose afin d'éviter un surdosage ou un sous-dosage. Un sous-dosage peut entraîner une inefficacité et favoriser le développement de résistances. Dosage : Bovins :Administrer par voie topique à la dose de 0,5 mg d’éprinomectine par kg de poids vif, correspondant à la dose recommandée de 1 mL pour 10 kg de poids vif. Ovins et Caprins :Administrer par voie topique à la dose de 1 mg d’éprinomectine par kg de poids vif, correspondant à la dose recommandée de 2 mL pour 10 kg de poids vif.Lors de l’administration du médicament vétérinaire le long de la ligne du dos, écarter la toison/pelage et placer l’embout de l’applicateur ou le goulot du flacon au contact de la peau. Mode d’administration :Le médicament vétérinaire doit être appliqué topiquement en le versant le long de la ligne du dos en bande étroite du garrot à la base de la queue. Pour les flacons de 250 mL et 1 litre avec système de dosage :- Fixer le système de dosage au flacon.- Sélectionner la dose en tournant la partie supérieure du système de dosage pour aligner le poids correct avec l’indicateur du système de dosage. Lorsque le poids est entre deux niveaux, sélectionner le niveau supérieur.- Maintenir le flacon vertical, bouchon vers le haut, et presser le flacon pour délivrer une dose légèrement supérieure à la dose requise comme indiquée par les lignes de calibration. En relâchant la pression, la dose s’ajuste automatiquement au bon niveau. Incliner le flacon pour administrer la dose. Pour les flacons de 1 litre : lorsqu’une dose de 10 mL ou 15 mL est nécessaire, aligner l’indicateur avec \"STOP\" avant d’administrer la dose. La position OFF (STOP) fermera le système entre les dosages.- Le système de dosage ne doit pas être stocké fixé au flacon lorsqu’il n’est pas utilisé. Retirer le système de dosage après chaque usage et remettre le bouchon du flacon. Pour les bidons de 2,5 et 5 litres (sac à dos) destinés à être utilisé avec un pistolet de dosage automatique approprié :Connecter le pistolet doseur et le tuyau souple au sac à dos comme suit :- Fixer une extrémité du tuyau souple à un pistolet doseur adapté.- Fixer l’autre extrémité du tuyau souple au bouchon avec l’embout adapté inclus dans l’emballage.- Remplacer le bouchon d’origine par le bouchon relié au tuyau souple. Serrer le bouchon de prélèvement.- Amorcer doucement le pistolet de dosage, en vérifiant qu’il n’y a pas de fuite.- Suivre les instructions du fabricant du pistolet de dosage pour l’ajustement de la dose, un usage et un entretien appropriés du pistolet doseur et du tuyau souple."},{"n":"FERCOBSANG SOLUTION INJECTABLE ET BUVABLE","l":0,"v":0,"p":"Voie intramusculaire (i.m), sous-cutanée (s.c) et orale. Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible. 0,08 à 0,4 mg de fer, 1 à 5 µg de vitamine B12, 0,8 à 4 mg de vitamine PP et 0,27 à 1,4 µg de cobalt par kg de poids vif par jour en fonction des espèces, selon les recommandations suivantes : Equins et bovins : voies i.m., s.c. et orale :Adultes : 20 mLJeunes : 10 mL Ovins et caprins : voies i.m., s.c. et orale :Adultes : 5 mLJeunes : 1 à 2 mL Porcins : voies i.m., s.c. et orale :Adultes : 10 mLà l'engraissement : 5 mL Chiens et chats : voie orale seulement :1 à 2 gouttes par kg de poids corporel. L'administration du médicament vétérinaire se fera pendant 3 à 5 jours de suite."},{"n":"FIXPLAN 200 UI/ML LYOPHILISAT ET SOLVANT POUR SOLUTION INJECTABLE","l":0,"v":0,"p":"Voies d’administration :- Bovins et ovins : intramusculaire- Porcins : intramusculaire ou sous-cutanée. Reconstitution :Reconstituer le lyophilisat avec le solvant fourni. Dissoudre le lyophilisat avec une petite quantité de solvant. Mélanger pour obtenir une solution homogène. Transférer cette solution dans le flacon qui contient le reste de solvant et mélanger jusqu’à dissolution complète.Bien vérifier que le lyophilisat est complètement dissous avant d’utiliser.Respecter les précautions aseptiques normales. Éviter l’introduction d’une contamination. \\nAnimaux femellesIndicationPosologie et administration\\nBovinsAnoestrus, induction de l’oestrus500 - 1000 UI (soit 2,5 à 5 mL de produit), par voie intramusculaire\\nSuperovulation1500 - 3000 UI (soit 7,5 à 15 mL de produit), par voie intramusculaire, entre le jour 8 et le jour 13 du cycle, suivies d’administration d’une prostaglandine, par voie intramusculaire, 48 heures plus tard\\nAugmentation du taux de fertilité après un pré-traitement par progestatif300 - 750 UI (soit 1,5 à 3,75 mL de produit), par voie intramusculaire, à la fin d’un traitement par progestatif\\nOvinsAugmentation du taux de fertilité après un pré-traitement par progestatif (pendant et hors de la saison de reproduction)400 - 750 UI (soit 2,0 à 3,75 mL de produit), par voie intramusculaire, au moment du retrait du progestatif\\nPorcinsAnoestrus après le sevrage (l’induction de l’oestrus est difficile jusqu’à 40 jours post-partum)1000 UI (soit 5 mL de produit), par voie sous-cutanée ou intramusculaire, un oestrus fertile s’ensuit habituellement entre 3 à 7 jours L’anoestrus découle souvent d’une gestion inadéquate (alimentation et hébergement). L’amélioration de la gestion est donc une condition requise pour un traitement réussi. La gonadotropine sérique est une hormone protéique qui agit sur l’ovaire en vue de stimuler la production de follicules. Le nombre de follicules produits peut être influencé par la dose de gonadotropine sérique administrée ; cela doit être pris en compte au moment, par exemple, de calculer la dose pour un troupeau particulier de brebis chez lesquelles on souhaite synchroniser l’oestrus. En général, plus on tente de s’éloigner de la saison de reproduction et plus la prolificité normale du troupeau est faible, plus la dose de gonadotropine sérique requise est élevée. Une dose moyenne de 500 UI par brebis est recommandée mais, de temps à autre, des doses comprises entre 400 et 750 UI ont été utilisées. Il est, par conséquent, recommandé de tenir des registres précis des troupeaux, dans lesquels on notera la race, la dose administrée, le moment de l’injection et les nombre d’agneaux produits afin, lors des saisons d’après, d’ajuster la dose de manière à obtenir des résultats optimaux. Superovulation chez les bovins : Le médicament vétérinaire peut être utilisé pour la superovulation de vaches donneuses avant le transfert d’embryons. Voici un exemple de schéma qui a été appliqué sur le terrain avec succès :Une dose unique du médicament vétérinaire (1500 - 3000 UI) est injectée entre le jour 8 et le jour 13 d’un cycle oestral normal. NB : la dose exacte de médicament requise pour obtenir une superovulation efficace dépendra d’un certain nombre de facteurs tels que la race, l’âge, l’historique de la reproduction, l’état de santé général et le statut nutritionnel de la femelle donneuse, et est sujette à des variations individuelles. 48 heures après l’injection du médicament vétérinaire, la lutéolyse est induite en injectant un analogue de la prostaglandine. Habituellement, une dose équivalant à 1,5 fois la dose lutéolytique normale est administrée. L’oestrus survient normalement environ dans les 48 heures suivant l’injection de prostaglandine. L’insémination a lieu 60 et 72 heures après l’injection de prostaglandine. Le prélèvement des embryons fécondés (« flushing ») a lieu 6 à 8 jours après l’insémination. Les embryons de bonne qualité sont transférés sur les vaches receveuses dont les…"},{"n":"FLORFENIS 300 MG/ML SOLUTION INJECTABLE POUR BOVINS OVINS ET PORCINS","l":null,"v":44,"p":"Voie d’administration :Bovins : voie intramusculaire et sous-cutanée.Ovins et porcins : voie intramusculaire Traitement :Bovins :Voie intramusculaire : 20 mg de florfénicol par kg de poids vif (soit 1 mL de médicament vétérinaire/15 kg de poids vif), 2 fois à 48 heures d’intervalle.Voie sous-cutanée : 40 mg de florfénicol par kg de poids vif (soit 2 mL de médicament vétérinaire/15 kg de poids vif), une injection unique.Pour les deux voies : utiliser une aiguille de 16 gauges. Le volume administré ne doit pas excéder 10 mL par site d’injection. L’injection doit être réalisée uniquement au niveau du cou de l’animal. Ovins :Voie intramusculaire : 20 mg de florfénicol par kg de poids vif (soit 1 mL de médicament vétérinaire/15 kg de poids vif), une fois par jour pendant 3 jours consécutifs.Le volume administré par site d’injection ne doit pas excéder 4 mL. Porcins :Voie intramusculaire : 15 mg de florfénicol/kg de poids vif (soit 1 mL de médicament vétérinaire/20 kg de poids vif) par injection intramusculaire dans le muscle du cou, 2 fois à 48 heures d’intervalle en utilisant une aiguille de 16 gauges.Le volume administré par site d’injection ne doit pas excéder 3 mL. Il est recommandé de traiter les animaux aux premiers stades de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant la dernière injection. Si les signes cliniques de la maladie respiratoire persistent ou augmentent, ou en cas de rechute, le traitement doit être modifié, en utilisant un autre antibiotique, et poursuivi jusqu’à résolution des signes cliniques. Métaphylaxie Bovins :Voie sous-cutanée : 40 mg de florfénicol par kg de poids vif (soit 2 mL de médicament vétérinaire/15 kg de poids vif), une injection unique à l’aide d’une aiguille de 16 gauges. Le volume administré ne doit pas excéder 10 mL par site d’injection.L’injection doit être réalisée uniquement au niveau du cou de l’animal. Pour toutes les espèces cibles : pour garantir un dosage correct, il convient de déterminer le poids vif de l’animal aussi précisément q
