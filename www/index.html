            ${aEuSelepherol ? '<div style="font-size:11px;color:var(--text-muted);">Sélépérol 2cc administré</div>' : ''}
          </div>
        </div>
        ${sortieDecidee
          ? `<div style="display:flex;align-items:center;gap:8px;">
               <span class="badge badge-muted">${badge}</span>
               <button type="button" class="btn btn-secondary btn-lamb-annuler-sortie" data-i="${i}" style="width:auto;padding:4px 10px;font-size:12px;">Annuler</button>
             </div>`
          : resolved
          ? `<span class="badge badge-muted">${badge}</span>`
          : `<div style="display:flex;gap:6px;">
               <button type="button" class="btn btn-secondary btn-lamb-vendu" data-i="${i}" style="width:auto;padding:4px 10px;font-size:12px;color:var(--coral-fg);border-color:var(--danger);">Vendu</button>
               <button type="button" class="btn btn-secondary btn-lamb-mort" data-i="${i}" style="width:auto;padding:4px 10px;font-size:12px;color:var(--coral-fg);border-color:var(--danger);">Mort</button>
             </div>`}
      </div>
    `;
  }).join('');

  const mereBlock = sheep.mereEid
    ? `<button type="button" class="btn btn-secondary" id="btn-voir-mere-sheep" style="margin-bottom:16px;">Voir la fiche de la mère (n°${numeroVisuel(sheep.mereEid)})</button>`
    : '';

  // Statut reproduction de la campagne + action "vide définitive" — secours
  // manuel en dehors du flux "dernière écho de la campagne" (voir Écho
  // rapide). Le bouton "Annuler" reste visible même si un agnelage existe
  // déjà cette campagne (incohérence à corriger à la main, voir l'alerte du
  // Bilan de campagne) : mieux vaut la montrer que la masquer.
  const campagneAffichage = DB.campagneDebut ? (DB.campagneDebut + 1) : null;
  const videDefCampagne = estVideDefinitiveCampagne(sheep);
  const dejaMiseBasCampagne = sheep.agnelages && sheep.agnelages.length > 0;
  const reproStatutHtml = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
        <div>
          <div style="font-size:12px;color:var(--text-muted);">Statut reproduction${campagneAffichage ? ' — campagne ' + campagneAffichage : ''}</div>
          <div style="font-weight:600;">${statutReproductionCampagne(sheep)}</div>
        </div>
        ${videDefCampagne
          ? `<button type="button" class="btn btn-secondary" id="btn-annuler-vide-def" style="width:auto;padding:6px 14px;font-size:13px;flex-shrink:0;">Annuler</button>`
          : dejaMiseBasCampagne
          ? ''
          : `<button type="button" class="btn btn-secondary" id="btn-marquer-vide-def" style="width:auto;padding:6px 14px;font-size:13px;flex-shrink:0;color:var(--coral-fg);border-color:var(--danger);">Marquer vide définitive</button>`}
      </div>
    </div>
  `;

  app.innerHTML = `
    <div class="card">
      <div style="font-size:12px;color:var(--text-muted);">EID complet</div>
      <div style="font-size:14px;margin-bottom:10px;">${sheep.eid}</div>
      <div class="grid2">
        <div><div style="font-size:12px;color:var(--text-muted);">Âge</div><div style="font-weight:600;">${age(sheep.eid)} an(s) (${anneeNaissance(sheep.eid)})</div></div>
        <div><div style="font-size:12px;color:var(--text-muted);">Numéro officiel</div><div style="font-weight:600;">n°${numeroVisuel(sheep.eid)}</div></div>
      </div>
      ${sheep.dateEntree ? `<div style="margin-top:10px;font-size:12px;color:var(--text-muted);">Date d'entrée : <strong style="color:var(--text);">${sheep.dateEntree}</strong></div>` : ''}
    </div>
    ${statutBadge}
    ${reproStatutHtml}
    ${attendueTraiteBadge}
    ${withdrawalBadge}
    ${mereBlock}
    <div class="row" style="margin-bottom:10px;">
      <button class="btn btn-primary" id="btn-add-echo" style="flex:1;">+ Échographie</button>
      ${(sheep.agnelages && sheep.agnelages.length > 0)
        ? '<div class="badge badge-muted" style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;">Mise bas déjà saisie — modifie-la ci-dessous</div>'
        : '<button class="btn btn-primary" id="btn-add-agnelage" style="flex:1;background:var(--accent);">+ Agnelage</button>'}
    </div>
    <div class="row" style="margin-bottom:16px;">
      <button class="btn btn-primary" id="btn-add-sanitaire" style="flex:1;background:var(--danger);">+ Carnet sanitaire</button>
      ${(sheep.mouvements && sheep.mouvements.length > 0)
        ? '<div class="badge badge-muted" style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;">Mouvement déjà saisi — modifie-le ci-dessous</div>'
        : '<button class="btn btn-primary" id="btn-add-mouvement" style="flex:1;background:var(--danger);">+ Mouvement</button>'}
    </div>
    <button class="btn btn-primary" id="btn-add-controle" style="background:var(--blue-solid);margin-bottom:16px;">+ Contrôle laitier</button>
    ${allLiveLambs.length > 0 ? `
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Devenir des agneaux</div>
      ${devenirHtml}
    </div>
    ` : ''}
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Historique échographies</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${historyHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Historique agnelages</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${agnelageHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Carnet sanitaire</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${sanitaireHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Contrôle laitier</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${controleHtml}
    </div>
    <div class="card">
      <div style="font-size:14px;font-weight:600;margin-bottom:2px;">Mouvements</div>
      <div class="swipe-hint">Glisser à droite pour supprimer, à gauche pour modifier</div>
      ${mouvementHtml}
    </div>
    <button class="btn btn-secondary" id="btn-delete-sheep" style="color:var(--danger);border-color:var(--danger);">Supprimer cette brebis</button>
  `;
  document.getElementById('btn-add-echo').onclick = () => { editContext = null; render('add-echo', sheep.id); };
  if (document.getElementById('btn-add-agnelage')) document.getElementById('btn-add-agnelage').onclick = () => { editContext = null; render('add-agnelage', sheep.id); };
  const btnMarquerVideDef = document.getElementById('btn-marquer-vide-def');
  if (btnMarquerVideDef) btnMarquerVideDef.onclick = () => {
    if (!confirm('Marquer la brebis n°' + numeroVisuel(sheep.eid) + ' comme vide définitive pour cette campagne ? Elle ne sera plus comptée dans "mises bas restantes attendues".')) return;
    marquerVideDefinitive(sheep);
    saveData(DB);
    render('detail', sheep.id);
  };
  const btnAnnulerVideDef = document.getElementById('btn-annuler-vide-def');
  if (btnAnnulerVideDef) btnAnnulerVideDef.onclick = () => {
    if (!confirm('Annuler le statut "vide définitive" de la n°' + numeroVisuel(sheep.eid) + ' pour cette campagne ?')) return;
    annulerVideDefinitive(sheep);
    saveData(DB);
    render('detail', sheep.id);
  };
  document.getElementById('btn-add-sanitaire').onclick = () => { editContext = null; render('add-sanitaire', sheep.id); };
  if (document.getElementById('btn-add-mouvement')) document.getElementById('btn-add-mouvement').onclick = () => { editContext = null; render('add-mouvement', sheep.id); };
  document.getElementById('btn-add-controle').onclick = () => { editContext = null; render('add-controle', sheep.id); };
  document.querySelectorAll('.btn-lamb-vendu').forEach(btn => {
    btn.onclick = () => {
      const lamb = allLiveLambs[parseInt(btn.dataset.i, 10)];
      showLambSortieModal(lamb, 'vendu', () => render('detail', sheep.id));
    };
  });
  document.querySelectorAll('.btn-lamb-mort').forEach(btn => {
    btn.onclick = () => {
      const lamb = allLiveLambs[parseInt(btn.dataset.i, 10)];
      showLambSortieModal(lamb, 'mort', () => render('detail', sheep.id));
    };
  });
  document.querySelectorAll('.btn-lamb-annuler-sortie').forEach(btn => {
    btn.onclick = () => {
      const lamb = allLiveLambs[parseInt(btn.dataset.i, 10)];
      annulerSortieLamb(lamb, () => render('detail', sheep.id));
    };
  });
  if (document.getElementById('btn-voir-mere-sheep')) {
    document.getElementById('btn-voir-mere-sheep').onclick = () => {
      const mother = DB.brebis.find(s => cleanEid(s.eid) === cleanEid(sheep.mereEid));
      if (!mother) { alert('Fiche de la mère introuvable (peut-être supprimée).'); return; }
      previousDetailId = sheep.id;
      detailOrigin = 'detail-back';
      render('detail', mother.id);
    };
  }
  document.getElementById('btn-delete-sheep').onclick = () => {
    if (!confirm('Supprimer la brebis n°' + numeroVisuel(sheep.eid) + ' de la liste active ? Son carnet sanitaire, ses mises bas et ses mouvements resteront conservés dans le registre d\'élevage réglementaire.')) return;
    archiverDansRegistre('brebis', sheep.eid, { sanitaire: sheep.sanitaire, agnelages: sheep.agnelages, mouvements: sheep.mouvements });
    DB.brebis = DB.brebis.filter(s => s.id !== sheep.id);
    saveData(DB);
    render('list');
  };
  activateSwipes(app);
}

/* ---------- Ajout échographie ---------- */
function renderAddEcho(sheepId) {
  const sheep = findSheep(sheepId);
  const editing = editContext && editContext.kind === 'echographies';
  const existing = editing ? sheep.echographies[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier l\'échographie' : 'Nouvelle échographie';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Brebis n°${numeroVisuel(sheep.eid)}</div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <label>Type d'échographie</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
        <button type="button" class="opt-btn type-echo-opt" data-val="constat">Constat</button>
        <button type="button" class="opt-btn type-echo-opt" data-val="stade">Stades</button>
        <button type="button" class="opt-btn type-echo-opt" data-val="stade_comptage">Stades + comptage</button>
      </div>

      <div id="stade-block" class="hidden">
        <label id="stade-label">Résultat</label>
        <div class="grid4" id="stade-group"></div>
      </div>

      <div id="agneaux-block" class="hidden">
        <label>Nombre d'agneaux</label>
        <div class="grid2" id="agneaux-group">
          <button type="button" class="opt-btn" data-val="Simple">1 agneau</button>
          <button type="button" class="opt-btn" data-val="Double">2 et plus</button>
        </div>
      </div>

      <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
        <input type="checkbox" id="f-parasit" style="width:18px;height:18px;margin:0;">
        <span style="font-size:14px;color:var(--text);">Parasitisme observé</span>
      </label>

      <label>Cas particulier (facultatif)</label>
      <div class="chip-list" id="special-list"></div>
      <div class="row" style="margin-bottom:14px;">
        <input type="text" id="new-special" placeholder="Ajouter un nouveau cas...">
        <button type="button" class="btn btn-secondary" id="add-special" style="width:auto;padding:0 16px;">+</button>
      </div>

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-echo">${editing ? 'Enregistrer les modifications' : "Enregistrer l'échographie"}</button>
    </div>
  `;

  let typeEcho = existing ? (existing.type || 'stade_comptage') : null;
  let stade = existing ? existing.stade : null;
  let agneaux = existing ? existing.agneaux : null;
  let special = existing ? existing.special : null;

  function clearGroup(sel) {
    document.querySelectorAll(sel).forEach(b => b.classList.remove('selected'));
  }

  function renderStadeButtons() {
    const group = document.getElementById('stade-group');
    const label = document.getElementById('stade-label');
    if (typeEcho === 'constat') {
      label.textContent = 'Résultat';
      group.style.gridTemplateColumns = 'repeat(2,1fr)';
      group.innerHTML = `
        <button type="button" class="opt-btn stade-opt" data-val="Pleine">Pleine</button>
        <button type="button" class="opt-btn stade-opt" data-val="Vide">Vide</button>
      `;
    } else {
      label.textContent = 'Stade';
      group.style.gridTemplateColumns = 'repeat(2,1fr)';
      group.innerHTML = `
        <button type="button" class="opt-btn stade-opt" data-val="Début">Début</button>
        <button type="button" class="opt-btn stade-opt" data-val="Milieu">Milieu</button>
        <button type="button" class="opt-btn stade-opt" data-val="Fin">Fin</button>
        <button type="button" class="opt-btn stade-opt" data-val="Vide">Vide</button>
      `;
    }
    document.querySelectorAll('.stade-opt').forEach(btn => {
      if (btn.dataset.val === stade) btn.classList.add('selected');
      btn.onclick = () => {
        stade = btn.dataset.val;
        special = null;
        renderSpecialChips();
        clearGroup('.stade-opt');
        btn.classList.add('selected');
        const showAgneaux = (typeEcho === 'stade_comptage') && stade !== 'Vide';
        document.getElementById('agneaux-block').classList.toggle('hidden', !showAgneaux);
        if (!showAgneaux) { agneaux = null; clearGroup('#agneaux-group .opt-btn'); }
        document.getElementById('err').classList.add('hidden');
      };
    });
  }

  function renderSpecialChips() {
    const list = document.getElementById('special-list');
    list.innerHTML = '';
    DB.casParticuliers.forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (special === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => {
        if (special === val) { special = null; }
        else {
          special = val; stade = null; agneaux = null;
          clearGroup('.stade-opt');
          clearGroup('#agneaux-group .opt-btn');
          document.getElementById('agneaux-block').classList.add('hidden');
        }
        renderSpecialChips();
        document.getElementById('err').classList.add('hidden');
      };
      list.appendChild(chip);
    });
  }
  renderSpecialChips();

  document.querySelectorAll('.type-echo-opt').forEach(btn => {
    if (btn.dataset.val === typeEcho) btn.classList.add('selected');
    btn.onclick = () => {
      typeEcho = btn.dataset.val;
      stade = null; agneaux = null; special = null;
      document.querySelectorAll('.type-echo-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('stade-block').classList.remove('hidden');
      document.getElementById('agneaux-block').classList.add('hidden');
      renderStadeButtons();
      renderSpecialChips();
      document.getElementById('err').classList.add('hidden');
    };
  });

  if (typeEcho) {
    document.getElementById('stade-block').classList.remove('hidden');
    renderStadeButtons();
    if (typeEcho === 'stade_comptage' && stade && stade !== 'Vide') {
      document.getElementById('agneaux-block').classList.remove('hidden');
    }
  }

  document.querySelectorAll('#agneaux-group .opt-btn').forEach(btn => {
    if (btn.dataset.val === agneaux) btn.classList.add('selected');
    btn.onclick = () => {
      agneaux = btn.dataset.val;
      clearGroup('#agneaux-group .opt-btn');
      btn.classList.add('selected');
      document.getElementById('err').classList.add('hidden');
    };
  });
  if (existing && existing.parasitisme) document.getElementById('f-parasit').checked = true;

  document.getElementById('add-special').onclick = () => {
    const input = document.getElementById('new-special');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.casParticuliers.includes(val)) DB.casParticuliers.push(val);
    saveData(DB);
    input.value = '';
    renderSpecialChips();
    document.querySelectorAll('#special-list .chip').forEach(c => {
      if (c.textContent === val) c.click();
    });
  };

  document.getElementById('btn-save-echo').onclick = () => {
    const err = document.getElementById('err');
    if (!typeEcho) {
      err.textContent = "Choisis un type d'échographie.";
      err.classList.remove('hidden');
      return;
    }
    if (!stade && !special) {
      err.textContent = "Choisis un résultat (ou un cas particulier).";
      err.classList.remove('hidden');
      return;
    }
    const needAgneaux = typeEcho === 'stade_comptage' && (stade === 'Début' || stade === 'Milieu' || stade === 'Fin');
    if (needAgneaux && !agneaux) {
      err.textContent = "Précise si c'est 1 agneau ou 2 et plus.";
      err.classList.remove('hidden');
      return;
    }
    const dateEcho = document.getElementById('f-date').value;
    sheep.echographies = sheep.echographies || [];
    const doublon = sheep.echographies.some((e, i) => e.date === dateEcho && (!editing || i !== editContext.idx));
    if (doublon) {
      err.textContent = "Une échographie est déjà enregistrée pour cette brebis à cette date — modifie l'existante plutôt que d'en ajouter une seconde.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const echo = {
      type: typeEcho,
      date: dateEcho,
      stade: stade,
      agneaux: agneaux,
      special: special,
      parasitisme: document.getElementById('f-parasit').checked,
      // Sur une modification, on garde le tag de campagne d'origine (même
      // absent, pour une saisie antérieure à cette fonctionnalité) plutôt
      // que de la rattacher silencieusement à la campagne actuelle.
      campagne: editing ? existing.campagne : DB.campagneDebut
    };
    if (editing) sheep.echographies[editContext.idx] = echo;
    else sheep.echographies.push(echo);
    editContext = null;
    saveData(DB);
    render('detail', sheep.id);
  };
}

/* ---------- Ajout agnelage ---------- */
function renderAddAgnelage(sheepId) {
  const sheep = findSheep(sheepId);
  const editing = editContext && editContext.kind === 'agnelages';
  const existing = editing ? sheep.agnelages[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier l\'agnelage' : 'Nouvel agnelage';

  // Une brebis ne peut avoir qu'un seul agnelage par campagne (sheep.agnelages
  // est remis à zéro — et archivé dans le registre — à chaque nouvelle
  // campagne, voir "Nouvelle campagne" dans Paramètres). Si un agnelage
  // existe déjà et qu'on n'est pas en train de le modifier, on bloque l'ajout
  // d'un second plutôt que de laisser la fiche en avoir deux.
  if (!editing && sheep.agnelages.length > 0) {
    app.innerHTML = `
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
          ${iconCircle(ICON_WARNING, 'coral', 'md')}
          <div style="font-weight:700;">Agnelage déjà enregistré cette campagne</div>
        </div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Cette brebis a déjà un agnelage enregistré le ${sheep.agnelages[0].date}. Modifie-le plutôt que d'en ajouter un second — une brebis ne peut avoir qu'un agnelage par campagne.</div>
        <button type="button" class="btn btn-primary" id="btn-edit-existing-agnelage">Modifier l'agnelage existant</button>
      </div>
    `;
    document.getElementById('btn-edit-existing-agnelage').onclick = () => editItem('agnelages', 0);
    return;
  }

  const today = existing ? existing.date : new Date().toISOString().slice(0,10);
  let lambCount = 0;
  const lambs = {};

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Mère — Brebis n°${numeroVisuel(sheep.eid)}</div>
      <label>Date de naissance</label>
      <input type="date" id="f-date" value="${today}" style="margin-bottom:16px;">
      <div id="lamb-list"></div>
      <button type="button" class="btn btn-secondary" id="add-lamb" style="margin-bottom:14px;">+ Ajouter un agneau</button>
      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-agnelage">${editing ? 'Enregistrer les modifications' : "Enregistrer l'agnelage"}</button>
    </div>
  `;

  function lambCard(id) {
    const div = document.createElement('div');
    div.className = 'card';
    div.style.marginBottom = '10px';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:14px;font-weight:600;">Agneau ${id}</span>
        <button type="button" class="btn btn-secondary remove-lamb" data-id="${id}" style="width:auto;padding:4px 10px;font-size:13px;">Retirer</button>
      </div>
      <label>Sexe</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);">
        <button type="button" class="opt-btn sexe-opt warn" data-id="${id}" data-val="Mâle">Mâle</button>
        <button type="button" class="opt-btn sexe-opt warn" data-id="${id}" data-val="Femelle">Femelle</button>
        <button type="button" class="opt-btn sexe-opt warn" data-id="${id}" data-val="Mort-né">Mort-né</button>
      </div>
      <div class="eid-block" data-id="${id}">
        <label>EID (bip agneau)</label>
        <input type="text" class="eid-input" data-id="${id}" placeholder="Scanner ou saisir l'EID">
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <input type="checkbox" class="adopt-check" data-id="${id}" style="width:16px;height:16px;margin:0;">
          <span style="font-size:14px;color:var(--text);">Adopté par une autre mère</span>
        </label>
        <div class="adopt-field hidden" data-id="${id}">
          <label>EID mère adoptive</label>
          <input type="text" class="adopt-eid" data-id="${id}" placeholder="Scanner ou saisir l'EID">
        </div>
      </div>
      <div class="mortne-note hidden" data-id="${id}" style="font-size:12px;color:var(--text-muted);">Pas de boucle sur un mort-né — aucun EID à saisir.</div>
    `;
    return div;
  }

  function bindLamb(id) {
    document.querySelectorAll(`.sexe-opt[data-id="${id}"]`).forEach(btn => {
      btn.onclick = () => {
        lambs[id].sexe = btn.dataset.val;
        document.querySelectorAll(`.sexe-opt[data-id="${id}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const isMortNe = btn.dataset.val === 'Mort-né';
        document.querySelector(`.eid-block[data-id="${id}"]`).classList.toggle('hidden', isMortNe);
        document.querySelector(`.mortne-note[data-id="${id}"]`).classList.toggle('hidden', !isMortNe);
        document.getElementById('err').classList.add('hidden');
      };
    });
    const check = document.querySelector(`.adopt-check[data-id="${id}"]`);
    check.onchange = () => {
      document.querySelector(`.adopt-field[data-id="${id}"]`).classList.toggle('hidden', !check.checked);
      lambs[id].adopte = check.checked;
    };
    document.querySelector(`.remove-lamb[data-id="${id}"]`).onclick = () => {
      delete lambs[id];
      document.querySelector(`.remove-lamb[data-id="${id}"]`).closest('.card').remove();
    };
    const eidInput = document.querySelector(`.eid-input[data-id="${id}"]`);
    if (eidInput) attachEidBeep(eidInput);
    const adoptEidInput = document.querySelector(`.adopt-eid[data-id="${id}"]`);
    if (adoptEidInput) attachEidBeep(adoptEidInput);
  }

  function addLamb() {
    lambCount++;
    const id = lambCount;
    lambs[id] = { sexe: null, adopte: false };
    document.getElementById('lamb-list').appendChild(lambCard(id));
    bindLamb(id);
  }
  document.getElementById('add-lamb').onclick = addLamb;

  if (existing) {
    existing.lambs.forEach(l => {
      addLamb();
      const id = lambCount;
      const sexeBtn = document.querySelector(`.sexe-opt[data-id="${id}"][data-val="${l.sexe}"]`);
      if (sexeBtn) sexeBtn.click();
      if (l.sexe !== 'Mort-né') {
        const eidInput = document.querySelector(`.eid-input[data-id="${id}"]`);
        if (eidInput) eidInput.value = l.eid || '';
        if (l.adopte) {
          const check = document.querySelector(`.adopt-check[data-id="${id}"]`);
          check.checked = true;
          check.dispatchEvent(new Event('change'));
          const adoptEidInput = document.querySelector(`.adopt-eid[data-id="${id}"]`);
          if (adoptEidInput) adoptEidInput.value = l.adoptiveEid || '';
        }
      }
    });
  } else {
    addLamb();
  }

  document.getElementById('btn-save-agnelage').onclick = () => {
    const err = document.getElementById('err');
    const ids = Object.keys(lambs);
    if (ids.length === 0) {
      err.textContent = "Ajoute au moins un agneau.";
      err.classList.remove('hidden');
      return;
    }
    for (const id of ids) {
      if (!lambs[id].sexe) {
        err.textContent = "Sélectionne le sexe de chaque agneau.";
        err.classList.remove('hidden');
        return;
      }
      if (lambs[id].sexe !== 'Mort-né') {
        const eidInput = document.querySelector(`.eid-input[data-id="${id}"]`);
        lambs[id].eid = eidInput.value.trim();
        if (lambs[id].adopte) {
          const adoptEidInput = document.querySelector(`.adopt-eid[data-id="${id}"]`);
          lambs[id].adoptiveEid = adoptEidInput.value.trim();
        }
        lambs[id].sanitaire = lambs[id].sanitaire || [];
        const dejaSelepherol = lambs[id].sanitaire.some(s => s.produit === 'Selepherol');
        if (!dejaSelepherol) {
          lambs[id].sanitaire.push({
            type: 'Traitement', sousType: null, produit: 'Selepherol', dose: '2 cc',
            date: document.getElementById('f-date').value,
            commentaire: 'Injection systématique à la naissance'
          });
        }
      }
    }
    err.classList.add('hidden');
    const agnelage = {
      date: document.getElementById('f-date').value,
      lambs: ids.map(id => lambs[id])
    };
    agnelage.lambs.forEach(l => ensureLambEntreeMouvement(l, agnelage.date));
    sheep.agnelages = sheep.agnelages || [];
    if (editing) sheep.agnelages[editContext.idx] = agnelage;
    else sheep.agnelages.push(agnelage);
    editContext = null;
    saveData(DB);
    render('detail', sheep.id);
  };
}

/* ---------- Saisie rapide d'échographies (boucle scan → résultat) ----------
   1) On choisit le type d'échographie une seule fois pour toute la session.
   2) Boucle : scan → résumé de la brebis + champs de résultat pour ce type
      → Valider → tout se vide, prêt pour le scan suivant. Un compteur de
      session s'incrémente à chaque validation.
   3) EID inconnu → propose de créer la brebis à la volée puis continue dans
      la même boucle sans interrompre la saisie.
   Les champs de résultat reproduisent exactement ceux de renderAddEcho
   (stade/constat, comptage d'agneaux, parasitisme, cas particulier) — seul
   le sélecteur de type et la date disparaissent, fixés pour la session
   (date = aujourd'hui pour chaque échographie saisie). */
/* État de session persisté au niveau module (pas dans renderEchoRapide) :
   si l'utilisateur quitte et revient sur cet écran (ex: ouverture accidentelle
   du menu hamburger pendant une série de scans, puis retape sur "Écho
   rapide"), la session reprend là où elle en était au lieu de repartir sur
   l'écran de choix du type — c'est précisément le bug rapporté ("revient à
   la page de sélection du type"). Réinitialisée uniquement quand l'écran
   d'accueil (ou tout autre écran) est explicitement quitté vers autre chose
   ET qu'on revient plus tard : voir resetEchoRapideSession(). */
let echoRapideSession = { typeEcho: null, count: 0, dernierEcho: false };
function resetEchoRapideSession() { echoRapideSession = { typeEcho: null, count: 0, dernierEcho: false }; }

function renderEchoRapide() {
  function typeLabel() {
    return echoRapideSession.typeEcho === 'constat' ? 'Constat' : echoRapideSession.typeEcho === 'stade' ? 'Stades' : 'Stades + comptage';
  }

  function screenChooseType() {
    pageTitle.textContent = 'Nouvelle session — Échographies';
    app.innerHTML = `
      <div class="card">
        <div style="font-size:14px;font-weight:600;margin-bottom:4px;">Type d'échographie pour cette session</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:14px;">Ce choix reste fixé pour toute la session — inutile de le ressélectionner à chaque brebis.</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <button type="button" class="opt-btn type-echo-session-opt" data-val="constat">Constat (Pleine / Vide)</button>
          <button type="button" class="opt-btn type-echo-session-opt" data-val="stade">Stades (Début / Milieu / Fin / Vide)</button>
          <button type="button" class="opt-btn type-echo-session-opt" data-val="stade_comptage">Stades + comptage (+ 1 ou 2 agneaux)</button>
        </div>
      </div>
      <div class="card">
        <label style="display:flex;align-items:center;gap:10px;margin-bottom:0;">
          <input type="checkbox" id="f-dernier-echo" style="width:18px;height:18px;margin:0;flex-shrink:0;">
          <span style="font-size:14px;color:var(--text);">Ceci est la dernière échographie de la campagne</span>
        </label>
        <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">Coché, chaque brebis marquée "Vide" pendant cette session sera aussi enregistrée comme <strong>vide définitive</strong> pour la campagne — pas de double saisie à faire.</div>
      </div>
      <button class="btn btn-primary" id="btn-start-echo-session" style="margin-top:14px;" disabled>Commencer la saisie</button>
      <button type="button" class="btn btn-secondary" id="btn-historique-echo" style="margin-top:10px;">Voir l'historique des échographies</button>
    `;
    document.querySelectorAll('.type-echo-session-opt').forEach(btn => {
      btn.onclick = () => {
        echoRapideSession.typeEcho = btn.dataset.val;
        document.querySelectorAll('.type-echo-session-opt').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('btn-start-echo-session').disabled = false;
      };
    });
    document.getElementById('f-dernier-echo').checked = echoRapideSession.dernierEcho;
    document.getElementById('f-dernier-echo').onchange = (e) => { echoRapideSession.dernierEcho = e.target.checked; };
    document.getElementById('btn-start-echo-session').onclick = () => {
      if (!echoRapideSession.typeEcho) return;
      screenLoop();
    };
    document.getElementById('btn-historique-echo').onclick = () => render('historique-echo');
  }

  function screenLoop() {
    let currentSheep = null;
    let unknownEid = null;
    let stade = null, agneaux = null, parasit = false, special = null;

    function resetResult() {
      currentSheep = null; unknownEid = null; stade = null; agneaux = null; parasit = false; special = null;
    }

    function clearGroup(sel) {
      document.querySelectorAll(sel).forEach(b => b.classList.remove('selected'));
    }

    function renderStadeButtons() {
      const group = document.getElementById('stade-group');
      if (!group) return;
      if (echoRapideSession.typeEcho === 'constat') {
        group.style.gridTemplateColumns = 'repeat(2,1fr)';
        group.innerHTML = `
          <button type="button" class="opt-btn stade-opt" data-val="Pleine">Pleine</button>
          <button type="button" class="opt-btn stade-opt" data-val="Vide">Vide</button>
        `;
      } else {
        group.style.gridTemplateColumns = 'repeat(2,1fr)';
        group.innerHTML = `
          <button type="button" class="opt-btn stade-opt" data-val="Début">Début</button>
          <button type="button" class="opt-btn stade-opt" data-val="Milieu">Milieu</button>
          <button type="button" class="opt-btn stade-opt" data-val="Fin">Fin</button>
          <button type="button" class="opt-btn stade-opt" data-val="Vide">Vide</button>
        `;
      }
      document.querySelectorAll('.stade-opt').forEach(btn => {
        if (btn.dataset.val === stade) btn.classList.add('selected');
        btn.onclick = () => {
          stade = btn.dataset.val;
          special = null;
          renderSpecialChips();
          clearGroup('.stade-opt');
          btn.classList.add('selected');
          const showAgneaux = (echoRapideSession.typeEcho === 'stade_comptage') && stade !== 'Vide';
          document.getElementById('agneaux-block').classList.toggle('hidden', !showAgneaux);
          if (!showAgneaux) { agneaux = null; clearGroup('#agneaux-group .opt-btn'); }
        };
      });
    }

    function renderSpecialChips() {
      const list = document.getElementById('special-list');
      if (!list) return;
      list.innerHTML = '';
      DB.casParticuliers.forEach(val => {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip' + (special === val ? ' selected' : '');
        chip.textContent = val;
        chip.onclick = () => {
          if (special === val) { special = null; }
          else {
            special = val; stade = null; agneaux = null;
            clearGroup('.stade-opt');
            clearGroup('#agneaux-group .opt-btn');
            document.getElementById('agneaux-block').classList.add('hidden');
          }
          renderSpecialChips();
        };
        list.appendChild(chip);
      });
    }

    function resultFieldsHtml() {
      return `
        <div class="card">
          <label>${echoRapideSession.typeEcho === 'constat' ? 'Résultat' : 'Stade'}</label>
          <div class="grid4" id="stade-group" style="margin-bottom:14px;"></div>
          <div id="agneaux-block" class="hidden">
            <label>Nombre d'agneaux</label>
            <div class="grid2" id="agneaux-group" style="margin-bottom:14px;">
              <button type="button" class="opt-btn" data-val="Simple">1 agneau</button>
              <button type="button" class="opt-btn" data-val="Double">2 et plus</button>
            </div>
          </div>
          <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">
            <input type="checkbox" id="f-parasit" style="width:18px;height:18px;margin:0;">
            <span style="font-size:14px;color:var(--text);">Parasitisme observé</span>
          </label>
          <label>Cas particulier (facultatif)</label>
          <div class="chip-list" id="special-list"></div>
          <div id="err" class="error-box hidden"></div>
          <button class="btn btn-primary" id="btn-valider-echo">Valider et scanner la suivante</button>
        </div>
      `;
    }

    function draw() {
      pageTitle.textContent = 'Échographies — ' + typeLabel();
      const unknownHtml = unknownEid ? `
        <div style="background:var(--coral-bg);border-radius:var(--radius);padding:16px;margin-bottom:12px;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
            <span style="width:44px;height:44px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--coral-fg);">${ICON_WARNING.replace('viewBox="0 0 24 24"', 'width="22" height="22" viewBox="0 0 24 24"')}</span>
            <div>
              <div style="font-weight:700;color:var(--coral-fg);">Brebis inconnue</div>
              <div style="font-size:12px;color:var(--coral-fg);opacity:0.85;">Aucune fiche pour cet EID (n°${numeroVisuel(unknownEid)}).</div>
            </div>
          </div>
          <button type="button" class="btn btn-primary" id="btn-create-unknown" style="margin-bottom:8px;">Créer cette brebis et continuer</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel-unknown">Annuler ce scan</button>
        </div>
      ` : '';
      const foundHtml = currentSheep ? `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="display:flex;align-items:center;gap:12px;">
              ${iconCircle(ICON_SHEEP, 'amber', 'sm')}
              <div>
                <div style="font-weight:700;font-size:16px;">Brebis n°${numeroVisuel(currentSheep.eid)}</div>
                <div style="font-size:12px;color:var(--text-muted);">${age(currentSheep.eid)} an(s) (${anneeNaissance(currentSheep.eid)})</div>
              </div>
            </div>
            <span class="found-badge">Trouvée</span>
          </div>
        </div>
      ` : '';

      const count = echoRapideSession.count;
      app.innerHTML = `
        <div style="display:flex;justify-content:center;margin-bottom:16px;">
          <div class="session-counter sc-green">${ICON_ECHO}${count} échographie${count > 1 ? 's' : ''} saisie${count > 1 ? 's' : ''}</div>
        </div>
        ${echoRapideSession.dernierEcho ? `<div style="display:flex;align-items:center;gap:10px;background:var(--blue-bg);color:var(--blue-fg);padding:10px 14px;border-radius:var(--radius);font-size:13px;margin-bottom:14px;font-weight:600;">Dernière écho de la campagne — toute brebis "Vide" sera aussi marquée vide définitive</div>` : ''}
        <div class="card">
          <label>${currentSheep ? 'Scanner la prochaine brebis' : 'Scanner une brebis'}</label>
          <input type="text" id="scan-echo" placeholder="Scanner ou saisir l'EID" autofocus>
        </div>
        ${unknownHtml}
        ${foundHtml}
        ${currentSheep ? resultFieldsHtml() : ''}
        <button type="button" class="btn btn-secondary" id="btn-fin-session-echo" style="margin-top:14px;">Terminer la session</button>
        <button type="button" class="btn btn-secondary" id="btn-historique-echo-loop" style="margin-top:10px;">Voir l'historique des échographies</button>
      `;

      const scanInput = document.getElementById('scan-echo');
      // .focus() juste après avoir remplacé innerHTML échoue parfois sur
      // WebView mobile (le clavier virtuel n'a pas encore de quoi s'accrocher
      // tant que le reflow n'a pas eu lieu) — on le reporte d'une frame.
      requestAnimationFrame(() => scanInput.focus());
      scanInput.addEventListener('keydown', (e) => {
        // e.keyCode en secours : certains claviers/WebView Android ne
        // renseignent pas e.key de façon fiable pour la touche Entrée.
        if (e.key !== 'Enter' && e.keyCode !== 13) return;
        e.preventDefault();
        const val = cleanEid(scanInput.value);
        if (!val) return;
        const sheep = DB.brebis.find(s => cleanEid(s.eid) === val);
        if (!sheep) {
          playBeepRate();
          resetResult();
          unknownEid = val;
          draw();
          return;
        }
        playBeepTrouve();
        resetResult();
        currentSheep = sheep;
        draw();
      });
      document.getElementById('btn-fin-session-echo').onclick = () => {
        if (count > 0 && !confirm('Terminer cette session d\'échographies (' + count + ' saisie(s)) ? Tu pourras en commencer une nouvelle à tout moment.')) return;
        resetEchoRapideSession();
        render('home');
      };
      document.getElementById('btn-historique-echo-loop').onclick = () => render('historique-echo');

      if (unknownEid) {
        document.getElementById('btn-create-unknown').onclick = () => {
          const eidFormatted = unknownEid;
          const newSheep = {
            id: Date.now().toString() + Math.random().toString(36).slice(2,6),
            eid: eidFormatted, createdAt: Date.now(), dateEntree: new Date().toISOString().slice(0,10),
            echographies: [], agnelages: [], sanitaire: [], controleLaitier: [], statut: 'active',
            mouvements: [{ type: 'Entrée', cause: 'Création (ajout manuel)', date: new Date().toISOString().slice(0,10) }]
          };
          DB.brebis.push(newSheep);
          saveData(DB);
          unknownEid = null;
          currentSheep = newSheep;
          draw();
        };
        document.getElementById('btn-cancel-unknown').onclick = () => {
          unknownEid = null;
          draw();
        };
      }

      if (currentSheep) {
        renderStadeButtons();
        renderSpecialChips();
        document.querySelectorAll('#agneaux-group .opt-btn').forEach(btn => {
          if (btn.dataset.val === agneaux) btn.classList.add('selected');
          btn.onclick = () => {
            agneaux = btn.dataset.val;
            clearGroup('#agneaux-group .opt-btn');
            btn.classList.add('selected');
          };
        });
        document.getElementById('f-parasit').checked = parasit;
        document.getElementById('f-parasit').onchange = (e) => { parasit = e.target.checked; };

        const btnValider = document.getElementById('btn-valider-echo');
        btnValider.onclick = () => {
          const err = document.getElementById('err');
          if (!stade && !special) {
            err.textContent = "Choisis un résultat (ou un cas particulier).";
            err.classList.remove('hidden');
            return;
          }
          const needAgneaux = echoRapideSession.typeEcho === 'stade_comptage' && (stade === 'Début' || stade === 'Milieu' || stade === 'Fin');
          if (needAgneaux && !agneaux) {
            err.textContent = "Précise si c'est 1 agneau ou 2 et plus.";
            err.classList.remove('hidden');
            return;
          }
          const dateEcho = new Date().toISOString().slice(0,10);
          currentSheep.echographies = currentSheep.echographies || [];
          if (currentSheep.echographies.some(e => e.date === dateEcho)) {
            err.textContent = "Une échographie a déjà été saisie aujourd'hui pour cette brebis — modifie-la depuis sa fiche si besoin.";
            err.classList.remove('hidden');
            return;
          }
          btnValider.disabled = true; // évite un double-clic/double-tap qui rejouerait la validation
          const echo = {
            type: echoRapideSession.typeEcho,
            date: dateEcho,
            stade: stade, agneaux: agneaux, special: special, parasitisme: parasit,
            campagne: DB.campagneDebut
          };
          currentSheep.echographies.push(echo);
          // "Dernière écho de la campagne" cochée : une brebis notée "Vide"
          // ici est vide définitive, pas juste vide "à cette écho" — pas de
          // double saisie à faire (voir marquerVideDefinitive).
          if (echoRapideSession.dernierEcho && stade === 'Vide') marquerVideDefinitive(currentSheep);
          saveData(DB);
          echoRapideSession.count++;
          resetResult();
          draw();
        };
      }
    }
    draw();
  }

  if (echoRapideSession.typeEcho) screenLoop();
  else screenChooseType();
}

/* ---------- Historique des échographies (consultation/édition/suppression) ----------
   Tableau cross-brebis de toutes les échographies enregistrées, filtrable
   par date. Modifier réutilise l'écran d'édition existant (add-echo, via
   editItem) — après enregistrement on revient sur la fiche de la brebis,
   comme partout ailleurs dans l'appli ; Supprimer reste sur cet écran et se
   contente de rafraîchir le tableau. */
let historiqueEchoFiltreDate = '';

function historiqueEchoRows() {
  const rows = [];
  DB.brebis.forEach(sheep => {
    (sheep.echographies || []).forEach((e, idx) => {
      rows.push({
        sheepId: sheep.id,
        eid: sheep.eid,
        idx,
        date: e.date || '',
        resultLabel: (e.special ? e.special : ((e.stade || '?') + (e.agneaux ? ' — ' + (e.agneaux === 'Double' ? '2 et plus' : '1 agneau') : ''))) + (e.parasitisme ? ' · parasitisme' : '')
      });
    });
  });
  rows.sort((a, b) => (b.date || '').localeCompare(a.date || '') || numeroVisuel(a.eid).localeCompare(numeroVisuel(b.eid)));
  return rows;
}

function renderHistoriqueEchoBody() {
  let rows = historiqueEchoRows();
  if (historiqueEchoFiltreDate) rows = rows.filter(r => r.date === historiqueEchoFiltreDate);
  const body = document.getElementById('historique-echo-body');
  if (!body) return;
  body.innerHTML = rows.length === 0 ? '<div class="empty">Aucune échographie ne correspond.</div>' : `
    <div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;">
      <thead><tr><th style="${REGISTRE_TH}">N°</th><th style="${REGISTRE_TH}">Date</th><th style="${REGISTRE_TH}">Résultat</th><th style="${REGISTRE_TH}"></th></tr></thead>
      <tbody>${rows.map(r => `
        <tr>
          <td style="${REGISTRE_TD}">n°${numeroVisuel(r.eid)}</td>
          <td style="${REGISTRE_TD}">${r.date}</td>
          <td style="${REGISTRE_TD}">${r.resultLabel}</td>
          <td style="${REGISTRE_TD}">
            <button type="button" class="btn btn-secondary btn-edit-histo-echo" data-sheep-id="${r.sheepId}" data-idx="${r.idx}" style="width:auto;padding:4px 10px;font-size:12px;margin-right:6px;">Modifier</button>
            <button type="button" class="btn btn-secondary btn-del-histo-echo" data-sheep-id="${r.sheepId}" data-idx="${r.idx}" style="width:auto;padding:4px 10px;font-size:12px;color:var(--danger);border-color:var(--danger);">Suppr.</button>
          </td>
        </tr>`).join('')}</tbody>
    </table></div>`;
  body.querySelectorAll('.btn-edit-histo-echo').forEach(btn => {
    btn.onclick = () => { currentSheepId = btn.dataset.sheepId; editItem('echographies', parseInt(btn.dataset.idx, 10)); };
  });
  body.querySelectorAll('.btn-del-histo-echo').forEach(btn => {
    btn.onclick = () => {
      if (!confirm('Supprimer cette échographie ? Cette action est irréversible.')) return;
      const sheep = findSheep(btn.dataset.sheepId);
      if (!sheep) return;
      sheep.echographies.splice(parseInt(btn.dataset.idx, 10), 1);
      saveData(DB);
      renderHistoriqueEchoBody();
    };
  });
}

function renderHistoriqueEcho() {
  pageTitle.textContent = 'Historique des échographies';
  app.innerHTML = `
    <div style="font-size:13px;color:var(--text-muted);margin:2px 2px 14px;">Toutes les échographies enregistrées, toutes brebis confondues — filtrables par date.</div>
    <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:14px;">
      <div style="flex:1;"><label>Filtrer par date</label><input type="date" id="historique-echo-date" value="${historiqueEchoFiltreDate}"></div>
      <button type="button" class="btn btn-secondary" id="historique-echo-reset" style="width:auto;padding:0 16px;height:44px;">Toutes</button>
    </div>
    <div id="historique-echo-body"></div>
  `;
  document.getElementById('historique-echo-date').addEventListener('change', (e) => {
    historiqueEchoFiltreDate = e.target.value;
    renderHistoriqueEchoBody();
  });
  document.getElementById('historique-echo-reset').onclick = () => {
    historiqueEchoFiltreDate = '';
    document.getElementById('historique-echo-date').value = '';
    renderHistoriqueEchoBody();
  };
  renderHistoriqueEchoBody();
}

/* ---------- Saisie rapide de mises bas (boucle scan → agnelage) ----------
   Reprend exactement le formulaire d'agnelage existant (renderAddAgnelage :
   sexe par agneau, EID, adoption, Sélépérol automatique) mais sans quitter
   l'écran entre deux brebis : scan → formulaire → Valider et scanner la
   suivante → tout se vide. Compteur de session. EID inconnu → création à la
   volée, comme pour les échographies. */
/* Compteur de session persisté au niveau module — voir echoRapideSession
   pour l'explication (une ré-entrée sur cet écran, ex: via le menu
   hamburger, reprend le compteur au lieu de le remettre à zéro). */
let misebasRapideCount = 0;
function resetMisebasRapideSession() { misebasRapideCount = 0; }

function renderMiseBasRapide() {
  let currentSheep = null;
  let unknownEid = null;
  let lambCount = 0;
  const lambs = {};

  function resetForm() {
    currentSheep = null; unknownEid = null; lambCount = 0;
    Object.keys(lambs).forEach(k => delete lambs[k]);
  }

  function lambCard(id) {
    const div = document.createElement('div');
    div.className = 'card';
    div.style.marginBottom = '10px';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span style="font-size:14px;font-weight:600;">Agneau ${id}</span>
        <button type="button" class="btn btn-secondary remove-lamb-rapide" data-id="${id}" style="width:auto;padding:4px 10px;font-size:13px;">Retirer</button>
      </div>
      <label>Sexe</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);">
        <button type="button" class="opt-btn sexe-opt-rapide warn" data-id="${id}" data-val="Mâle">Mâle</button>
        <button type="button" class="opt-btn sexe-opt-rapide warn" data-id="${id}" data-val="Femelle">Femelle</button>
        <button type="button" class="opt-btn sexe-opt-rapide warn" data-id="${id}" data-val="Mort-né">Mort-né</button>
      </div>
      <div class="eid-block-rapide" data-id="${id}">
        <label>EID (bip agneau)</label>
        <input type="text" class="eid-input-rapide" data-id="${id}" placeholder="Scanner ou saisir l'EID">
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
          <input type="checkbox" class="adopt-check-rapide" data-id="${id}" style="width:16px;height:16px;margin:0;">
          <span style="font-size:14px;color:var(--text);">Adopté par une autre mère</span>
        </label>
        <div class="adopt-field-rapide hidden" data-id="${id}">
          <label>EID mère adoptive</label>
          <input type="text" class="adopt-eid-rapide" data-id="${id}" placeholder="Scanner ou saisir l'EID">
        </div>
        <div class="selepherol-note" style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);background:#f0efe9;border-radius:var(--radius);padding:8px 12px;margin-top:10px;">Sélépérol 2 cc appliqué automatiquement</div>
      </div>
      <div class="mortne-note-rapide hidden" data-id="${id}" style="font-size:12px;color:var(--text-muted);margin-top:8px;">Pas de boucle sur un mort-né — aucun EID à saisir.</div>
    `;
    return div;
  }

  function bindLamb(id) {
    document.querySelectorAll(`.sexe-opt-rapide[data-id="${id}"]`).forEach(btn => {
      btn.onclick = () => {
        lambs[id].sexe = btn.dataset.val;
        document.querySelectorAll(`.sexe-opt-rapide[data-id="${id}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        const isMortNe = btn.dataset.val === 'Mort-né';
        document.querySelector(`.eid-block-rapide[data-id="${id}"]`).classList.toggle('hidden', isMortNe);
        document.querySelector(`.mortne-note-rapide[data-id="${id}"]`).classList.toggle('hidden', !isMortNe);
        document.getElementById('err').classList.add('hidden');
      };
    });
    const check = document.querySelector(`.adopt-check-rapide[data-id="${id}"]`);
    check.onchange = () => {
      document.querySelector(`.adopt-field-rapide[data-id="${id}"]`).classList.toggle('hidden', !check.checked);
      lambs[id].adopte = check.checked;
    };
    document.querySelector(`.remove-lamb-rapide[data-id="${id}"]`).onclick = () => {
      delete lambs[id];
      document.querySelector(`.remove-lamb-rapide[data-id="${id}"]`).closest('.card').remove();
    };
    const eidInput = document.querySelector(`.eid-input-rapide[data-id="${id}"]`);
    if (eidInput) attachEidBeep(eidInput);
    const adoptEidInput = document.querySelector(`.adopt-eid-rapide[data-id="${id}"]`);
    if (adoptEidInput) attachEidBeep(adoptEidInput);
  }

  function addLamb() {
    lambCount++;
    const id = lambCount;
    lambs[id] = { sexe: null, adopte: false };
    document.getElementById('lamb-list-rapide').appendChild(lambCard(id));
    bindLamb(id);
  }

  function draw() {
    pageTitle.textContent = 'Saisie de mises bas';
    const unknownHtml = unknownEid ? `
      <div style="background:var(--coral-bg);border-radius:var(--radius);padding:16px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
          <span style="width:44px;height:44px;border-radius:50%;background:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--coral-fg);">${ICON_WARNING.replace('viewBox="0 0 24 24"', 'width="22" height="22" viewBox="0 0 24 24"')}</span>
          <div>
            <div style="font-weight:700;color:var(--coral-fg);">Brebis inconnue</div>
            <div style="font-size:12px;color:var(--coral-fg);opacity:0.85;">Aucune fiche pour cet EID (n°${numeroVisuel(unknownEid)}).</div>
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="btn-create-unknown-mb" style="margin-bottom:8px;">Créer cette brebis et continuer</button>
        <button type="button" class="btn btn-secondary" id="btn-cancel-unknown-mb">Annuler ce scan</button>
      </div>
    ` : '';
    const dejaAgnelage = currentSheep && currentSheep.agnelages && currentSheep.agnelages.length > 0;
    const foundHtml = currentSheep ? `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:12px;">
            ${iconCircle(ICON_SHEEP, 'amber', 'sm')}
            <div>
              <div style="font-weight:700;font-size:16px;">Brebis n°${numeroVisuel(currentSheep.eid)}</div>
              <div style="font-size:12px;color:var(--text-muted);">${age(currentSheep.eid)} an(s) (${anneeNaissance(currentSheep.eid)})</div>
            </div>
          </div>
          <span class="found-badge">Trouvée</span>
        </div>
      </div>
    ` : '';
    // Une brebis ne peut avoir qu'un agnelage par campagne (voir renderAddAgnelage) :
    // on bloque ici aussi plutôt que de laisser la boucle rapide en créer un second.
    const dejaAgnelageHtml = dejaAgnelage ? `
      <div class="card">
        <div style="font-size:13px;color:var(--coral-fg);margin-bottom:12px;">Cette brebis a déjà un agnelage enregistré le ${currentSheep.agnelages[0].date} — une seule mise bas par campagne. Modifie-la depuis sa fiche si besoin, ou scanne la brebis suivante.</div>
        <button type="button" class="btn btn-secondary" id="btn-edit-existing-agnelage-rapide">Modifier l'agnelage existant</button>
      </div>
    ` : '';
    const formHtml = (currentSheep && !dejaAgnelage) ? `
      <div class="card">
        <label>Date de naissance</label>
        <input type="date" id="f-date-rapide" value="${new Date().toISOString().slice(0,10)}" style="margin-bottom:16px;">
        <div id="lamb-list-rapide"></div>
        <button type="button" class="btn btn-secondary" id="add-lamb-rapide" style="margin-bottom:14px;">+ Ajouter un agneau</button>
        <div id="err" class="error-box hidden"></div>
        <button class="btn btn-primary" id="btn-valider-misebas">Valider et scanner la suivante</button>
      </div>
    ` : '';

    const count = misebasRapideCount;
    app.innerHTML = `
      <div style="display:flex;justify-content:center;margin-bottom:16px;">
        <div class="session-counter sc-amber">${ICON_SHEEP}${count} mise${count > 1 ? 's' : ''} bas saisie${count > 1 ? 's' : ''}</div>
      </div>
      <div class="card">
        <label>Scanner la brebis qui vient de mettre bas</label>
        <input type="text" id="scan-misebas" placeholder="Scanner ou saisir l'EID" autofocus>
      </div>
      ${unknownHtml}
      ${foundHtml}
      ${dejaAgnelageHtml}
      ${formHtml}
      <button type="button" class="btn btn-secondary" id="btn-fin-session-mb" style="margin-top:14px;">Terminer la session</button>
    `;

    if (dejaAgnelage) {
      document.getElementById('btn-edit-existing-agnelage-rapide').onclick = () => {
        currentSheepId = currentSheep.id;
        editItem('agnelages', 0);
      };
    }

    const scanInput = document.getElementById('scan-misebas');
    requestAnimationFrame(() => scanInput.focus());
    scanInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.keyCode !== 13) return;
      e.preventDefault();
      const val = cleanEid(scanInput.value);
      if (!val) return;
      const sheep = DB.brebis.find(s => cleanEid(s.eid) === val);
      if (!sheep) {
        playBeepRate();
        resetForm();
        unknownEid = val;
        draw();
        return;
      }
      playBeepTrouve();
      resetForm();
      currentSheep = sheep;
      draw();
    });
    document.getElementById('btn-fin-session-mb').onclick = () => {
      if (count > 0 && !confirm('Terminer cette session de mises bas (' + count + ' saisie(s)) ? Tu pourras en commencer une nouvelle à tout moment.')) return;
      resetMisebasRapideSession();
      render('home');
    };

    if (unknownEid) {
      document.getElementById('btn-create-unknown-mb').onclick = () => {
        const newSheep = {
          id: Date.now().toString() + Math.random().toString(36).slice(2,6),
          eid: unknownEid, createdAt: Date.now(), dateEntree: new Date().toISOString().slice(0,10),
          echographies: [], agnelages: [], sanitaire: [], controleLaitier: [], statut: 'active',
          mouvements: [{ type: 'Entrée', cause: 'Création (ajout manuel)', date: new Date().toISOString().slice(0,10) }]
        };
        DB.brebis.push(newSheep);
        saveData(DB);
        unknownEid = null;
        currentSheep = newSheep;
        draw();
        addLamb();
      };
      document.getElementById('btn-cancel-unknown-mb').onclick = () => {
        unknownEid = null;
        draw();
      };
    }

    if (currentSheep && !dejaAgnelage) {
      document.getElementById('add-lamb-rapide').onclick = addLamb;
      if (Object.keys(lambs).length === 0) addLamb();

      const btnValiderMb = document.getElementById('btn-valider-misebas');
      btnValiderMb.onclick = () => {
        const err = document.getElementById('err');
        const ids = Object.keys(lambs);
        if (ids.length === 0) {
          err.textContent = "Ajoute au moins un agneau.";
          err.classList.remove('hidden');
          return;
        }
        for (const id of ids) {
          if (!lambs[id].sexe) {
            err.textContent = "Sélectionne le sexe de chaque agneau.";
            err.classList.remove('hidden');
            return;
          }
          if (lambs[id].sexe !== 'Mort-né') {
            const eidInput = document.querySelector(`.eid-input-rapide[data-id="${id}"]`);
            lambs[id].eid = eidInput.value.trim();
            if (lambs[id].adopte) {
              const adoptEidInput = document.querySelector(`.adopt-eid-rapide[data-id="${id}"]`);
              lambs[id].adoptiveEid = adoptEidInput.value.trim();
            }
            lambs[id].sanitaire = lambs[id].sanitaire || [];
            const dateNaissance = document.getElementById('f-date-rapide').value;
            const dejaSelepherol = lambs[id].sanitaire.some(s => s.produit === 'Selepherol');
            if (!dejaSelepherol) {
              lambs[id].sanitaire.push({
                type: 'Traitement', sousType: null, produit: 'Selepherol', dose: '2 cc',
                date: dateNaissance,
                commentaire: 'Injection systématique à la naissance'
              });
            }
          }
        }
        err.classList.add('hidden');
        btnValiderMb.disabled = true; // évite un double-clic/double-tap qui rejouerait la validation
        const agnelage = {
          date: document.getElementById('f-date-rapide').value,
          lambs: ids.map(id => lambs[id])
        };
        agnelage.lambs.forEach(l => ensureLambEntreeMouvement(l, agnelage.date));
        currentSheep.agnelages = currentSheep.agnelages || [];
        currentSheep.agnelages.push(agnelage);
        saveData(DB);
        misebasRapideCount++;
        resetForm();
        draw();
      };
    }
  }

  draw();
}

/* ---------- Ajout carnet sanitaire ---------- */
function renderAddSanitaire(sheepId) {
  const sheep = findSheep(sheepId);
  const editing = editContext && editContext.kind === 'sanitaire';
  const existing = editing ? sheep.sanitaire[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le soin' : 'Carnet sanitaire';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Brebis n°${numeroVisuel(sheep.eid)}</div>

      <label>Type d'évènement</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px;">
        <button type="button" class="opt-btn type-opt coral" data-val="Vaccin">Vaccin</button>
        <button type="button" class="opt-btn type-opt coral" data-val="Traitement">Traitement</button>
        <button type="button" class="opt-btn type-opt coral" data-val="Autre">Autre</button>
      </div>

      <div id="sous-type-block" class="hidden" style="margin-bottom:10px;">
        <label>Catégorie de traitement</label>
        <div class="grid2" id="sous-type-group">
          <button type="button" class="opt-btn sous-opt coral" data-val="Antibiotique">Antibiotique</button>
          <button type="button" class="opt-btn sous-opt coral" data-val="Antiparasitaire">Antiparasitaire</button>
        </div>
        <div class="grid2">
          <button type="button" class="opt-btn sous-opt coral" data-val="Anti-inflammatoire" style="grid-column:span 2;">Anti-inflammatoire</button>
        </div>
      </div>

      <div id="autre-note" class="hidden" style="font-size:13px;color:var(--text-muted);margin-bottom:14px;padding:10px;background:#f0efe9;border-radius:var(--radius);">Soin de plaie — pas de produit à sélectionner.</div>

      <div id="produit-block" class="hidden" style="margin-bottom:14px;">
        <label>Produit utilisé</label>
        <div class="chip-list" id="produit-list"></div>
        <div class="row">
          <input type="text" id="new-produit" placeholder="Ajouter un nouveau produit...">
          <button type="button" class="btn btn-secondary" id="add-produit" style="width:auto;padding:0 16px;">+</button>
        </div>
      </div>

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <label>Dose (facultatif)</label>
      <input type="text" id="f-dose" placeholder="ex: 2 ml" value="${existing ? (existing.dose || '') : ''}">

      <label>Commentaire (facultatif)</label>
      <input type="text" id="f-comment" placeholder="ex: rappel dans 3 semaines" value="${existing ? (existing.commentaire || '') : ''}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-sanitaire">${editing ? 'Enregistrer les modifications' : 'Enregistrer le soin'}</button>
    </div>
  `;

  let type = null, sousType = null, produit = null;

  function categorieKey() {
    if (type === 'Vaccin') return 'vaccins';
    if (sousType === 'Antibiotique') return 'antibiotiques';
    if (sousType === 'Antiparasitaire') return 'antiparasitaires';
    if (sousType === 'Anti-inflammatoire') return 'antiinflammatoires';
    return null;
  }

  function renderProduitChips() {
    const key = categorieKey();
    const list = document.getElementById('produit-list');
    list.innerHTML = '';
    if (!key) { document.getElementById('produit-block').classList.add('hidden'); return; }
    document.getElementById('produit-block').classList.remove('hidden');
    DB.produits[key].forEach(val => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (produit === val ? ' selected' : '');
      chip.textContent = val;
      chip.onclick = () => {
        const wasSelected = produit === val;
        produit = wasSelected ? null : val;
        renderProduitChips();
        document.getElementById('err').classList.add('hidden');
        updatePosologieBox(produit);
        if (!wasSelected) maybeAssociateAnmv(val, () => updatePosologieBox(produit));
      };
      list.appendChild(chip);
    });
  }

  document.querySelectorAll('.type-opt').forEach(btn => {
    btn.onclick = () => {
      type = btn.dataset.val;
      sousType = null;
      produit = null;
      document.querySelectorAll('.type-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      document.getElementById('sous-type-block').classList.toggle('hidden', type !== 'Traitement');
      document.getElementById('autre-note').classList.toggle('hidden', type !== 'Autre');
      if (type === 'Autre') {
        document.getElementById('produit-block').classList.add('hidden');
      } else if (type === 'Vaccin') {
        renderProduitChips();
      } else {
        document.getElementById('produit-block').classList.add('hidden');
      }
      document.getElementById('err').classList.add('hidden');
    };
  });

  document.querySelectorAll('.sous-opt').forEach(btn => {
    btn.onclick = () => {
      sousType = btn.dataset.val;
      produit = null;
      document.querySelectorAll('.sous-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      renderProduitChips();
      document.getElementById('err').classList.add('hidden');
    };
  });

  document.getElementById('add-produit').onclick = () => {
    const key = categorieKey();
    if (!key) return;
    const input = document.getElementById('new-produit');
    const val = input.value.trim();
    if (!val) return;
    if (!DB.produits[key].includes(val)) DB.produits[key].push(val);
    saveData(DB);
    input.value = '';
    produit = val;
    renderProduitChips();
    maybeAssociateAnmv(val, () => updatePosologieBox(produit));
  };

  document.getElementById('btn-save-sanitaire').onclick = () => {
    const err = document.getElementById('err');
    if (!type) {
      err.textContent = "Choisis un type d'évènement.";
      err.classList.remove('hidden');
      return;
    }
    if (type === 'Traitement' && !sousType) {
      err.textContent = "Choisis une catégorie de traitement.";
      err.classList.remove('hidden');
      return;
    }
    if (type !== 'Autre' && !produit) {
      err.textContent = "Sélectionne ou ajoute un produit.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const soin = {
      type: type,
      sousType: sousType,
      produit: type === 'Autre' ? 'Soin de plaie' : produit,
      date: document.getElementById('f-date').value,
      dose: document.getElementById('f-dose').value.trim(),
      commentaire: document.getElementById('f-comment').value.trim()
    };
    sheep.sanitaire = sheep.sanitaire || [];
    if (editing) sheep.sanitaire[editContext.idx] = soin;
    else sheep.sanitaire.push(soin);
    editContext = null;
    saveData(DB);
    render('detail', sheep.id);
  };

  if (existing) {
    const typeBtn = [...document.querySelectorAll('.type-opt')].find(b => b.dataset.val === existing.type);
    if (typeBtn) typeBtn.click();
    if (existing.sousType) {
      const sousBtn = [...document.querySelectorAll('.sous-opt')].find(b => b.dataset.val === existing.sousType);
      if (sousBtn) sousBtn.click();
    }
    if (existing.produit && existing.type !== 'Autre') {
      const chip = [...document.querySelectorAll('#produit-list .chip')].find(c => c.textContent === existing.produit);
      if (chip) chip.click();
    }
  }
}

/* ---------- Ajout contrôle laitier ---------- */
function renderAddControle(sheepId) {
  const sheep = findSheep(sheepId);
  const editing = editContext && editContext.kind === 'controleLaitier';
  const existing = editing ? sheep.controleLaitier[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le contrôle laitier' : 'Contrôle laitier';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Brebis n°${numeroVisuel(sheep.eid)}</div>

      <label>Contrôle de la campagne</label>
      <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px;">
        <button type="button" class="opt-btn ctrl-opt blue" data-val="1">1er</button>
        <button type="button" class="opt-btn ctrl-opt blue" data-val="2">2e</button>
        <button type="button" class="opt-btn ctrl-opt blue" data-val="3">3e</button>
      </div>

      <label>Quantité de lait (L)</label>
      <input type="number" step="0.1" id="f-quantite" placeholder="ex: 1.8" value="${existing ? existing.quantite : ''}">

      <label>Date</label>
      <input type="date" id="f-date" value="${today}">

      <div id="err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-save-controle">${editing ? 'Enregistrer les modifications' : 'Enregistrer le contrôle'}</button>
    </div>
  `;

  let controle = existing ? String(existing.controle) : null;
  document.querySelectorAll('.ctrl-opt').forEach(btn => {
    if (btn.dataset.val === controle) btn.classList.add('selected');
    btn.onclick = () => {
      controle = btn.dataset.val;
      document.querySelectorAll('.ctrl-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('err').classList.add('hidden');
    };
  });

  document.getElementById('btn-save-controle').onclick = () => {
    const err = document.getElementById('err');
    const quantite = parseFloat(document.getElementById('f-quantite').value);
    if (!controle) {
      err.textContent = "Choisis le numéro du contrôle.";
      err.classList.remove('hidden');
      return;
    }
    if (isNaN(quantite) || quantite < 0) {
      err.textContent = "Saisis une quantité de lait valide.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    const record = {
      controle: parseInt(controle, 10),
      quantite: Math.round(quantite * 10) / 10,
      date: document.getElementById('f-date').value
    };
    sheep.controleLaitier = sheep.controleLaitier || [];
    if (editing) sheep.controleLaitier[editContext.idx] = record;
    else sheep.controleLaitier.push(record);
    editContext = null;
    saveData(DB);
    render('detail', sheep.id);
  };
}


function renderAddMouvement(sheepId) {

  const editing = editContext && editContext.kind === 'mouvements';
  const existing = editing ? sheep.mouvements[editContext.idx] : null;
  pageTitle.textContent = editing ? 'Modifier le mouvement' : 'Nouveau mouvement';
  const today = existing ? existing.date : new Date().toISOString().slice(0,10);

  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Brebis n°${numeroVisuel(sheep.eid)}</div>

      <label>Type de mouvement</label>

        <button type="button" class="opt-btn type-opt coral" data-val="Morte">Morte</button>
        <button type="button" class="opt-btn type-opt coral" data-val="Vendue">Vendue</button>

        <div class="chip-list" id="cause-list"></div>
        <div class="row">

        <div class="chip-list" id="acheteur-list"></div>
