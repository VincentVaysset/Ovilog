 de tylosine/kg de poids vif par jour, pendant 3 jours (soit 2,5 à 5 mL de solution injectable pour 100 kg de poids vif).Chez les porcins, ne pas administrer plus de 5 mL par site d’injection.\\nLes bouchons ne doivent pas être percés plus de 15 fois. Pour éviter de trop percer le bouchon, il est recommandé d'utiliser un dispositif multi-doses. Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible."},{"n":"PHOSPHONORTONIC SOLUTION INJECTABLE","l":0,"v":0,"p":"Voie intraveineuse (i.v), intramusculaire (i.m) ou sous-cutanée (s.c). 3,0 à 72,5 mg de toldimphos par kg de poids vif par jour par animal selon les recommandations suivantes : Equins et bovins :Adultes : 1 mL pour 50 kg,Cette dose peut être portée à 1 mL pour 10 kg pour un bovin lors de la 1ère intervention.Jeunes : 1 à 2 mL pour 10 kg Ovins et caprins :Adultes : 0,5 mLl à 1 mL pour 10 kgJeunes : 0,5 mL par kg Porcins :Adultes : 1 à 2 mL pour 10 kgJeunes : 0,5 mL par kg Chiens et chats: de 0,5 mLpar kg à 1 mL pour 10 kg. Ces doses doivent être administrées par les voies I.V., I.M. ou S.C. en plusieurs points d'injection. Elles seront répétées tous les jours ou à intervalles de 2 à 3 jours selon l'avis du vétérinaire traitant. En cas d'affections chroniques, 5 à 10 injections peuvent être réalisées."},{"n":"PHYTOLAC SOLUTION BUVABLE","l":null,"v":0,"p":"Voie orale.5 mL par animal, matin et soir, pendant 5 à 7 jours.Administrer directement dans la bouche de l'animal ou diluer dans l'eau de boisson ou mélanger à l'aliment."},{"n":"PNEUMOSPECTIN 50/100 MG/ML SOLUTION INJECTABLE","l":null,"v":14,"p":"Le produit doit être administré par injection intramusculaire ou sous-cutanée. Afin d'assurer un dosage correct, le poids de l'animal doit être déterminé aussi précisément que possible.\\n\\nVeaux :\\n5 mg de lincomycine et 10 mg de spectinomycine par kg de poids vif (correspondant à 1 mL de solution pour 10 kg de poids vif) par voie intramusculaire, deux injections pendant le premier jour de traitement, puis une injection par jour pendant 3 à 5 jours.\\n\\nOvins et caprins :\\n5 mg de lincomycine et 10 mg de spectinomycine par kg de poids vif (correspondant à 1 mL de solution pour 10 kg de poids vif) par voie intramusculaire, une fois par jour, pendant 3 à 5 jours.\\n\\nPorcins :\\n5 mg de lincomycine et 10 mg de spectinomycine par kg de poids vif (correspondant à 1 mL de solution pour 10 kg de poids vif) par voie intramusculaire, à renouveler, si nécessaire, 24 heures plus tard et pendant 5 jours maximum.\\n\\nPoulets et dindes :\\n10 mg de lincomycine et 20 mg de spectinomycine par kg de poids vif (correspondant à 1 mL de solution pour 5 kg de poids vif) par voie sous-cutanée, une fois par jour, pendant 3 jours.\\n\\nChats et chiens :\\n10 mg de lincomycine et 20 mg de spectinomycine par kg de poids corporel (correspondant à 1 mL de solution pour 5 kg de poids corporel par voie intramusculaire. Le traitement peut être renouvelé entre 12 et 24 heures d'intervalle pendant 3 à 7 jours selon la réponse clinique. \\nNe pas percer le bouchon plus de 30 fois. Autrement, utiliser une seringue automatique ou une aiguille à prélèvement appropriée pour éviter une perforation excessive du bouchon."},{"n":"PO 121 AMPICILLINE 10 VOLAILLE-PORC-VEAU-AGNEAU-CHEVREAU","l":null,"v":8,"p":"Voie orale. Veaux, agneaux, chevreaux et porcelets :10 mg d'ampicilline par kg de poids vif, deux fois par jour ; soit 2 g de médicament vétérinaire pour 10 kg de poids vif et par jour à répartir en 2 prises pendant 3 jours dans le lait, l'aliment d'allaitement, l'aliment liquide ou l'eau de boisson. Volailles :20 mg d'ampicilline par kg de poids vif par jour, dans l'eau de boisson pendant 3 jours ; soit 200 grammes de médicament vétérinaire par tonne de poids vif et par jour pendant 3 jours. La prise d'eau de boisson médicamenteuse, de lait ou d'aliment liquide dépend de l’état physiologique et clinique des animaux. Afin d'obtenir la posologie appropriée, il peut être nécessaire d’ajuster en conséquence la quantité de médicament vétérinaire à dissoudre."},{"n":"POLYSTRONGLE POUDRE ORALE","l":null,"v":3,"p":"Voie orale. Chez les bovins et les ovins :7,5 mg de lévamisole par kg de poids vif, en administration unique sans dépasser la dose totale par animal de 3,75 g chez les bovins et 0,375 g chez les ovins, soit 37,5 mg de médicament vétérinaire par kg de poids vif dilué dans un peu d'eau sans dépasser la dose de 18,75 g chez les bovins et de 1,9 g chez les ovins. Chez les porcins :7,5 mg de lévamisole par kg de poids vif, en administration unique sans dépasser la dose totale par animal de 0,75 g, soit 37,5 mg de médicament vétérinaire par kg dilué dans un peu d'eau ou la soupe sans dépasser la dose de 3,75 g par animal. Chez les volailles :20 mg de lévamisole par kg de poids vif, soit environ 1 g de médicament vétérinaire par litre d'eau de boissonLa quantité d'eau de boisson médicamenteuse consommée par les volailles dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en lévamisole doit être ajustée en conséquence. Utiliser un pistolet doseur propre et correctement étalonné."},{"n":"PREMELANGE MEDICAMENTEUX Z 27","l":14,"v":14,"p":"Voie orale. Après incorporation dans l’aliment Porcs :50 mg d'oxytétracycline et 94 mg de sulfadimidine par kg de poids vif par jour pendant 3 à 8 jours. Agneaux, veaux :20 mg d'oxytétracycline et 37,5 mg de sulfadimidine par kg de poids vif par jour pendant 3 à 8 jours. Taux d'incorporation : Agneaux : Pour un ingéré alimentaire quotidien de 40 g d'aliment par kg de poids vif, cette posologie correspond à 420 ppm d'oxytétracycline et 787,5 ppm de sulfadimidine dans l'aliment, soit un taux d'incorporation de 7 kg de prémélange médicamenteux par tonne d'aliment. Veaux : Pour un ingéré alimentaire quotidien de 20 g d'aliment par kg de poids vif, cette posologie correspond à 1020 ppm d'oxytétracycline et 1912,5 ppm de sulfadimidine dans l'aliment, soit un taux d'incorporation de 17 kg de prémélange médicamenteux par tonne d'aliment. Porcs : Pour un ingéré alimentaire quotidien de 50 g d'aliment par kg de poids vif, cette posologie correspond à 960 ppm d'oxytétracycline et 1800 ppm de sulfadimidine dans l'aliment, soit un taux d'incorporation de 16 kg de prémélange médicamenteux par tonne d'aliment. La quantité d'aliment médicamenteux consommée par les animaux dépend de leur état physiologique (âge) et clinique. Pour respecter les doses recommandées en oxytétracycline et sulfadimidine et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué. Cela peut conduire à des teneurs en ppm d'oxytétracycline et de sulfadimidine différentes dans l'aliment médicamenteux de celles mentionnées ci-dessus à titre indicatif."},{"n":"PREMELANGE MEDICAMENTEUX Z 29","l":12,"v":12,"p":"Voie orale. Après incorporation dans l’aliment. 20 mg d'oxytétracycline et 50 mg de sulfadiméthoxine par kg de poids vif par jour pendant 3 à 8 jours Taux d'incorporation :Lapins : Pour un ingéré alimentaire quotidien de 100 g d'aliment par kg de poids vif, cette posologie correspond 200 ppm d'oxytétracycline et 500 ppm de sulfadiméthoxine dans l'aliment, soit un taux d'incorporation de 5 kg de prémélange médicamenteux par tonne d'aliment. Agneaux : Pour un ingéré alimentaire quotidien de 40 g d'aliment par kg de poids vif, cette posologie correspond à 400 ppm d'oxytétracycline et 1000 ppm de sulfadiméthoxine dans l'aliment, soit un taux d'incorporation de 10 kg de prémélange médicamenteux par tonne d'aliment. La quantité d'aliment médicamenteux consommée par les animaux dépend de leur état physiologique (âge) et clinique. Pour respecter les doses recommandées en oxytétracycline et sulfadiméthoxine et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué. Cela peut conduire à des teneurs en ppm d'oxytétracycline et de sulfadiméthoxine différentes dans l'aliment médicamenteux de celles mentionnées ci-dessus à titre indicatif."},{"n":"PREMELANGE MEDICAMENTEUX Z 30","l":null,"v":12,"p":"Voie orale, après incorporation dans l’aliment. Chez les veaux et agneaux (aliment d'allaitement) :25 mg de sulfadiazine et 5 mg de triméthoprime par kg de poids vif et par jour pendant :4 à 10 jours pour les entérites infectieuses,5 à 6 jours pour les infections respiratoires. Pour un ingéré alimentaire quotidien de 20 g d'aliment par kg de poids vif, cette posologie correspond à 1250 ppm de sulfadiazine et à 250 ppm de triméthoprime dans l'aliment d'allaitement, soit un taux d'incorporation de 20 kg de prémélange médicamenteux par tonne d'aliment. Chez les porcelets, porcs et agneaux à l'engrais :25 mg de sulfadiazine et 5 mg de triméthoprime par kg de poids vif et par jour pendant 6 à 8 jours consécutifs. Pour un ingéré alimentaire quotidien de 50 g d'aliment par kg de poids vif, cette posologie correspond à 500 ppm de sulfadiazine et à 100 ppm de triméthoprime dans l'aliment, soit un taux d'incorporation de 8 kg de prémélange médicamenteux par tonne d'aliment. Chez les volailles :50 mg de sulfadiazine et 10 mg de triméthoprime par kg de poids vif et par jour pendant 6 à 8 jours consécutifs.Pour un ingéré alimentaire quotidien de 100 g d'aliment par kg de poids vif, cette posologie correspond à 500 ppm de sulfadiazine et à 100 ppm de triméthoprime dans l'aliment, soit un taux d'incorporation de 8 kg de prémélange médicamenteux par tonne d'aliment. Pour respecter la posologie pondérale et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ou éventuellement diminué dans la limite minimale d'incorporation de 5 kg/tonne, ce qui conduit à une teneur (en ppm) différente dans l'aliment."},{"n":"PRIMOX","l":null,"v":7,"p":"Voie orale. La quantité d'eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en oxytétracycline doit être ajustée en conséquence. Veaux, agneaux, chevreaux et porcins :20 mg d'oxytétracycline / kg de poids vif par jour pendant 3 à 5 jours dans la buvée, soit 400 mg de médicament vétérinaire pour 10 kg de poids vif par jour en 2 prises dans le lait, l'aliment liquide ou l'eau de boisson. Volailles et lapins :20 mg d'oxytétracycline / kg de poids vif par jour pendant 3 à 5 jours dans l'eau de boisson.La concentration du médicament vétérinaire à distribuer dans l'eau de boisson est reprise dans le tableau suivant, pour une consommation d'eau estimée : \\nEspècesmg d’oxytétracycline / kg de poids vif / jourmg de médicament vétérinaire / 10 kg de poids vif / jourEstimation de l’eau consommée(L / 10 kg de poids vif)mg de médicament vétérinaire / L d’eau de boisson\\nLapins20 mg400 mg1,8 L / 10 kg220 mg / L\\nPoulets20 mg400 mg2 L / 10 kg de poids vif200 mg / L Sur la base de la posologie recommandée, du nombre et du poids des animaux à traiter, la concentration journalière de médicament vétérinaire doit être calculée à l'aide de la formule suivante : \\nmg de médicament vétérinaire / kg de poids vif / jourxPoids moyen (kg) des animaux à traiter mg de médicament vétérinaire par litre d’eau de boisson\\n=\\nConsommation moyenne journalière d’eau (L/animal) Afin d'assurer une posologie correcte et d'éviter un sous-dosage, le poids des animaux doit être déterminé aussi précisément que possible.Il est recommandé d'utiliser un matériel de pesée correctement étalonné en cas de fractionnement des conditionnements. La quantité journalière de médicament vétérinaire doit être ajoutée à l'eau de boisson de telle sorte que le médicament vétérinaire soit entièrement consommé en 24 heures. L'eau de boisson contenant la substance médicamenteuse doit être à nouveau préparée toutes les 24 heures. Pour profiter pleinement des qualités de solubilité du médicament vétérinaire, il est recommandé de préparer une pré-solution concentrée contenant 400 grammes de produit par litre d'eau de boisson puis de la diluer, si nécessaire, à la concentration thérapeutique préconisée.Il est également possible de distribuer la solution concentrée en utilisant une pompe doseuse."},{"n":"PROCAMIDOR SOLUTION INJECTABLE","l":0,"v":0,"p":"Pour usage sous-cutanée, périnerveuse et épidurale.Pour le début et la durée de l'effet, voir rubrique « 3.4 - Mises en garde particulières ». Anesthésie par infiltrationInjection sous-cutanée, dans ou autour de la zone opérée. Chevaux, bovins, porcins, ovins :5 à 20 mL (c'est à dire 100 à 400 mg de chlorhydrate de procaïne) Chiens, chats :1 à 5 mL (c'est à dire 20 à 100 mg de chlorhydrate de procaïne) Anesthésie de conductionInjection au niveau d'un tronc nerveux. Chiens et chats :2 à 5 mL (c'est à dire 40 à 100 mg de chlorhydrate de procaïne) Anesthésie épiduraleInjection dans l'espace épidural. Bovins :Anesthésie épidurale sacrée ou postérieure : \\nOpération de la queue \\n \\nVeau .............................5 mL (c’est à dire 100 mg de chlorhydrate de procaïne)\\nAnimal d’un an ................7,5 mL (c’est à dire 150 mg de chlorhydrate de procaïne)\\nVache ou taureau ............10 mL (c’est à dire 200 mg de chlorhydrate de procaïne)\\n \\nInterventions périnatales mineures \\n \\nAnimal d’un an ................12 mL (c’est à dire 240 mg de chlorhydrate de procaïne)\\nVache ...........................15 mL (c’est à dire 300 mg de chlorhydrate de procaïne)\\n Anesthésie épidurale antérieure : \\nExamen et chirurgie du pénis \\nVeau .............................15 mL (c’est à dire 300 mg de chlorhydrate de procaïne)\\nAnimal d’un an ................30 mL (c’est à dire 600 mg de chlorhydrate de procaïne)\\nTaureau .........................40 mL (c’est à dire 800 mg de chlorhydrate de procaïne)Les animaux recevant cette posologie peuvent se coucher.\\n OvinsAnesthésie épidurale sacrée ou postérieure :3 à 5 mL (c'est à dire 60 à 100 mg de chlorhydrate de procaïne) Anesthésie épidurale antérieure :max. 15 mL (c'est à dire 300 mg de chlorhydrate de procaïne) Porcins1 mL (c'est à dire 20 mg de chlorhydrate de procaïne) par 4,5 kg de poids vif, max. 20 mL (c'est à dire 400 mg de chlorhydrate de procaïne) Chiens2 mL (c'est à dire 40 mg de chlorhydrate de procaïne) par 5 kg de poids corporel Le bouchon en caoutchouc peut être percé 25 fois au maximum."},{"n":"PROCIPEN SUSPENSION INJECTABLE POUR BOVINS OVINS ET PORCINS","l":5,"v":12,"p":"Administration par voie intramusculaire uniquement.Posologie : 12 mg de benzylpénicilline procaïne (correspondant à 7 mg de benzylpénicilline) par kg de poids vif (équivalant à 2 mL du produit par 50 kg de poids vif) par jour.La durée du traitement est de 3 à 7 jours.La durée appropriée du traitement doit être choisie en fonction des besoins cliniques et de la guérison de chaque animal traité. Il convient de tenir compte de l’accessibilité du tissu cible et des caractéristiques de l’agent pathogène cible.Les volumes maximaux à injecter par site sont de 20 mL (bovins), 3 mL (porcins) et 2 mL (ovins).Les flacons peuvent être ponctionnés 30 fois au maximum.Pour assurer un dosage correct, le poids vif doit être déterminé le plus précisément possible afin d’éviter tout sous-dosage.Avant utilisation, agitez délicatement le flacon pendant au moins 10 secondes jusqu’à dispersion totale des sédiments."},{"n":"PRONESTESIC 34,65 MG/ML / 0,02 MG/ML SOLUTION INJECTABLE POUR CHEVAUX BOVINS PORCINS ET OVINS","l":0,"v":0,"p":"Voie sous-cutanée et périneurale. Anesthésie locale ou par infiltration : injecter dans l’hypoderme ou autour de la zone concernée 2,5-10 mL du médicament vétérinaire/animal (correspondant à 100-400 mg de chlorhydrate de procaïne + 0,09-0,36 mg de tartrate d’épinéphrine). Anesthésie périneurale : injecter près de la branche du nerf 5-10 mL du médicament vétérinaire/animal (correspondant à 200-400 mg de chlorhydrate de procaïne + 0,18-0,36 mg de tartrate d’épinéphrine). Pour les blocs du membre inférieur chez les chevaux, la dose doit être divisée entre deux ou plusieurs sites d’injection selon la dose. Voir également rubrique 3.5. Le bouchon peut être ponctionné jusqu’à 20 fois."},{"n":"PULMOXXIN 100 MG/ML SOLUTION INJECTABLE POUR BOVINS PORCINS ET OVINS","l":null,"v":22,"p":"BovinsVoie sous-cutanée.Une injection unique de 2,5 mg de tulathromycine par kg de poids vif (équivalant à 1 mL par 40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 7,5 mL au même site d’administration. PorcinsVoie intramusculaire.Une injection unique de 2,5 mg de tulathromycine par kg de poids vif (équivalant à 1 mL par 40 kg de poids vif) dans le cou. Pour le traitement de porcins pesant plus de 80 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 2 mL au même site d’administration. Pour les maladies respiratoires, il est recommandé de traiter les animaux aux stades précoces de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques respiratoires persistent ou s’aggravent, ou en cas de rechute, le traitement doit être changé en utilisant un autre antibiotique et poursuivi jusqu’à ce que les signes cliniques disparaissent. OvinsVoie intramusculaire.Une injection unique de 2,5 mg de tulathromycine par kg de poids vif (équivalant à 1 mL par 40 kg de poids vif) dans le cou. Pour s’assurer d’un dosage correct, le poids de l’animal doit être déterminé aussi précisément que possible pour éviter un sous-dosage. Pour les flacons multidose, il est recommandé d’utiliser une aiguille ou une seringue multidose afin de limiter le nombre de percements du bouchon. Le bouchon des flacons de 25, 50 et 100 mL peut être percé jusqu’à 20 fois. Le bouchon des flacons de 250 mL peut être percé jusqu’à 25 fois."},{"n":"RABISIN MULTI SUSPENSION INJECTABLE","l":null,"v":0,"p":"Voie sous-cutanée (excepté chez les équins) ou voie intramusculaire. Injecter une dose de 1 mL par voie sous-cutanée (excepté chez les équins) ou par voie intramusculaire selon le calendrier suivant : \\nEspècesPrimo-vaccinationRappels\\nChiens, chats1 injection à partir de l'âge de 12 semaines11 an après la primo-vaccination. Puis, à intervalle de 3 ans maximum2\\nFurets1 injection à partir de l'âge de 3 moisAnnuels\\nChevauxDe - de 6 mois1 injection à partir de l'âge de 4 mois3 suivie d'une 2ème injection 1 mois plus tardAnnuels\\nDe + de 6 mois1 injection\\nBovins, ovinsDe - de 9 mois1 injection à partir de l'âge de 4 mois3 suivie d'une 2ème injection entre 9 et 12 mois d'âgeAnnuels\\nDe + de 9 mois1 injection 1 Dans le cas d'un chien ou d'un chat vacciné avant l'âge de 12 semaines, le schéma de primo-vaccination devrait être complété par une injection à 12 semaines d'âge ou plus tard.2 Dans tous les cas, l'intervalle entre les rappels doit respecter la réglementation en vigueur dans le pays.3 Dans le cas où un cheval, un bovin ou un ovin est vacciné avant l'âge de 4 mois, le schéma de primo-vaccination devrait être complété par une injection faite à 4 mois d'âge ou plus tard."},{"n":"RABISIN SUSPENSION INJECTABLE","l":null,"v":0,"p":"Voie sous-cutanée (excepté chez les équins) ou voie intramusculaire. Injecter une dose de 1 mL par voie sous-cutanée (excepté chez les équins) ou par voie intramusculaire selon le calendrier suivant : \\nEspècesPrimo-vaccinationRappels\\nChiens, chats1 injection à partir de l'âge de 12 semaines 11 an après la primo-vaccination. Puis, à intervalle de 3 ans maximum 2\\nFurets1 injection à partir de l'âge de 3 moisAnnuels\\nChevauxDe - de 6 mois1 injection à partir de l'âge de 4 mois 3 suivie d'une 2ème injection 1 mois plus tardAnnuels\\nDe + de 6 mois1 injection\\nBovins, ovinsDe - de 9 mois1 injection à partir de l'âge de 4 mois 3 suivie d'une 2ème injection entre 9 et 12 mois d'âgeAnnuels\\nDe + de 9 mois1 injection1 Dans le cas d'un chien ou d'un chat vacciné avant l'âge de 12 semaines, le schéma de primo-vaccination devrait être complété par une injection à 12 semaines d'âge ou plus tard.2 Dans tous les cas, l'intervalle entre les rappels doit respecter la réglementation en vigueur dans le pays.3 Dans le cas où un cheval, un bovin ou un ovin est vacciné avant l'âge de 4 mois, le schéma de primo-vaccination devrait être complété par une injection faite à 4 mois d'âge ou plus tard."},{"n":"REHYDEX 2414 SOLUTION POUR PERFUSION","l":0,"v":0,"p":"Voie intraveineuse lente. Equins, bovins adultes : 250 à 500 mL.Poulains, veaux : 50 à 100 mL.Ovins, porcins : 50 à 100 mL.Chiens, porcelets : 10 à 50 mL."},{"n":"RIDAMEC 1 MG/ML SOLUTION BUVABLE POUR OVINS","l":5,"v":14,"p":"Voie orale.Administration en une seule fois, par voie orale (drenchage) de 1 mL de produit pour 5 kg de poids vif soit 200 µg de moxidectine / kg de poids vif, à l'aide de tout équipement de drenchage standard.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible., et vérifier la précision d'administration du traitement."},{"n":"SALICYLINE 50 % PO","l":null,"v":7,"p":"Voie orale. A dissoudre dans l’eau de boisson, l’aliment liquide ou le lait. Veaux, agneaux, chevreaux, équins, porcins et volailles : 30 à 50 mg d'acide acétylsalicylique par kg de poids vif par jour, en 1 ou 2 administrations, soit 0,6 g à 1 g du médicament vétérinaire pour 10 kg de poids vif en 1 à 2 fois par jour dans le lait, l'aliment liquide ou l'eau de boisson pendant 2 à 3 jours. Recommandation pour la dissolution :La solubilité maximale du médicament vétérinaire est de 1g/L, et ne permet pas son utilisation en pompes doseuses.La solubilisation totale du médicament vétérinaire à 1 g/L s’obtient après 30 minutes d’agitation.S'assurer de la bonne solubilisation du médicament vétérinaire avant administration aux animaux.Préparer la solution médicamenteuse par ajout du médicament vétérinaire dans le liquide, et non l'inverse.L’eau de boisson médicamenteuse doit être fraichement préparée toutes les 24 heures."},{"n":"SEBACIL 50 % SOLUTION","l":null,"v":40,"p":"Usage externe. Bovins, porcins, ovins, caprins, équins : 3 mg à 10 mg de phoxime par kg de poids vif en balnéation, pulvérisation ou friction à l'éponge, en une application unique après dilution du médicament vétérinaire selon les recommandations ci-dessous : \\n Ovins / CaprinsBovinsPorcinsEquins\\nGales\\nDose1 L dans 2000 L d'eau.Gales anciennes : 1L dans 1000 L d'eau. 1L dans 1000 L d'eau.Gales anciennes : 1L dans 500 L d'eau. 10 ml dans 10 L d'eau.Gales anciennes : 20 ml dans 10 L d'eau. 1 ml dans 1 L d'eau.Application à l'éponge\\nMélophages - Poux - Myiases - Tiques\\nDose1 L dans 2000 L d'eau1L dans 1000 L d'eau.10 mL dans 20 L d'eau1 mL dans 1 L d'eau.Application à l'éponge Recharge du bain : lorsque le volume du bain a diminué de 20%, recharger avec une solution de 250 mL de médicament vétérinaire pur dans 125 litres d'eau. Il est possible de recharger le bain les 3 premiers jours.Pour des raisons d'efficacité et d'hygiène, il est nécessaire de renouveler le bain complet le 5ème jour. La rémanence est de 2 à 8 semaines selon les espèces de parasites suivants : gales, mélophages, poux et myiases.L'activité sur les tiques est curative. Le médicament vétérinaire possède une efficacité acaricide sur les tiques dès 24 heures après l'application. Le traitement complet d'un cheval à l'éponge nécessite 2 à 3 litres de solution."},{"n":"SELEPHEROL EMULSION INJECTABLE","l":null,"v":4,"p":"Voie intramusculaire stricte. Prévention : 0,023 à 0,046 mg de sélénium et 3,82 à 7,64 mg de vitamine E par kg de poids vif par voie intramusculaire. Soit les doses suivantes en une administration unique : \\n- Veaux et poulains :1,5 mL/10 kg jusqu'à 100 kg de poids vif ;\\n 1 mL/10 kg au-dessus de 100 kg de poids vif.\\n- Agneaux et porcelets :0,2 mL/kg. On traitera les jeunes à la naissance ou dans d'autres circonstances. Traitement : Chez les veaux, les poulains, les agneaux et les porcelets, les doses sont identiques à celles indiquées ci-dessus, mais à répéter à 2 ou 3 semaines d'intervalle, si nécessaire.Bien agiter le flacon avant utilisation."},{"n":"SELEPHOS","l":null,"v":4,"p":"Voie intramusculaire et sous-cutanée. Prévention :0,06 mg de sélénium et 2,73 mg de vitamine E par kg de poids vif, soit les doses suivantes en une administration unique :- Veaux : 1 mL/10 kg- Agneaux-chevreaux : 1 mL/10 kg- Porcins : 1 mL/10 kgOn traitera préventivement les mères un mois avant la mise bas et les jeunes à la naissance ou dans d'autres circonstances. Traitement :Chez les veaux, les agneaux, les chevreaux et les porcelets, les doses sont identiques à celles indiquées ci-dessus, mais à administrer tous les 2 jours pendant 6 jours."},{"n":"SELVENIUM","l":null,"v":4,"p":"Voie intramusculaire et sous-cutanée.\\n\\nPrévention :\\n\\n0,09 mg de sélénium et 7,30 mg de vitamine E par kg de poids vif, par voie intramusculaire ou voie sous-cutanée.\\nSoit les doses suivantes en une administration unique :\\n- Veaux : 1 mL/10 kg\\n- Agneaux : 1 mL/ 10 kg\\n- Porcins : 1 mL/10 kg\\nOn traitera préventivement les mères un mois avant la mise bas et les jeunes à la naissance ou dans d'autres circonstances.\\n\\nTraitement :\\n\\nChez les veaux, les agneaux et les porcelets, les doses sont identiques à celles indiquées ci-dessus, à renouveler si nécessaire 8 à 10 jours plus tard."},{"n":"SEPONVER","l":90,"v":55,"p":"Voie orale.10 mg de closantel par kg de poids vif, en une administration Respecter la dose prescrite.Bien agiter la suspension avant utilisation pour une bonne homogénéité du produit.Utiliser un pistolet doseur propre et correctement étalonné. Chez les brebis dont le lait est destiné à la consommation humaine, la spécialité doit être administrée au moment du tarissement."},{"n":"SEPTOTRYL SOLUTION INJECTABLE","l":6,"v":12,"p":"Voies intraveineuse (i.v.), intramusculaire (i.m.) et sous-cutanée (s.c.). 13,4 mg de sulfaméthoxypyridiazine et 2,7 mg de triméthoprine par kg de poids vif par jour par voie intraveineuse lente ou intramusculaire, correspondant à 1 mL pour 15 kg de poids vif. Bovins : voies i.v. lente, i.m., s.c.- veaux de 60 kg : 4 mL- adultes : 30 mL. Ovins : voies i.v. lente, i.m., s.c.- agneaux : 0,1 mL pour 1,5 kg de poids vif- adultes : 4 mL. Porcins : voie i.m. :- porcelets : 0,1 mL pour 1,5 kg de poids vif- jusqu'à 30 kg : 2 mL- jusqu'à 90 kg : 6 mL. Afin de garantir une posologie appropriée, le poids corporel/vif doit être déterminé aussi précisément que possible."},{"n":"SODICOLY INJECTABLE","l":null,"v":21,"p":"Voie intramusculaire.\\n\\nVeaux, agneaux, porcs, volailles et lapins :\\n25 000 UI par kg de poids vif toutes les 12 heures, soit 1,25 ml de solution pour 10 kg de poids corporel matin et soir pendant 3 jours."},{"n":"SODIFEROL","l":null,"v":4,"p":"Voie intramusculaire et sous-cutanée.\\n\\nPrévention :\\n\\n0,022 mg de sélénium et 6 mg de vitamine E par kg de poids vif, par voie intramusculaire ou voie sous-cutanée.\\nSoit les doses suivantes trois fois de suite à 2 jours d'intervalle :\\n- Veaux : 1 ml/10 kg\\n- Agneaux et chevreaux : 1 ml/10 kg\\n- Poulains: 1 ml/10 kg.\\nOn traitera préventivement les mères un mois avant la mise bas et les jeunes à la naissance ou dans d'autres circonstances.\\n\\nTraitement :\\n\\n0,044 mg de sélénium et 12 mg de vitamine E par kg de poids vif, par voie intramusculaire ou voie sous-cutanée.\\nSoit les doses suivantes tous les jours pendant 3 à 4 jours :\\n- Veaux : 2 ml/10 kg\\n- Agneaux-chevreaux : 2 ml/10 kg\\n- Poulains: 2 ml/10 kg."},{"n":"SPASMIPUR SOLUTION INJECTABLE POUR CHEVAUX, BOVINS, OVINS ET PORCINS","l":1,"v":18,"p":"Voie intraveineuse ou intramusculaire. Chevaux, bovins et porcins :0,2 - 0,4 mg de butylbromure de scopolamine/kg de poids vif par injection intraveineuse (équivalant à 0,1 - 0,2 mL du médicament vétérinaire/10 kg de poids vif). Ovins :0,7 mg de butylbromure de scopolamine/kg de poids vif par injection intraveineuse (équivalant à 0,35 mL du médicament vétérinaire/10 kg de poids vif). Pour réduire les contractions des muscles lisses dans le tractus gastro-intestinal ou les voies urinaires (effet spasmolytique) :Si nécessaire, le traitement peut être répété une fois à 12 heures après l’administration initiale après avis du vétérinaire.Uniquement dans les cas où une injection intraveineuse n’est pas possible, le médicament vétérinaire peut être administré par voie intramusculaire à la dose la plus élevée spécifiée pour l’espèce cible concernée. Pour les procédures cliniques (voir indications d’utilisation) :Administrer immédiatement avant le moment où l’inactivité dans le tractus gastro-intestinal ou le système urinaire est nécessaire.Pour les procédures cliniques, utiliser exclusivement l’administration par voie intraveineuse. Une injection lente est recommandée, pour la voie intraveineuse comme intramusculaire. Afin de garantir l’administration d’une dose correcte, le poids vif de l'animal devra être déterminé aussi précisément que possible et utiliser du matériel de mesure ou des seringues gradués de façon appropriée. Le bouchon en caoutchouc peut être ponctionné jusqu’à 25 fois maximum."},{"n":"SPECTAM SOLUTION INJECTABLE","l":3,"v":30,"p":"Voie intramusculaire (bovins, ovins, caprins, équins, porcins).\\nVoie intramusculaire, sous-cutanée ou sinusale (volailles).\\n\\nChez les bovins :\\n20 mg de spectinomycine par kg de poids vif toutes les 24 heures, soit 2 mL de solution pour 10 kg une fois par jour pendant 3 jours pour les infections respiratoires à pasteurelles et mycoplasmes.\\n\\n20 mg de spectinomycine par kg de poids vif toutes les 12 heures, soit 2 mL de solution pour 10 kg matin et soir pendant 3 jours pour les autres infections à germes sensibles.\\n\\nChez les ovins, les caprins, les équins et les porcins :\\n20 mg de spectinomycine par kg de poids vif toutes les 12 heures, soit 2 mL de solution pour 10 kg matin et soir pendant 3 jours.\\n\\nChez les volailles :\\n20 mg de spectinomycine par kg de poids vif toutes les 12 heures, soit 2 mL de solution pour 10 kg matin et soir pendant 3 jours."},{"n":"SPOTINOR 10 MG/ML SOLUTION POUR SPOT-ON POUR BOVINS ET OVINS","l":0,"v":35,"p":"Pour un usage externe uniquement.Application en spot-on. Posologie :Bovins : 100 mg de deltaméthrine par animal, soit 10 mL de médicament vétérinaire.Ovins : 50 mg de deltaméthrine par animal, soit 5 mL de médicament vétérinaire.Agneaux (en dessous de 10 kg de poids vif ou d'un mois d'âge) : 25 mg de deltaméthrine par animal, soit 2,5 mL de médicament vétérinaire. Administration : appliquer une seule dose de médicament vétérinaire à l'aide du dispositif d'application « Presser et verser » spécialement conçu ou l'applicateur Spot-On en un seul point sur la ligne médiane du dos au niveau des épaules. En cas de myiase à calliphoridés chez les ovins, voir la procédure particulière décrite ci-dessous. Poux chez les bovins : une application suffit généralement pour éradiquer tous les poux. Leur éradication complète peut prendre quatre à cinq semaines, période pendant laquelle les lentes éclosent et les poux sont tués. Quelques poux peuvent survivre sur une petite minorité d'animaux. Mouches chez les bovins : traitement et prévention des infestations par les mouches piqueuses et non piqueuses. Dans les régions à forte prédominance de mouches des cornes, le traitement et la prévention des infestations pourront prendre quatre à huit semaines. Le traitement contre les mouches ne devra pas être répété avant quatre semaines. Tiques chez les ovins : l'application du médicament vétérinaire entre les épaules constitue un moyen efficace de traitement et de prévention des infestations par les tiques chez les animaux de tout âge. Le médicament vétérinaire sera efficace jusqu'à six semaines après son application. Mélophages et poux chez les ovins : l'application du médicament vétérinaire entre les épaules chez les ovins à toison courte ou longue réduira l'incidence des infestations par les poux broyeurs ou mélophages sur une période de quatre à six semaines.Il est conseillé de :- appliquer le médicament vétérinaire juste après la tonte (sur toison courte) ;- garder les moutons traités à l'écart des moutons non traités pour éviter toute ré-infestation. Remarque : pour le traitement et la prévention des infestations par les tiques, les mélophages et les poux chez les ovins, il conviendra de dégager la zone de peau à traiter en séparant les poils de la toison pour y appliquer la solution. Cas établis de myiase à calliphoridés chez les ovins : appliquer le médicament vétérinaire directement sur la zone infectée par les asticots dès que la myiase est constatée. Une application suffit pour tuer rapidement les larves de calliphoridés. En cas de lésions plus prononcées, il est conseillé de tondre la laine tachée préalablement au traitement. Poux et tiques chez les agneaux : l'application du médicament vétérinaire entre les épaules constitue un moyen efficace de traitement et de prévention des infestations par les tiques jusqu'à six semaines et réduit l'incidence de poux broyeurs pendant quatre à six semaines."},{"n":"SULFACYCLINE","l":6,"v":12,"p":"Voie intraveineuse lente ou intramusculaire (sauf cheval). 12,5 mg de sulfadiméthoxine et 2,7 mg de triméthoprine par kg de poids vif par jour pendant 3 jours, correspondant à 1 mL de médicament vétérinaire pour 15 kg de poids vif par jour, pendant 3 jours."},{"n":"SULFADIMERAZINE QALIAN","l":5,"v":12,"p":"Voies intraveineuse, intramusculaire ou intrapéritonéale.\\n\\nChez les bovins, les ovins, les caprins et les porcins :\\n90 mg de sulfadimidine par kg de poids vif et par jour pendant 3 jours consécutifs, par voie intraveineuse, intramusculaire ou intrapéritonéale, soit 3 mL pour 10 kg de poids vif et par jour pendant 3 jours consécutifs.\\n\\nVoie orale.\\n\\nChez les bovins, les ovins, les caprins et les porcins :\\n90 mg de sulfadimidine par kg de poids vif et par jour pendant 3 jours consécutifs, par voie orale, soit 3 mL de solution pour 10 kg de poids vif et par jour pendant 3 jours consécutifs, à diluer dans l'eau de boisson ou en drogage.\\n\\nChez les volailles et les lapins :\\n150 mg à 180 mg de sulfadimidine par kg de poids vif et par jour pendant 3 jours consécutifs, par voie orale, soit 5 mL à 6 mL de solution pour 10 kg de poids vif et par jour pendant 3 jours consécutifs, à diluer dans l'eau de boisson en fonction de la consommation réelle des animaux pour respecter la posologie pondérale (en mg/kg)."},{"n":"SULFADIMETHOXINE 100-CR LAPIN-VOLAILLE-PORC ET AGNEAU-CHEVREAU SEVRES","l":null,"v":12,"p":"Voie orale dans l'aliment.\\n\\nPosologie :\\n\\nLapins, volailles et porcs :\\n50 mg de sulfadiméthoxine par kg de poids vif par jour pendant 10 jours.\\n\\nAgneaux sevrés, chevreaux sevrés :\\n40 mg de sulfadiméthoxine par de poids vif par jour pendant 10 jours.\\n\\nTaux et procédé d'incorporation :\\n\\nLapins et volailles :\\nPour une consommation de 1 kg d'aliment pour 10 kg de poids vif, préparer un aliment complet contenant 500 ppm de sulfadiméthoxine, soit 0,5 % de prémélange (soit 5 kg par tonne d'aliment).\\n\\nPorcs :\\nPour une consommation de 1 kg d'aliment pour 20 kg de poids vif, préparer un aliment complet contenant 1000 ppm de sulfadiméthoxine, soit 1 % de prémélange (soit 10 kg par tonne d'aliment).\\n\\nAgneaux sevrés et chevreaux sevrés :\\nPour une consommation de 1 kg d'aliment pour 25 kg de poids vif, préparer un aliment complet contenant 1000 ppm de sulfadiméthoxine, soit 1 % de prémélange (soit 10 kg par tonne d'aliment)."},{"n":"SULFADIMETHOXINE-TRIMETHOPRIME 62,5-12,5 PORC ET VEAU-AGNEAU-CHEVREAU SEVRES","l":null,"v":14,"p":"Chez les porcins :\\n37,5 mg de sulfadiméthoxine et 7,5 mg de triméthoprime par kg de poids vif et par jour, pendant 5 jours par voie orale dans l'aliment.\\nPour un ingéré alimentaire quotidien de 50 g d'aliment par kg de poids vif, cette posologie correspond à 900 ppm de l'association (750 ppm de sulfadiméthoxine + 150 ppm de triméthoprime) dans l'aliment, soit un taux d'incorporation de 12 kg de prémélange par tonne d'aliment.\\n\\nChez les veaux, les agneaux et les chevreaux sevrés :\\n37,5 mg de sulfadiméthoxine et 7,5 mg de triméthoprime par kg de poids vif et par jour, pendant 5 jours par voie orale dans l'aliment.\\nPour un ingéré alimentaire quotidien de 40 g d'aliment par kg de poids vif, cette posologie correspond à 1125 ppm de l'association (937,5 ppm + 187,5 ppm) dans l'aliment, soit un taux d'incorporation de 15 kg de prémélange par tonne d'aliment.\\n\\nPour respecter la posologie pondérale et tenir compte des ingérés alimentaires effectifs, le taux d'incorporation peut être augmenté ce qui conduit à une teneur (en ppm) plus importante dans l'aliment."},{"n":"SUPAVERM","l":null,"v":65,"p":"Voie orale.15 mg de mébendazole et 10 mg de closantel par kg de poids vif soit 2 mL de suspension pour 10 kg de poids vif en une administration unique. L’utilisation d’un équipement permettant d’administrer le médicament vétérinaire à un dosage précis est recommandée.Bien agiter avant l'emploi.Afin de garantir une posologie appropriée, le poids corporel doit être déterminé aussi précisément que possible.Un sous-dosage peut entraîner une inefficacité et favoriser le développement de résistance."},{"n":"SYNANTHIC SUSPENSION BUVABLE","l":14,"v":28,"p":"Voie orale. Chez les bovins :4,5 mg d'oxfendazole par kg de poids vif, soit 20 mL de médicament vétérinaire pour 100 kg de poids vif en une administration unique. Chez les ovins :5 mg d'oxfendazole par kg de poids vif, soit 2,2 mL de médicament vétérinaire pour 10 kg de poids vif en une administration unique. Chez les caprins :10 mg d'oxfendazole par kg de poids vif, soit 4,4 mL de médicament vétérinaire pour 10 kg de poids vif en une administration unique. Bien agiter la suspension avant utilisation pour une bonne homogénéité du médicament vétérinaire.Utiliser un pistolet doseur propre et correctement étalonné."},{"n":"SYNCRO-PART 30 MG","l":0,"v":5,"p":"Voie vaginale.Ovins : une éponge laissée en place pendant 14 jours. Mise en place :L’éponge est placée au fond du vagin à l’aide d’un applicateur prévu à cet effet.Introduire l’éponge par l’extrémité biseautée de l’applicateur, ficelle en premier.Nettoyer la vulve, écarter les lèvres et introduire doucement l’applicateur jusqu’au fond du vagin.Libérer l’éponge en faisant coulisser l’applicateur sur le piston qui est maintenu immobile.L’applicateur doit être soigneusement nettoyé et désinfecté entre chaque application avec une solution désinfectante non irritante (ammonium quaternaire).L’éponge reste en place 14 jours. Retrait :L’éponge est retirée en tirant doucement sur la ficelle.Pour obtenir une synchronisation optimale de l’ovulation, une injection de PMSG (de 300 à 600 UI en fonction de la race et de l’état physiologique des femelles et de la saison de traitement) est administrée par voie intramusculaire au moment du retrait de l’éponge. Fécondation :La fécondation peut être réalisée par saillie naturelle en présence d’un bélier, ou « en main » c’est à dire à moment déterminé (48 heures et 60 heures après le retrait). Une insémination artificielle peut être réalisée 55 heures après le retrait de l’éponge chez la brebis ou 51 heures après le retrait de l’éponge chez l’agnelle."},{"n":"SYNCRO-PART PMSG 400 UI BOVINS-OVINS-CAPRINS","l":0,"v":0,"p":"Injecter par voie intramusculaire le contenu du flacon de lyophilisat (400 UI), après remise en solution dans 2 ml de solvant. La solution reconstituée doit être utilisée immédiatement.\\n\\nL'injection doit être réalisée à la fin du traitement progestatif selon le protocole spécifique à chaque espèce."},{"n":"SYNCRO-PART PMSG 500 UI BOVINS-OVINS-CAPRINS","l":0,"v":0,"p":"Injecter par voie intramusculaire le contenu du flacon de lyophilisat (500 UI), après remise en solution dans 2 mL de solvant. La solution reconstituée doit être utilisée immédiatement.\\n\\nL'injection doit être réalisée à la fin du traitement progestatif selon le protocole spécifique à chaque espèce."},{"n":"SYNCRO-PART PMSG 600 UI BOVINS-OVINS-CAPRINS","l":0,"v":0,"p":"Voie intramusculaire. Injecter par voie intramusculaire le contenu du flacon de lyophilisat (600 UI), après remise en solution dans 2 mL de solvant. La solution reconstituée doit être utilisée immédiatement. L'injection doit être réalisée à la fin du traitement progestatif selon le protocole spécifique à chaque espèce."},{"n":"SYNCRO-PART PMSG 6000 UI BOVINS-OVINS-CAPRINS","l":0,"v":0,"p":"Voie intramusculaire. Après remise en solution du lyophilisat, injecter par voie intramusculaire, par animal, 2 mL de solution reconstituée sur les bases suivantes : \\nDose de PMSG choisie en UI300400428461500545600700\\nVolume de solvant4030282624222016\\nNombre de femelles pouvant être traitées201514131211108 Vaches et génisses :300 à 600 UI par voie intramusculaire, à la fin d'un traitement progestagène ; les animaux non cyclés doivent recevoir les doses les plus élevées. Brebis :400 - 700 UI par voie IM à la fin du traitement progestagène.Les doses administrées doivent être adaptées à la race (doses plus faibles chez les races prolifiques que chez les races non prolifiques) et à la saison (doses plus élevées chez les brebis non cyclées que chez les brebis cyclées). Chèvres :400 - 600 UI par voie intramusculaire, à la fin du traitement progestagène (protocole long : 18 à 21 jours de pose) ou 48 h +/-1 h avant la fin du traitement progestagène (protocole court : 11 jours).Les doses administrées doivent être adaptées à la saison (doses plus élevées chez les chèvres non cyclées que chez les chèvres cyclées) et à la production laitière."},{"n":"TAF SPRAY 28,5 MG/G SOLUTION POUR PULVERISATION CUTANEE","l":0,"v":14,"p":"Voie cutanée. Bien agiter le flacon avant de pulvériser.\\nPulvériser la solution sur la zone affectée pendant 3 secondes (pour administrer une dose équivalant à environ 45 mg de thiamphénicol), une fois par jour. Le traitement peut être répété, en fonction du processus de cicatrisation, jusqu'à 3 jours consécutifs.\\nTenir le flacon à une distance d'environ 15-20 cm de la zone à pulvériser. Pour une utilisation optimale, les plaies doivent être nettoyées avant l'application.\\nLe flacon de pulvérisation doit être utilisé en position verticale (droite ou renversée)."},{"n":"TENALINE L.A.","l":21,"v":21,"p":"Bovins, ovins et porcins (adultes) : voie intramusculaire.Porcelets : voie sous-cutanée Agiter avant utilisation. 20 mg d’oxytétracycline par kg de poids vif en une injection unique, soit 1 mL de solution injectable pour 10 kg de poids vif. Si des signes cliniques de maladie persistent 72 heures après la première administration, une deuxième administration de 20 mg d’oxytétracycline par kg peut être effectuée.Le flacon ne doit pas être ponctionné plus de 20 fois. Si plus de ponctions sont nécessaires, l’utilisation d’une seringue multidose est recommandée."},{"n":"TERRALON L.A. 200 MG/ML SOLUTION INJECTABLE","l":5,"v":28,"p":"Voie intramusculaire. 20 mg d'oxytétracycline par kg de poids vif en une injection unique, soit 1 mL de solution injectable pour 10 kg de poids vif. Si des signes cliniques de maladie persistent 72 heures après la première administration, une deuxième administration de 20 mg d'oxytétracycline par kg peut être effectuée.Chez les bovins, ne pas administrer plus de 10 mL du médicament vétérinaire par site d’injection.Chez les ovins, ne pas administrer plus de 3 mL du médicament vétérinaire par site d’injection."},{"n":"TERRAMYCINE LONGUE ACTION 200 MG/ML SOLUTION INJECTABLE POUR BOVINS  OVINS ET PORCINS","l":7,"v":37,"p":"Voie intramusculaire.20 mg d'oxytétracycline par kg de poids vif en une injection unique par voie intramusculaire soit 1 mL de solution injectable pour 10 kg de poids vif. Le volume injecté ne doit pas dépasser 10 mL par site d’injection chez les bovins et 5 mL par site d’injection chez les ovins et les porcins."},{"n":"TETRASOLUB","l":null,"v":7,"p":"Voie orale. Veaux, agneaux, chevreaux, porcins :20 mg d'oxytétracycline / kg de poids vif par jour, pendant 3 à 5 jours dans la buvée, soit 400 mg de poudre pour 10 kg de poids vif, en 2 fois par jour, dans le lait, l'aliment liquide ou l'eau de boisson. Volailles, lapins :20 mg d'oxytétracycline / kg de poids vif par jour, pendant 3 à 5 jours dans l'eau de boisson, soit environ 400 mg de poudre par litre d'eau de boisson."},{"n":"TETRAVETO","l":null,"v":0,"p":"Veaux, agneaux, chevreaux et porcs :20 mg d’oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans la buvée, soit 400 mg de poudre orale pour 10 kg de poids vif par jour en 2 prises dans le lait, l’aliment liquide ou l’eau de boisson. Volailles, lapins :20 mg d’oxytétracycline par kg de poids vif par jour pendant 3 à 5 jours dans l’eau de boisson, soit environ 400 mg de poudre orale par litre d’eau de boisson. La quantité d’eau de boisson médicamenteuse consommée par les animaux dépend de leur état physiologique et clinique. Afin d'obtenir la posologie recommandée, la concentration en oxytétracycline doit être ajustée en conséquence."},{"n":"TETROXY VET 200 MG/ML SOLUTION INJECTABLE POUR BOVINS OVINS ET PORCINS","l":10,"v":31,"p":"Voie intramusculaire profonde.La posologie recommandée est de 20 mg d'oxytétracycline par kg de poids vif (soit 1 mL de médicament vétérinaire par 10 kg de poids vif). Il est recommandé d’utiliser le médicament vétérinaire en administration unique seulement.Le bouchon peut être perforé sans risque jusqu’à 35 fois. Pour traiter des groupes d’animaux, maintenir en place une aiguille dédiée au prélèvement dans le bouchon. Volume maximum à administrer par site d’injection : Bovins : 20 mLPorcins : 10 mLOvins : 5 mL Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible."},{"n":"THERACALCIUM SOLUTION INJECTABLE","l":0,"v":0,"p":"Voies d'administration : intraveineuse lente, intramusculaire ou sous cutanée. Afin de garantir une posologie appropriée, le poids corporel/vif doit être déterminé aussi précisément que possible. Chez les bovins et les équins adultes :4 à 8 mg de calcium par kg de poids vif par administration, soit 0,1 mL à 0,2 ml par kg de poids vif.Soit un volume à administrer de 100 mL pour un bovin et de 50 à 100 ml pour un cheval. Chez les porcins :2 à 4 mg de calcium par kg de poids vif par administration, soit 0,05 mL à 0,1 mL par kg de poids vifSoit un volume à administrer de 10 à 15 mL par animal.Chez les ovins, porcelets, veaux et poulains :10 à 20 mg par kg de poids vif par administration, soit 0,25 ml à 0,5 mL par kg de poids vifPour les porcelets, l'administration ne doit se faire que par la voie sous-cutanée.Soit un volume à administrer de 20 à 30 mL pour un mouton, veau ou poulain et de 1 à 2 mL pour un porcelet. Chez les chats et les chiens :10 à 20 mg par kg de poids corporel par administration, soit 0,25 mL à 0,5 mL par kg de poids corporel.Soit un volume à administrer de 1 à 2 mL pour un chat et de 2 à 10 mL pour un chien. Chez les lapins :20 à 40 mg par kg de poids vif par administration, soit 0,5 à 1 mL par kg de poids vif.Soit un volume à administrer de 1 à 2 mL par animal. L'administration peut être renouvelée, si nécessaire, toutes les 12 heures pendant un à deux jours."},{"n":"TILMOVET 300 MG/ML SOLUTION INJECTABLE POUR BOVINS ET OVINS","l":36,"v":70,"p":"Pour injection sous-cutanée uniquement.Utiliser un traitement unique de 10 mg de tilmicosine par kg de poids vif (correspondant à 1 mL de médicament vétérinaire pour 30 kg de poids vif). Bovins :Mode d'administration :Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible afin d’éviter un sous-dosage. Prélever la dose requise du flacon et retirer la seringue de l’aiguille, en laissant l'aiguille dans le flacon. Lorsqu’il faut traiter un groupe d’animaux, laisser l’aiguille dans le flacon pour prélever les doses suivantes. Immobiliser l’animal et insérer une aiguille distincte par voie sous-cutanée au niveau du site d’injection, de préférence dans un pli de peau au niveau de la cage thoracique, derrière l’épaule. Fixer la seringue à l’aiguille et injecter à la base du pli de peau. Ne pas injecter plus de 20 mL par site d’injection. Ovins :Mode d'administration :Il est important de peser précisément les agneaux afin d’éviter un surdosage. L’utilisation d’une seringue de 2 mL ou de plus petite taille améliore la précision du dosage. Prélever la dose requise du flacon et retirer la seringue de l’aiguille, en laissant l'aiguille dans le flacon. Immobiliser l’animal en se penchant sur lui et insérer une aiguille distincte par voie sous-cutanée au niveau du site d’injection, de préférence dans un pli de peau au niveau de la cage thoracique, derrière l’épaule. Fixer la seringue à l’aiguille et injecter à la base du pli de peau. Ne pas injecter plus de 2 mL par site d’injection. Si aucune amélioration n'est notée dans un délai de 48 heures, il faut alors confirmer le diagnostic. Éviter toute contamination du flacon au cours de l’utilisation. Le flacon doit être inspecté visuellement pour détecter la présence de toute particule étrangère et/ou altération de l'aspect physique. Dans le cas où l’un ou l’autre a été détecté, jeter le flacon. Le bouchon ne doit pas être ponctionné plus de 15 fois. Afin d'éviter un percement excessif du bouchon, utiliser un équipement adapté pour le dosage multiple."},{"n":"TOLRACOL 50 MG/ML SUSPENSION BUVABLE POUR PORCINS, BOVINS ET OVINS","l":null,"v":77,"p":"Voie orale.La suspension buvable doit être agitée avant utilisation.Afin d'assurer l'administration de la dose correcte, le poids vif doit être déterminé aussi précisément que possible.Pour obtenir un résultat optimal, les animaux doivent être traités avant l'apparition des signes cliniques, c'est à dire pendant la période prépatente. Porcs :Traitement individuel des animaux.Traiter chaque porcelet âgé de 3 à 5 jours d'âge avec une dose orale unique de 20 mg de toltrazuril par kg de poids vif, soit 0,4 mL de suspension buvable par kg de poids vif.Compte tenu des faibles volumes nécessaires pour traiter individuellement les porcelets, il est recommandé d'utiliser un système d'administration avec une exactitude de dosage de 0,1 mL. Bovins :Traiter chaque animal avec une dose orale unique de 15 mg de toltrazuril par kg de poids vif, soit 3 mL de suspension buvable pour 10 kg de poids vif.Lorsque les animaux sont traités collectivement plutôt qu'individuellement, ils doivent être groupés selon leur poids et la posologie adaptée en conséquence afin d'éviter les sous- et sur- dosages. Ovins :Traiter chaque animal avec une dose orale unique de 20 mg de toltrazuril par kg de poids vif, soit 0,4 mL de suspension buvable par kg de poids vif.Lorsque les animaux sont traités collectivement plutôt qu'individuellement, ils doivent être groupés selon leur poids et la posologie adaptée en conséquence afin d'éviter les sous- et sur- dosages."},{"n":"TOLTRANIL 50 MG/ML SUSPENSION BUVABLE POUR PORCINS, BOVINS ET OVINS","l":null,"v":77,"p":"Voie orale.Le médicament vétérinaire doit être agitée avant utilisation.Afin d'assurer l'administration de la dose correcte, le poids vif doit être déterminé aussi précisément que possible.Pour obtenir un résultat optimal, les animaux doivent être traités avant l'apparition des signes cliniques, c'est à dire pendant la période prépatente. Le traitement individuel de l'animal lors d’un épisode clinique sera d'un intérêt limité compte tenu des lésions déjà présentes dans l'intestin grêle. Porcs :Traitement individuel des animaux.Traiter chaque porcelet de 3 à 5 jours d'âge avec une dose orale unique de 20 mg de toltrazuril par kg de poids vif, soit 0,4 mL de suspension buvable par kg de poids vif.Compte tenu des faibles volumes nécessaires pour traiter individuellement les porcelets, il est recommandé d'utiliser un système d'administration avec une exactitude de dosage de 0,1 mL. Bovins :Traiter chaque animal avec une dose orale unique de 15 mg de toltrazuril par kg de poids vif, soit 3 mL de suspension buvable pour 10 kg de poids vif.Lorsque les animaux sont traités collectivement plutôt qu'individuellement, ils doivent être groupés selon leur poids et la posologie adaptée en conséquence afin d'éviter les sous- et sur- dosages. Ovins :Traiter chaque animal avec une dose orale unique de 20 mg de toltrazuril par kg de poids vif, soit 0,4 mL de suspension buvable par kg de poids vif.Lorsque les animaux sont traités collectivement plutôt qu'individuellement, ils doivent être groupés selon leur poids et la posologie adaptée en conséquence afin d'éviter les sous- et sur- dosages."},{"n":"TONIPHOS","l":0,"v":0,"p":"Voie sous-cutanée, intramusculaire ou intraveineuse.\\n\\nEquins, bovins, ovins, caprins, porcins (animaux de plus de 25 kg) :\\n10 mg de toldimfos par kg de poids vif, soit 1 mL de solution pour 10 kg de poids vif.\\n\\nChiens, chats (animaux de moins de 25 kg) :\\n20 mg de toldimfos par kg de poids corporel, soit 2 mL pour 10 kg de poids corporel.\\n\\nLes injections peuvent être renouvelées à 3 jours d'intervalle : 3 à 5 injections suffisent en général pour faire disparaître les symptômes."},{"n":"TRIBEX 5 % SUSPENSION BUVABLE POUR OVINS","l":null,"v":56,"p":"Administrer uniquement par voie orale.\\nAfin d'administrer la dose adéquate, estimer aussi précisément que possible le poids de l'animal et vérifier le calibrage du dispositif d'administration.\\n\\nSi les animaux doivent être traités collectivement plutôt qu'individuellement, ils devront être regroupés suivant leur poids corporel et traités à la posologie correspondante, afin d'éviter un sous dosage ou un surdosage.\\n10 mg de triclabendazole par kg de poids vif, par voie orale, soit 2 mL pour 10 kg de poids vif, en une seule administration, selon le tableau suivant : \\nPoids vifDosePoids vifDose\\nJusqu'à 10 kg2 mL40 kg8 mL\\n15 kg3 mL50 kg10 mL\\n20 kg4 mL60 kg12 mL\\n25 kg5 mL70 kg14 mL\\n30 kg6 mL80 kg16 mL\\nPour les animaux de plus de 80 kg, ajouter 2 mL par tranche de 10 kg de poids vif supplémentaires.\\n\\nPROGRAMME DE TRAITEMENT :\\nLa date du traitement doit prendre en compte les facteurs épidémiologiques et être adaptée à chaque élevage. Le programme de traitement est établi par le vétérinaire traitant."},{"n":"TRISULMIX POUDRE POUR SOLUTION BUVABLE","l":null,"v":12,"p":"Pour administration orale dans l’eau de boisson, l’aliment liquide ou le lait de remplacement. Afin de garantir une posologie appropriée, le poids vif et la consommation quotidienne d'eau de boisson ou la prise alimentaire réelle doit être déterminé aussi précisément que possible. La posologie est de 18,68 à 37,36 mg de sulfadiméthoxine et 4 à 8 mg de triméthoprime par kg de poids vif et par jour (soit 1 à 2 g de médicament vétérinaire pour 10 kg de poids vif et par jour) pendant 3 à 5 jours, à dissoudre dans l’eau de boisson, l’aliment liquide ou le lait de remplacement. La solubilité maximale du médicament vétérinaire est de 2,7 g/L dans l’eau douce et l’eau dure à une température voisine de 20°C. La dissolution peut prendre jusqu'à 15 minutes. La dissolution complète doit être vérifiée visuellement avant de débuter l’administration.Compte tenu des excipients du médicament, une légère opalescence de la solution peut être observée. Il n’est pas conseillé de prédiluer le médicament vétérinaire ou d’utiliser une pompe doseuse pour l’administration. On utilisera de préférence un bac. L'eau de boisson médicamentée sera renouvelée ou remplacée toutes les 24 heures. Administration dans le lait de remplacement :Dissoudre d'abord le médicament vétérinaire dans l'eau. Après dispersion du lait en poudre, ajouter la solution médicamenteuse sous agitation vigoureuse à environ 40 ºC.Le lait de remplacement médicamenteux doit être consommé immédiatement après préparation. Administration dans l’aliment liquide :Préparer une solution préliminaire avec la quantité requise de médicament vétérinaire. Prendre une quantité d’eau suffisante afin que cette première solution n’excède pas la concentration maximale de 2,7 g de médicament vétérinaire par litre d’eau. À ce stade, la solution préliminaire doit être mélangée avec l’aliment liquide. L'aliment liquide doit être continuellement agité pendant la préparation et la distribution aux animaux. L’aliment liquide doit être consommé immédiatement après la préparation."},{"n":"TRISULMIX SOLUTION INJECTABLE","l":6,"v":12,"p":"Voie intramusculaire, intraveineuse lente ou sous-cutanée.Bovins, ovins, caprins, porcins :18,6 mg de sulfadiméthoxine et 4 mg de triméthoprime par kg de poids vif et par jour pendant 3 jours consécutifs, soit 1 mL de médicament vétérinaire pour 10 kg de poids vif et par jour pendant 3 jours consécutifs."},{"n":"TRIVITASE","l":5,"v":324,"p":"Ce médicament vétérinaire ne doit pas être administré par voie sous-cutanée chez les espèces productrices de denrées alimentaires. Chez les espèces productrices de denrées alimentaires, ce médicament vétérinaire ne doit être administré qu’une seule fois et la dose recommandée ne doit pas être dépassée. Voie intramusculaire stricte. 10 000 à 20 000 UI de vitamine A, 500 à 2 000 UI de vitamine D3 et 1 à 50 mg de vitamine E, par kg de poids vif, par voie intramusculaire en une administration unique, soit à titre indicatif et par animal : Bovins adultes : 5 à 15 mL de solutionVeaux, porcins : 2 mL à 4 mLOvins, caprins adultes : 1 à 2 mL de solutionPorcelets, agneaux, chevreaux : 0,5 mL de solution"},{"n":"TROXXAN 100 MG/ML SOLUTION INJECTABLE POUR BOVINS, PORCINS ET OVINS","l":null,"v":16,"p":"BovinsVoie sous-cutanée.Une injection unique par voie sous-cutanée de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 7,5 mL au même site d’administration. PorcinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Pour le traitement des porcins de plus de 80 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 2 mL au même site d’administration. Pour les maladies respiratoires, il est recommandé de traiter les animaux aux stades précoces de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques respiratoires persistent ou s’aggravent, ou en cas de rechute, le traitement doit être changé en utilisant un autre antibiotique, et poursuivi jusqu'à ce que les signes cliniques disparaissent. OvinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Afin de garantir une posologie appropriée, le poids de l’animal doit être déterminé aussi précisément que possible. Pour les flacons multidoses, il est recommandé d’utiliser une aiguille de prélèvement ou une seringue automatique afin de limiter le nombre de percements du bouchon. Le bouchon peut être percé en toute sécurité jusqu'à 25 fois pour les flacons de 100 mL et 50 fois pour les flacons de 250 mL."},{"n":"TRYMOX LA 150 MG/ML SUSPENSION INJECTABLE POUR BOVINS OVINS PORCINS CHIENS ET CHATS","l":5,"v":42,"p":"Bovins, ovins, porcins : voie intramusculaire. Chiens et chats : voie sous-cutanée ou intramusculaire. Agitez vigoureusement le flacon afin d’obtenir une remise en suspension complète avant utilisation.Ce médicament vétérinaire ne contient pas de conservateur antimicrobien.Essuyez la membrane en caoutchouc du bouchon avant de prélever chaque dosePour garantir un dosage correct, il convient de déterminer le plus précisément possible le poids de l’animal. La posologie recommandée est de 15 mg par kg de poids, ce qui équivaut à 1 ml pour 10 kg, à renouveler une fois au bout de 48 heures. \\nAnimauxPoids (kg)Volume de dose (mL)\\nBovins450 kg45,0 mL\\nOvins65 kg6,5 mL\\nPorcins150 kg15,0 mL\\nChiens20 kg2,0 mL\\nChats5 kg0,5 mL Le volume de la dose équivaut à 1 mL pour 10 kg de poids. Si le volume de la dose est supérieur à 15 mL chez les bovins et 4 mL chez les ovins et les porcs, il devra être divisé et injecté dans deux sites au minimum. Le bouchon ne doit pas être percé plus de 40 fois."},{"n":"TULAJECT 100 MG/ML SOLUTION INJECTABLE POUR BOVINS PORCINS ET OVINS","l":null,"v":22,"p":"BovinsVoie sous-cutanée.Une injection unique par voie sous-cutanée de 2,5 mg de tulathromycine / kg de poids vif (équivalant à 1 mL/40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 7,5 mL au même site d’administration. PorcinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine / kg de poids vif (équivalent à 1 mL/40 kg de poids vif) dans le cou. Pour le traitement de porcins pesant plus de 80 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 2 mL au même site d’administration. Pour toutes les pathologies respiratoires, il est recommandé de traiter les animaux aux stades précoces de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques de pathologie respiratoire persistent ou augmentent, ou en cas de rechute, le traitement doit être changé en utilisant un autre antibiotique et poursuivi jusqu’à ce que les signes cliniques disparaissent. Ovins Voie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine / kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Afin de garantir une posologie appropriée, le poids vif doit être déterminé aussi précisément que possible. Pour le prélèvement de plusieurs flacons, il est recommandé d’utiliser une aiguille d’aspiration ou une seringue multidose pour éviter un perçage excessif du bouchon.Le bouchon peut être perforé jusqu’à 20 fois en toute sécurité."},{"n":"TULAPRO 100 MG/ML SOLUTION INJECTABLE POUR BOVINS PORCINS ET OVINS","l":null,"v":16,"p":"BovinsVoie sous-cutanée.Une injection unique par voie sous-cutanée de 2,5 mg de tulathromycine par kg de poids vif (équivalant à 1 mL par 40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 7,5 mL au même site d’injection. PorcinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine par kg de poids vif (équivalant à 1mL par 40 kg de poids vif) dans le cou. Pour le traitement de porcins pesant plus de 80 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 2 mL au même site d’injection. Pour les pathologies respiratoires, il est recommandé de traiter les animaux aux premiers stades de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques de pathologie respiratoire persistent ou augmentent, ou en cas de rechute le traitement doit être changé en utilisant un autre antibiotique et poursuivi jusqu’à ce que les signes cliniques disparaissent. OvinsVoie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine par kg de poids vif (équivalant à 1 mL par 40 kg de poids vif) dans le cou. Afin de garantir une posologie appropriée, le poids de l’animal doit être déterminé aussi précisément que possible.Pour les flacons multi-doses, il est recommandé d’utiliser une aiguille à prélèvement ou une seringue automatique afin de limiter le nombre de ponctions du bouchon. Le bouchon peut être perforé en toute sécurité jusqu’à 20 fois."},{"n":"TULAXA 100 MG/ML SOLUTION INJECTABLE POUR BOVINS PORCINS ET OVINS","l":null,"v":22,"p":"Bovins Voie sous-cutanée.Une injection unique par voie sous-cutanée de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg, diviser la dose de manière à ne pas injecter plus de 7,5 mL par site d’administration. Porcins Voie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Pour le traitement de porcins pesant plus de 80 kg, diviser la dose de manière à ne pas injecter plus de 2 mL par site d’administration. Pour les maladies respiratoires, il est recommandé de traiter les animaux en dans les premiers stades de la maladie et d’évaluer la réponse au traitement dans les 48 heures suivant l’injection. Si les signes cliniques de la pathologie respiratoire persistent ou s’aggravent, ou en cas de rechute le traitement doit être changé en utilisant un autre antibiotique et poursuivi jusqu’à ce que les signes cliniques disparaissent. Ovins Voie intramusculaire.Une injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL/40 kg de poids vif) dans le cou. Pour assurer un dosage correct, le poids de l’animal doit être déterminé aussi précisément que possible. Le capuchon peut être perforé jusqu’à 20 fois en toute sécurité. Lorsqu’un groupe d’animaux est traité en une fois, utiliser une aiguille de prélèvement placée sur le bouchon du flacon afin d'éviter de trop percer le bouchon. L’aiguille de prélèvement doit être retirée après le traitement."},{"n":"TULIEVE 100 MG/ML SOLUTION INJECTABLE POUR BOVINS PORCINS ET OVINS","l":null,"v":22,"p":"Voie sous-cutanée (Bovins).Voie intramusculaire (Porcs ; Ovins). BovinsUne injection unique par voie sous-cutanée de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL de médicament vétérinaire/40 kg de poids vif). Pour le traitement de bovins pesant plus de 300 kg de poids vif, diviser la dose de manière à ne pas injecter plus de 7,5 mL au même site d’injection. PorcinsUne injection unique par voie intramusculaire de 2,5 mg de tulathromycine/kg de poids vif (équivalant à 1 mL
