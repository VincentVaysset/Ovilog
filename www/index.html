      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Important : à chaque fois qu'une nouvelle version du fichier est installée, exporte d'abord tes données ici, puis réimporte-les une fois la nouvelle version ouverte — sinon tout repart à zéro.</div>
      <button class="btn btn-secondary" id="btn-export" style="margin-bottom:10px;">Exporter mes données (sauvegarde)</button>
      <input type="file" id="import-file" accept=".json" class="hidden">
      <button class="btn btn-secondary" id="btn-import">Importer une sauvegarde</button>
    </div>
  `;

  document.getElementById('btn-goto-import').onclick = () => render('import-echo');

  document.getElementById('btn-sync-action').onclick = () => {
    if (syncState.loggedIn) {
      if (!confirm('Se déconnecter de la synchronisation ? L\'appli continuera de fonctionner avec les données actuelles, en local uniquement, jusqu\'à ta prochaine connexion.')) return;
      window.OvilogSync.logout();
      render('parametres');
    } else {
      render('sync-login');
    }
  };

  document.getElementById('btn-nouvelle-campagne').onclick = () => {
    const nbAgnelles = (DB.agnelles || []).length;
    if (!confirm(
      'Démarrer une nouvelle campagne ?\n\n' +
      '- ' + nbAgnelles + ' agnelle(s) rejoindront le troupeau de brebis\n' +
      '- Les mises bas et mouvements de la campagne précédente seront retirés des fiches actives (mais conservés dans le registre d\'élevage réglementaire)\n\n' +
      'Cette action est irréversible.'
    )) return;

    // Archive puis vide les brebis déjà actives AVANT d'ajouter les nouvelles
    // (renouvelées depuis les agnelles), pour ne pas effacer le mouvement
    // d'entrée qu'on vient de créer pour ces dernières.
    DB.brebis.forEach(sheep => {
      if ((sheep.statut || 'active') === 'active') {
        archiverDansRegistre('brebis', sheep.eid, { agnelages: sheep.agnelages, mouvements: sheep.mouvements });
        sheep.agnelages = [];
        sheep.mouvements = [];
      }
    });

    const dateRenouvellement = new Date().toISOString().slice(0,10);
    (DB.agnelles || []).forEach(ag => {
      DB.brebis.push({
        id: Date.now().toString() + Math.random().toString(36).slice(2,6), eid: ag.eid, mereEid: ag.motherEid || null,
        createdAt: Date.now(), echographies: [], agnelages: [], sanitaire: ag.sanitaire || [],
        mouvements: [{ type: 'Entrée', cause: 'Renouvellement (agnelle devenue brebis)', date: dateRenouvellement }],
        controleLaitier: [], statut: 'active'
      });
      archiverDansRegistre('agneaux', ag.eid, { mouvements: ag.mouvements });
    });
    DB.agnelles = [];

    const now = new Date();
    DB.campagneDebut = now.getMonth() >= 9 ? now.getFullYear() : now.getFullYear() - 1;
    saveData(DB);
    render('parametres');
  };

  document.getElementById('btn-save-exploitation').onclick = () => {
    DB.exploitation = {
      nom: document.getElementById('f-exp-nom').value.trim(),
      numeroCheptel: document.getElementById('f-exp-cheptel').value.trim(),
      indicatifMarquage: document.getElementById('f-exp-marquage').value.trim(),
      adresse: document.getElementById('f-exp-adresse').value.trim(),
      telephone: document.getElementById('f-exp-tel').value.trim()
    };
    saveData(DB);
    alert('Informations enregistrées.');
  };
  document.getElementById('btn-save-campagne-annee').onclick = () => {
    const val = parseInt(document.getElementById('f-campagne-annee').value, 10);
    if (isNaN(val)) { alert("Saisis une année valide."); return; }
    DB.campagneDebut = val - 1;
    saveData(DB);
    render('parametres');
  };

  document.getElementById('btn-export').onclick = () => exportBackupFile(DB, 'troupeau-sauvegarde');

  document.getElementById('btn-import').onclick = () => {
    document.getElementById('import-file').click();
  };
  document.getElementById('import-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!Array.isArray(parsed.brebis)) throw new Error('format invalide');
        if (!confirm('Remplacer toutes les données actuelles par cette sauvegarde ? Cette action est irréversible.')) return;
        // migrateData comble les champs qui n'existaient pas encore dans une
        // sauvegarde plus ancienne, pour éviter toute erreur sur un champ
        // manquant juste après la restauration.
        DB = migrateData(parsed);
        saveData(DB);
        render('list');
      } catch (err) {
        alert("Ce fichier ne semble pas être une sauvegarde valide.");
      }
    };
    reader.readAsText(file);
  };
}

/* ---------- Connexion à la synchronisation cloud ---------- */
function renderSyncLogin() {
  pageTitle.textContent = 'Connexion à la synchronisation';
  app.innerHTML = `
    <div class="card">
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">Connecte-toi avec le compte créé pour la synchronisation (même e-mail et mot de passe sur tous tes appareils).</div>
      <label>Adresse e-mail</label>
      <input type="email" id="f-sync-email" placeholder="ton@email.fr" autocomplete="username">
      <label>Mot de passe</label>
      <input type="password" id="f-sync-password" autocomplete="current-password">
      <div id="sync-err" class="error-box hidden"></div>
      <button class="btn btn-primary" id="btn-sync-login">Se connecter</button>
    </div>
  `;
  const emailInput = document.getElementById('f-sync-email');
  const passwordInput = document.getElementById('f-sync-password');
  const btn = document.getElementById('btn-sync-login');
  const err = document.getElementById('sync-err');

  function attemptLogin() {
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    if (!email || !password) {
      err.textContent = "Renseigne l'e-mail et le mot de passe.";
      err.classList.remove('hidden');
      return;
    }
    err.classList.add('hidden');
    btn.textContent = 'Connexion en cours...';
    btn.disabled = true;
    window.OvilogSync.login(email, password).then(() => {
      render('parametres');
    }).catch(e => {
      err.textContent = e.message || "Connexion impossible.";
      err.classList.remove('hidden');
      btn.textContent = 'Se connecter';
      btn.disabled = false;
    });
  }
  btn.onclick = attemptLogin;
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptLogin(); });
}

/* ---------- Démarrage ---------- */
render('list');
</script>

<!--
  Synchronisation cloud (Firebase). Séparée du script principal ci-dessus
  car elle a besoin des imports ES module — elle s'exécute après lui (les
  scripts "module" sont différés par le navigateur), donc DB, render(),
  saveData() etc. existent déjà quand ce code tourne, et peut les lire/
  écrire directement (même portée globale que le script classique).
-->
<script type="module">
import {
  initializeApp, getAuth, setPersistence, browserLocalPersistence,
  signInWithEmailAndPassword, onAuthStateChanged, signOut,
  initializeFirestore, persistentLocalCache, persistentSingleTabManager,
  collection, doc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot, arrayUnion
} from './vendor/firebase.bundle.js';

const firebaseConfig = {
  apiKey: "AIzaSyDY_Z3Jqo92RAuJlYX5K4sZKTFmf-0P-h4",
  authDomain: "ovilog-15ef6.firebaseapp.com",
  projectId: "ovilog-15ef6",
  storageBucket: "ovilog-15ef6.firebasestorage.app",
  messagingSenderId: "861492569011",
  appId: "1:861492569011:web:67ade13ee7fdedff62a1c6"
};

const fbApp = initializeApp(firebaseConfig);
const fbAuth = getAuth(fbApp);
const fbDb = initializeFirestore(fbApp, {
  localCache: persistentLocalCache({ tabManager: persistentSingleTabManager() })
});

// Champs regroupés dans un unique document 'meta' par compte (petits,
// bornés, pas besoin d'un document par enregistrement comme pour les
// animaux).
const META_FIELDS = ['exploitation', 'campagneDebut', 'produits', 'acheteurs',
  'causesMortalite', 'casParticuliers', 'typesJournal', 'lots', 'journal',
  'laitTank', 'luttes', 'produitsInfo'];
const ANIMAL_COLLECTIONS = ['brebis', 'beliers', 'agnelles'];
const BOOTSTRAP_FLAG_KEY = 'ovilog_sync_bootstrapped_uid';

const sync = {
  uid: null,
  email: null,
  applyingRemote: false,
  unsubscribers: [],
  // Dernier état connu de chaque collection/document tel qu'envoyé vers ou
  // reçu depuis Firestore, pour calculer un diff minimal à chaque sauvegarde
  // plutôt que de tout réécrire.
  lastSynced: { brebis: {}, beliers: {}, agnelles: {}, meta: undefined }
};

/* Copie profonde + remplace toute valeur undefined par null (Firestore
   refuse undefined). Sert à la fois pour ce qu'on envoie réellement à
   Firestore ET pour ce qu'on garde dans lastSynced : lastSynced doit être
   un instantané figé, jamais une référence vers le même objet que DB —
   sinon, comme l'appli modifie ses objets sur place avant d'appeler
   saveData(DB), l'« ancien » et le « nouveau » finiraient par être
   littéralement le même objet et plus aucun changement ne serait jamais
   détecté après le tout premier envoi. */
function deepClean(value) {
  if (value === undefined) return null;
  if (value === null || typeof value !== 'object') return value;
  if (Array.isArray(value)) return value.map(deepClean);
  const out = {};
  Object.keys(value).forEach(k => { out[k] = deepClean(value[k]); });
  return out;
}

/* Calcule un payload de mise à jour Firestore entre un ancien et un nouvel
   enregistrement : arrayUnion pour un simple ajout en fin de tableau (les
   ajouts concurrents depuis 2 appareils se combinent alors sans s'écraser),
   remplacement complet du champ dans les autres cas (édition, suppression,
   réordonnancement — dernier écrit gagne, comme le reste de Firestore). */
function buildUpdatePayload(oldRec, newRec) {
  const updates = {};
  const keys = new Set([...Object.keys(oldRec || {}), ...Object.keys(newRec || {})]);
  keys.forEach(key => {
    const oldVal = oldRec ? oldRec[key] : undefined;
    const newVal = newRec[key];
    if (JSON.stringify(oldVal) === JSON.stringify(newVal)) return;
    if (Array.isArray(oldVal) && Array.isArray(newVal) && newVal.length > oldVal.length &&
        JSON.stringify(newVal.slice(0, oldVal.length)) === JSON.stringify(oldVal)) {
      updates[key] = arrayUnion(...newVal.slice(oldVal.length));
    } else {
      updates[key] = newVal === undefined ? null : newVal;
    }
  });
  return Object.keys(updates).length ? updates : null;
}

async function syncAnimalCollection(colName, records) {
  const colRef = collection(fbDb, 'users', sync.uid, colName);
  const lastMap = sync.lastSynced[colName];
  const seenIds = new Set();
  for (const rawRec of (records || [])) {
    if (!rawRec.id) continue;
    const rec = deepClean(rawRec);
    seenIds.add(rec.id);
    const old = lastMap[rec.id];
    if (old === undefined) {
      await setDoc(doc(colRef, rec.id), rec);
    } else {
      const payload = buildUpdatePayload(old, rec);
      if (payload) await updateDoc(doc(colRef, rec.id), payload);
    }
    lastMap[rec.id] = rec;
  }
  for (const id of Object.keys(lastMap)) {
    if (!seenIds.has(id)) {
      await deleteDoc(doc(colRef, id));
      delete lastMap[id];
    }
  }
}

async function syncMeta(data) {
  const metaRecord = {};
  META_FIELDS.forEach(k => { metaRecord[k] = deepClean(data[k]); });
  const metaRef = doc(fbDb, 'users', sync.uid, 'meta', 'main');
  if (sync.lastSynced.meta === undefined) {
    await setDoc(metaRef, metaRecord);
  } else {
    const payload = buildUpdatePayload(sync.lastSynced.meta, metaRecord);
    if (payload) await updateDoc(metaRef, payload);
  }
  sync.lastSynced.meta = metaRecord;
}

async function syncAllToCloud(data) {
  for (const col of ANIMAL_COLLECTIONS) await syncAnimalCollection(col, data[col]);
  await syncMeta(data);
}

// Remplace la sauvegarde locale-uniquement par une version qui écrit aussi
// vers Firestore quand la synchro est active — sans toucher aux dizaines
// d'endroits de l'appli qui appellent déjà saveData(DB).
saveData = function(data) {
  localStorage.setItem(DB_KEY, JSON.stringify(data));
  DB = data;
  if (sync.uid && !sync.applyingRemote) {
    syncAllToCloud(data).catch(e => console.error('Erreur de synchronisation cloud :', e));
  }
};

/* Applique un changement reçu depuis Firestore (un autre appareil, ou notre
   propre écriture confirmée) : met à jour DB + le cache local + l'écran
   affiché, sans redéclencher un envoi vers le cloud (sync.applyingRemote). */
function applyRemoteUpdate(mutatorFn) {
  sync.applyingRemote = true;
  try {
    mutatorFn();
    localStorage.setItem(DB_KEY, JSON.stringify(DB));
    render(currentView);
  } finally {
    sync.applyingRemote = false;
  }
}

function startListeners() {
  ANIMAL_COLLECTIONS.forEach(colName => {
    const colRef = collection(fbDb, 'users', sync.uid, colName);
    const unsub = onSnapshot(colRef, snap => {
      const arr = [];
      snap.forEach(d => arr.push(d.data()));
      sync.lastSynced[colName] = {};
      // Instantané indépendant de ce qui va dans DB (voir deepClean) : DB
      // continue de contenir les objets « vivants » que l'appli modifie
      // directement sur place.
      arr.forEach(r => { sync.lastSynced[colName][r.id] = deepClean(r); });
      applyRemoteUpdate(() => { DB[colName] = arr; });
    }, err => console.error('Erreur d\'écoute Firestore (' + colName + ') :', err));
    sync.unsubscribers.push(unsub);
  });
  const metaRef = doc(fbDb, 'users', sync.uid, 'meta', 'main');
  const unsubMeta = onSnapshot(metaRef, snap => {
    if (!snap.exists()) return;
    const meta = snap.data();
    sync.lastSynced.meta = deepClean(meta);
    applyRemoteUpdate(() => { Object.assign(DB, meta); });
  }, err => console.error('Erreur d\'écoute Firestore (meta) :', err));
  sync.unsubscribers.push(unsubMeta);
}

function stopListeners() {
  sync.unsubscribers.forEach(u => u());
  sync.unsubscribers = [];
}

/* Décision prise une seule fois par appareil, la première fois qu'il se
   connecte à un compte donné : si le cloud est vide, on y pousse les
   données locales actuelles (cet appareil devient la source) ; s'il
   contient déjà des données (un autre appareil a synchronisé avant), on
   sauvegarde les données locales de cet appareil par sécurité puis on
   bascule sur celles du cloud (récupérées ensuite par startListeners). */
async function bootstrapDevice(uid) {
  const metaRef = doc(fbDb, 'users', uid, 'meta', 'main');
  const metaSnap = await getDoc(metaRef);
  if (!metaSnap.exists()) {
    await syncAllToCloud(DB);
  } else {
    exportBackupFile(DB, 'avant-synchronisation-cloud');
  }
  localStorage.setItem(BOOTSTRAP_FLAG_KEY, uid);
}

async function onSignedIn(user) {
  sync.uid = user.uid;
  sync.email = user.email;
  const alreadyBootstrapped = localStorage.getItem(BOOTSTRAP_FLAG_KEY) === user.uid;
  if (!alreadyBootstrapped) {
    await bootstrapDevice(user.uid);
  }
  startListeners();
}

function onSignedOut() {
  stopListeners();
  sync.uid = null;
  sync.email = null;
}

onAuthStateChanged(fbAuth, user => {
  if (user) onSignedIn(user).catch(e => console.error('Erreur de connexion à la synchronisation :', e));
  else onSignedOut();
});

function friendlyAuthError(e) {
  const code = e && e.code;
  if (code === 'auth/invalid-credential' || code === 'auth/invalid-email' || code === 'auth/wrong-password' || code === 'auth/user-not-found') {
    return "E-mail ou mot de passe incorrect.";
  }
  if (code === 'auth/too-many-requests') return "Trop de tentatives — réessaie dans quelques minutes.";
  if (code === 'auth/network-request-failed') return "Pas de connexion réseau — la première connexion nécessite d'être en ligne.";
  return "Connexion impossible (" + (code || (e && e.message) || 'erreur inconnue') + ").";
}

window.OvilogSync = {
  getState() {
    return { loggedIn: !!sync.uid, email: sync.email };
  },
  async login(email, password) {
    try {
      await setPersistence(fbAuth, browserLocalPersistence);
      await signInWithEmailAndPassword(fbAuth, email, password);
      // onAuthStateChanged prend le relais (bootstrap + écoute) juste après.
    } catch (e) {
      throw new Error(friendlyAuthError(e));
    }
  },
  logout() {
    signOut(fbAuth).catch(e => console.error('Erreur de déconnexion :', e));
  }
};
</script>
</body>
</html>
